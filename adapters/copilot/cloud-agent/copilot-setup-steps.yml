name: "Copilot Setup Steps"

# copilot only picks this up from the default branch, and only runs the job named
# copilot-setup-steps - everything else in this file besides steps/permissions/
# runs-on/services/snapshot/timeout-minutes is ignored by the coding agent (it still
# runs as an ordinary workflow on push, which is what lets you validate it in the
# Actions tab before trusting it to prep the agent's container).
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: install the kpopper runtime
        # KPOPPER_ROOT: where this repo's kpopper checkout lives (a vendored copy, a
        # submodule, whatever the project's own convention is) - set as a repository
        # variable (Settings > Secrets and variables > Actions > Variables) or hardcode
        # the path below. the installer downloads the runtime for that checkout's VERSION
        # from the kpopper GitHub release and checks its SHA-256, so the agent can run
        # "$KPOPPER_ROOT/scripts/bin/kpop". silent no-op without it, same as the local
        # session opener.
        env:
          KPOPPER_ROOT: ${{ vars.KPOPPER_ROOT }}
        run: |
          if [ -n "$KPOPPER_ROOT" ]; then
            sh "$KPOPPER_ROOT/scripts/install_native.sh"
          else
            echo "KPOPPER_ROOT unset - nothing to install"
          fi

      - name: open the record
        env:
          KPOPPER_ROOT: ${{ vars.KPOPPER_ROOT }}
        run: |
          if { [ -f GROUNDING.yaml ] || [ -f PROVENANCE.yaml ]; } && [ -n "$KPOPPER_ROOT" ]; then
            "$KPOPPER_ROOT/scripts/bin/kpop" open --chars 2000
          else
            echo "no record, or KPOPPER_ROOT unset - nothing to open"
          fi
