name: "provenance check"

# the stop gate, as a PR status: a pull request that leaves the record failing
# check does not go green. no session_id, no baseline, no one-bounce-then-yield - a
# CI check either passes or it doesn't, so this simply runs check cold every time.
on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: check the record
        # KPOPPER_ROOT: the kpopper checkout, as in copilot-setup-steps.yml. the installer
        # downloads the runtime for its VERSION from the kpopper GitHub release and checks
        # its SHA-256.
        env:
          KPOPPER_ROOT: ${{ vars.KPOPPER_ROOT }}
        run: |
          REC=""
          for name in GROUNDING.yaml PROVENANCE.yaml; do
            if [ -f "$name" ]; then REC="$name"; break; fi
          done
          if [ -z "$REC" ]; then
            echo "no record - nothing to check"
            exit 0
          fi
          if [ -z "$KPOPPER_ROOT" ]; then
            echo "KPOPPER_ROOT is not set (repository variable) - can't locate kpop" >&2
            exit 1
          fi
          sh "$KPOPPER_ROOT/scripts/install_native.sh"
          "$KPOPPER_ROOT/bin/kpop" check "$REC"
