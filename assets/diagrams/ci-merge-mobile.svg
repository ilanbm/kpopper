<text x="159" y="1043" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#c52c42">30 s &gt; 10 s: condition fails</text>
<text x="380" y="1101" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#142033">Revisit the checkout decision</text>
</svg>
