<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1140" viewBox="0 0 760 1140" role="img" aria-labelledby="title desc">
<title id="title">Two green PRs. One broken assumption.</title>
<desc id="desc">Both branches start from a 5-second timeout. A allows 30 seconds; B chooses a blocking call because 5 seconds fits its 10-second waiting budget. Each record passes separately. Git combines the records cleanly, but the merged timeout breaks B’s recorded reason.</desc>
<defs><marker id="blue" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L11 5 1 9Z" fill="#0666ff"/></marker><marker id="gray" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L11 5 1 9Z" fill="#596579"/></marker><marker id="red" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L11 5 1 9Z" fill="#c52c42"/></marker></defs>
<rect width="760" height="1140" fill="white"/>
<rect x="32" y="32" width="696" height="96" rx="12" fill="#f3f7ff" stroke="#c6d0df" stroke-width="1.8"/>
<text x="56" y="69" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#596579">SHARED BASE</text>
<text x="56" y="108" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#142033">Request timeout: 5 seconds</text>
