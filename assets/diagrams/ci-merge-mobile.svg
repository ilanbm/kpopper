<path d="M380 169L198 169L198 207" fill="none" stroke="#0666ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M380 169L562 169L562 207" fill="none" stroke="#0666ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<circle cx="380" cy="169" r="4" fill="#0666ff"/>
<rect x="32" y="230" width="332" height="312" rx="12" fill="white" stroke="#c6d0df" stroke-width="1.8"/>
<rect x="396" y="230" width="332" height="312" rx="12" fill="white" stroke="#c6d0df" stroke-width="1.8"/>
<text x="56" y="276" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#0666ff">PR A</text>
<text x="56" y="322" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#142033">Allow longer</text>
<text x="56" y="359.5" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#142033">requests</text>
<text x="56" y="416" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#596579">Timeout</text>
<text x="56" y="473" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" text-anchor="start" fill="#0666ff">5 → 30 s</text>
<circle cx="67" cy="509" r="11" fill="#18794e"/>
<path d="M62 509l4 4 7-8" fill="none" stroke="white" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="91" y="518" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#18794e">Record passes</text>
<text x="420" y="276" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#0666ff">PR B</text>
<text x="420" y="322" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#142033">Use a blocking</text>
<text x="420" y="359.5" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#142033">call</text>
<text x="420" y="416" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#596579">Recorded reason</text>
<text x="420" y="473" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#142033">5 s fits a 10 s budget</text>
<circle cx="431" cy="509" r="11" fill="#18794e"/>
<path d="M426 509l4 4 7-8" fill="none" stroke="white" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
