<text x="380" y="690" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#142033">Git merge: clean</text>
<path d="M380 720L380 755" fill="none" stroke="#0666ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="32" y="780" width="696" height="215" rx="12" fill="#fff4f5" stroke="#e8a5b0" stroke-width="1.8"/>
<text x="56" y="822" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#c52c42">COMBINED RECORD</text>
<text x="56" y="866" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#596579">Timeout from A</text>
<text x="432" y="866" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#596579">Decision from B</text>
<text x="56" y="938" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700" text-anchor="start" fill="#0666ff">30 s</text>
<text x="432" y="914" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#142033">Blocking call</text>
<text x="432" y="953" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#142033">fits 10 s</text>
