<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" role="img" aria-labelledby="title desc">
<title id="title">Past, present, future.</title>
<desc id="desc">The past preserves sources, evidence, decision reasons and review snapshots. The present connects claims, changes, contradictions and new information. The future holds followups, daily reviews and time or event triggers. The agent records outcomes back into the record.</desc>
