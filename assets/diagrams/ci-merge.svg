<path d="M180.737 903.018l8 8m0-8l-8 8" fill="none" stroke="white" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="217.579" y="914.912" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#c52c42">30 s &gt; 10 s: condition fails</text>
<text x="520" y="965.789" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#142033">Revisit the checkout decision</text>
</svg>
