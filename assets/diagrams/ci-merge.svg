<text x="520" y="605.263" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#142033">Git merge: clean</text>
<path d="M520 631.579L520 662.281" fill="none" stroke="#0666ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="43.7895" y="684.211" width="952.421" height="188.596" rx="12" fill="#fff4f5" stroke="#e8a5b0" stroke-width="1.8"/>
<text x="76.6316" y="721.053" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#c52c42">COMBINED RECORD</text>
<text x="76.6316" y="759.649" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#596579">Timeout from A</text>
<text x="591.158" y="759.649" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#596579">Decision from B</text>
<text x="76.6316" y="822.807" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700" text-anchor="start" fill="#0666ff">30 s</text>
<text x="591.158" y="801.754" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#142033">Blocking call</text>
<text x="591.158" y="835.965" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#142033">fits 10 s</text>
<path d="M299.684 806.14L548.737 806.14" fill="none" stroke="#c52c42" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#red)"/>
<circle cx="413.263" cy="806.14" r="13" fill="#c52c42"/>
<path d="M408.263 801.14l10 10m0-10l-10 10" fill="none" stroke="white" stroke-width="2.5"/>
