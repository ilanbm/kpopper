<text x="76.6316" y="145.461" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#0666ff">keeps moving</text>
<text x="574.737" y="76.2783" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="white">Background worker</text>
<text x="574.737" y="114.417" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#c1d5ff">Separate process</text>
<text x="574.737" y="145.461" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#c1d5ff">Runs in parallel</text>
