<text x="99.8947" y="259.878" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#142033">“The venue</text>
<text x="99.8947" y="295.357" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#142033">cancelled.”</text>
<text x="93.0526" y="371.635" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#0666ff">Agent captures update</text>
