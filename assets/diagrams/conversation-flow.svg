<text x="596.632" y="480.73" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#142033">2  Check recorded</text>
<text x="596.632" y="511.774" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#142033">    dependencies</text>
<text x="596.632" y="556.122" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#c52c42">Venue: cancelled</text>
