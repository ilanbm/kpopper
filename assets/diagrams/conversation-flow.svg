<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1020" viewBox="0 0 1040 1020" role="img" aria-labelledby="title desc">
<title id="title">Your session continues while a separate worker checks the update.</title>
<desc id="desc">An agent captures an explicit venue cancellation. A separate background process runs in parallel, saves a sourced reading, and checks the venue-to-announcement dependency. The main session continues with the set list. Only an important finding returns; routine results send no notification.</desc>
<defs><marker id="blue" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L11 5 1 9Z" fill="#0666ff"/></marker><marker id="gray" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L11 5 1 9Z" fill="#596579"/></marker><marker id="red" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L11 5 1 9Z" fill="#c52c42"/></marker></defs>
