<text x="99.8947" y="793.826" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#142033">“The announcement</text>
<text x="99.8947" y="829.304" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#142033">needs review.”</text>
<text x="587.053" y="729.078" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#926100">Only important</text>
<text x="587.053" y="759.235" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#926100">findings return</text>
