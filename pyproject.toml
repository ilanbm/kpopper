[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kpopper"
# The plugin manifest carries the same number: one tree, two distribution channels,
# released together.
version = "1.9.0"
description = "An epistemic record for work that gets revisited: what is known, how each piece is grounded, and what would make each judgment wrong."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ilan Bar Magen" }]
keywords = [
  "provenance",
  "epistemic",
  "falsifiability",
  "truth-maintenance",
  "traceability",
  "research",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["PyYAML>=5.1", "tzdata"]

[project.optional-dependencies]
html = ["html5lib>=1.1,<2", "tinycss2>=1.2,<2"]
session = ["tiktoken>=0.14,<1", "mcp>=2.2,<3"]
retrieval = ["numpy>=1.24,<3", "onnxruntime>=1.18,<2", "tokenizers>=0.20,<1"]

[project.urls]
Homepage = "https://github.com/ilanbm/kpopper"
Source = "https://github.com/ilanbm/kpopper"
Issues = "https://github.com/ilanbm/kpopper/issues"

[project.scripts]
# `kpop` is the command. `kpopper` names the project and the package, and stays
# installed as a second entry point so either spelling runs.
kpop = "kpopper.cli:main"
kpopper = "kpopper.cli:main"

[tool.setuptools]
# The editor plugin reads these files out of scripts/ by path, so the package is mapped
# onto that directory instead of being copied into one of its own. A second copy would
# be a second thing to edit.
packages = ["kpopper", "kpopper.session", "kpopper.reasoning", "kpopper.applications"]
package-dir = { kpopper = "scripts" }

[tool.setuptools.package-data]
# The page's own files ship with the renderer that reads them, and the browser checks ship
# with the command line that runs them - `kpop experimental hub --checks` is only as installable as
# the file it hands to node.
kpopper = ["page/*.css", "page/*.js", "verify_page.js", "start-guide.md", "document-guide.md", "document/*.css", "document/*.js", "assessment.schema.json"]
"kpopper.session" = ["rules.txt", "bootstrap.txt", "lean/*.lean", "lean/lean-toolchain"]
"kpopper.reasoning" = ["assessment.schema.json", "history_assessment.schema.json", "lean/*.lean", "lean/Kpopper/*.lean", "lean/lean-toolchain", "lean/lakefile.toml", "native/*.kpopper-runtime", "native/*.tar.gz", "native/*.md", "third_party/*"]
