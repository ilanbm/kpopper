[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kpopper"
# The plugin manifest carries the same number: one tree, two distribution channels,
# released together.
version = "0.19.0"
description = "An epistemic record for work that gets revisited: what is known, how each piece is grounded, and what would make each judgment wrong."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ilan Bar Magen" }]
keywords = [
  "provenance",
  "epistemic",
  "falsifiability",
  "truth-maintenance",
  "traceability",
  "research",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["PyYAML>=5.1"]

[project.urls]
Homepage = "https://github.com/ilanbm/kpopper"
Source = "https://github.com/ilanbm/kpopper"
Issues = "https://github.com/ilanbm/kpopper/issues"

[project.scripts]
kpopper = "kpopper.cli:main"

[tool.setuptools]
# The editor plugin reads these files out of scripts/ by path, so the package is mapped
# onto that directory instead of being copied into one of its own. A second copy would
# be a second thing to edit.
packages = ["kpopper"]
package-dir = { kpopper = "scripts" }
