open:
  q.pull_defaults: "does a session that ran pull still open the record file for values - and if
                    so, what was missing from the line it got?"
  q.account_copy: "does the hosted copy of this plugin get refreshed from here, or retired?"
  q.first_artifact: "what is the first artifact that must never change silently?"
  q.language_direction: "prior.ts_direction puts the renderer, command line and checker in TypeScript at
                         0.7 and prior.rust_unwarranted keeps a compiled binary off the table at 0.9 - a
                         costly, reversible move, so it waits for a person rather than an event: yes, no,
                         or coupled to the next rewrite of the page?"
  q.locator_authority: "the locator takes the highest cached version, while the harness records
                        one enabled install path - they agree today, but should the locator read
                        that record instead of ranking what it finds?"
  q.arrangement_falsifiers: "will sessions write arrangement falsifiers a build can evaluate and
                             that say something - to be read as a foreign agent would, after
                             fifteen real arrangements?"
  q.same_day_rereading: "where does a re-reading go when the session changed the file a premise was
                         read from, on the day it was read? set refuses it into the base as two
                         writers, and the hypothesis beside it is a contested reading the dry run
                         fails, so a hand edit in the pull request is the only door left - the day
                         may be the wrong grain for a writer that is also the world"
  q.sealed_falsifiers: "is one question - under this decision, can the sign still happen? -
                        enough against falsifiers a decision seals, or does the work on
                        predictions that change what they predict (performative prediction,
                        reflexive forecasts, Goodhart) give a sharper test; and how often do
                        sessions write sealed ones before and after the rule?"
  q.unprompted_recording: "what makes a session record what it decided in conversation,
                           unasked? seven decisions lived only in chat until a person asked;
                           the opener had shown the rule, and the gate cannot see a record
                           nobody touched"
  q.contradiction_rule: "which writes open a hypothesis - a different value on an id the base
                         holds is clear; is an opposite verdict on the same rests_on one too, and
                         how is opposite told from merely different?"
  q.hypothesis_lifetime: "when is an untested hypothesis stale enough for the opener to say so -
                          by age, by how much rests on it, or only when a person asks?"

judgments:
  d.a_comparison_shows_where_it_parts:
    rests_on: [s.2026_09_04_difference, d.moved_is_a_flag]
    verdict: "where two readings are printed side by side, each is clipped to where they part rather
              than to where they agree; the head is kept only when they part inside it"
    because: "Clipping at the head shows the reader the part that did not change. Two long readings
              that differ at their end came back as one string printed twice - on the line check
              prints, the one open ranks, the one a write answers with, the one a fork refusal asks a
              person to choose by, and two more - so {{d.moved_is_a_flag}}'s flag arrived carrying
              nothing to judge. A window opening at the last whole word before the two diverge says
              what moved in the space a clip already costs."
    blocked_on: "observational: falsified if sessions read these lines worse rather than better - a
                 fragment led by an ellipsis drops the context the head carried, and the sign is a
                 session that has to open the record to learn what the moved value is about, where
                 the old line told it"
    seen:
      s.2026_09_04_difference: "read 2026-09-04"
      d.moved_is_a_flag: "a dependency that moved since the snapshot flags the judgment for a
                          person; only a predicate that holds fails the build"
    distinct_from: d.text_holds_the_prose_it_places
    # distinct 2026-09-04: one decides which reading a snapshot records; this decides how any two readings are shown against each other, whatever they are snapshots of
  d.a_line_is_clipped_by_its_parts:
    rests_on: [s.2026_09_04_difference, d.a_comparison_shows_where_it_parts]
    verdict: "a line that shows a comparison is built from parts already clipped, and never cut as a
              whole - a budget spent on the first value would eat the second and the arrow between
              them"
    because: "pull cut its line at its full width, so a long value took the whole budget and the
              reading it was being compared against never appeared at all: not a clipped comparison
              but a single value, with nothing to say a second existed. That is the failure
              {{d.a_comparison_shows_where_it_parts}} does not reach, because no per-side reading
              helps a side that was never printed. Clipping the parts first also makes the line's own
              budget a last resort rather than the thing doing the work."
    blocked_on: "observational: falsified by a surface where the parts are short and the line still
                 overruns - which would mean the budget belongs on the line after all"
    seen:
      s.2026_09_04_difference: "read 2026-09-04"
      d.a_comparison_shows_where_it_parts: "where two readings are printed side by side, each is
                                            clipped to where they part rather than to where they
                                            agree; the head is kept only when they part inside it"
  d.add_places_by_prefix:
    rests_on: [m.multi.record_pairs_conflicting, d.base_shared_forks_on_contradiction]
    verdict: "add inserts a new entry beside the entries it shares the longest dotted prefix with,
              in id order among them, and at a collection's tail only when id order puts it there"
    because: "Every parallel pair conflicted on this file because every session appended at the same
              tail. An entry placed by its id lands where its subject already sits, so two sessions
              writing about different subjects touch different lines and git merges them, and two
              writing about the same subject meet - which is the honest signal. A collection nobody
              sorted still has a first sibling that sorts after the new id, so the rule reorders
              nothing that is there."
    blocked_on: "observational: falsified if a later survey of parallel branches, all writing
                 through add, still conflicts on the record in most pairs -
                 m.multi.record_pairs_conflicting measured again"
    seen:
      m.multi.record_pairs_conflicting: "4 of 4"
      d.base_shared_forks_on_contradiction: "a consistent addition goes straight to the shared
                                             record from any session or branch; a write that
                                             contradicts the record opens a named hypothesis, and
                                             whatever later rests on the contradiction goes there - a
                                             session is never the unit"
  d.also_is_read_by_absence:
    rests_on: [s.2026_09_04_also_reading, d.locate_by_shape, d.sameness_is_judged, p.fields_read_by_name]
    verdict: "also: names other identities of a subject and never what it rests on: the reader
              excludes it from role voting by name, reads it as a retirement only where the named id
              is absent everywhere, and where that id is held says so as a note naming both commands
              rather than choosing between a retirement that came back and a sibling the record
              declares"
    because: "A survivor carries the id retired into it. While that id is absent the field names
              nothing and votes for nothing; the day a merge brings back the branch it came from -
              one side having retired the id, the other still holding it, the two touching different
              lines - the field is a list of ids that are all entries, which is the shape the
              dependency role is voted on by, and in a record with one judgment it ties with the real
              one and nothing can be read at all. No write can reach that state, so nothing but shape
              inference could have seen it coming. Excluding the field by name is the smallest fix
              and must not be the only one: alone it turns a loud failure into a silent
              contradiction, and passing quietly over what cannot be read is the one thing this
              reader refuses. The note is a note and not a failure because the two readings have one
              shape - a live record already keeps sibling resource ids in this field - and deciding
              between them is what {{d.sameness_is_judged}} leaves to a person. A record that does
              keep its dependencies there still says so with schema. {{p.fields_read_by_name}} names
              are read this way, and the count is what would show the reader retreating from shape
              inference one field at a time."
    wrong_if: "p.fields_read_by_name > 4"
    seen:
      s.2026_09_04_also_reading: "read 2026-09-04"
      d.locate_by_shape: "the docs locate a shipped script by matching its name and taking the
                          highest version, never by a path written against today's layout"
      d.sameness_is_judged: "the tool never decides that two entries are the same: it shows the
                             nearest existing entries when one is written and candidates when
                             hypotheses consolidate; the writer or the merger decides, and the
                             decision is recorded - same_as as a migration that leaves the build
                             green, distinct_from as an edge that retires the pair"
      p.fields_read_by_name: 4
    distinct_from: d.distinct_is_a_bare_id
    # distinct 2026-09-04: one says how a field is read, the other how a field is written; they share their premises and not their subject
  d.another_branch_reads_as_hypotheses:
    rests_on: [s.2026_09_04_consolidate, d.no_feed_of_other_branches, d.record_is_code]
    verdict: "another branch's committed record is read as hypotheses and never written: its base as
              one named after the ref, holding only what differs from this base or is new to it, and
              each hypothesis file it carries as one more - so a branch's facts cross by a pull, and
              a dead branch is harvested without its code"
    because: "{{d.record_is_code}} puts a branch's knowledge in its commits, and
              {{d.no_feed_of_other_branches}} keeps it out of every session's opener - so the one
              honest way across is a command a person runs, reading what git already holds. Read
              whole, the other record would overwrite this one's reviews and rewordings on every id
              they share; pruned to what differs in its claim or is newer by its day, it proposes
              exactly what the same writes would have proposed from here. The reader's own pull then
              shows the proposals beside the values, and the same dry run tests them."
    blocked_on: "observational: falsified if a harvested branch's facts arrive wrong for being read
                 without their reviews, or if sessions push records across worktrees by hand instead"
    seen:
      s.2026_09_04_consolidate: "read 2026-09-04"
      d.no_feed_of_other_branches: "the opener adds one line - how many hypotheses wait, and for how
                                    long; nothing another branch claims is pushed into a session, it
                                    is pulled by seed or surfaces as a collision on the same id"
      d.record_is_code: "the record of what is known about the code lives in the tree - committed
                         with the work it describes, reviewed in the same pull request, checked by
                         the same CI - and a hypothesis travels with its branch; an out-of-tree
                         record holds only what the tree cannot hold, the world outside the code; a
                         user-level directory is at most an index of records, never content; a
                         session named as a source is provenance, not process"
  d.arrangement_link_is_earned:
    rests_on: [s.2026_09_03_arrangements, d.review_names_what_it_reads, d.serving_earned_by_picks]
    verdict: "an arrangement's tabs are the ones whose picks earn a session source it rests on, and
              any tab that claims no occasion; it is linked while every source is earned by some tab,
              and its review settles every shape it governs"
    because: "A link by the serves: line alone lets a tab keep its claim and lose its sections, then
              cite the unserved count the gutting produced; earned picks are what serving already
              means. An arrangement may decide the whole page at once, so it governs every tab that
              earns one of its sources, and a tab with no serves: line is the page's own and belongs
              to every decision as the one bare tab does. The older reading - the tab serving a
              session source it rests on - is narrowed, not reversed: every tab this finds, it
              found."
    blocked_on: "observational: falsified if a real brief keeps an arrangement linked through a
                 single token pick, or cuts one by a section moved between the tabs it governs"
    seen:
      s.2026_09_03_arrangements: "read 2026-09-03"
      d.review_names_what_it_reads: "review takes a judgment's id or a section's title; an
                                     arrangement's review also rewrites the shape of the one tab, or
                                     of the tab serving a session source it rests on; nothing
                                     refreshes a snapshot by itself"
      d.serving_earned_by_picks: "a tab serves an intent only when its sections pick something that
                                  session recorded; a declaration nothing picks fails the build, and
                                  an intent that recorded nothing stands outside coverage"
  d.arrangement_sign_is_one_comparison:
    rests_on: [s.2026_09_03_arrangements, d.falsifier_beyond_reach, d.metrics_derived_builtin]
    verdict: "an arrangement's sign is one comparison over a count that can hold - a name, an
              operator, one value; a compound or an impossible one is refused, and a re-opener stands
              beside it, never in its place"
    because: "A compound sign reads as evaluable and is never decided - worse, the comparison shape
              takes everything after the operator as the value, so page.spill > 0 or page.unserved >
              0 was decided as a text comparison and held nothing forever. A count below zero or a
              share above one never happens. An arrangement's sign is a count the build takes, or it
              is decoration, and decoration is freeze in disguise."
    blocked_on: "observational: falsified if sessions answer the rule by writing arrangements with
                 no sign at all - blocked_on where a comparison was available - or if the one value a
                 sign may carry proves too narrow for a real arrangement"
    seen:
      s.2026_09_03_arrangements: "read 2026-09-03"
      d.falsifier_beyond_reach: "a falsifier names a sign the decision itself cannot suppress; one
                                 that can only appear when people do what the decision stops offering
                                 is sealed, not falsifiable"
      d.metrics_derived_builtin: "graph.* and page.* are derived entries the reader computes itself
                                  - counts and shares, never stored, thresholds only inside
                                  falsifiers"
  d.browser_code_in_browser_files:
    rests_on: [m.page_string_lines, prior.strings_lose_tooling]
    verdict: "the page's CSS and JS live in their own files under scripts/page/, read whole at
              import and inlined at render - a page is still one file"
    because: "The renderer carried its page as Python strings - run.constants_measured counted them
              before the move - with no highlighting, no linter, no types, and every edit to the
              page an edit to a .py file. Reading the files at render time keeps the output
              byte-identical and puts the code where its tools are; m.page_string_lines at zero is
              the move having happened. Cheap to reverse, so decided on the prior alone."
    wrong_if: "prior.strings_lose_tooling < 0.6"
    seen: {m.page_string_lines: 0, prior.strings_lose_tooling: 0.95}
  d.candidate_lists_are_a_floor:
    rests_on: [s.2026_09_04_also_reading, d.sameness_is_judged, d.names_rank_never_decide, alt.sameness_from_names]
    verdict: "a candidate list is a floor and never a census: two entries about one fact, each with
              its own source and resting on nothing, share no declared edge, and what is left of them
              - the value, the name - is a resemblance this record refuses to decide on, so such a
              pair is closed by a person or by the next write that lands near one of them"
    because: "The edges the generators read are provenance, derivation and premises: the same source
              and place, the same rule, the same premises. Two sessions that each read their own
              document about one number share none of them, which is the ordinary shape of a
              multi-session record rather than an edge case. What is left is the value and the name,
              and both are properties of the subject rather than of its identity - two entries hold
              24 for unrelated reasons - which is the road this record refused when it rejected a
              tool that infers sameness from names. So a session reading a clean list has learned
              that nothing declared connects two subjects, never that the record holds no duplicate."
    blocked_on: "observational: falsified by a signal over declared fields that names such a pair
                 without deciding on resemblance - an identity a source itself declares, say - or by
                 a real record in which two sessions reading one fact from two documents never
                 happens"
    seen:
      s.2026_09_04_also_reading: "read 2026-09-04"
      d.sameness_is_judged: "the tool never decides that two entries are the same: it shows the
                             nearest existing entries when one is written and candidates when
                             hypotheses consolidate; the writer or the merger decides, and the
                             decision is recorded - same_as as a migration that leaves the build
                             green, distinct_from as an edge that retires the pair"
      d.names_rank_never_decide: "a candidate pair is named for a declared reason - the same source
                                  and place, the same source, the same rule read through what was
                                  retired, the same premises - and the overlap of two names only
                                  orders a list; add says the nearest three and refuses nothing, the
                                  dry run says a handful per arriving id"
      alt.sameness_from_names: rejected
  d.checked_session_is_optional:
    rests_on: [goal.portable, d.open_is_a_slot, doc.checked_sessions]
    verdict: "Offer the checked session transport alongside the legacy reader, enabled explicitly
              per project or machine; keep each judgment's source body alongside its computed card,
              exact raw reads and a reversible hook choice."
    because: "A complete typed view can preserve declared distinctions while the existing opening
              remains the compatibility baseline. Formal field checks do not establish source truth
              or a general improvement in session performance. A computed card can omit source
              explanations, so the original fields remain in the same read."
    reopened_by: "New records expose an omitted distinction or an unreachable source reference, or
                  fresh comparative session evidence warrants changing the default."
    seen:
      goal.portable: "usable by any session, in any project, with no author present"
      d.open_is_a_slot: "the session opener fills a fixed character slot, highest value per
                         character first; values never preload"
      doc.checked_sessions: "read 2026-09-08"
  d.chrome_follows_language:
    rests_on: [s.2026_09_04_components, d.author_free_build_guarantees]
    verdict: "Chrome follows the declared record language, or the dominant script of its descriptive
              text; Hebrew and Arabic are distinct catalogs, and values do not choose the language"
    because: "Direction alone cannot choose a language. The page translates its own words and
              preserves the record wording; an unsupported declared language is reported rather than
              silently claimed as translated."
    blocked_on: "observational: re-open when another record language needs a catalog or changing
