  d.page_lint_reads_output:
    rests_on: [s.2026_09_04_components, d.author_free_build_guarantees, d.reasoning_in_record]
    verdict: "The output lint checks references and visible keys, judgment and review markers,
              language, and arrangement intent; source prose stays attributed to its record entry and
              connective prose must carry its own references"
    because: "The record owns its statements and snapshots. The page can check whether a rendered
              reference and its warning survived; it cannot decide whether a sentence argues, and a
              reference beyond a reported card cut is not rendered. Unanchored connective prose is
              therefore a warning, while a value invented in connective prose or a missing warning
              fails."
    blocked_on: "observational: re-open if rendered values evade the reference check, or the lint
                 requires rewriting a source merely to render it"
    seen:
      s.2026_09_04_components: "read 2026-09-04"
      d.author_free_build_guarantees: "the session composes freely and the build enforces the
                                       element rules on the output"
