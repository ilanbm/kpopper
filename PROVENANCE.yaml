              reading that was fresh by its date. A recipe is the entry's own at: made runnable - the
              count behind that run already said python3 ast over the renderer, in prose - and it
              lives where {{d.record_is_code}} puts everything the tree can hold: in the tree,
              reviewed in the same pull request, checked by the same job. What the record may carry
              is a name alone, refused when it is not one or stands on anything but a stored scalar
              reading, so a data file edited in a pull request makes nothing run; the allowlist is
              the one file whose content runs, trusted as the tests are, and {{p.recipe_runners}}
              counts the places that run it - a reading command that started to would show as a
              second."
