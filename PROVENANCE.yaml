      d.author_free_build_guarantees: "the session composes freely and the build enforces the
                                       element rules on the output"
  d.components_follow_shape:
    rests_on: [s.2026_09_04_components, d.groupings_declared, doc.hub_seam]
    verdict: "The existing shapes carry the hub components; an axis is reviewed text with signed
              references, links select entries carrying destinations, and grouping hues follow
              declaration order"
    because: "The hub provides the visual grammar without prescribing its sections. Dates are
              calendar days, so countdowns update from the picked date in the browser and retain a
