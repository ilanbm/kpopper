  d.contested_is_a_rival_claim:
    rests_on: [s.2026_09_04_forks_chapter, d.hypotheses_read_beside_the_base, p.contested_meanings]
    verdict: "contested is said of one thing: a rival claim laid against what the record holds,
              which nothing but a person decides - two hypotheses on one id, a reading the door
              refuses at the fold, a hypothesis or an open question against an arrangement; a
              judgment the opener lists as needing a person is said to need one, never to be
              contested"
    because: "The opener's standing line called every flagged judgment contested - a premise that
              moved, a hole, a falsifier nothing evaluates - while check, pull, the dry run and the
              page keep the word for a rival claim a person must decide between. A session reading
              both takes a moved premise for a second writer and goes looking for a hypothesis that
              does not exist. One word for one thing; {{p.contested_meanings}} is the count that
              would show a second one creeping back in."
    wrong_if: "p.contested_meanings > 1"
    seen:
      s.2026_09_04_forks_chapter: "read 2026-09-04"
      d.hypotheses_read_beside_the_base: "every command reads the hypotheses beside the record over
                                          the base - pull shows what each proposes, check and open
                                          say where two disagree, the opener counts what waits with
                                          each one's age and reach - and evaluates the base alone;
                                          the union is tested by consolidation, and the page draws
                                          the base"
      p.contested_meanings: 1
  d.contradiction_by_id_and_day:
    rests_on: [s.2026_09_04_minted_permission, s.2026_09_03_hypotheses, d.base_shared_forks_on_contradiction, d.write_path_returns_reach, p.supersede_doors]
    verdict: "a contradiction is told by the id and the day: the same id with a value read no later
              than the base's own reading, or with a different verdict, is refused into the base and
              named a hypothesis; a newer reading supersedes, a standing judgment is superseded only
              when its wrong_if holds; the same premises under different ids are different subjects"
    because: "set is the update path - the world moving, flagged as it always was - so a differing
              value alone cannot be the contradiction, or the reach would have nothing left to reach.
              What the record can tell apart is time: a reading newer than the one the base holds -
              its own date, else its source's - supersedes it; one of the same day or older that
              disagrees is two writers, not the world moving. A value nothing dates is superseded by
              the first dated write, which starts the clock; a concurrent second writer is then
              same-day and refused - the case the mechanism exists for. A judgment has no such clock,
              and resting on a session source proves nothing, since every judgment rests on the
              session that wrote it; naming one proves no more, since the session writes it. So a
              judgment is replaced in the base only when it is already broken by its own condition,
              and every other rewrite waits beside the record for a person to fold. Five judgments
              here rest on one source with five verdicts, so the same premises under different ids
              stay different subjects until someone says otherwise - a candidate to judge, never a
              refusal. One function decides all of it; {{p.supersede_doors}} is the count that would
              show a second one creeping in."
    wrong_if: "p.supersede_doors > 1"
    seen:
      s.2026_09_04_minted_permission: "read 2026-09-04"
      s.2026_09_03_hypotheses: "read 2026-09-03"
      d.base_shared_forks_on_contradiction: "a consistent addition goes straight to the shared
                                             record from any session or branch; a write that
                                             contradicts the record opens a named hypothesis, and
                                             whatever later rests on the contradiction goes there - a
                                             session is never the unit"
      d.write_path_returns_reach: "the record changes from the command line through set, add and
                                   review; each edits the file in place, writes seen itself, and
                                   answers with the reach - what rests on the write, what is MOVED
                                   now, which predicate fired"
      p.supersede_doors: 1
  d.coverage_printed_never_acted:
    rests_on: [s.2026_09_03_coverage, d.intent_is_a_source, d.metrics_derived_builtin, p.coverage_thresholds]
    verdict: "coverage is counted at every build and check and printed as facts - each intent no tab
              serves with one hint beside it, the prefixes nothing picks, spill, drift, the recent
              streak - and nothing in the mechanism acts on a number"
    because: "The hint says how much of what a session wrote already falls inside each tab's picks,
              and stops there: whether that makes the intent the same world as the tab is a session's
              judgment, recorded as an arrangement decision with its own falsifier. A line drawn in
              code would be a threshold nobody chose and everybody wants to move;
              {{p.coverage_thresholds}} of them exist, and the count is what would show one creeping
              in."
    wrong_if: "p.coverage_thresholds > 0"
    seen:
      s.2026_09_03_coverage: "read 2026-09-03"
      d.intent_is_a_source: "a session records what it was for as a source; a tab is a reading
                             occasion that serves intents, and serving is earned by picks"
      d.metrics_derived_builtin: "graph.* and page.* are derived entries the reader computes itself
                                  - counts and shares, never stored, thresholds only inside
                                  falsifiers"
      p.coverage_thresholds: 0
  d.distinct_is_a_bare_id:
    rests_on: [s.2026_09_04_sameness, d.sameness_is_judged, d.locate_by_shape]
    verdict: "distinct writes its edge as a bare id - or several, comma-separated - with the why as
              a comment beneath, never as a list or an id-keyed mapping; the pair is left out of
              every candidate list, and same refuses it until the edge is removed"
    because: "The reader infers a field's role from its shape: a list of ids votes for the
              dependency field and a mapping keyed by ids for the snapshot, so an edge written either
              way would outvote rests_on or seen in a small record and change what every judgment
              there means. A bare id has no role to claim. The why is for a person and lives beside
              the field as a comment, the way a set's reason does; nothing evaluates it, and the edge
              holds either way round."
    blocked_on: "implementation: falsified by a record whose role inference tips on a distinct_from
                 field - a bare id casts no vote, so the sign would be a reader that learned to read
                 one as a list - or by a merger who needs the why on a surface, where a comment
                 cannot be shown"
    seen:
      s.2026_09_04_sameness: "read 2026-09-04"
      d.sameness_is_judged: "the tool never decides that two entries are the same: it shows the
                             nearest existing entries when one is written and candidates when
                             hypotheses consolidate; the writer or the merger decides, and the
                             decision is recorded - same_as as a migration that leaves the build
                             green, distinct_from as an edge that retires the pair"
      d.locate_by_shape: "the docs locate a shipped script by matching its name and taking the
                          highest version, never by a path written against today's layout"
  d.drift_from_newest_born:
    rests_on: [s.2026_09_03_coverage, d.metrics_derived_builtin]
    verdict: "drift is the share of what sessions read on or after the newest born among the
              arrangement judgments that nothing picks; without a born it has no value"
    because: "The newest arrangement decision is the last day someone looked at the page as a whole,
              so what was left unpicked before it was chosen, not drifted. A session read on that
              same day counts, because two sessions in one day are the common case here and a day is
              the finest clock the record keeps; a record whose arrangements carry no born cannot
              date what was added, and the count says so rather than guessing a start."
    blocked_on: "observational: falsified if a real page shows drift at zero while its recent
                 sessions sit unserved - a new tab's born hiding what the older tabs never picked"
    seen:
      s.2026_09_03_coverage: "read 2026-09-03"
      d.metrics_derived_builtin: "graph.* and page.* are derived entries the reader computes itself
                                  - counts and shares, never stored, thresholds only inside
                                  falsifiers"
  d.dry_run_is_check_on_the_union:
    rests_on: [s.2026_09_04_consolidate, d.consolidation_is_a_test, d.hypotheses_read_beside_the_base, p.union_tests]
    verdict: "the dry run is the reader's own check, run on the base with the hypotheses laid over
              it by id, said as what the fold would change: what arrives, what it replaces and what
              rests on that, what the union moves or breaks, what is contested"
    because: "A second evaluator for hypotheses would drift from the first; what a hypothesis's
              judgment needs is exactly what check asks of any judgment, asked of the record as it
              would stand after the fold. So the union is checked as a base is, and only what check
              did not already say about the base alone is the union's doing - a record already red
              stays red on its own account. A premise that moved under a judgment blocks the fold and
              leaves the run green, since a move flags a judgment for a person and fails no build; a
              contested id, a falsifier that holds and a hole make it red. {{p.union_tests}} is the
              count of places the union is tested."
    wrong_if: "p.union_tests > 1"
    seen:
      s.2026_09_04_consolidate: "read 2026-09-04"
      d.consolidation_is_a_test: "consolidating hypotheses into the base tests whether the writers
                                  worked on the same world: premises re-checked, falsifiers
                                  evaluated, contradictions stopped - as a dry run at any moment, and
                                  as a step on every pull request"
      d.hypotheses_read_beside_the_base: "every command reads the hypotheses beside the record over
                                          the base - pull shows what each proposes, check and open
                                          say where two disagree, the opener counts what waits with
                                          each one's age and reach - and evaluates the base alone;
                                          the union is tested by consolidation, and the page draws
                                          the base"
      p.union_tests: 1
  d.fold_passes_the_one_door:
    rests_on: [s.2026_09_04_minted_permission, s.2026_09_04_consolidate, d.contradiction_by_id_and_day, p.supersede_doors]
    verdict: "a folded reading passes the one door a written one does, with a person's hand on it:
              an entry replaces what the base holds when its reading is newer, a judgment when the
              standing one is broken or when the fold itself is the person's - and a reading the door
              refuses is contested, never overwritten"
    because: "The fold is a write under ids the base holds, and one function still says whether such
              a write may replace what stands - {{d.contradiction_by_id_and_day}} put the rule there
              so that nothing else decides it, and the fold passes its hand through that function
              rather than deciding beside it. Readings keep the day rule whole: a hypothesis born of
              a same-day contradiction stays beside the record until someone reads again on a later
              day, which is the act the day rule tells two writers apart by, and no hand makes an
              older reading newer. A standing judgment has no clock to appeal to, so what could admit
              its rewrite was a claim written into the write itself - which is what a session mints
              for free. The fold is the one act here a session cannot write into the record, and it
              is where the rewrite is read beside what it replaces, with the dry run naming both.
              {{p.supersede_doors}} is the count that would show a second door."
    wrong_if: "p.supersede_doors > 1"
    seen:
      s.2026_09_04_minted_permission: "read 2026-09-04"
      s.2026_09_04_consolidate: "read 2026-09-04"
      d.contradiction_by_id_and_day: "a contradiction is told by the id and the day: the same id
                                      with a value read no later than the base's own reading, or with
                                      a different verdict, is refused into the base and named a
                                      hypothesis; a newer reading supersedes, a standing judgment is
                                      superseded only when its wrong_if holds; the same premises
                                      under different ids are different subjects"
      p.supersede_doors: 1
  d.gate_and_opener_against_the_mark:
    rests_on: [s.2026_09_03_coverage, d.gate_reminds, d.open_is_a_slot, p.gate_bounces]
    verdict: "the opener marks where a session began - failures, judgments, readings, unserved
              intents and the ids held - and the gate reminds once about new unexcused failures,
              an intent left unserved, entries written with no intent recorded; of coverage the
              opener says only the newest unserved intent, in its line about what to do next"
    because: "What was already red or unserved when a session opened is not its doing, and a gate
              that bounced for it would teach sessions to fight the gate. The opener's slot is for
              what needs a person, so coverage takes no line of its own there: the intent goes into
              the line that already says what to run next, and check carries every unserved intent
              with a hint each. The gate still yields after {{p.gate_bounces}} bounce."
    wrong_if: "p.gate_bounces > 1"
    seen:
      s.2026_09_03_coverage: "read 2026-09-03"
      d.gate_reminds: "the stop gate compares against the session-start mark and yields after one
                       bounce; unchanged existing judgments falsified by updated readings can stay
                       flagged while recording finishes, and check still reports their failed
                       conditions"
      d.open_is_a_slot: "the session opener fills a fixed character slot, highest value per
                         character first; values never preload"
      p.gate_bounces: 1
  d.gate_by_consequence:
    rests_on: [prior.gate_by_consequence, m.claims.general_held, d.hypothesis_is_a_judgment]
    verdict: "who decides is confidence times the cost of being wrong: high and cheap is decided in
              one line, no person; high and costly is decided, recorded, and put in front of the
              person; low and cheap is tried, the reversal being the test; low and costly is the
              person's, or buys information with the cheapest experiment"
    because: "Confidence attaches to the claim and never to the decision; cost is what the lanes
              already weigh - reversibility, blast radius, who is affected. Asked for a language, a
              session answered at 0.7 and then proposed to wait for an event that would falsify the
              other choice, which nothing had asked of it. Confidence in a general claim is earned -
              {{m.claims.general_held}} of 3 scored held - so the cheap row is decided on it and the
              record says so in one line. The fork gate of d.hypothesis_is_a_judgment is the costly
              row of the same matrix: the falsifier drafted, the person confirming. The sign that
              would make a judgment wrong is written in every cell, since it is one line; it is
              pursued - a run, a measurement - only where being wrong costs."
    wrong_if: "prior.gate_by_consequence < 0.8"
    reopened_by: "sessions asking a person in the cheap row, or deciding alone in the costly one,
                  more often than not - read off the records of real work"
    seen:
      prior.gate_by_consequence: 0.85
      m.claims.general_held: 3
      d.hypothesis_is_a_judgment: "a task, a branch and a what-if are one thing: a judgment whose
                                   truth is pending - its premises in rests_on, its claim in verdict,
                                   what would refute its success in wrong_if - and the merge is its
                                   test"
  d.hypotheses_read_beside_the_base:
    rests_on: [s.2026_09_03_hypotheses, d.consolidation_is_a_test, d.no_feed_of_other_branches, p.hypothesis_thresholds]
    verdict: "every command reads the hypotheses beside the record over the base - pull shows what
              each proposes, check and open say where two disagree, the opener counts what waits with
              each one's age and reach - and evaluates the base alone; the union is tested by
              consolidation, and the page draws the base"
    because: "A hypothesis laid over the base at every check would move every judgment resting on
              what it proposes, in every session, for a claim nobody has tested - the dry run is
              where that question is asked, once, with the answer in three lists. Reading it beside
              the base costs almost nothing: a proposal is a line under the value it would replace, a
              contested id is the one thing that needs a person now, and the count line says how long
              each has waited and how much rests on it without drawing a line -
              {{p.hypothesis_thresholds}} thresholds live in the code, and the count is what would
              show one creeping in."
    wrong_if: "p.hypothesis_thresholds > 0"
    seen:
      s.2026_09_03_hypotheses: "read 2026-09-03"
      d.consolidation_is_a_test: "consolidating hypotheses into the base tests whether the writers
                                  worked on the same world: premises re-checked, falsifiers
                                  evaluated, contradictions stopped - as a dry run at any moment, and
                                  as a step on every pull request"
      d.no_feed_of_other_branches: "the opener adds one line - how many hypotheses wait, and for how
                                    long; nothing another branch claims is pushed into a session, it
                                    is pulled by seed or surfaces as a collision on the same id"
      p.hypothesis_thresholds: 0
  d.hypothesis_files_meet_on_one_name:
    rests_on: [s.2026_09_04_hypothesis_claim_name, s.2026_09_04_merge_driver_reason, alt.record_merge_driver, p.hypothesis_name_inputs]
    request: s.2026_09_04_hypothesis_claim_name
    verdict: "hypothesis files meet only where two branches claim the same thing under one id: the
              suggested name carries the id contradicted and a mark of the claim written, so two
              readings that disagree open two files and merge, and two that agree open one path that
              git reports as an add and an add, since each head carries the day it was born; a merge
              driver stays set aside for that meeting - the two heads say one thing, and either is
              the whole of it - never for an absence of conflicts"
    because: "This narrows what stood here rather than retiring it. That decision read the fork
              honestly: the name came from the id alone, so two branches refused on one id wrote one
              path whatever they claimed, and the meeting was two writers on one subject, repaired by
              a rename and judged by the dry run. The rename is needed now only where the writers
              disagree - a mark of the whole claim rides in the name, so different claims are
              different files that git merges, and which reading stands is put to a person as a
              contest, the question a driver would have had to answer and cannot. What is left is the
              agreeing pair, kept on purpose: one claim gets one name wherever it is written, so two
              branches that read the same thing meet on one path, and that merge asks nothing harder
              than which day's head to keep. {{p.hypothesis_name_inputs}} is what enters a name now,
              and a third - the branch, the session - would end even the meeting this keeps."
    wrong_if: "p.hypothesis_name_inputs > 2"
    seen:
      s.2026_09_04_hypothesis_claim_name: "read 2026-09-04"
      s.2026_09_04_merge_driver_reason: "read 2026-09-04"
      alt.record_merge_driver: rejected
      p.hypothesis_name_inputs: 2
  d.local_claims_want_a_run:
    rests_on: [s.2026_09_04_calibration, prior.local_needs_a_run, m.claims.general_held,
               m.claims.local_checked_held, m.claims.local_assumed_held, m.reach.general_held,
               m.reach.local_checked_held, m.reach.local_assumed_held,
               m.reach.assumed_at_high_confidence]
    verdict: "a claim with reach general may rest on the session's prior; a claim with reach local
              wants a run or a document beside it, usually a five-second one"
    because: "A general claim is about how things usually work anywhere, and the session has seen
              the pattern countless times. A local claim is about this project right now, which
              training cannot know: the session guesses from what is typical, and the specific case
              is specific. Scored on one day, {{m.claims.general_held}} of 3 general claims held,
              {{m.claims.local_checked_held}} of 6 local claims checked before they were asserted
              held, and {{m.claims.local_assumed_held}} of 4 local claims assumed held - each of the
              four had felt like 0.85. Sharper than the rule: local checks are fine and cost seconds;
              local assumptions carry no information. Three counts of different sizes, thirteen
              claims in all, are too thin for a comparison between them to be an honest predicate, so
              the sign that re-opens this is read by a person. A second scoring, on a different
              instrument, put the same rule against ground written before the answers: unchecked
              claims about a project held {{m.reach.local_assumed_held}} of 75, the same questions
              with that project's files readable held {{m.reach.local_checked_held}} of 83, and
