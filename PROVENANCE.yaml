                              the page's connective text lives in the brief; both resolve references
                              at build and both carry seen"
  d.predicate_shape_is_one_reading:
    rests_on: [s.2026_09_04_falsifier_shape, p.predicate_shapes, d.arrangement_sign_is_one_comparison]
    verdict: "what shape a predicate must have to be decided is one reading, asked wherever a
              predicate is written, reported or evaluated: one comparison, which is a right-hand side
              carrying no second comparison - text inside quotes is a literal and is not read for one
              - and a predicate that is not one is declined by the reader and reported where an empty
              predicate is, never answered false"
    because: "The comparison shape takes everything after the operator as its value, so a == false,
              or b == false was decided against the text after the first operator - false in every
              state of the record, a falsifier that reads as evaluable and can never fire.
              {{d.arrangement_sign_is_one_comparison}} refused that for an arrangement's sign and
              named it there; every other judgment inherited it, and check passed over them because a
              predicate that names an entry was taken as one it could read. {{p.predicate_shapes}}
              counts the places that decide the shape: a second one drifts from the first, and it
              drifts both ways. The path that had a shape test read a quoted value by looking inside
              the quotes for operators, so a date - one value, written with hyphens - was refused
              there while the path with no test compared it happily; a rule any narrower than
              'carries no second comparison' refuses values the reader compares perfectly well, and
              silencing a falsifier that works is this same failure from the other side."
    wrong_if: "p.predicate_shapes > 1"
    seen:
      s.2026_09_04_falsifier_shape: "read 2026-09-04"
      p.predicate_shapes: 1
      d.arrangement_sign_is_one_comparison: "an arrangement's sign is one comparison over a count
                                             that can hold - a name, an operator, one value; a
                                             compound or an impossible one is refused, and a
                                             re-opener stands beside it, never in its place"
  d.prior_carries_its_own_falsifier:
    rests_on: [prior.confidence_needs_calibration, m.claims.local_assumed_held, d.hypothesis_is_a_judgment]
    verdict: "the prior kind carries its own falsifier: if judgments resting on priors at 0.8 or
              above are reversed more than about one in five, the confidences carry no information
              and prior.* is demoted to a note"
    because: "A stated 0.85 is a vibe unless something can check it: the four local assumptions that
              each felt like 0.85 held {{m.claims.local_assumed_held}} times. Reversals become
              countable once a refuted hypothesis enters the record as a negative finding, which
              d.hypothesis_is_a_judgment provides for; until the reader counts them, the count is
              read by hand. A session rating everything 0.9 to skip work is not policed by the number
              - the sign that would re-open its judgment still has to be written, and a bad one is
              visible on the card."
    wrong_if: "prior.confidence_needs_calibration < 0.8"
    reopened_by: "more than about one in five of the judgments resting on a prior at 0.8 or above
                  reversed - counted over the record's negative findings once the reader counts them,
                  by hand until then"
    seen:
      prior.confidence_needs_calibration: 0.95
      m.claims.local_assumed_held: 0
      d.hypothesis_is_a_judgment: "a task, a branch and a what-if are one thing: a judgment whose
                                   truth is pending - its premises in rests_on, its claim in verdict,
                                   what would refute its success in wrong_if - and the merge is its
                                   test"
  d.prior_confidence_survives_refutation:
    from: s.2026_09_04_prior_reversal_share
    rests_on: [d.prior_carries_its_own_falsifier, d.priors_counted_at_the_matrix_line, graph.prior_reversal_rate]
    verdict: "the prior kind remains a source of confidence while at most one in five
              high-confidence prior-resting judgments has been refuted; beyond that share, prior.* is
              demoted to a note"
    because: "The printed count and this share read the same high-confidence judgment ids from
              priors_line: each judgment is counted once even when it rests on several priors.
              Consolidation preserves a hypothesis claim as the negative finding name and deletes the
              file, so the claim links the refuted judgment by its whole id or an explicit
              double-braced reference; other prose is not guessed from. Only hyp.* entries whose
              value is refuted contribute, and repeated findings for one judgment still count once.
              No qualifying judgments means a share of 0.0, not evidence of calibration. The share
              becomes an entry only when named, never stored as a fact, and its demotion line belongs
              to this falsifier, not the counting code. The older judgment still stands with its own
              sign; this new judgment makes its demotion rule evaluable without rewriting it. The
              session is attributed through from rather than made a premise: this judges the prior
              policy, not the page arrangement."
    wrong_if: "graph.prior_reversal_rate > 0.2"
    seen:
      d.prior_carries_its_own_falsifier: "the prior kind carries its own falsifier: if judgments
                                          resting on priors at 0.8 or above are reversed more than
                                          about one in five, the confidences carry no information and
                                          prior.* is demoted to a note"
      d.priors_counted_at_the_matrix_line: "how much of a record stands on a session's own
                                            confidence is counted at every check and every open and
                                            printed as two numbers - the judgments resting on a
                                            prior.* claim, and how many of those on a prior at 0.8 or
                                            above - and nothing in the mechanism acts on either"
      graph.prior_reversal_rate: 0.0
  d.priors_counted_at_the_matrix_line:
    rests_on: [s.2026_09_04_priors_count, d.computed_names_when_named, d.metrics_derived_builtin, d.prior_carries_its_own_falsifier, p.prior_count_thresholds]
    verdict: "how much of a record stands on a session's own confidence is counted at every check
              and every open and printed as two numbers - the judgments resting on a prior.* claim,
              and how many of those on a prior at 0.8 or above - and nothing in the mechanism acts on
              either"
    because: "The rule that would demote the kind is a share, and a share needs a denominator
              someone can see; until the reader counts them, how many judgments stand on a prior is
              read by hand off the file. The line the count splits at is the matrix's own, not one
              the count invents, and it is printed inside the line rather than kept in the code where
              nobody can disagree with it - {{p.prior_count_thresholds}} of them lives there, and the
              count is what would show a second creeping in: an age past which a prior goes stale, a
              share past which the line turns red. Neither number gets a computed name, because
              {{d.computed_names_when_named}} and none is rested on yet - the judgment that will rest
              on one is the demotion rule itself, once refuted findings make reversals countable."
    wrong_if: "p.prior_count_thresholds > 1"
    seen:
      s.2026_09_04_priors_count: "read 2026-09-04"
      d.computed_names_when_named: "a computed name becomes an entry only when something in the
                                    record mentions it; a count nobody rests on does not exist"
      d.metrics_derived_builtin: "graph.* and page.* are derived entries the reader computes itself
                                  - counts and shares, never stored, thresholds only inside
                                  falsifiers"
      d.prior_carries_its_own_falsifier: "the prior kind carries its own falsifier: if judgments
                                          resting on priors at 0.8 or above are reversed more than
                                          about one in five, the confidences carry no information and
                                          prior.* is demoted to a note"
      p.prior_count_thresholds: 1
  d.purpose_gaps_warn:
    rests_on: [s.2026_09_04_components, d.author_free_build_guarantees, d.intent_is_a_source, d.spill_on_every_tab]
    verdict: "Missing serves or why warns rather than preventing the page from being read; invalid
              or unearned serving claims still fail"
    because: "Existing briefs predate session intents, and a tab of source material can
              intentionally claim no session outcome. Requiring a claim from those pages would invent
              intent or suppress their reading surface. The warning names the missing metadata;
              coverage and the mandatory spill still expose unserved work, while a serving claim that
