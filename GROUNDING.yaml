      s.2026_09_13_worker_and_research: "read 2026-09-13"
  d.readme_working_modes:
    from: s.2026_09_14_working_modes
    name: "Explain shared contexts, branch contexts and explicit consolidation"
    rests_on: [s.working_modes_explanation, d.readme_layered_explanation, d.consolidation_is_a_test]
    verdict: "Explain Simple as one shared context and Advanced as branch contexts plus a continuing
              path for shared findings. Show consolidation explicitly in both modes, with folding,
              refutation and unresolved proposals distinguished. Show local reads of pending findings
              separately from publication and acceptance into main."
    because: "A branch-only picture hides findings that outlive the feature which discovered them. A
              generic review box hides comparison of subjects, conflicting claims and combined
              dependencies. The shared path and consolidation cycle explain how knowledge becomes
              available, is reconciled and is retained, while the vendor API example gives that
              separation a concrete use. These are explanatory design choices; reader comprehension
              has not been measured."
    reopened_by: "An uncoached reader interprets pending findings as already accepted, assumes every
                  finding applies to every branch, cannot explain what consolidation changes, or
                  reads a connector as automatic adoption or publication."
    seen:
      s.working_modes_explanation: "read 2026-09-14"
      d.readme_layered_explanation: "Lead with recorded dependencies between decisions, evidence and
                                     assumptions, and the conditions for review. Use descriptive
                                     story headings and visible record excerpts, with complete
                                     records, state tables and diagrams in the example guides.
                                     Distinguish shared reasoning roles from mandatory sections,
                                     spell the name kpopper, and link to Popper's idea without
                                     explaining every part of the visual joke."
      d.consolidation_is_a_test: "consolidating hypotheses into the base tests whether the writers
                                  worked on the same world: premises re-checked, falsifiers
                                  evaluated, contradictions stopped - as a dry run at any moment, and
                                  as a step on every pull request"
  d.record_is_code:
    rests_on: [s.2026_09_01_consolidation, d.register_out_of_tree, d.base_shared_forks_on_contradiction, p.hypothesis_homes]
    verdict: "the record of what is known about the code lives in the tree - committed with the work
              it describes, reviewed in the same pull request, checked by the same CI - and a
              hypothesis travels with its branch; an out-of-tree record holds only what the tree
              cannot hold, the world outside the code; a user-level directory is at most an index of
              records, never content; a session named as a source is provenance, not process"
    because: "Code and the knowledge about it move together or drift apart: a record beside the tree
              is reviewed by whoever reviews the change and tested by whatever tests it, and a
              hypothesis committed with its branch is one file the merge carries - an untracked one
              dies with its worktree, the honest fate of a claim nobody committed. What the tree
              cannot hold - an environment, a pull request, a measurement against a deployment - has
              no branch, so it lives in the one record every worktree registers. A directory of
              records at the user level would be a second place every reader must know, so it may
              index and never hold. A session in a source field says where a claim was made, the way
              a document does, and instructs no one. The reader looks for hypotheses in
              {{p.hypothesis_homes}} place, beside the record; the count is what would show a second
              home creeping in."
    wrong_if: "p.hypothesis_homes > 1"
    seen:
      s.2026_09_01_consolidation: "read 2026-09-03"
      d.register_out_of_tree: "a record the tree cannot hold registers its path in the git common
                               dir, so every worktree finds it and nothing enters the tree"
      d.base_shared_forks_on_contradiction: "a consistent addition goes straight to the shared
                                             record from any session or branch; a write that
                                             contradicts the record opens a named hypothesis, and
                                             whatever later rests on the contradiction goes there - a
                                             session is never the unit"
      p.hypothesis_homes: 1
  d.record_measured_from_its_text:
    rests_on: [s.2026_09_04_measure_recipes, run.recipes_probed, d.measure_names_a_recipe, m.blocked_on_reopeners]
    verdict: "a recipe whose subject is the record counts from the record's own text and imports
              nothing - not the reader that check runs, and not a parser installed beside it"
    because: "{{m.blocked_on_reopeners}} declared holes is a fact about the record, and the record
              is in the tree, so it is measurable like any other. Taken through the reader it would
              stop being evidence: the number and the thing it is evidence about would come out of
              one function, and a reading that cannot disagree with what it measures is not a
              measurement - it is the same claim written twice. The isolation
              {{d.measure_names_a_recipe}} runs the Python recipes under says the same thing from the
              other side and adds a second reason: an interpreter that will not let a file in the
              checkout stand in for a module also will not see a package installed for the person
              rather than for itself, and the reader's own parser is installed exactly that way here
              - a recipe importing it runs green on the pull request and fails at a keyboard, which
              is a hole wearing a measurement's clothes. What is left is the file's own lines, and
              they are enough: an entry opens at one indent and its fields at the next."
    blocked_on: "observational: falsified by a shape the record grows that a line scan miscounts
                 while the reader reads it right - a field written as a block scalar, or a collection
                 nested a level deeper - or by a count about the record that no scan can take without
                 reimplementing the reader"
    seen:
      s.2026_09_04_measure_recipes: "read 2026-09-04"
      run.recipes_probed: "read 2026-09-04"
      d.measure_names_a_recipe: "an entry whose value is a fact about the tree names its recipe with
                                 measure: - a bare name, never a command; the recipes live beside the
                                 record as argument lists in one file reviewed as code, and run only
                                 on the pull request, by one runner, without a shell - so the record
                                 never carries a command, and no command that reads the record runs
                                 one"
      m.blocked_on_reopeners: 53
  d.record_scope_preserves_learning:
    name: "Retain useful knowledge within the actual write scope"
    rests_on: [d.record_is_code, d.gate_asks_once_after_work]
    verdict: "Keep schema restrictions separate from record-write prohibitions. Before
              implementation or handoff, check internally for useful unrecorded knowledge and retain
              it only within existing write authorization."
    because: "Knowledge about the work belongs with the work, while the reminder must leave room to
              finish without a write. A schema-preserving update can retain a new finding; a
              restriction inferred in a draft plan must not become a user prohibition. Existing
              entries, explicit read-only instructions and record-write bans still govern the
              action."
    reopened_by: "Sessions using this guidance still omit useful authorized findings, violate
                  explicit write prohibitions, create filler or duplicate entries, or add routine
                  approval requests at implementation or handoff."
    seen:
      d.record_is_code: "the record of what is known about the code lives in the tree - committed
                         with the work it describes, reviewed in the same pull request, checked by
                         the same CI - and a hypothesis travels with its branch; an out-of-tree
                         record holds only what the tree cannot hold, the world outside the code; a
                         user-level directory is at most an index of records, never content; a
                         session named as a source is provenance, not process"
      d.gate_asks_once_after_work: "a session that changed files of the tree, or ran eight prompts,
                                    with the record untouched is asked once whether there was nothing
                                    to keep - as a line on the prompt, and as one stop on the turn
                                    after a line went unanswered; the gate still yields after one
                                    bounce"
  d.refutations_keep_judgment_ids:
    from: s.2026_09_04_prior_reversal_share
    rests_on: [d.prior_confidence_survives_refutation, d.refuted_hypothesis_leaves_one_finding]
    verdict: "a negative finding preserves the judgment ids its hypothesis held in refutes, so
              refuting a hypothesis written by add changes the reversal share without an authored
              head claim"
    because: "The hypothesis file already carries each proposed judgment under its id, while its
              optional claim is prose and a file written by add carries only a birth date in its
              head. Consolidation keeps those ids in a sorted refutes list before deleting the file.
              This list identifies what was refuted, not premises the finding rests on, so it never
              votes for the dependency field. The reversal share reads this explicit list when
              present and keeps the older name links only as a fallback for findings that predate it.
              Each linked judgment counts once, and only while it belongs to the existing
              high-confidence denominator."
    blocked_on: "observational: refuting a hypothesis created entirely by the write commands leaves
                 no link to a judgment it held, or a refutes list is mistaken for a dependency
                 declaration; the end-to-end refutation tests exercise both signs"
    seen:
      d.prior_confidence_survives_refutation: "the prior kind remains a source of confidence while
                                               at most one in five high-confidence prior-resting
                                               judgments has been refuted; beyond that share, prior.*
                                               is demoted to a note"
      d.refuted_hypothesis_leaves_one_finding: "a refuted hypothesis leaves one entry in the base -
                                                hyp.<name> with v: refuted, its claim as the name,
                                                the why as at, from the session that refuted it,
                                                dated - and nothing else of it enters"
  d.refuted_hypothesis_leaves_one_finding:
    rests_on: [s.2026_09_04_consolidate, d.hypothesis_is_a_judgment]
    verdict: "a refuted hypothesis leaves one entry in the base - hyp.<name> with v: refuted, its
              claim as the name, the why as at, from the session that refuted it, dated - and nothing
              else of it enters"
    because: "A branch that failed its test should not vanish: the claim and why it fell are the
              finding, the same shape as an alternative weighed and set aside, so the record can cite
              it and a later count of reversals can find it by its value. What the hypothesis held
              besides - its entries, its judgments, its sources - was refuted with it, and carrying
              any of it over would be the fold the test refused. A session is the source because
              refuting is an act someone performs in one: the newest session source in the record is
              taken unless the command names another."
    blocked_on: "observational: falsified if the count of negative findings needs a field this shape
                 lacks, or if sessions refute by deleting the file instead of leaving the finding"
    seen:
      s.2026_09_04_consolidate: "read 2026-09-04"
      d.hypothesis_is_a_judgment: "a task, a branch and a what-if are one thing: a judgment whose
                                   truth is pending - its premises in rests_on, its claim in verdict,
                                   what would refute its success in wrong_if - and the merge is its
                                   test"
  d.release_is_one_tree:
    rests_on: [d.merge_publishes_the_release, s.2026_09_14_publish_review]
    verdict: "a release is made from a single commit - the tag, the text and the attached files all
              come from it, and only the commit that moves the version publishes"
    because: "The first shape of this tagged the commit that moved the version while building the
              files from whatever was checked out, which on any later push is a different tree: the
              tag would have said one thing and the wheel beside it another, and nobody downloading
              it could tell. Publishing only from the commit that moved the version makes the three
              agree by construction rather than by care, and costs the ability to tag an old version
              after the fact - which was never worth having, because the files for it would have come
              from the wrong tree anyway. What it also costs is retrying on the next push, and that
              is what rerunning a run is for: it replays the same commit."
    blocked_on: "observational: falsified if a release is ever wanted for a version already behind
                 main, or if a failed publish is left unmade because rerunning its own run is not
                 reachable by whoever notices"
    seen:
      d.merge_publishes_the_release: "the push that lands a version publishes it - tagged at the
                                      commit that moved the version, carrying that version's
                                      changelog entry and the files built from that commit"
      s.2026_09_14_publish_review: "read 2026-09-14"
  d.relevance_stays_declared:
    rests_on: [doc.fact_moves, m.record_scale]
    verdict: "retrieval follows declared edges and names; no learned relevance at record scale"
    because: "At hundreds of nodes exact traversal is free, auditable, and cannot invent a
              link. Learned attention with no training signal is noise - and the session
              itself already attends over the namespace line with the best model in the room."
    wrong_if: "m.record_scale > 100000"
    seen: {doc.fact_moves: "read 2026-09-01", m.record_scale: 107}
  d.one_source:
    rests_on: [skill.two_shapes]
    verdict: "this repository is the only place the plugin is edited; every installed or
              hosted copy is a read-only distribution"
    because: "The method's own law applied to the method: a second editable copy never
              resolves on its own, and every reader thereafter must know both."
    blocked_on: "observational: falsified by an edit that lands in a distributed copy and has
                 to be merged back; the distributions carry no marker that would record one"
    seen: {skill.two_shapes: "Two parallel records is the most expensive mistake available here"}
  d.page_reads_only:
    rests_on: [doc.fact_moves]
    verdict: "the page is a reading surface - no write path, nothing a hand does to it is kept;
              a trial value that persists nothing is a way of reading the reach"
    because: "A live trial input was built and rejected on contact: it added a mode to a surface
              whose whole job is to be read, and the reach question already had two dedicated
              answers outside the page. Narrowed 2026-09-02 at the person's word: the reach
              question asked in place - what falls if this moves - is reading, provided the
              page writes nothing and keeps nothing. What stays refused is a write path."
    blocked_on: "observational: falsified by a reading task that genuinely needs the record
                 changed from the page; none has appeared"
    seen: {doc.fact_moves: "read 2026-09-01"}
  d.remeasure_tests_share_one_day:
    name: "Date-sensitive remeasure tests use one explicit day"
    request: s.2026_09_18_remeasure_midnight
    rests_on: [s.2026_09_18_remeasure_midnight, m.remeasure.midnight_failures]
    verdict: "Inject one fixed day into the remeasure behavior and use that same day in each fixture
              and assertion."
    because: "The three tests cached UTC today when the module loaded, while the subprocess read UTC
              today when it eventually ran; a suite crossing midnight therefore changed the rule
              under test between setup and assertion."
    reopened_by: "A date-sensitive remeasure test obtains its fixture day and the day used by
                  remeasure from separate clock reads, or a forced cross-day run fails."
    seen: {s.2026_09_18_remeasure_midnight: "read 2026-09-18", m.remeasure.midnight_failures: 3}
  d.reopened_by_is_not_blocked_on:
    rests_on: [prior.field_name_reads_as_gate, m.blocked_on_reopeners, m.older_records_changed,
               d.declared_hole_is_a_note]
    verdict: "three fields, three meanings: wrong_if is a predicate the reader evaluates, blocked_on
              says the predicate cannot be evaluated and why, reopened_by is the prose sign that
              re-opens a judgment decided on a prior or on taste - additive, so every record written
              before it keeps working"
    because: "The record filed its re-openers under blocked_on: {{m.blocked_on_reopeners}} of its
              declared holes name the sign that would re-open a decision, none an input the record
              lacks. The content says re-opened, the field says blocked, and a session reads the
              field - that is where the reflex to wait for an event found its foothold.
              d.declared_hole_is_a_note keeps blocked_on for its designed meaning, so the third
              meaning gets a name beside it rather than a rename. Nothing is migrated: owners re-sort
              their judgments when they next touch them, and a judgment with neither field still
              fails the build. At 0.7 this sits in the cheap row below the line, so it is tried: a
              field the reader accepts is an hour to take out. Additive is measured, not
              promised: {{m.older_records_changed}} of 4 records written before the field read
              differently once the reader learned it."
    wrong_if: "m.older_records_changed > 0"
    reopened_by: "owners still filing re-openers under blocked_on once the field exists, or
                  judgments carrying reopened_by turning out, when re-read, to have been waiting on
                  an input after all"
    seen:
      prior.field_name_reads_as_gate: 0.7
      m.blocked_on_reopeners: 53
      m.older_records_changed: 0
      d.declared_hole_is_a_note: "check fails only an undeclared gap; a hole declared with
                                  blocked_on is a note"
  d.replacement_leaves_a_trail:
    rests_on: [s.2026_09_15_verdict_conflicts_decided, s.2026_09_15_branch_verdict_conflicts, m.door.replaced_fields_kept, m.door.supersede_fields_kept, d.refuted_hypothesis_leaves_one_finding, p.supersede_doors]
    verdict: "every replacement of a judgment - by add once the standing one's condition fired, or
              by the fold - keeps one line on the judgment saying what ended the decision it replaced
              and the day, and the replaced body whole beside the record; a dependency dropped is
              named with its reason, and a write that returns to a kept version is told so"
    because: "The in-place supersede kept {{m.door.supersede_fields_kept}} fields of what it
              replaced: the verdict, its why, whose asking it answered and two of four dependencies
              were gone, and only git remembered - which squash merges forget and a record outside
              git never had. The method's own rule keeps a refuted hypothesis as one finding; a
              standing judgment that fell got less. What the file the reader opens holds is read at
              every open, so the body goes beside the record in .kpopper/replaced.yaml, written at
              the moment of replacement and read only when asked - pull --history, the loop signal at
              write time, the lost ear at set - and the judgment carries one line per replacement,
              the shape arrangements already had. A body equal to a kept version is a pointer, so a
              record that flips back and forth stores each position once. A dependency dropped is the
              new decision no longer listening, which is a decision, not a side effect: named with
              its reason, kept with the version. {{m.door.replaced_fields_kept}} is what the trail
              keeps."
    wrong_if: "m.door.replaced_fields_kept < 6"
    seen:
      s.2026_09_15_verdict_conflicts_decided: "read 2026-09-15"
      s.2026_09_15_branch_verdict_conflicts: "The session that replayed the two-branch verdict
                                              conflict of issues #98 and #99 on this tree and probed
                                              four cases the issues did not try. Its reading:
                                              readings pass the day rule, a judgment in one tree is
                                              replaced only when its own falsifier fires, but the
                                              fold - local hypothesis or another branch - lays any
                                              verdict over a standing judgment by hand and calls it
                                              clean, so the write that add refuses in one tree passes
                                              across the branch line; the in-place supersede keeps
                                              nothing of what it replaced; a judgment's grounds are
                                              invisible to both doors; a future-dated reading enters.
                                              The rule it shaped, not yet decided: the base's
                                              condition evaluated on the base, an unfired flip
                                              contested and folded only by name, every replacement
                                              traced beside the record, and a source's own clock in
                                              place of the day."
      m.door.replaced_fields_kept: 6
      m.door.supersede_fields_kept: 0
      d.refuted_hypothesis_leaves_one_finding: "a refuted hypothesis leaves one entry in the base -
                                                hyp.<name> with v: refuted, its claim as the name,
                                                the why as at, from the session that refuted it,
                                                dated - and nothing else of it enters"
      p.supersede_doors: 1
  d.request_is_a_visible_claim:
    rests_on: [s.2026_09_04_minted_permission, s.2026_09_03_arrangements, d.reversal_is_a_redecision]
    verdict: "request: names whose asking a judgment was taken from - a session source whose asked:
              is the request verbatim, rested on - and says it on every surface that shows the
              judgment; it is provenance a reader weighs at the fold, and it admits nothing"
    because: "The session writes that source itself, and this method requires it to: every session's
              first write is a source carrying what it was asked. A door that opened on request: was
              therefore open to every session by the record's own convention - nothing told a
              person's asking from a session's claim that a person asked - and since the field was
              widened from arrangements to every judgment it could pass any standing falsifier in the
              record. The visibility that was offered for it, on the page and in check, is audit
              after the fact and not authority. What the field is good for survives: whose asking a
              change answers is what a person wants in front of them when they fold it, and it
              travels with the hypothesis to be read there. The alternative the exception lacked when
              it was opened - a rewrite that waits beside the record until a person folds it - exists
              now."
    blocked_on: "observational: falsified if sessions stop naming the asking a change came from once
                 the field carries no permission, so folds are read without it, or if a reader takes
                 request: for authority anyway"
    seen:
      s.2026_09_04_minted_permission: "read 2026-09-04"
      s.2026_09_03_arrangements: "read 2026-09-03"
      d.reversal_is_a_redecision: "a reversal is the arrangement written again under its own id -
                                   admitted in place when its sign holds with its tabs intact, or on
                                   a person's request, never twice in a day - and otherwise refused
                                   into a hypothesis that contests it"
  d.requested_words_are_quotes:
    rests_on: [s.2026_09_04_components, d.intent_is_a_source, d.page_lint_reads_output]
    verdict: "The request under an arrangement is a complete quote of its source, including any
              entry names the person used"
    because: "On the word of identifies whose asking a decision was taken from. Truncating or
              renaming words inside that quotation changes the provenance being shown. The quote has
              its own source reference, and the output lint accepts its text only when it exactly
              matches that source asked field; ordinary page labels still cannot expose internal
              keys."
    blocked_on: "observational: re-open if readers cannot distinguish the attributed request from
                 assertions made by the page itself"
    seen:
      s.2026_09_04_components: "read 2026-09-04"
      d.intent_is_a_source: "a session records what it was for as a source; a tab is a reading
                             occasion that serves intents, and serving is earned by picks"
      d.page_lint_reads_output: "The output lint checks references and visible keys, judgment and
                                 review markers, language, and arrangement intent; source prose stays
                                 attributed to its record entry and connective prose must carry its
                                 own references"
  d.reversal_is_a_redecision:
    rests_on: [s.2026_09_04_minted_permission, s.2026_09_03_arrangements, d.reversal_is_a_question, d.contradiction_by_id_and_day]
    verdict: "a reversal is the arrangement written again under its own id - admitted in place when
              its sign holds with its tabs intact, never twice in a day - and otherwise refused into
              a hypothesis that contests it until a person folds it"
    because: "The brief cannot reverse a decision by being edited - the record's own claims fail it
              - and a new id contradicts nothing, so the same id is where a reversal lives and the
              door every same-id write goes through decides it. The sign is read only from a brief
              that still carries what the decision made: a tab deleted or gutted makes the very sign
              it would cite. One re-decision a day makes one radical change per session mechanical
              rather than remembered, and replaced: keeps each decision's born, how long it stood and
              what ended it, so a flip reads from the record alone. A session's own word that a
              person asked bought a way past all three at once - the day, the cut link and the sign -
              and the session writes that word, so it buys nothing now. {{d.reversal_is_a_question}}
              is answered where it belongs instead: the question waits in the hypothesis until the
              person answers it by folding."
    blocked_on: "observational: falsified if an arrangement flips across days by sessions each
                 citing a sign the other's repair produced, or if a gradual edit - a pick narrowed
                 until something spills - is used to manufacture the sign"
    seen:
      s.2026_09_04_minted_permission: "read 2026-09-04"
      s.2026_09_03_arrangements: "read 2026-09-03"
      d.reversal_is_a_question: "undoing an arrangement whose falsifier did not fire is a question
                                 for the person, never a change"
      d.contradiction_by_id_and_day: "a contradiction is told by the id and the day: the same id
                                      with a value read no later than the base's own reading, or with
                                      a different verdict, is refused into the base and named a
                                      hypothesis; a newer reading supersedes, a standing judgment is
                                      superseded only when its wrong_if holds; the same premises
                                      under different ids are different subjects"
  d.review_names_what_it_reads:
    rests_on: [d.reasoning_in_record, d.metrics_derived_builtin]
    verdict: "review takes a judgment's id or a section's title; an arrangement's review also
              rewrites the shape of the one tab, or of the tab serving a session source it rests on;
              nothing refreshes a snapshot by itself"
    because: "Connective text has no id, so its title is its address, and a section reviewed by
              title gets its references snapshotted the way a judgment's dependencies are. An
              arrangement's shape is its seen kept in the brief, so the same review refreshes both -
              but a brief with several tabs has to say which, and until an arrangement names its tab,
              the tab serving what the arrangement rests on is the only link the record holds.
              Refreshing any of it automatically would erase the difference a snapshot exists to
              show."
    blocked_on: "implementation: falsified the day a real brief carries two tabs serving one session
                 source, so that the link picks arbitrarily - when an arrangement has to name its
                 tab"
    seen:
      d.reasoning_in_record: "reasoning is the because of the judgment it belongs to, in the record;
                              the page's connective text lives in the brief; both resolve references
                              at build and both carry seen"
      d.metrics_derived_builtin: "graph.* and page.* are derived entries the reader computes itself
                                  - counts and shares, never stored, thresholds only inside
                                  falsifiers"
  d.same_asks_the_one_door:
    rests_on: [s.2026_09_04_sameness, d.contradiction_by_id_and_day, d.sameness_is_judged, p.supersede_doors]
    verdict: "same is a migration through the record's own write path: the retired id is rewritten
              everywhere it is named - dependencies, snapshots, predicates, rules, references in
              text, the brief - the survivor takes the newer reading with its place and date, and
              where the two readings disagree with nothing to order them the migration is refused
              through the one door every same-id write goes through; check runs after, and a problem
              it did not have undoes the whole of it"
    because: "Two ids for one subject are two readings of it, and the record already has one rule
              for two readings under one id: the newer supersedes, the same day or undated is two
              writers. Asking {{p.supersede_doors}} door rather than writing a second keeps the
              migration from becoming a way to overwrite a value that add and set would refuse. The
              rewrite is by whole token across every file the record is, structural where a judgment
              named both ids and would otherwise rest on the survivor twice; the survivor carries
              also: with the retired id, so a write under the old id is refused and pointed at it.
              Check after the write is what makes a migration safe to run without reading the diff: a
              reference the rewrite missed fails there, and the files come back as they were."
    wrong_if: "p.supersede_doors > 1"
    seen:
      s.2026_09_04_sameness: "read 2026-09-04"
      d.contradiction_by_id_and_day: "a contradiction is told by the id and the day: the same id
                                      with a value read no later than the base's own reading, or with
                                      a different verdict, is refused into the base and named a
                                      hypothesis; a newer reading supersedes, a standing judgment is
                                      superseded only when its wrong_if holds or the request that
                                      asked for the change is named; the same premises under
                                      different ids are different subjects"
      d.sameness_is_judged: "the tool never decides that two entries are the same: it shows the
                             nearest existing entries when one is written and candidates when
                             hypotheses consolidate; the writer or the merger decides, and the
                             decision is recorded - same_as as a migration that leaves the build
                             green, distinct_from as an edge that retires the pair"
      p.supersede_doors: 1
  d.serving_earned_by_picks:
    rests_on: [s.2026_09_03_coverage, d.intent_is_a_source]
    verdict: "a tab serves an intent only when its sections pick something that session recorded; a
              declaration nothing picks fails the build, and an intent that recorded nothing stands
              outside coverage"
    because: "A tab could otherwise claim every intent and serve none, and coverage would read as
              complete on a page that shows nothing a session wrote. What a session recorded is what
              comes from its source or rests on it; one pick of that earns the claim, the share says
              how much of it the tab shows. An intent with nothing recorded can be neither served nor
              unserved, so it is said once and counted nowhere - a claim on it is the one claim that
              cannot be earned."
    blocked_on: "observational: falsified if tabs come to earn their claims with a single token pick
                 - one entry of the intent, chosen to silence the failure - often enough that the
                 failure stops meaning anything"
    seen:
      s.2026_09_03_coverage: "read 2026-09-03"
      d.intent_is_a_source: "a session records what it was for as a source; a tab is a reading
                             occasion that serves intents, and serving is earned by picks"
  d.shape_is_read_not_declared:
    rests_on: [s.2026_09_11_shape_core, d.record_is_code, d.checked_session_is_optional, d.parse_kept_by_file_identity, d.relevance_stays_declared, doc.agent_graph]
    verdict: "what the record's physical form is - its files and shards, the field each role is read
              from, its sidecars, the stores derived from it and what reads it - is computed by a
              read command whenever asked and never kept as a declaration; the only declared parts
