              available, is reconciled and is retained, while the vendor API example gives that
              separation a concrete use. These are explanatory design choices; reader comprehension
              has not been measured."
    reopened_by: "An uncoached reader interprets pending findings as already accepted, assumes every
                  finding applies to every branch, cannot explain what consolidation changes, or
