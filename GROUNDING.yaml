  s.2026_09_15_branch_verdict_conflicts:
    asked: "Explain and diagnose issues #98 and #99: a two-branch test on a real record where each
            branch reached the opposite verdict on one judgment, and the cross-branch fold took the
            overlay's side, said clean, kept nothing of the replaced judgment and left the tree
            uncommitted. Reproduce on this tree, say which behaviour is a rule and which a gap, and
            shape the rule that should replace it."
    name: "The session that replayed the two-branch verdict conflict of issues #98 and #99 on this
           tree and probed four cases the issues did not try. Its reading: readings pass the day
           rule, a judgment in one tree is replaced only when its own falsifier fires, but the fold -
           local hypothesis or another branch - lays any verdict over a standing judgment by hand and
           calls it clean, so the write that add refuses in one tree passes across the branch line;
           the in-place supersede keeps nothing of what it replaced; a judgment's grounds are
           invisible to both doors; a future-dated reading enters. The rule it shaped, not yet
           decided: the base's condition evaluated on the base, an unfired flip contested and folded
           only by name, every replacement traced beside the record, and a source's own clock in
           place of the day."
  s.2026_09_15_link_spelling:
    name: "The session that found a source link measured between two spellings of one place"
    asked: "tests/test_page_links.py ... fails deterministically on macOS ... while it passes on the
            Linux CI runner ... find where the renderer builds the relative href for an absolute
            evidence file, and make the page location and the evidence path use one consistent
            spelling (both resolved, or both as written) so a browser opening the page at the
            spelling the CLI writes reaches the file on macOS as well as Linux. Decide whether the
            test assumption or the renderer is the one to change"
    of: "The Absolute evidence link on the rendered page left its directory with ten steps where
         three reach the directory the two files share: it was measured from the resolved location of
         the page to the source under the name the record spells it with. A temporary directory on
         macOS is reached as both /var/folders/... and /private/var/folders/..., so the two ends
         counted different numbers of levels and the link climbed past the root. The test that
         catches it reads its verdict through urljoin, which discards a step past the root on some
         versions and not on others: it failed on Python 3.13.13 and passed on 3.9.6 and 3.14.5, so
         the runs that guard the tree stayed green while the link was wrong on every platform. Both
         ends are resolved before the subtraction now; a path with no directory link in it produces
         the same link as before, and the 1327-test suite passes."
    read: "2026-09-15"
  s.2026_09_15_verdict_conflicts_decided:
    asked: "Closed: implement the rule shaped for issues #98 and #99 and see how it behaves,
            following the delivery workflow - a verdict, or other grounds, laid over a standing
            judgment folds only when the base's own condition has broken it on the base's readings or
            when a person names it; every replacement leaves a trail beside the record; a reading
            dated ahead of today is refused; across the branch line a reading from another source is
            named by a person; the dry run says reversed and open says so until reviewed."
    name: "The session that implemented the verdict-conflicts rule as four features on one branch,
           each with tests: the trail a replacement leaves (one line on the judgment, the body kept
           in .kpopper/replaced.yaml, dropped dependencies named with a reason, a return to a kept
           version said), the fold's door asked with the base's readings and by name (--take), the
           reversal said by open and check until reviewed with pull --history, and readings dated
           ahead refused with another source named across the branch line. The door was mutated back
           to by-hand once to show the tests fail. The rule itself went into the record as a
           hypothesis for a person to take by name - the new door deciding its own re-decision."
    read: "2026-09-15"
  s.2026_09_16_page_address:
    name: "The session that made the address of a page survive the name of its directory"
    asked: "The path is pasted into the URL unquoted. A record directory whose name contains # ...
            makes the browser treat everything from the # onward as a fragment, and the page never
            loads. Spaces and other characters that need percent-encoding have the same problem, and
            a literal % in a directory name would be read as an escape. Fix: build the URI properly
            ... then append #tree when the --tree flag was given ... Add a test covering a record
            directory whose name contains # and a space"
    of: "The command that opens a written page built its address by pasting the path after a scheme.
         A record directory named with a number sign ended the address where its name began: the
         browser was asked for the path up to that point and read the rest as a fragment, so the page
         never loaded. The name in the test fixtures, record # שלום, is such a name. The path becomes
         a URL through the same call that escapes it now, and the one fragment the command offers is
         added after. A test names a directory with a number sign and a space and reads the address
         handed to the browser: without the change its fragment is the tail of the directory name
         rather than the flag."
    read: "2026-09-16"
  s.2026_09_16_versions_core:
    asked: "Close the model behind issues #98 and #99 for good: after the fold's fixes of PR #101,
            shape the smallest core that covers every case the thread raised - a two-branch verdict
            conflict, an inherited reading mistaken for evidence, a same-source re-read, a same-day
            correction, two commits measuring two code states, a fallen conclusion and its
            replacement, a replace-and-return with its reasons, a hand edit on a stale base, a
            historical dependency that is not a lost one, conflicting adjudications - as one set of
            rules with no path-specific exception; write it into the record as a model chosen for
            examination, with its promises as requirements to prove, then prove them in an isolated
            module with real git merges before wiring anything existing to it"
    name: "The session that closed the model behind the branch verdict conflicts: versions per
           subject stored one file each, what each writer saw kept apart from what a claim rests on
           and from what an act replaced, acts as versions of their own kind, state computed from the
           frontier and the acts and the checks, and the entry file as a rendering that carries its
           own heads and that a hand edit is reconciled against three ways. Shaped in conversation
           with a second reviewer's corrections - seeing is not replacing, a hand edit keeps the base
           it saw, a historical dependency is not a lost one, one append-only file per subject
           conflicts under git where one file per version merges clean, acts can conflict, the two
           times need exact meaning, the merged entry file is rebuilt and never read as an edit - and
           hardened by two review rounds of the module itself"
