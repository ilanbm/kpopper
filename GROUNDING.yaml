                                     explaining every part of the visual joke."
      d.consolidation_is_a_test: "consolidating hypotheses into the base tests whether the writers
                                  worked on the same world: premises re-checked, falsifiers
                                  evaluated, contradictions stopped - as a dry run at any moment, and
                                  as a step on every pull request"
  d.record_is_code:
    rests_on: [s.2026_09_01_consolidation, d.register_out_of_tree, d.base_shared_forks_on_contradiction, p.hypothesis_homes]
    verdict: "the record of what is known about the code lives in the tree - committed with the work
              it describes, reviewed in the same pull request, checked by the same CI - and a
              hypothesis travels with its branch; an out-of-tree record holds only what the tree
              cannot hold, the world outside the code; a user-level directory is at most an index of
              records, never content; a session named as a source is provenance, not process"
    because: "Code and the knowledge about it move together or drift apart: a record beside the tree
              is reviewed by whoever reviews the change and tested by whatever tests it, and a
              hypothesis committed with its branch is one file the merge carries - an untracked one
              dies with its worktree, the honest fate of a claim nobody committed. What the tree
              cannot hold - an environment, a pull request, a measurement against a deployment - has
              no branch, so it lives in the one record every worktree registers. A directory of
              records at the user level would be a second place every reader must know, so it may
              index and never hold. A session in a source field says where a claim was made, the way
              a document does, and instructs no one. The reader looks for hypotheses in
              {{p.hypothesis_homes}} place, beside the record; the count is what would show a second
              home creeping in."
    wrong_if: "p.hypothesis_homes > 1"
    seen:
      s.2026_09_01_consolidation: "read 2026-09-03"
      d.register_out_of_tree: "a record the tree cannot hold registers its path in the git common
                               dir, so every worktree finds it and nothing enters the tree"
      d.base_shared_forks_on_contradiction: "a consistent addition goes straight to the shared
                                             record from any session or branch; a write that
                                             contradicts the record opens a named hypothesis, and
                                             whatever later rests on the contradiction goes there - a
                                             session is never the unit"
      p.hypothesis_homes: 1
  d.record_measured_from_its_text:
    rests_on: [s.2026_09_04_measure_recipes, run.recipes_probed, d.measure_names_a_recipe, m.blocked_on_reopeners]
    verdict: "a recipe whose subject is the record counts from the record's own text and imports
              nothing - not the reader that check runs, and not a parser installed beside it"
    because: "{{m.blocked_on_reopeners}} declared holes is a fact about the record, and the record
              is in the tree, so it is measurable like any other. Taken through the reader it would
              stop being evidence: the number and the thing it is evidence about would come out of
              one function, and a reading that cannot disagree with what it measures is not a
              measurement - it is the same claim written twice. The isolation
              {{d.measure_names_a_recipe}} runs the Python recipes under says the same thing from the
              other side and adds a second reason: an interpreter that will not let a file in the
              checkout stand in for a module also will not see a package installed for the person
              rather than for itself, and the reader's own parser is installed exactly that way here
              - a recipe importing it runs green on the pull request and fails at a keyboard, which
              is a hole wearing a measurement's clothes. What is left is the file's own lines, and
              they are enough: an entry opens at one indent and its fields at the next."
    blocked_on: "observational: falsified by a shape the record grows that a line scan miscounts
                 while the reader reads it right - a field written as a block scalar, or a collection
                 nested a level deeper - or by a count about the record that no scan can take without
                 reimplementing the reader"
    seen:
      s.2026_09_04_measure_recipes: "read 2026-09-04"
      run.recipes_probed: "read 2026-09-04"
      d.measure_names_a_recipe: "an entry whose value is a fact about the tree names its recipe with
                                 measure: - a bare name, never a command; the recipes live beside the
                                 record as argument lists in one file reviewed as code, and run only
                                 on the pull request, by one runner, without a shell - so the record
                                 never carries a command, and no command that reads the record runs
                                 one"
      m.blocked_on_reopeners: 53
  d.record_scope_preserves_learning:
    name: "Retain useful knowledge within the actual write scope"
    rests_on: [d.record_is_code, d.gate_asks_once_after_work]
    verdict: "Keep schema restrictions separate from record-write prohibitions. Before
              implementation or handoff, check internally for useful unrecorded knowledge and retain
              it only within existing write authorization."
    because: "Knowledge about the work belongs with the work, while the reminder must leave room to
              finish without a write. A schema-preserving update can retain a new finding; a
              restriction inferred in a draft plan must not become a user prohibition. Existing
              entries, explicit read-only instructions and record-write bans still govern the
              action."
    reopened_by: "Sessions using this guidance still omit useful authorized findings, violate
