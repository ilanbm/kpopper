  d.readme_visual_identity:
    rests_on: [s.2026_09_13_readme_direction, s.2026_09_12_first_readings, s.2026_09_13_large_hero, s.gaze_direction_study, s.2026_09_13_reasoning_emphasis, s.2026_09_13_process_illustrations, s.2026_09_13_worker_and_research]
    verdict: "Use the large ink portrait of Karl Popper on the left, with a restrained, faintly
              amused expression and a natural inward gaze toward the lowercase kpopper wordmark and
