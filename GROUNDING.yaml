      p.gate_bounces: 0
      doc.hook_delivery: "read 2026-09-22"
  d.gate_asks_once_after_work:
    rests_on: [s.2026_09_10_skills_split, run.design_talk, d.gate_reminds, p.gate_bounces, doc.prompt_reminders, doc.hook_delivery]
    verdict: "A session that changed files or ran eight prompts without updating the record receives
