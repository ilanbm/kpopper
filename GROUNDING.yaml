  d.snapshot_named_reviewed_is_kept:
    name: "A snapshot named reviewed is kept, and review writes no day into it"
    verdict: "When a record names its snapshot field reviewed, review rewrites that snapshot and
              writes no review day, in the base and in named hypotheses, in both writers. A reversal
              the judgment's trail records then stays open, and the review says so in one line."
    because: "The snapshot is what a review leaves behind. A day written over it left the judgment
              never checked and turned check red, while the day only acknowledges a reversal, which
              the review can name instead. Refusing the review would leave every judgment in such a
              record unreviewable until someone renamed the field by hand, in the schema and in every
              judgment. A snapshot that is not a mapping, such as a day an earlier review wrote over
              it, is read as never checked by both readers, and both writers now replace it with the
              snapshot."
    rests_on: [d.replacement_leaves_a_trail, d.review_names_what_it_reads]
    reopened_by: "A record that names its snapshot reviewed carries a judgment a person has read
                  since it was decided again, and its reversal notice keeps asking with no way to
                  answer it."
    from: s.2026_09_23_snapshot_named_reviewed
    seen:
      d.replacement_leaves_a_trail: "every replacement of a judgment - by add once the standing
                                     one's condition fired, or by the fold - keeps one line on the
                                     judgment saying what ended the decision it replaced and the day,
                                     and the replaced body whole beside the record; a dependency
                                     dropped is named with its reason, and a write that returns to a
                                     kept version is told so"
      d.review_names_what_it_reads: "review takes a judgment's id or a section's title; an
                                     arrangement's review also rewrites the shape of the one tab, or
                                     of the tab serving a session source it rests on; nothing
                                     refreshes a snapshot by itself"
  d.source_file_availability_is_a_note:
    name: "A missing source file calls for another reading"
    verdict: "check reports a missing repository file locator as a note, with a re-read or revision
              pin hint. file and literal from paths accept revision:path; the revision must hold a
              blob. Absolute external paths, symbolic entry references, prose and glob patterns are
              outside this check."
    because: "The absence of a cited file removes the ability to revisit that source in the current
              tree, but does not by itself refute the claim read from it. Like other unavailable
              knowledge notes, this finding preserves check exit status. at scopes the citation and
              read dates it; neither substitutes for an openable file locator."
    rests_on: [s.2026_09_24_source_file_references]
    from: s.2026_09_24_source_file_references
    reopened_by: "A claim is treated as independently verified solely because check exits zero
                  despite a missing source, a valid pinned blob is reported absent, or an absolute
                  external path is reported as missing from this repository."
    seen: {s.2026_09_24_source_file_references: "read 2026-09-24"}
  d.spill_on_every_tab:
    rests_on: [s.2026_09_03_coverage, d.author_free_build_guarantees]
    verdict: "what fell through the arrangement - flagged judgments nothing picked, and what a
              session wrote for an intent no tab serves - is counted once for the page and drawn on
              every tab"
    because: "A reader opens a tab, not the page. The guarantee that an arrangement may order but
              not drop has to hold on whichever tab is open, or a second tab becomes the place to
              keep what the first did not anticipate out of sight. The count stays one, so a
              falsifier over it means the same thing from every tab."
    blocked_on: "observational: falsified if readers of a page with many tabs report the repeated
                 section as noise they learn to skip - the guarantee failing the other way"
    seen:
      s.2026_09_03_coverage: "read 2026-09-03"
      d.author_free_build_guarantees: "the session composes freely and the build enforces the
                                       element rules on the output"
  d.standalone_html_is_a_copy:
    from: s.2026_09_10_standalone_html
    rests_on: [doc.standalone_html]
    verdict: "Keep authored HTML and finite evidence in one portable file; refresh prepares atomic
              text corrections on a copy while preserving unmarked, unavailable and unchecked
              states."
    because: "Readers need to inspect sources and choose related corrections offline without a
              renderer replacing the author's document or promoting unreviewed prose to checked
              fact."
    reopened_by: "A saved copy loses its selected content or evidence, a partial related edit is
                  applied, evidence runs in the document shell, or an unmarked statement is presented
                  as checked."
    seen: {doc.standalone_html: "read 2026-09-10"}
  d.startup_checks_only_record_dependencies:
    from: s.2026_09_19_main_integration
    rests_on: [s.2026_09_19_main_integration, doc.applications]
    verdict: "Session startup probes only PyYAML. Normal setup retains timezone data for followups,
              and HTML applications retain their explicit optional runtime."
    because: "Opening and checking a record do not need an HTML renderer or a timezone database.
              Missing dependencies for another operation should be reported at that operation without
              preventing access to the record."
    reopened_by: "A record opening is blocked solely by missing HTML or timezone libraries, or
                  configured followups silently accept an unavailable timezone."
    seen: {s.2026_09_19_main_integration: "read 2026-09-19", doc.applications: "read 2026-09-18"}
  d.stood_is_derived:
    rests_on: [s.2026_09_03_arrangements, d.metrics_derived_builtin, d.minimal_repair, p.fields_a_build_writes]
    verdict: "how long an arrangement stood is derived - the sessions read on a later day than it
              was born that one of its tabs served - and never stored"
    because: "A counter a build bumps has a read command write the record, counts builds that are
              not events - ten renders fixing a section would age every arrangement by ten - and
              moves a line every pair of branches would conflict on. Sessions are what the record
              counts, and only the later sessions a tab went on serving are evidence it held: one
              that landed unserved is the sign, one that recorded nothing never met it. Today
              {{p.fields_a_build_writes}} fields are written by a build."
    wrong_if: "p.fields_a_build_writes > 0"
    seen:
      s.2026_09_03_arrangements: "read 2026-09-03"
      d.metrics_derived_builtin: "graph.* and page.* are derived entries the reader computes itself
                                  - counts and shares, never stored, thresholds only inside
                                  falsifiers"
      d.minimal_repair: "seniority is evidence, never a threshold; a trigger is cleared by the
                         smallest structural change that suffices"
      p.fields_a_build_writes: 0
  d.storage_line_is_a_judgment:
    rests_on: [s.2026_09_11_shape_core, d.scale_by_federation, d.hypothesis_is_a_judgment, d.open_is_a_slot, p.coverage_thresholds, p.hypothesis_thresholds]
    verdict: "the line at which the record's physical form changes - one file to shards, no index to
              a derived one - is drawn inside a judgment over a measured entry, never in code; open
              reports the crossing, the change it asks for is proposed as a hypothesis, and it is
              carried out as a migration that leaves the build green"
    because: "{{d.scale_by_federation}} names the form a record grows into but not the moment, and a
              moment written into code is a threshold nobody can read or refute - this record keeps
              {{p.coverage_thresholds}} and {{p.hypothesis_thresholds}} of those for the same reason.
              A judgment with wrong_if over a measured entry is evaluated by every check and reported
              by the opener the day it holds ({{d.open_is_a_slot}}), which is the observed trigger
              the ladder asks for; the proposal is a hypothesis because
              {{d.hypothesis_is_a_judgment}} makes the merge its test; and the migration rule keeps
              two forms from standing side by side."
    reopened_by: "a threshold on the record's size, its file count or a hook's time written into the
                  scripts rather than into a judgment, or a change of form applied without a
                  hypothesis and a green build"
    seen:
      s.2026_09_11_shape_core: "read 2026-09-11"
      d.scale_by_federation: "a record scales by sharding into domain records under a pointer index,
                              never by growing one file"
      d.hypothesis_is_a_judgment: "a task, a branch and a what-if are one thing: a judgment whose
                                   truth is pending - its premises in rests_on, its claim in verdict,
                                   what would refute its success in wrong_if - and the merge is its
                                   test"
      d.open_is_a_slot: "the session opener fills a fixed character slot, highest value per
                         character first; values never preload"
      p.coverage_thresholds: 0
      p.hypothesis_thresholds: 0
  d.storage_stays_in_the_reader:
    rests_on: [s.2026_09_11_shape_core, d.one_tree_two_channels, d.record_is_code, doc.agent_graph, d.a_write_joins_its_own_shard]
    verdict: "the storage layer - the pointer index, the placement of a write, the stores derived
              from the files - stays inside the reader and this repository; it becomes a thing of its
              own only when a third consumer that is not a record this reader reads asks for it"
    because: "A general mechanism is built on the third case, not the second ({{doc.agent_graph}}),
              and today the layer has one consumer. A second repository would be a second place every
              reader must know - what {{d.one_tree_two_channels}} refuses for the reader and
              {{d.record_is_code}} for a directory of records - and the layer's pieces are landing as
              bounded changes to the reader, each bought by a measurement
              ({{d.a_write_joins_its_own_shard}}). A project's own facts file kept in another shape,
              or any knowledge store that is not a record of this shape, is what would count."
    reopened_by: "a second and a third consumer of the pointer index, the placement rule or the
                  derived stores that is not a record this reader reads - a knowledge store of
                  another shape asking for them"
    seen:
      s.2026_09_11_shape_core: "read 2026-09-11"
      d.one_tree_two_channels: "the command line and the plugin ship the same files - packaging maps
                                the script directory rather than copying it"
      d.record_is_code: "the record of what is known about the code lives in the tree - committed
                         with the work it describes, reviewed in the same pull request, checked by
                         the same CI - and a hypothesis travels with its branch; an out-of-tree
                         record holds only what the tree cannot hold, the world outside the code; a
                         user-level directory is at most an index of records, never content; a
                         session named as a source is provenance, not process"
      doc.agent_graph: "read 2026-09-01"
      d.a_write_joins_its_own_shard: "a new entry goes into the file whose collection already holds
                                      its neighbours - the entries whose ids share its head - and a
                                      write to an entry goes into the file that holds it; a record in
                                      one file answers that file to all of it"
  d.text_holds_the_prose_it_places:
    rests_on: [s.2026_09_04_signals, d.reasoning_in_record, d.moved_is_a_flag]
    verdict: "a section's text is held to the sentence it draws - a judgment placed for its
              reasoning is snapshotted by that reasoning, while what rests on a judgment keeps
              snapshotting its verdict"
    because: "A text that places {{d.reasoning_in_record}}'s reasoning puts an argument on the
              reading surface, and until now it recorded only the verdict above it: the argument
              could be rewritten to say the opposite with no tint and nothing said by the build. The
              verdict is still the right snapshot everywhere else, because what rests on a judgment
              rests on its conclusion and survives three rewrites of the prose - but a text is the
              one place the prose itself is what a person reads, so it is the one place the prose is
              what the text is held to."
    blocked_on: "observational: falsified if sessions start clearing this tint without reading - a
                 text re-reviewed for wording that did not change the argument is noise, and the sign
                 is reviews that follow a rewrite too closely to have been read"
    seen:
      s.2026_09_04_signals: "read 2026-09-04"
      d.reasoning_in_record: "reasoning is the because of the judgment it belongs to, in the record;
                              the page's connective text lives in the brief; both resolve references
                              at build and both carry seen"
      d.moved_is_a_flag: "a dependency that moved since the snapshot flags the judgment for a
                          person; only a predicate that holds fails the build"
    distinct_from: d.written_layer_drawn_by_build
    # distinct 2026-09-04: one says where the mark is made - by the build, in the markup, so it survives a host that strips scripts; this one says which reading the snapshot holds, which is what decides whether there is anything to mark
  d.threshold_read_inside_its_function:
    rests_on: [s.2026_09_04_measure_recipes, run.recipes_probed, p.prior_count_thresholds, p.coverage_thresholds, p.hypothesis_thresholds]
    verdict: "a line a count draws is counted inside the function the entry's at: names and nowhere
              else - a module-level number the function reads by name, or a number other than zero or
              one it compares against; what a helper it calls draws belongs to that helper's own
              count"
    because: "Three entries here say a report draws {{p.prior_count_thresholds}} line or none, and a
              recipe that grepped the file for numbers would answer a different question. The reader
              also refuses a falsifier over a share above one - a comparison against 1, over two
              computed names, in a function none of these entries names - and a count that swept the
              module would read it as a second line and correct a 1 upward against a judgment that
              says a second would be wrong. So the at: is the scope and the function is the unit.
              Inside it a line is named, or it is not zero or one: zero and one are how this code
              says empty and singular, and a line worth arguing about is given a name the way the
              matrix's own is. Both halves fire - each of the three counts rose by one when a line
              was added, once as a named constant and once as a bare comparison - and a function the
              file no longer has reads as a hole rather than as a zero."
    blocked_on: "observational: falsified by a line this cannot see - drawn inside a helper the
                 function calls, or written as a comparison against zero or one that readers treat as
                 a threshold - or by a name it counts that nobody would argue with"
    seen:
      s.2026_09_04_measure_recipes: "read 2026-09-04"
      run.recipes_probed: "read 2026-09-04"
      p.prior_count_thresholds: 1
      p.coverage_thresholds: 0
      p.hypothesis_thresholds: 0
  d.tree_reads_as_a_hypothesis:
    rests_on: [s.2026_09_04_remeasure, d.dry_run_is_check_on_the_union, d.contradiction_by_id_and_day, d.moved_is_a_flag, p.union_tests]
    verdict: "the tree's readings that differ from the record are laid over it as one more
              hypothesis - named after the commit, never folded - with the hypotheses beside the
              record and through the same dry run, so the pull request decides nothing check would
              not: a falsifier that holds on the measured value is red, a reading the door refuses is
              contested, an older reading that moved is green and says what refreshes it, and a value
              enters the record only by a person's or a session's write"
    because: "{{d.dry_run_is_check_on_the_union}} already tests the record as it would stand under a
              claim, and a measurement is a claim about the tree with a date: laying it over the base
              asks the one question that exists and adds no evaluator - {{p.union_tests}} stays the
              count. The door decides the reading like any other, by
              {{d.contradiction_by_id_and_day}}: one older than the tree's is superseded and the
              judgments over it move, which {{d.moved_is_a_flag}} keeps a flag and not a failure; one
              of the same day that disagrees is two writers, and here the second writer is the author
              of the pull request, who corrects the number in it. The runner writes nothing: a value
              with nobody's reading behind it is not a reading, and a commit nobody reviewed is not
              the record. The count in p.union_tests is retained only as the last Python reading; it
              no longer measures places in the native reader."
    reopened_by: "A measured hypothesis and an equivalent explicitly authored hypothesis receive
                  different validation on the same base."
    replaced: ["the standing judgment holds, and a person takes this over it by name on 2026-09-24"]
    seen:
      s.2026_09_04_remeasure: "read 2026-09-04"
      d.dry_run_is_check_on_the_union: "the dry run is the reader's own check, run on the base with
                                        the hypotheses laid over it by id, said as what the fold
                                        would change: what arrives, what it replaces and what rests
                                        on that, what the union moves or breaks, what is contested"
      d.contradiction_by_id_and_day: "a contradiction is told by the id, the day and the base's own
                                      readings: the same id with a value read no later than the
                                      base's own reading, or with a different verdict, or with the
                                      same verdict on other grounds, is refused into the base and
                                      named a hypothesis; a newer reading supersedes and one dated
                                      after today is refused; a standing judgment is superseded only
                                      when its wrong_if holds on what the base holds; across the
                                      branch line a reading from another source with another value
                                      waits for a person to name the source; the same premises under
                                      different ids are different subjects"
      d.moved_is_a_flag: "a dependency that moved since the snapshot flags the judgment for a
                          person; only a predicate that holds fails the build"
      p.union_tests: 1
  d.truth_value_is_matched:
    rests_on: [s.2026_09_04_falsifier_shape, d.predicate_shape_is_one_reading]
    verdict: "a falsifier compares a truth value by matching it - wrong_if x == false holds when x
              holds false - and never as text, never ordered, and never against a value that is not
              one"
    because: "A record writes false and the fact holds a boolean, so comparing the two as text
              matched in neither state: the falsifier stood green while the fact was true, and stayed
              green when it turned false - the one moment it existed for. Matching is the only
              comparison a truth value has, so under {{d.predicate_shape_is_one_reading}} a truth
              value is one value a falsifier may name; ordering one decides nothing, and holding one
              against a value that is not one is two kinds of thing, and both are declined rather
              than answered."
    reopened_by: "a record that writes a truth value as something else - yes and no, 1 and 0, a
                  quoted true - and expects a falsifier to match it: the reading would then be about
                  what a truth value may be written as, not about matching one"
    seen:
      s.2026_09_04_falsifier_shape: "read 2026-09-04"
      d.predicate_shape_is_one_reading: "what shape a predicate must have to be decided is one
                                         reading, asked wherever a predicate is written, reported or
                                         evaluated: one comparison, which is a right-hand side
                                         carrying no second comparison - text inside quotes is a
                                         literal and is not read for one - and a predicate that is
                                         not one is declined by the reader and reported where an
                                         empty predicate is, never answered false"
  d.unasked_recording_is_the_opener:
    rests_on: [s.2026_09_11_gate_question, run.gate_question_eval, m.unasked.turn_one, m.unasked.question_wrote, m.unasked.question_filler, d.gate_asks_once_after_work, run.design_talk]
    verdict: "on the Codex host a session that opens on the record writes it unasked during ordinary
              work, and the one question catches most of what it leaves"
    because: "With the opener's output and the record skill in front of it a session wrote the
              record during the first turn in {{m.unasked.turn_one}} of 200 trials of ordinary work;
              where the first turn left the record untouched, the question moved writing on the next
              turn to {{m.unasked.question_wrote}} of 25 against 8 of 27, and
              {{m.unasked.question_filler}} of those writes were filler ({{run.gate_question_eval}}).
              The cost of asking, seen twice in 22 writes, is haste - a wrong number and a wrong
              correction, both sourced - which is not the failure {{d.gate_asks_once_after_work}}
              guards against. The Claude host and the old single skill, where {{run.design_talk}}
              happened, were not measured."
    wrong_if: "m.unasked.turn_one < 150"
    reopened_by: "the same episodes on the Claude host leaving the record untouched in most first
                  turns, or a session asked once writing entries with nothing behind them"
    seen:
      s.2026_09_11_gate_question: "read 2026-09-11"
      run.gate_question_eval: "read 2026-09-11"
      m.unasked.turn_one: 187
      m.unasked.question_wrote: 22
      m.unasked.question_filler: 0
      d.gate_asks_once_after_work: "a session that changed files of the tree, or ran eight prompts,
                                    with the record untouched is asked once whether there was nothing
                                    to keep - as a line on the prompt, and as one stop on the turn
                                    after a line went unanswered; the gate still yields after one
                                    bounce"
      run.design_talk: "read 2026-09-02"
  d.unsaved_baseline_stays_absent:
    name: "A session-start baseline that cannot be saved is left absent"
    verdict: "When the session-start baseline cannot be saved, the opening still reaches the agent
              and no baseline takes its place; prompt diagnostics stay silent for that session rather
              than compare against an empty one."
    because: "An empty baseline claims the record held no failures and no entries when the session
              began. For a record that could not be read that claim is false: once it reads again,
              its existing failures would be reported as the session's own, and until then every
              prompt would carry the unavailable-assessment notice. The Python opener has always
              ignored a failed baseline, and both prompt-context hooks already stay silent without
              one."
    rests_on: [d.gate_and_opener_against_the_mark]
    reopened_by: "A session that began without a baseline repairs the record, then writes entries
                  with no recorded intent or introduces a new failure, and nothing reports it before
                  the work is handed off."
    from: s.2026_09_23_unsaved_baseline
    seen:
      d.gate_and_opener_against_the_mark: "The opener records a session-start baseline. Prompt
                                           diagnostics compare current failures and session-owned
                                           writes with it, without creating a record or continuing a
                                           stopped turn."
  d.watch_async_compatibility:
    rests_on: [s.watch_contract, d.record_is_code, d.no_feed_of_other_branches]
    verdict: "Keep code records with their branches. Opted-in background watch previews only
              authored worktree changes against a configured main ref, and selectively returns new
              contradictions or incomplete checks to the originating session. Comparison never folds
              or refreshes seen."
    because: "The working session must continue while cross-branch checks run. Captured input
              identities make a late result distinguishable from a result about current work, and a
              scoped compatibility finding avoids a general feed of other branches."
    reopened_by: "A result is delivered as current after its captured inputs change, an unchanged
                  finding repeatedly interrupts the session, or comparison writes either graph."
    seen:
      s.watch_contract: "read 2026-09-10"
      d.record_is_code: "the record of what is known about the code lives in the tree - committed
                         with the work it describes, reviewed in the same pull request, checked by
                         the same CI - and a hypothesis travels with its branch; an out-of-tree
                         record holds only what the tree cannot hold, the world outside the code; a
                         user-level directory is at most an index of records, never content; a
                         session named as a source is provenance, not process"
      d.no_feed_of_other_branches: "the opener adds one line - how many hypotheses wait, and for how
                                    long; nothing another branch claims is pushed into a session, it
                                    is pulled by seed or surfaces as a collision on the same id"
  d.watch_shared_scope:
    rests_on: [s.watch_contract, d.record_is_code, d.base_shared_forks_on_contradiction]
    verdict: "External scalar observations may enter one explicitly configured shared record before
              a branch merges, with a source, observation date and environment. Branch measurements,
              experiments and judgments remain branch-bound. Conflicts stay retained for review;
              certainty of wording never chooses shared scope."
    because: "A fact about an external environment can matter on main immediately without describing
              proposed code. Explicit scope and serialized canonical writes prevent that route from
              silently publishing branch assumptions or overwriting competing observations."
    reopened_by: "A branch-scoped observation reaches the shared record automatically, a same-day
                  conflict loses its competing evidence, or concurrent updates discard an unrelated
                  fact."
    seen:
      s.watch_contract: "read 2026-09-10"
      d.record_is_code: "the record of what is known about the code lives in the tree - committed
                         with the work it describes, reviewed in the same pull request, checked by
                         the same CI - and a hypothesis travels with its branch; an out-of-tree
                         record holds only what the tree cannot hold, the world outside the code; a
                         user-level directory is at most an index of records, never content; a
                         session named as a source is provenance, not process"
      d.base_shared_forks_on_contradiction: "a consistent addition goes straight to the shared
                                             record from any session or branch; a write that
                                             contradicts the record opens a named hypothesis, and
                                             whatever later rests on the contradiction goes there - a
                                             session is never the unit"
  d.whole_shape_surface:
    rests_on: [doc.fact_moves]
    verdict: "the shape of the whole gets one surface of its own - the tree - and the reading
              surfaces stay flat"
    because: "For work in progress the in-place outline answers the question people have. The
              shape-of-the-whole question is still real once per reader - at first meeting -
              so it gets its own tab instead of leaking into the reading surfaces."
    blocked_on: "observational: falsified if readers keep working from the tree instead of
                 meeting it once - that would mean the reading surfaces failed, not that the
                 tree succeeded"
    seen: {doc.fact_moves: "read 2026-09-01"}
  d.trust_layer:
    rests_on: [doc.fact_moves]
    verdict: "kpopper is the epistemic layer over knowledge stores - how something is known,
              never what exists; classic knowledge-graph edge semantics are a non-goal"
    because: "World-knowledge already enters as entries with sources, and the layer every
              store lacks is exactly this one: who vouches for a fact, when it was last
              checked, and what falls when it moves. Competing on world-ontology joins a
              crowded field with nothing new to say."
    blocked_on: "observational: falsified if real corpora keep raising cross-object questions
                 that entries, pull and affects cannot answer without new edge semantics"
    seen: {doc.fact_moves: "read 2026-09-01"}
  d.scale_by_federation:
    rests_on: [skill.two_shapes]
    verdict: "a record scales by sharding into domain records under a pointer index, never by
              growing one file"
    because: "The single file dies on human bandwidth - merge conflicts, an exploding
              namespace line, review fatigue - long before parsing does. The pointer form
              already merges shards on read, so federation is the same mechanism at a
              larger radius."
    blocked_on: "observational: falsified by a sharded corpus whose cross-shard sessions open
                 slower or ground worse than the single file they replaced"
    seen: {skill.two_shapes: "Two parallel records is the most expensive mistake available here"}
  d.first_meeting_artifact:
    rests_on: [doc.agent_graph, doc.applications]
    verdict: "Show the optional experimental record page only on an explicit request or a standing
              preference; creating a record or finishing a map does not activate it."
    because: "The HTML page is an optional application. A person can meet and use the record through
              ordinary reading without installing or selecting a presentation runtime."
    reopened_by: "A page appears after ordinary mapping or recording without a request or standing
                  preference, or core onboarding requires an HTML dependency."
    replaced: ["the standing judgment holds, and a person takes this over it by name on 2026-09-18"]
    seen: {doc.agent_graph: "read 2026-09-01", doc.applications: "read 2026-09-18"}
  d.named_for_popper:
    rests_on: [lit.name_risk]
    verdict: "the project keeps the name kpopper; discovery runs on direct links and qualified
              search, never on the bare term"
    because: "The name carries the founding idea and the registries are free. What it costs is
              known and priced: no bare-term search, an org spelled differently, and a fandom
              that owns the word. The falsifiability claim is what earns the reference."
    blocked_on: "observational: re-opened only if launch shows the name costing real adoption -
                 installs that stall at discovery, not at value"
    seen: {lit.name_risk: "bare-term search is owned by a fandom; the org and handle are taken;
                           every package registry is free; qualified search works"}
  d.gate_reminds:
    rests_on: [p.gate_bounces, doc.ingestion_contract, doc.hook_delivery]
    verdict: "Lifecycle hooks never request a continuation. Current findings are advisory context on
              real user prompts; explicit check, gate and write-admission failures remain
              authoritative."
    because: "A Stop continuation becomes a new user request in supported hosts, so even a single
              bookkeeping or validation message can replace the question. Record assessment and
              notification transport must remain separate."
    wrong_if: "p.gate_bounces > 0"
    replaced: ["the standing judgment holds, and a person takes this over it by name on 2026-09-22"]
    seen:
      p.gate_bounces: 0
      doc.ingestion_contract: "read 2026-09-07"
      doc.hook_delivery: "read 2026-09-22"
  d.one_tree_two_channels:
    rests_on: [skill.two_shapes, p.script_copies, d.one_implementation_ships]
    verdict: "The command line and plugin execute the same native reader; the plugin selects the
              binary shipped with its active package. Cargo builds that reader from native/, and its
              runtime resources must match the release. The former Python package-directory mapping
              is retired."
    because: "Two independently editable implementations drift between installations. There is now
              one native implementation. p.script_copies retains only the last Python package-mapping
              count; d.one_implementation_ships describes the current implementation boundary."
    from: s.2026_09_24_source_file_references
    reopened_by: "The command line and the active plugin report different results for the same
                  record using the same release resources, or an independently editable reader
                  implementation is shipped again."
    replaced: ["the standing judgment holds, and a person takes this over it by name on 2026-09-24"]
    seen:
      skill.two_shapes: "Two parallel records is the most expensive mistake available here"
      p.script_copies: 1
      d.one_implementation_ships: "the tree ships one reader, the native command line; what the
                                   record says about how a record is read is read from it, and no
                                   second implementation of the same behaviour lives beside it"
  d.name_registered_when_earned:
    rests_on: [lit.registry_names, lit.name_risk]
    verdict: "only kpopper is published; ground-tree stays unregistered until the tree has
              something of its own to install"
    because: "A package with nothing behind it is a promise the project cannot keep, and a
              content-free placeholder is the one thing every registry's naming policy is
              written against. The tree is a surface of this record, not a separate install."
    blocked_on: "observational: falsified the day the name is taken by someone else before the
                 tree ships as its own artifact - the only cost here that was avoidable"
    seen: {lit.registry_names: "kpopper is published on both npm and PyPI since 2026-09-03, first at 0.21.0 on each; ground-tree is unregistered on both",
           lit.name_risk: "bare-term search is owned by a fandom; the org and handle are taken;
                           every package registry is free; qualified search works"}
  d.npm_holds_the_name:
    rests_on: [prior.ts_direction, p.npm_files, p.script_copies, lit.registry_names]
    verdict: "the npm name is held against the day this becomes a Node tool, and it is held by
              the browser checks rather than by a placeholder"
    because: "q.language_direction is open and waits for a person: prior.ts_direction puts the
              renderer, the command line and the checks in TypeScript, and of everything that
              waiting costs, a name taken by someone else in the meantime is the only part that
              cannot be undone later. Publishing an empty package to reserve a word is the move
              every registry's naming policy exists to refuse, and this record declined it once
              already for ground-tree - so the hold has to carry something, and the browser
              checks are the one part that belongs on npm on its own terms. They are not exiled
              there; see d.checks_ship_with_the_reader."
    wrong_if: "p.npm_files < 1"
    seen: {prior.ts_direction: 0.7, p.npm_files: 1, p.script_copies: 1,
           lit.registry_names: "kpopper is published on both npm and PyPI since 2026-09-03, first at 0.21.0 on each; ground-tree is unregistered on both"}
  d.checks_ship_with_the_reader:
    rests_on: [p.checks_in_the_wheel, p.script_copies]
    verdict: "the browser checks install with the command line - `kpopper page --checks` runs the
              copy that came with the reader, wherever it was installed"
    because: "The checks are the only thing that answers whether the page actually behaves, and a
              wheel that leaves them out withholds that answer from everyone who installed the
              ordinary way. Being Node is a reason to want node on the path, not a reason to live in
              another registry - and an installed copy sits somewhere nobody would think to look, so
              the dispatcher finds it instead of the person. The file ships in both packages and is
              edited in neither."
    reopened_by: "an installed reader whose page check cannot run because the browser check did not
                  come with it; an installed reader whose page check cannot run because the browser
                  check did not come with it; an installed reader whose page check cannot run because
                  the browser check did not come with it"
    replaced: ["the standing judgment holds, and a person takes this over it by name on 2026-09-23"]
    seen: {p.checks_in_the_wheel: 1, p.script_copies: 1}
  d.tree_springs_back:
    rests_on: [d.page_reads_only, p.tree_positions_kept]
    verdict: "the tree can be handled - pulled about, and grown into place once - and nothing a
              hand does to it is kept"
    because: "Tugging on a thing to see how it is attached is a way of reading it, so the tree
              answers a pull. Keeping where a node landed would be different in kind: it would
              make the page somewhere an arrangement lives, which is the write path already
              refused. So the pull resists, the tree springs back, and the position goes
              nowhere."
    wrong_if: "p.tree_positions_kept > 0"
    seen: {d.page_reads_only: "the page is a reading surface - no write path, nothing a hand
                               does to it is kept",
           p.tree_positions_kept: 0}
  d.record_before_repair:
    rests_on: [m.first_run.repair, m.first_run.record]
    verdict: "the record is written before the project is repaired; a repair the opener
              surfaces is said first and done as its own visible work"
    because: "On the first external run a repair three times the record's own cost ran
              inside the recording turn, unannounced: the person could not tell bookkeeping
              from a change to their project, and the repair's minutes read as the method's."
    blocked_on: "observational: falsified if recording first leaves repairs the person wanted
                 done, or if announcing them first costs more than it explains"
    seen: {m.first_run.repair: 217, m.first_run.record: 62}
  d.moved_is_a_flag:
    rests_on: [doc.fact_moves]
    verdict: "a dependency that moved since the snapshot flags the judgment for a person;
              only a predicate that holds fails the build"
    because: "Flag, never rewrite: movement is a question and a crossed line is the answer.
              Failing the build on every move would teach records to stop snapshotting, and
              muting only what the predicate names keeps a sloppy predicate from silencing
              what it never covered."
    blocked_on: "observational: falsified if moved flags pile up unread while a crossed line
                 hides among them"
    seen: {doc.fact_moves: "read 2026-09-01"}
  d.register_out_of_tree:
    rests_on: [p.pointer_home, skill.two_shapes]
    verdict: "a record the tree cannot hold registers its path in the git common dir, so
              every worktree finds it and nothing enters the tree"
    because: "The pointer file the method already has assumes the root can hold it; a
              disposable worktree cannot, and a registry outside the repository would be a
              second place every reader must know. The common dir is shared by all worktrees,
              never tracked, and already belongs to the checkout."
    blocked_on: "observational: falsified by a project with no git that cannot keep the file
                 at its root either, or by re-clones losing the pointer often enough to matter"
    seen: {p.pointer_home: "<git common dir>/kpopper-record",
           skill.two_shapes: "Two parallel records is the most expensive mistake available here"}
  d.locate_by_shape:
    rests_on: [p.install_segments, m.locator_agrees]
    verdict: "the docs locate a shipped script by matching its name and taking the highest
              version, never by a path written against today's layout"
    because: "A pattern anchored on the layout that existed the day it was written matched
              nothing the moment the installer put a version segment in the path - and it failed
              silently, because the very next line reads an empty result as proof the plugin is
              not installed. Matching the shape instead survives the layout; pruning a checkout's
              own worktrees and sorting by version are what make the newest real install fall out
              of a loose match rather than an arbitrary first hit."
    wrong_if: "m.locator_agrees < 1"
    seen: {p.install_segments: 1, m.locator_agrees: 1}
  d.page_is_graph:
    rests_on: [run.hub_vs_now, doc.hub_seam, m.hub_wrapped_share]
    verdict: "the page is more graph - intents are entries, arrangements and passages are
              judgments, every value on the surface is a reference"
    because: "Read side by side on the same record, the hand-written page beat the generated one
              on authorship alone; the mechanism underneath was identical. The one thing the
              generated page could not do was write, and the one thing the hand-written page
              could not do was notice its own prose going stale: it links every number and wraps
              four passages. A passage that is a judgment gets seen and a falsifier, is flagged
              like anything else, and is never rewritten in silence."
    blocked_on: "observational: falsified if passages recorded as judgments end up reviewed less,
                 not more, than prose left outside the graph - the cost of declaring would then
                 exceed what the flag returns"
    seen: {run.hub_vs_now: "read 2026-09-02", doc.hub_seam: "read 2026-09-02",
           m.hub_wrapped_share: 4}
  d.author_free_build_guarantees:
    rests_on: [d.page_is_graph, doc.three_briefs, m.briefs_written]
    verdict: "the session composes freely and the build enforces the element rules on the output"
    because: "Every existing brief is pick-only because picking was all the format allowed.
              Richness needs freedom - tabs, sections, prose, components, the session's own
              markup - and freedom is safe only if the guarantees live where a session cannot
              forget them: no key on the surface, one reference per value, values inside
              sentences, judgments marked, the record's language. A lint on the output does not
              care how the page was written."
    blocked_on: "observational: falsified by a page that passes every element rule and still
                 reads as a dump, or by sessions that route around the rules with markup the
                 lint cannot see"
    seen: {d.page_is_graph: "the page is more graph - intents are entries, arrangements and
                             passages are judgments, every value on the surface is a reference",
           doc.three_briefs: "read 2026-09-02", m.briefs_written: 0}
  d.intent_is_a_source:
    rests_on: [d.page_is_graph, doc.agent_graph]
    verdict: "a session records what it was for as a source; a tab is a reading occasion that
              serves intents, and serving is earned by picks"
    because: "Whether the page still answers what the project is for cannot be checked until
              intents are things. One line in the requester's words, at the moment the session
              knows it, makes coverage mechanical: an intent no tab serves, entries no section
              picks, a tab claiming to serve what it never shows. What the mechanism never does
              is decide whether two intents are one world - that is the session's judgment,
              recorded as an arrangement decision with its own falsifier."
    blocked_on: "observational: falsified if recording the intent costs the first turn its
                 normal feel, or if declared intents drift from what sessions actually did"
    seen: {d.page_is_graph: "the page is more graph - intents are entries, arrangements and
                             passages are judgments, every value on the surface is a reference",
           doc.agent_graph: "read 2026-09-01"}
  d.arrangement_replaced_by_trigger:
    rests_on: [d.page_is_graph, d.moved_is_a_flag]
    verdict: "an arrangement is replaced only when its falsifier fires, a coverage gap exists,
              or a person asks"
    because: "A self-correcting surface fails two ways: every session redesigns, or nobody
              notices the project moved. Buying every structural change with an observed
              trigger stops the first - tidier is not a trigger. Guarantees that cannot be
              switched off stop the second: the spill section stays, the unserved intent prints
              at every open, drift and recency are computed as facts. A falsifier the build
              cannot evaluate is decoration, and decoration is the second failure in disguise -
              so an arrangement's falsifier is a predicate over what the build computes, with
              the human sign beside it in prose. A person's direct request is the same graph
              with a different root: a source with no dependencies, stronger than any
              seniority, acted on in the session that received it."
    blocked_on: "observational: falsified if arrangements go stale under falsifiers that never
                 fire while readers keep reworking pages by hand"
    seen: {d.page_is_graph: "the page is more graph - intents are entries, arrangements and
                             passages are judgments, every value on the surface is a reference",
           d.moved_is_a_flag: "a dependency that moved since the snapshot flags the judgment for
                               a person; only a predicate that holds fails the build"}
  d.minimal_repair:
    rests_on: [d.arrangement_replaced_by_trigger]
    verdict: "seniority is evidence, never a threshold; a trigger is cleared by the smallest
              structural change that suffices"
    because: "The second session and the twentieth should not weigh the same, but a declared
              threshold becomes a number someone wants to raise. Showing how long an arrangement
              stood, and asking for the least change that clears the trigger - add before move,
              move before remove, remove before rebuild, a new tab entering last until it earns
              its place, a bigger change recording why the smaller one was not enough - gets the
              weight without the number. Late arrangements change rarely because everything
              before them already serves and stands."
    blocked_on: "observational: falsified if pages accrete small patches until no reader can say
                 what they are for - the sign that repair stayed minimal past the point where a
                 rebuild was due"
    seen: {d.arrangement_replaced_by_trigger: "an arrangement is replaced only when its
                                                falsifier fires, a coverage gap exists, or a
                                                person asks"}
  d.reversal_is_a_question:
    rests_on: [d.arrangement_replaced_by_trigger, d.judgments_write_inline]
    verdict: "undoing an arrangement whose falsifier did not fire is a question for the person,
              never a change"
    because: "Two sessions can otherwise flip a layout back and forth forever, each convinced.
              Requiring the second to show the first's falsifier fired turns taste into
              evidence, and what remains is exactly what a person should decide. With it: at
              most one radical change per session, and only at its end, when the session knows
              what it did."
    blocked_on: "observational: falsified if the questions this raises go unanswered so long
                 that the page freezes behind them"
    seen: {d.arrangement_replaced_by_trigger: "an arrangement is replaced only when its
                                                falsifier fires, a coverage gap exists, or a
                                                person asks",
           d.judgments_write_inline: "the session doing the work writes its own judgments; any
                                      watcher only harvests sources and proposes, behind the
                                      gate"}
  d.groupings_declared:
    rests_on: [p.grouping_mentions, goal.portable]
    verdict: "groupings are declared by the session, any number, under its own names; the
              renderer owns none"
    because: "The grouping came from one finance record and hardened into the renderer under
              that record's name for it. A thread that reads on its own is general - fields,
              subsystems, environments - but naming it once in code is how one project's shape
              becomes every project's layout."
    blocked_on: "implementation: the renderer owns no grouping name now and reads the older one
                 in 3 places, as an alias for briefs not yet renamed; the decision is fully in
                 force when that count is zero; falsified only if a second real project needs a
                 grouping the declared form cannot express"
    seen: {p.grouping_mentions: 3,
           goal.portable: "usable by any session, in any project, with no author present"}
  d.reasoning_in_record:
    rests_on: [d.page_is_graph, doc.hub_seam, doc.agent_graph]
    verdict: "reasoning is the because of the judgment it belongs to, in the record; the page's
              connective text lives in the brief; both resolve references at build and both
              carry seen"
    because: "The test is whether an agent that never opens the page needs the text. A
              judgment's reasoning: yes, so it lives where pull and open can serve it with its
              own flag, which today they cannot, because the reasoning lives only in a
              template. Connective text: no, so it stays in the cheapest file. The lab already
              wraps a domain claim and never a page judgment; a second kind of judgment beside
              the brief would split one conclusion across two files with two reviews. Giving
              connective text a snapshot of what it references earns it the same
              moved-since-reviewed tint without pretending it argues - it states, and a
              sentence that would deserve a falsifier is a judgment that belongs in the record."
    blocked_on: "observational: falsified if connective text keeps smuggling claims the lint
                 cannot see, or if because fields swell past what a card can carry"
    seen: {d.page_is_graph: "the page is more graph - intents are entries, arrangements and
                             passages are judgments, every value on the surface is a reference",
           doc.hub_seam: "read 2026-09-02", doc.agent_graph: "read 2026-09-01"}
  d.metrics_derived_builtin:
    rests_on: [d.arrangement_replaced_by_trigger, run.design_talk]
    verdict: "graph.* and page.* are derived entries the reader computes itself - counts and
              shares, never stored, thresholds only inside falsifiers"
    because: "A falsifier over an arrangement has to name what a build can count: what fell to
              spill, which intents no tab serves, what share of what was added since the
              arrangement was born nothing picks, how many recent sessions in a row went
              unrepresented. Storing those would change the record on every build; leaving
              them unnamed leaves every arrangement decision failing check, which is where the
              lab's page stands today. So the reader owns the names, computes them
              deterministically from the record and the brief, and a falsifier carries its own
              line - a claim by its author, visible and reviewed, never a constant in code."
    blocked_on: "implementation: the reader does not yet know the names; falsified if sessions
                 cannot write a falsifier over them that ever fires, or if a metric needs a
                 tuned constant to be useful"
    seen: {d.arrangement_replaced_by_trigger: "an arrangement is replaced only when its
                                                falsifier fires, a coverage gap exists, or a
                                                person asks",
           run.design_talk: "read 2026-09-02"}
  d.proposer_behind_gate:
    rests_on: [d.judgments_write_inline, d.moved_is_a_flag, run.design_talk]
    verdict: "a proposer may re-derive what is flagged and draft what a session or a person
              accepts in one line; it applies nothing, and no session opens by digesting a
              backlog"
    because: "Re-derivation on demand leaves a flagged text waiting and puts its cost on the
              critical path of whoever needs it next. A watcher that proposes behind the gate
              is the one shape the constitution allows, and limited to what is flagged it
              sharpens nothing that was not asked. The best moment is the writer's stop, when
              the cause of the move is still in hand; a scheduled sweep is the fallback."
    blocked_on: "observational: falsified if proposals are rejected or ignored more often than
                 they are accepted, or if sessions start reading proposals instead of the
                 dependencies they stand on"
    seen: {d.judgments_write_inline: "the session doing the work writes its own judgments; any
                                      watcher only harvests sources and proposes, behind the
                                      gate",
           d.moved_is_a_flag: "a dependency that moved since the snapshot flags the judgment for
                               a person; only a predicate that holds fails the build",
           run.design_talk: "read 2026-09-02"}
  d.what_if_is_reading:
    rests_on: [d.page_reads_only, d.tree_springs_back, run.design_talk]
    verdict: "what-if is one evaluator on two surfaces: a command that answers what a change
              would reach without writing, and a trial value in the page that lights what rests
              on it and keeps nothing"
    because: "The question is what falls when this moves, and a person asks it by touching the
              value where they read it. Nothing is written, nothing persists, the page springs
              back - it is a way of reading the reach, as pulling the tree is a way of reading
              how a node is attached. The command form serves the session that must see the
              reach before it writes. One evaluator, so the two surfaces never disagree."
    blocked_on: "observational: falsified if the trial input draws edits people expect to be
                 kept, or if the two surfaces are ever seen to answer differently"
    seen: {d.page_reads_only: "the page is a reading surface - no write path, nothing a hand
                               does to it is kept",
           d.tree_springs_back: "the tree can be handled - pulled about, and grown into place
                                 once - and nothing a hand does to it is kept",
           run.design_talk: "read 2026-09-02"}
  d.grouping_schemes:
    rests_on: [d.groupings_declared, run.design_talk]
    verdict: "a grouping is a scheme and a brief may declare several; a section says which one
              it reads by, membership may overlap, and the record's own shape is the scheme
              nothing declared"
    because: "One partition of the ids was an opinion hiding in the mechanism: a project reads
              its entries by thread on one section and by counterpart on another, and a tag is
              nothing but a scheme whose groups overlap. Naming the scheme on the section, and
              letting a session open one when a mixed list needs it, is the difference between
              an option the framework offers and a habit of its first author."
    blocked_on: "observational: a section draws by any scheme, so a brief that declares one is
                 a choice and not the only offer; falsified if the live briefs, rewritten under
                 the page's own writing guidance, still declare one scheme each - the option
                 would then be an unused generality"
    seen: {d.groupings_declared: "groupings are declared by the session, any number, under its
                                  own names; the renderer owns none",
           run.design_talk: "read 2026-09-02"}
  d.falsifier_beyond_reach:
    rests_on: [doc.fact_moves, run.design_talk]
    verdict: "a falsifier names a sign the decision itself cannot suppress; one that can only
              appear when people do what the decision stops offering is sealed, not falsifiable"
    because: "A decision shapes the world it is judged in. The grouping-schemes decision first
              said it would be wrong if no brief ever declared a second scheme, while the page
              drew only the first - nobody declares what nothing draws, so the sign could never
              appear and the judgment was sealed by its own mechanism. The test is one question
              asked of every wrong_if: under this decision, could that still happen? A sign that
              lives outside the decision's reach - a person's request, a record someone else
              writes, a measurement the change cannot touch - can."
    blocked_on: "observational: falsified if reviews reading falsifiers as a foreign agent keep
                 finding sealed ones written after this rule, or if the rule makes sessions stop
                 writing predicates at all"
    seen: {doc.fact_moves: "read 2026-09-01", run.design_talk: "read 2026-09-02"}
  d.computed_names_when_named:
    rests_on: [d.metrics_derived_builtin]
    verdict: "a computed name becomes an entry only when something in the record mentions it;
              a count nobody rests on does not exist"
    because: "Every record would otherwise carry fifteen entries it never asked for - in its
              opener's namespace line, its shape, its page - and every brief's stored shape
              would move on the day the names were added. Mentioned, a count is an entry like
              any other, with a value, a hover, a place in pull and affects. Unmentioned, it
              is not there to explain."
    blocked_on: "observational: falsified if sessions keep asking the opener for a count no
                 judgment rests on, or if the shape of a record that names none of them ever
                 moves because of them"
    seen: {d.metrics_derived_builtin: "graph.* and page.* are derived entries the reader
                                       computes itself - counts and shares, never stored,
                                       thresholds only inside falsifiers"}
  d.release_is_its_own_pull_request:
    rests_on: [d.one_source, run.design_talk]
    verdict: "the version moves in a release pull request of its own, computed from what
              merged since the last release; a feature pull request never touches it"
    because: "Three worktrees claimed one version number in a day, and a merged contract sat
              invisible to installed plugins until someone remembered the bump. A bump inside
              feature work conflicts with every parallel branch and depends on memory. A branch
              that only ever holds the version files and the changelog conflicts with
              nothing, and a push to main is the moment that knows what merged. Each pull
              request declares the bump it asks for and the largest wins; the release itself is
              still a person's merge."
    blocked_on: "observational: falsified if release pull requests pile up unmerged so that
                 installed plugins lag main for days, or if declared bumps prove wrong often
                 enough that the release needs a floor computed from the contract itself"
    seen: {d.one_source: "this repository is the only place the plugin is edited; every
                          installed or hosted copy is a read-only distribution",
           run.design_talk: "read 2026-09-02"}
  d.base_shared_forks_on_contradiction:
    rests_on: [m.multi.record_pairs_conflicting, m.multi.code_conflicts, m.multi.id_collisions,
               skill.two_shapes]
    verdict: "a consistent addition goes straight to the shared record from any session or
              branch; a write that contradicts the record opens a named hypothesis, and whatever
              later rests on the contradiction goes there - a session is never the unit"
    because: "Seven sessions in one day merged clean on code and conflicted only on this file,
              never on a subject: the writers agreed, the file could not. A notebook per session
              piles up unread at ends that never come; a fork per branch repeats what git already
              knows. The one event that needs separation is a contradiction, and a contradiction
              can be detected at the moment of writing. The write path inserts in id order, so
              parallel additions rarely meet; out of the tree it locks the file, since no git
              protects it there."
    blocked_on: "observational: falsified if hypotheses pile up untested past the point a person
                 reads the count, or if sessions keep writing contradicting values into the base
                 by hand"
    seen: {m.multi.record_pairs_conflicting: "4 of 4", m.multi.code_conflicts: 0,
           m.multi.id_collisions: 0,
           skill.two_shapes: "Two parallel records is the most expensive mistake available here"}
  d.hypothesis_is_a_judgment:
    rests_on: [d.base_shared_forks_on_contradiction, doc.fact_moves]
    verdict: "a task, a branch and a what-if are one thing: a judgment whose truth is pending -
              its premises in rests_on, its claim in verdict, what would refute its success in
              wrong_if - and the merge is its test"
    because: "The record already holds every field a hypothesis needs; only a container and a
              moment were missing. Written so, a merge can check that the premises still stand
              and that the claimed improvement holds where it is measurable; refuted work stays
              as a negative finding with its source instead of vanishing with its branch. The
              falsifier is asked for at the fork, never on a session's first turn, and an
              observational one is declared with blocked_on rather than invented."
    blocked_on: "observational: falsified if sessions write hypotheses and never test them, or if
                 naming the falsifier becomes a ritual that delays work rather than the line the
                 person already had in mind"
    seen: {d.base_shared_forks_on_contradiction: "a consistent addition goes straight to the
                                                  shared record; a contradiction opens a named
                                                  hypothesis",
           doc.fact_moves: "read 2026-09-01"}
  d.consolidation_is_a_test:
    rests_on: [d.hypothesis_is_a_judgment, m.multi.record_pairs_conflicting]
    verdict: "consolidating hypotheses into the base tests whether the writers worked on the same
              world: premises re-checked, falsifiers evaluated, contradictions stopped - as a dry
              run at any moment, and as a step on every pull request"
    because: "Tests check code against the spec one session assumed; nothing checks that two
              sessions' specs agree. The record is exactly the material that check needs, and a
              dry run makes it cheap enough to run before anything merges. Its output is three
              lists a merger walks - contested, candidates, new subjects - never a merge it
              performed by itself."
    blocked_on: "observational: falsified if the dry run finds nothing across many merges of
                 parallel work, or finds only paraphrases and never a premise that moved"
    seen: {d.hypothesis_is_a_judgment: "a task, a branch and a what-if are one thing: a judgment
                                        whose truth is pending, and the merge is its test",
           m.multi.record_pairs_conflicting: "4 of 4"}
  d.sameness_is_judged:
    rests_on: [d.relevance_stays_declared]
    verdict: "the tool never decides that two entries are the same: it shows the nearest existing
              entries when one is written and candidates when hypotheses consolidate; the writer
              or the merger decides, and the decision is recorded - same_as as a migration that
              leaves the build green, distinct_from as an edge that retires the pair"
    because: "A tool that guesses merges silently and wrongly. The two moments a model already
              holds the meaning are writing and merging, so the question is asked there and
              nowhere else. Candidates come from declared fields alone - the same source and
              location, the same rule, overlapping rests_on, a prefix the base does not know -
              and declared answers accumulate, so the lists shrink without anything learning."
    blocked_on: "observational: falsified if the candidate lists miss duplicates that later
                 surface as two values for one subject, or grow past what a merger will read"
    seen: {d.relevance_stays_declared: "retrieval follows declared edges and names; no learned
                                        relevance at record scale"}
  d.no_feed_of_other_branches:
    rests_on: [d.open_is_a_slot]
    verdict: "the opener adds one line - how many hypotheses wait, and for how long; nothing
              another branch claims is pushed into a session, it is pulled by seed or surfaces
              as a collision on the same id"
    because: "Uncommitted state elsewhere cannot be read. Most of what another branch touches is
              not this session's subject. The slot pays by value per character, and a feed
              invites reconciling what nobody asked to reconcile."
    blocked_on: "observational: falsified if sessions keep colliding on subjects the count line
                 could not have warned them about"
    seen: {d.open_is_a_slot: "the session opener fills a fixed character slot, highest value per
                              character first; values never preload"}

  d.workspace_operations:
    rests_on: [doc.workspace_operations]
    verdict: "The public workspace interface is open, map with an optional deep flag, and config for
              guidance. Mapping runs through the calling agent and distinguishes a returned task from
              accepted work and a completed result; a plain terminal without a bound session must
              fail explicitly."
    because: "Commands describe user operations while tutorial acknowledgements and task receipts
              stay in the private agent protocol. A mapping request must not be presented as
              execution merely because it was saved or printed."
    reopened_by: "A real user mistakes a ready mapping task for completed work, cannot tell how to
                  invoke the intended operation from its help, or must learn receipt commands to
                  perform an ordinary mapping."
    seen: {doc.workspace_operations: "read 2026-09-10"}

  d.write_path_returns_reach:
    rests_on: [s.2026_09_03_written_layer, d.moved_is_a_flag, d.base_shared_forks_on_contradiction,
               doc.ingestion_contract]
    verdict: "the record changes from the command line through set, add and review; each edits the
              file in place, writes seen itself, and answers with the reach - what rests on the
              write, what is MOVED now, which predicate fired; set can replace from and at together
              with a value using --source and --at, without reviewing dependent judgments"
    because: "A session that edits the record by hand reads the whole file to change one line, types
              the one field the method says no hand writes, and has to remember to run the check
              afterwards. Attaching the report to the write turns discipline into mechanics: the
              reply is what the write reached. One write function with one validation step in front
              of it is the seam the consolidation work needs - a value that contradicts the base, the
              entries nearest a new one - so those rules land in one place and nowhere else.
              A reason in a comment does not replace a reading's citation: an explicit source and
              location travel through validation, the write and readback together, including a
              hypothesis and a same-value reading. Omitting them keeps the prior citation."
    blocked_on: "observational: falsified if sessions keep editing the record by hand once the
                 commands exist - seen lines changed in commits that ran no command - or if the reach
                 printed at the write goes unread while check finds the same moves later"
    seen:
      s.2026_09_03_written_layer: "read 2026-09-03"
      d.moved_is_a_flag: "a dependency that moved since the snapshot flags the judgment for a
                          person; only a predicate that holds fails the build"
      d.base_shared_forks_on_contradiction: "a consistent addition goes straight to the shared
                                             record from any session or branch; a write that
                                             contradicts the record opens a named hypothesis, and
                                             whatever later rests on the contradiction goes there - a
                                             session is never the unit"
      doc.ingestion_contract: "read 2026-09-07"

  d.written_layer_drawn_by_build:
    rests_on: [d.reasoning_in_record, d.moved_is_a_flag, d.page_reads_only]
    verdict: "the build resolves a section's references, places a judgment's reasoning where the
              text asks, and marks what moved since a text or a card was reviewed - in the markup, so
              the warning shows wherever the page does"
    because: "A tint applied by script would vanish in a host that strips scripts, and those are the
              surfaces where a stale sentence is most dangerous, because nothing else there says it
              moved. The comparison is the one check already makes - a text's seen against the
              record, a judgment's snapshot against its dependencies - drawn once, at build, never a
              second reading of what stale means. The page still writes nothing: review clears the
              tint, and review is a command."
    blocked_on: "observational: falsified if readers of a page with scripts stripped still miss a
                 tinted sentence, or if the tint is read as the value having been corrected rather
                 than as a question"
    seen:
      d.reasoning_in_record: "reasoning is the because of the judgment it belongs to, in the record;
                              the page's connective text lives in the brief; both resolve references
                              at build and both carry seen"
      d.moved_is_a_flag: "a dependency that moved since the snapshot flags the judgment for a
                          person; only a predicate that holds fails the build"
      d.page_reads_only: "the page is a reading surface - no write path, nothing a hand does to it
                          is kept; a trial value that persists nothing is a way of reading the reach"
  d.young_sections_read_by_shape:
    name: "A young record's sections are read by what their entries are"
    verdict: "Before a record's first judgment, a section under a name of the record's own reads as
              known: does when every entry in it is a value - a bare scalar, or v, quoted or rule -
              or a source. Judgment fields, a dependency list naming what is not an entry, or an
              entry that is neither still refuse the record. Both runtimes read it the same way."
    because: "The method says section and field names are a recommendation, and once a record holds
              a judgment its section names never mattered; a young record was the one place they did.
              The name was not what caught a misspelled dependency declaration: the refusals that
              catch one - a judgment's own fields, a list naming what is not an entry, a
              judgment-like entry that holds no value - are shapes, and they still apply in every
              section. A bare scalar counts as a value because add <id> <value> writes one into the
              section its prefix already holds, and it declares nothing. The one shape newly read
              that could hide a judgment, an entry holding v whose dependency is a single string
              under a field the reader does not know and which carries no judgment field, was already
              read as a value under known: and in every record that holds a judgment."
    rests_on: [d.shape_is_read_not_declared]
    reopened_by: "A judgment in a record with no judgment yet is found to have been read as a plain
                  value - an entry holding v that named what it rests on in one string under a field
                  the reader does not know - after a decision was taken on it."
    from: s.2026_09_23_young_record_sections
    seen:
      d.shape_is_read_not_declared: "what the record's physical form is - its files and shards, the
                                     field each role is read from, its sidecars, the stores derived
                                     from it and what reads it - is computed by a read command
                                     whenever asked and never kept as a declaration; the only
                                     declared parts are the choices no shape can infer, each a
                                     judgment with a sign, and the bindings of one machine, which
                                     stay in that machine's state"
  v.three_occasions:
    rests_on: [s.2026_09_01_consolidation, s.2026_09_02_priors, s.2026_09_03_coverage,
               s.2026_09_03_hypotheses, s.2026_09_03_language, s.2026_09_03_written_layer,
               page.unserved]
    verdict: "this record is read on three occasions, so it has three tabs: what is still open,
              what already holds, and the ground under it"
    because: "One arrangement served this record from the day it had nineteen judgments to the day
              it had fifty-six, and it was never rewritten because nothing made it wrong - only its
              shape line moved. It was also written before tabs, occasions and coverage existed
              here, so the record that built them was the one record not arranged by them: four
              sessions had recorded what they were for and no tab answered any of them, and seven
              prefixes, every prior and every measured run among them, were picked by nothing. The
              split is by when a reader opens the page, not by what the ids are called - picking by
              subject is not available anyway, since every decision here is a flat d. and a prefix
              selector only matches on a namespace boundary."
    wrong_if: "page.unserved > 0"
    born: "2026-09-04"
    seen:
      s.2026_09_01_consolidation: "read 2026-09-03"
      s.2026_09_02_priors: "read 2026-09-02"
      s.2026_09_03_coverage: "read 2026-09-03"
      s.2026_09_03_hypotheses: "read 2026-09-03"
      s.2026_09_03_language: "read 2026-09-03"
      s.2026_09_03_written_layer: "read 2026-09-03"
      page.unserved: 0
