meta:
  updated: 2026-09-24
  name: kpopper
  scope: "What this plugin is for and the decisions that shaped it, kept in its own format -
          the tools eat their own cooking, and every session here opens grounded."
  prefixes: {d: decision, s: session, m: measurement, p: parameter, q: question, v: view}

sources:
  s.2026_09_01_consolidation:
    asked: "four sessions appended to the tail of this file in one day and every pair conflicted
            there and on the brief's stored shape line, while the code merged clean - insert in id
            order, drop the stored shape, or shard?"
    name: "The shaping conversation that decided how the record forks and merges - what it was
           asked, and what it was given. Its reading: the shared record forks only on a
           contradiction, a hypothesis is a judgment whose truth is pending, and consolidation is the
           test"
    of: "2026-09-01 to 2026-09-03, given one day of seven parallel sessions on this repository,
         dry-run merges of every pair, and the first external run"
    read: "2026-09-03"
  s.2026_09_02_priors:
    name: "The session that asked whether an agent's own knowledge can be a source here - what it
           was asked, and what it was given"
    asked: "maybe we need … mechanisms to have the ai llm agent session to be a source? or give its
            own decisions probabilities so we won't be stuck on proving mundane decisions?"
    of: "2026-09-02 to 2026-09-03, given the language question as the worked example - a session
         that answered at 0.7 and then proposed to wait for an event - the record's three prior.*
         claims and its open questions, and the day's own claims scored against what held"
    read: "2026-09-02"
  s.2026_09_03_arrangements:
    asked: "Make arrangement decisions the build maintains: born and stood, falsifiers over the
            page's counts, muted moves inside an arrangement and fired ones outside it, the
            brief-diff classifier, and the rule that a reversal without a fired falsifier is a
            question."
    name: "The session that made arrangement decisions something the build holds - what it was
           asked, and what it was given. Its reading: an arrangement is a judgment like any other,
           its sign is a count the page takes, and the brief is held against the decisions that stand
           rather than against its own last version"
    of: "2026-09-03, given the page design's stability section, the record's arrangement decisions,
         the page contract at c738341 with the fixture's two arrangements, and the reader and the
         page as they stand"
    read: "2026-09-03"
  s.2026_09_03_coverage:
    asked: "Render the brief's tabs, make serving an intent something a tab earns by what its
            sections pick, and compute coverage — unserved intents, unpicked prefixes, spill, drift,
            recency — as page entries the opener and the Stop gate read."
    name: "The session that made the page answer for its intents - what it was asked, and what it
           was given. Its reading: whether the page still serves what each session was for is a count
           the build takes and prints, never a judgment the mechanism makes"
    of: "2026-09-03, given the page design's intents section and its scenario, the page contract at
         2e5f4f3, the fixture record under tests/, and the opener's output on the now record at its
         2000-character slot"
    read: "2026-09-03"
  s.2026_09_03_hypotheses:
    asked: "Let the record fork on a contradiction: a write that contradicts the base opens a
            hypothesis file beside it, the reader layers hypotheses over the base, two hypotheses on
            one id are contested, and the opener counts what waits."
    name: "The session that let the record fork - what it was asked, and what it was given. Its
           reading: a contradiction is told by the id and the day, never by resemblance; the base is
           what every surface evaluates and a hypothesis is read beside it - proposals in pull,
           contested ids in check and open, one count line in the opener - until consolidation tests
           it"
    of: "2026-09-03, given the consolidation design and its five decisions in this record, the write
         path and the page counts at 3d47dcb, the fixture record under tests/, and the three live
         records this reader serves"
    read: "2026-09-03"
  s.2026_09_03_language:
    name: "The session that weighed the renderer's language - what it was asked, and what it was given"
    asked: "why are we using python? should we use python? for the html generation maybe ts is
            better? and in general maybe the best language to use today with ai coding agents and
            if aiming high and want it to be efficent maybe rust from the starT?"
    of: "2026-09-03, given scripts/render_page.py at b47f7a0, the plugin layout, pyproject.toml,
         and how the page's verifier and the checker each read the record"
    read: "2026-09-03"
  s.2026_09_03_written_layer:
    name: "The session that built the page's written layer and the record's write path - what it
           was asked, and what it was given"
    asked: "Build the page's written layer and the record's write path: section text with references
            resolved, the moved-since-reviewed tint, reasoning shown by pull and open, and set / add /
            review printing their reach."
    of: "2026-09-03, given the page design's written-layer section, the page contract at 84af70a, the
         fixture record under tests/, and the finance lab's write tool"
    read: "2026-09-03"
  s.2026_09_04_also_reading:
    asked: "Make the call on also: and record it - exclude the field from role voting the way
            reopened_by is excluded from predicate voting, add the check line, and put the condition
            that makes \"retired into\" sound into the code rather than only into prose; carry the
            blind spot the generators cannot close into the same change as a recorded fact."
    name: "The session that decided how also: is read - what it was asked, and what it was given.
           Its reading: a field naming other identities of a subject is read by name and never voted
           on; the retirement reading holds only where the named id is absent everywhere; and where
           it is held the record says so as a note, because a returned retirement and a declared
           sibling have one shape and choosing between them is a person work"
    of: "2026-09-04, given the sameness migration at f13e9eb, the reader role inference and the
         fields it already reads by name, the three live records this reader serves, and a record
         built to reproduce the collision"
    read: "2026-09-04"
  s.2026_09_04_calibration:
    asked: "tests the shape prospectively: a bank of local questions with verifiable ground,
            answered with confidence + reach, run no-tools vs tools-allowed, across models, graded
            against ground."
    name: "The session that scored the reach rule against ground instead of against itself - what it
           was asked, and what it was given. Its reading: a claim about this project that nobody
           checked is worth about a third of one that was, and a session asked to price such a claim
           already prices it low"
    of: "2026-09-04, given the reach rule and the thirteen claims it rested on, two projects
         consented to and pinned to a commit, and a bank of local questions whose ground was verified
         before any answer was seen"
    read: "2026-09-04"
  s.2026_09_04_components:
    asked: "Port the hub's components as data-driven CSS and JS keyed by the record's shape,
            give each declared grouping its hue, lint the page's output against the element
            rules, and put the chrome in the record's language."
    name: "The session that ports the hub components, draws declared grouping hues, checks the
           rendered reading surface, and follows the record language"
    of: "This session, given the page design, the existing renderer, the component contract, and the
         finance hub reference"
    read: "2026-09-04"
  s.2026_09_04_consolidate:
    asked: "Make consolidation a test: a dry run that unions the base with its hypotheses and
            re-checks every judgment, a fold that writes a proven hypothesis into the base, a
            refutation that leaves a negative finding, and another branch's record read as one more
            hypothesis."
    name: "The session that made consolidation a test - what it was asked, and what it was given.
           Its reading: the dry run is the reader's own check on the union, said as what the fold
           would change; the fold passes the one door every write passes, so a reading the door
           refuses is contested and never overwritten; a refuted hypothesis leaves one finding and
           nothing else of itself; another branch's record is read as hypotheses by a pull, never
           written"
    of: "2026-09-04, given the hypotheses beside the record at db31e1c - the layer, the door and the
         cone - the fixture record under tests/, and the three live records this reader serves"
    read: "2026-09-04"
  s.2026_09_04_difference:
    name: "The session that made a comparison show where two readings part rather than where they
           agree"
    asked: "take it as its own pull request once #32 merges ... a second reading beside short(), the
            difference rather than the head, called by the four; plus a separate decision about
            pull's line budget"
    of: "2026-09-04, given the written layer at 0ae2276 and five surfaces reproduced on a scratch
         record by the arrangement session and this one"
    read: "2026-09-04"
  s.2026_09_04_falsifier_shape:
    asked: "Make a falsifier that cannot fire either fire or say so: a predicate with more than one
            comparison is read as text, and one compared against a boolean never matches in either
            state."
    name: "The session that made a falsifier either fire or say so - what it was asked, and what it
           was given. Its reading: what shape a predicate must have to be decided is one reading,
           asked wherever a predicate is written, reported or evaluated - so a compound, which the
           comparison shape would decide against the text after its first operator, is declined and
           said rather than answered false; and a truth value is matched as one, since a record
           writes false where the fact holds False"
    of: "2026-09-04, given the three live records this reader serves and the compound and
         truth-value falsifiers standing in one of them, the arrangement rule that already refused a
         compound sign, and the fixture records under tests/"
    read: "2026-09-04"
  s.2026_09_04_forks_chapter:
    asked: "Write the method's chapter on forks and hypotheses: a task as a judgment, pull before
            add, the consolidation walk, the out-of-tree lock, how a merge goes, and the reader's new
            commands."
    name: "The session that wrote the method's chapter on forks and hypotheses - what it was asked,
           and what it was given. Its reading: the chapter teaches exactly what the reader does - a
           contradiction told by the id and the day, a hypothesis read beside the base and tested by
           the dry run, three lists answered by three commands - and says plainly what is still open
           and what no surface shows yet"
    of: "2026-09-04, given the consolidation design and its decisions in this record, the reader
         with the fork, the dry run and sameness at ad4e23f, the three fixture records under tests/,
         and the method as it stood"
    read: "2026-09-04"
  s.2026_09_04_hypothesis_claim_name:
    asked: "Name a hypothesis for what it claims as well as for what it contradicts, so two branches
            that disagree about one decision do not open the same file."
    name: "The session that let a hypothesis be named for what it claims - what it was asked, and
           what it was given. Its reading: the suggested name takes the id and a mark of the whole
           claim, so two branches refused on one id open one file only where they claim the same
           thing, and that meeting is the one worth keeping"
    of: "2026-09-04, given the naming in the reader and the judgment beside it that two forks on one
         id meet, the person's choice that the name come from the id and from the claim, and two
         branches forked on one id in a throwaway repository"
    read: "2026-09-04"
  s.2026_09_04_measure_recipes:
    asked: "Give the record's own counts a recipe, so a fact about the tree is re-measured by the
            pull request instead of standing on a number nobody re-read."
    name: "The session that gave the record's own counts a recipe - what it was asked, and what it
           was given. Its reading: a line a count draws is counted inside the function the entry's
           at: names and nowhere else, and a count whose subject is the record is taken from the
           record's own text rather than through the reader that check runs"
    of: "2026-09-04, given the remeasure step at 1c715a2 with five entries already named, the count
         of declared holes standing at 37 while the record held 49, the three threshold entries and
         the functions their at: scopes them to, and the isolated interpreter every Python recipe
         runs under"
    read: "2026-09-04"
  s.2026_09_04_merge_driver_reason:
    asked: "Correct the recorded reason for setting a merge driver aside: hypothesis files do meet,
            when two branches fork on one id. The decision stands; the reason is what changes."
    name: "The session that checked a rejected alternative's reason instead of repeating it - what
           it was asked, and what it was given. Its reading: the reason was false in the one case the
           fork exists for, the decision it supported is untouched, and what replaces it is the count
           that would end the meeting"
    of: "2026-09-04, given the fork and its naming in the reader, the alternatives this record set
         aside on 2026-09-01, an independent review of the method's own chapter on merging, and two
         branches forked on one id in a throwaway repository"
    read: "2026-09-04"
  s.2026_09_04_minted_permission:
    asked: "Close the door a session can open for itself: a rewrite of a standing judgment whose
            sign has not fired waits as a hypothesis until a person folds it."
    name: "The session that closed the self-minted door - what it was asked, and what it read into
           it. The record already required every session's first write to be a source carrying
           asked:, so a field that opened the door on the word of such a source handed every session
           the key to every standing judgment. Read as: the door keeps only the signs the build can
           read, and what a person authorises they authorise by folding it."
    read: "2026-09-04"
  s.2026_09_04_prior_reversal_share:
    asked: "Count the share of high-confidence prior-resting judgments that consolidation refuted,
            as a computed entry, and make the demotion rule a predicate the build evaluates."
    name: "The session that made reversals of high-confidence prior-resting judgments a share the
           build evaluates. Its reading: the count comes from the same confidence line the reader
           prints, the refuted finding preserves the judgment id in its claim, and the demotion rule
           is a new judgment rather than a rewrite of the one that still stands."
    of: "2026-09-04, given the prior counts and consolidation findings at 6330a56, the calibration
         rule, and the same-id rewrite boundary"
    read: "2026-09-04"
  s.2026_09_04_priors_count:
    asked: "Count what rests on priors: check notes how many judgments rest on prior claims and how
            many at high confidence, and open carries the line when there are any."
    name: "The session that made the reader count what rests on a prior - what it was asked, and
           what it was given. Its reading: how much of the record stands on a session's own
           confidence is a fact the reader takes at every read and prints for a person, never a
           stored number and never a gate, and the line it splits the count at is the matrix's own,
           said out loud in the line so it can be argued with"
    of: "2026-09-04, given the four cells of the consequence matrix and their line at 0.8, the
         record's own judgments resting on prior.* claims, the reader's check and opener, and the
         fixture record under tests/"
    read: "2026-09-04"
  s.2026_09_04_remeasure:
    asked: "Make the pull request re-measure: run the consolidation dry run on every pull request
            and push, red on contested or falsified, and decide how the entries a task's falsifier
            reads are re-measured on the merged tree."
    name: "The session that made the pull request re-measure - what it was asked, and what it was
           given. Its reading: an entry whose value is a fact about the tree names its recipe, the
           recipe lives beside the record as an argument list and runs only on the pull request, and
           the tree's readings are one more hypothesis tested by the same dry run"
    of: "2026-09-04, given the consolidation dry run at ad4e23f, the three-state run that counted
         one stale green, the two candidate shapes, a person's word for the first - an approved
         recipe run only in CI, over the session's report as a dated source - and an independent
         design review of the proposal"
    read: "2026-09-04"
  s.2026_09_04_sameness:
    asked: "Judge sameness instead of guessing it: surface candidate duplicates from declared fields
            only, migrate one id into another with every reference rewritten, and record a pair as
            distinct so it never returns."
    name: "The session that let the record judge sameness - what it was asked, and what it was
           given. Its reading: two ids are one subject only when a person says so; the tool names the
           nearest by what is declared - the same source and place, the same source, the same rule
           read through what was retired, the same premises - and the answer is written where it was
           given, so the pair never comes back"
    of: "2026-09-04, given the consolidation design and its decisions in this record, the write path
         and the fork at 77dd604, the fixture records under tests/, and the three live records this
         reader serves"
    read: "2026-09-04"
  s.2026_09_04_signals:
    name: "The session that closed two ways an author could silence a signal without meaning to"
    asked: "take both 3 and 4, in one pull request ... snapshot the because alongside the verdict
            for placed judgments, and separate the spill test's set from covered so a mention still
            counts for coverage but no longer silences a flagged item"
    of: "2026-09-04, given the written layer at 2e5f4f3 and what four pieces since then built on it"
    read: "2026-09-04"
  doc.applications:
    name: "Optional experimental applications and the core boundary"
    from: s.2026_09_18_experimental_applications
    file: "docs/applications.md"
    read: "2026-09-18"
  doc.assessment_contract:
    name: "Recorded assessment API and policy contract"
    file: "docs/assessment.md"
    read: "2026-09-14"
  doc.checked_retrieval:
    name: "Checked-session search continuation and explicit context contract"
    file: "docs/retrieval.md"
    read: "2026-09-10"
  doc.checked_sessions:
    name: "Optional checked-session interface and guarantee limits"
    file: "docs/checked-sessions.md"
    read: "2026-09-09"
    note: "The optional checked-session interface, its explicit setup and activation, and the limits
           of its guarantees."
  s.2026_09_10_skills_split:
    asked: "נראה שזה די משובש, למה הכל תחת סקיל אחד? ברור שיצירת הhtmls צריך להיות בסקיל אחר ואולי
            גם עוד מצבים שם צריכים התייחסות נפרדת. אבל הכי חשוב לגרום לכל סשן תמיד לעבוד ולעבור דרכנו
            בשביל לבדוק דברים בשביל עדכן, זה חייב לקרות ומכאן אמורים להיגזר הסקילים. הפעולה של
            שליחה/עדכון נשמע שהיא צריכה להיות סקיל נפרד לא? ועם frontmatter שמסביר במדוייק וממש
            משכנע. ואולי סקיל נוסף לretrival/quering וכו? בקיצור נראה לי שחייבים לסדר את זה בפרויקט,
            אחרת הוא לא יהיה שמיש!"
    name: "The session that cut the method into one skill per occasion and made every session pass
           through the record - what it was asked, and what it was given. Its reading: the hooks are
           the only always-on layer and carry pointers; a skill is one occasion; a session that did
           real work and never wrote is asked once"
    of: "2026-09-10, given the shipped skill whole at 1.3.0, the hooks, the record's own decisions
         on the opener and the gate, the activation A/B of 2026-09-09, a session transcript that
         recited git status on a greeting, and four decisions taken in the native question UI"
    read: "2026-09-10"
  s.2026_09_10_standalone_html:
    asked: "כן הסתכלתי עליו.\n\nבקופסאות אין צורך לחזור על מה שנלחץ לא צריך את ה״במסמך כתוב X\", זה
            ממש יותר וגורם לא לקרוא את ההסבר האמיתי\n\nאחרי התיקון הזה נראה לי שהעבודה מספיקה כבר לא?
            מקסימום נשנה דברים בעתיד\n\nתיצור PR? ואגב היוזר אמור פשוט לבקש ליצור מסמך וזהו זה לבד
            יוסיף את כל השכבה שלנו?"
    name: "Finish standalone HTML documents with concise evidence explanations and ordinary-request
           authoring"
    read: "2026-09-10"
  s.2026_09_11_gate_question:
    asked: "Measure per trial after turn two: was the record written at all; through kpopper add/set
            or by hand; does it contain the decision or finding turn one produced; is what was
            written sourced or filler; kpopper check green; did the session write in turn one
            already, before any question - that rate is the baseline the question is supposed to
            move. Report the recorded-the-decision rate per arm, the filler rate per arm - the
            failure the decision names, a stop that teaches sessions to write filler - the
            hand-written rate, and the cost per trial."
    name: "The session that measured the untouched-record question on the Codex host - what it was
           asked, and what it was given. Its reading: the opener and the record skill make a session
           write unasked, the one question catches most of what they leave, nothing written to answer
           it was filler, and twice it was written in haste"
    of: "2026-09-11, given the branch at bcca831, the page fixture's record with its view and
         measure files, the eight skills beside four ordinary ones, ten episodes of greenhouse work
         and five quick lookups, and one model at medium effort through a harness outside this
         repository"
    read: "2026-09-11"
  s.2026_09_11_prefix_words:
    asked: "\"m.\", \"s.\", \"d.\" - are those convetions in provenance.yaml or self evovled in this
            project? … האם זה יהיה חכם לבקש שהם יהיו מילה שלמה? שאנשים שמסתכלים על זה יבינו מה הם
            קוראים? וגם אייג׳נטים שקוראים את זה … ולמה לא לשנות אחורה גם בזה שקיים פה בשביל לבדוק את
            זה? בכלל לא כדאי לבדוק עם איזה eval אם זה משפר משהו?"
    name: "The session that asked what the one-letter prefixes are and whether a prefix should be a
           word - what it was asked, and what it was given. Its reading: the letters were one writing
           habit that travelled from the first record through the skill examples and was reassigned
           at every birth, declared nowhere; a prefix is the link a question takes into the record,
           so a new one is a word, and the letters already written get a legend"
    of: "2026-09-11, given this record at a51bc75 and its first version, two live records outside
         this repository with the oldest snapshot of the first, the fixtures, the skill files, and
         the grounding-line eval of 2026-09-11"
    read: "2026-09-11"
  s.2026_09_11_read_once:
    asked: "A parse cache for the record. Add a cache of the parsed documents keyed by each file's
            absolute path, size and mtime (ns), stored privately under
            $XDG_STATE_HOME/kpopper/cache/, one entry per file, invalidated whenever any of those
            three values changes, written atomically, and never trusted over the files: a corrupt or
            unreadable cache entry is rebuilt, never an error. Place an add by prefix across pointer
            shards: the file whose collection already holds an entry with the same prefix (the id's
            head before the first dot) wins; else the first file that holds the collection; else the
            first file, opening the collection there."
    name: "The session that stopped re-reading the whole record at every prompt and taught a write
           which file of a divided record it belongs in - what it was asked, and what it was given.
           Its reading: a parse is kept against the file's own identity and dropped by every write,
           and a new entry joins the file its subject is already in"
    of: "2026-09-11, given the reader at 1.4.0 parsing the record at every command and both hooks, a
         synthetic record ten times this one's measured at 3 MB/s, the pointer form that merges
         shards on read, and d.scale_by_federation's answer to a record that outgrows one file"
    read: "2026-09-11"
  s.2026_09_11_shape_core:
    asked: "יש לי תהיות ומחשבות שונות על איך אפשר לייצר db או data structure שמתחיל פשוט ולאט לאט עם
            הזמן מתעצב לפי הצרכים\nכמו שלא צריך להתחיל פרויקט עם דאטהבסייס רלציוני ואפשר עם סתם
            nosql, אם תרצה, אבל עם בנייה די אגנוסטית (עד כדי כללים בסיסיים או הכרחיים שהגיוני שיהיו
            למטרת הפרויקט), אבל כן להתחיל פשוט ביותר עם קצת דאטה עם סכמה שממציאה את עצמה לפי הצורך,
            ומתאזנת ומשתנה אבל גם data structures ואינדקסים שמשתנים ומתאזנים ומתחלפים בנקודות
            מסויימות כי ניתוח עלות תועלת של אופטימזציה עלה על סף מסויים אל מול סוג הפרויקט והבקשות
            שלו וכו׳\nאז אני תוהה אם אנחנו רוצים אולי להוסיף לפרויקט את היכולת הזו לבניית הגרף, ואולי
            אפילו כריפו נפרד שהוא ישתמש בו (כי אולי זה פרויקט בפני עצמו)\n\nאולי kpopper צריך איזו
            שהוא הגדרת הcore שלו שמכיל הגדרות של סכמא, אינדוקס, וdata structures, אם יש או אין
            אמבדינגז, איזה אמבדינגז, על מה ומתי, איזה עוד שירותי אכסון או db מעורבים וכו... כל מה
