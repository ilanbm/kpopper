                  discovers unrecorded assumptions automatically, or cannot read the essential
                  content on a phone. Revisit the length if readers who want to try the tool cannot
                  find installation. Revisit the research story if readers take schematic figures for
                  measured data, the synthesis for a proof, or the prepared replay for a live model
                  evaluation."
