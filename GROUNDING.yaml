            is flaky on CI. … the 'native background processor' the test starts is still creating
            files under <tmpdir>/state after the test body returns, while tempfile.TemporaryDirectory
            is removing the tree. … Make the test wait for the processor to finish … Do not paper
            over it with ignore_cleanup_errors=True: a processor that outlives its test can also
