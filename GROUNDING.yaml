  d.native_cycles_refuse:
    name: "Preserve cyclic YAML source by refusing unsupported writes"
    verdict: "Keep recursive YAML aliases outside the native finite-value contract and refuse
              targeted writes without changing source bytes."
    rests_on: [p.native_yaml_cycle_contract]
    because: "The native record and history formats use finite values. Dropping cyclic fields would
              lose meaningful custom collections, while a refusal keeps the original document
              available for an explicit conversion."
    reopened_by: "A concrete user workflow requires cyclic object identity, with an agreed lossless
                  graph representation and round-trip acceptance cases."
    seen:
