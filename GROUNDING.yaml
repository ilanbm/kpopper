                             green, distinct_from as an edge that retires the pair"
      alt.sameness_from_names: rejected
      p.candidate_reasons: 4
  d.native_delivery_scope:
    rests_on: [s.background_ingestion]
    verdict: "A native delivery job binds to the originating host task separately from report
              metadata. Host acceptance confirms delivery only; uncertain acceptance does not trigger
