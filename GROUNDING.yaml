  d.parse_kept_by_file_identity:
    rests_on: [s.2026_09_11_read_once, p.record_parsers, m.prompt_hook_10x_parsing, m.prompt_hook_10x_kept]
    verdict: "a file of the record is parsed when it changes, not when it is read: its parsed
              document is kept under the user's own state directory against what the file is - its
              path, its length, its last write and the digest of the bytes that were parsed - and
              every write drops the entry for the file it wrote"
    because: "Every command reads the whole record, and the hooks read it at every prompt and every
              edit: a prompt on a record ten times this one's cost {{m.prompt_hook_10x_parsing}}
              seconds, {{m.prompt_hook_10x_kept}} once the parse is kept. Reading the bytes is a
              millisecond and parsing them is the whole cost, so what is kept is the parse. The bytes
              are in the key because a length and a nanosecond cannot tell apart a rewrite of the
              same length inside one tick - and a tick is a whole second where a filesystem keeps its
              timestamps coarsely - while digesting them costs a thousandth of the parse they save.
              The files remain the authority: an entry that is missing, truncated, about another
              file, of an older shape or holding anything but a document is a parse, never an error,
              and nothing read back from one is ever built into an object, so a file under the state
              directory cannot become code. One function of the reader opens a file of a record and
              parses it; a second would read a record without ever seeing what was kept for it, and
              {{p.record_parsers}} is the count that would show one."
    reopened_by: "a second place that opens a file of the record and hands it to the parser without
                  asking what was kept for that file, seen as a parse that runs on a file nothing
                  wrote to; a second place that opens a file of the record and hands it to the parser
                  without asking what was kept for that file, seen as a parse that runs on a file
                  nothing wrote to; a second place that opens a file of the record and hands it to
                  the parser without asking what was kept for that file, seen as a parse that runs on
                  a file nothing wrote to"
    replaced: ["the standing judgment holds, and a person takes this over it by name on 2026-09-23"]
    seen:
      s.2026_09_11_read_once: "read 2026-09-11"
      p.record_parsers: 1
      m.prompt_hook_10x_parsing: 1.3
      m.prompt_hook_10x_kept: 0.15
  d.pending_findings_in_the_dry_run:
    rests_on: [s.2026_09_23_pending_dry_run, doc.pending_dry_run, p.live_dry_run_gates]
    verdict: "a live dry run over every hypothesis also tests each active pending finding against
              the record under its own heading, and is red when accepting one would break something;
              it adopts nothing, and no fold, commit, merge or frozen run waits on it"
    because: "A shared finding whose value would flip a recorded falsifier was otherwise reported
              only inside a knowledge PR, which exists only with publication. Reads already show
              pending items beside the record without adopting them, and a test that stayed green on
