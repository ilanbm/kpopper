        check_frozen: 0.26
        pull_frozen: 0.17
        overlays_per_open: 2
        semantic_roles_calls_per_open: 872
        findall_calls_per_open: 2529314
        open_live_with_per_document_memo: 0.7
        entries_319_open_live: 6.1
