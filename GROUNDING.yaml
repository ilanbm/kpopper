            to confirm it no longer races, and run the whole suite once."
    name: "The session that fixed the batch capture test's race with its detached worker. What it
           found: the receipt turns terminal before the worker releases its lease, so a test that
           polls the receipt alone can return while the worker still writes into the state directory;
           the queue test already waited for the lease and the batch test did not"
    of: "tests/test_ingestion_batch.py now waits for worker.lease to vanish before its temporary
         directory is cleaned, the way tests/test_ingestion_queue.py already does."
