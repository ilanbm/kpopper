  d.prior_carries_its_own_falsifier:
    rests_on: [prior.confidence_needs_calibration, m.claims.local_assumed_held, d.hypothesis_is_a_judgment]
    verdict: "the prior kind carries its own falsifier: if judgments resting on priors at 0.8 or
              above are reversed more than about one in five, the confidences carry no information
              and prior.* is demoted to a note"
    because: "A stated 0.85 is a vibe unless something can check it: the four local assumptions that
              each felt like 0.85 held {{m.claims.local_assumed_held}} times. Reversals become
              countable once a refuted hypothesis enters the record as a negative finding, which
              d.hypothesis_is_a_judgment provides for; until the reader counts them, the count is
              read by hand. A session rating everything 0.9 to skip work is not policed by the number
              - the sign that would re-open its judgment still has to be written, and a bad one is
              visible on the card."
    wrong_if: "prior.confidence_needs_calibration < 0.8"
    reopened_by: "more than about one in five of the judgments resting on a prior at 0.8 or above
                  reversed - counted over the record's negative findings once the reader counts them,
                  by hand until then"
