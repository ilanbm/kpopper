  d.overlay_infers_once_per_document:
    rests_on: [m.overlay_open_seconds, s.2026_09_18_overlay_profile]
    verdict: "the live overlay infers roles once per document it compares, never once per entry"
    because: "knowledge_views.overlay ran provenance.infer over the whole document once per entry -
              872 times per open on a 429-entry record, 8.9 of the 11 seconds a profiled open took
              inside re.findall - to compute a per-entry meaning whose per-document half is the same
              for every entry. Memoizing that half alone took a ten-second open to 0.70 seconds with
              identical output, so the fix is to build it once per document, on first use inside the
              loop so a document that refuses still leaves the holder the old order left - not an
              inverted mention index or a cache keyed on the record bytes, which would go stale on
              hypotheses, the pending ref, the mode and the target"
    reopened_by: "a live open that runs infer more than once for the same document within one
                  overlay, or knowledge_conflicts that differ between the old and the new overlay on
                  any fixture holding a pending bundle, a hypothesis and a target, including a target
                  whose meaning refuses"
