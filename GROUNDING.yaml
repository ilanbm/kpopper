  d.shape_is_read_not_declared:
    rests_on: [s.2026_09_11_shape_core, d.record_is_code, d.checked_session_is_optional, d.parse_kept_by_file_identity, d.relevance_stays_declared, doc.agent_graph]
    verdict: "what the record's physical form is - its files and shards, the field each role is read
              from, its sidecars, the stores derived from it and what reads it - is computed by a
              read command whenever asked and never kept as a declaration; the only declared parts
              are the choices no shape can infer, each a judgment with a sign, and the bindings of
              one machine, which stay in that machine's state"
    because: "A core file that declares the schema, the indexes and the stores would be the ontology
              interview {{doc.agent_graph}} forbids, metadata a person maintains by hand, and a
              second shape beside the files that drifts from them in silence - the mistake
              {{d.record_is_code}} refuses at the user level. The reader already infers roles from
              shape and asks for a schema line only on a tie; the parse it keeps is derived and
              dropped by every write ({{d.parse_kept_by_file_identity}}); similarity is discovery and
              never an edge ({{d.relevance_stays_declared}}); a checked session is enabled per
              project or machine ({{d.checked_session_is_optional}}). What can be generated is not
              stored, so the form is a report; what cannot be inferred is a decision with a sign, or
              a binding of one machine."
    reopened_by: "a field of the shape report a person must maintain by hand, or a declared shard,
                  store or model directory that check and open never verify against the files"
    seen:
      s.2026_09_11_shape_core: "read 2026-09-11"
      d.record_is_code: "the record of what is known about the code lives in the tree - committed
                         with the work it describes, reviewed in the same pull request, checked by
                         the same CI - and a hypothesis travels with its branch; an out-of-tree
                         record holds only what the tree cannot hold, the world outside the code; a
                         user-level directory is at most an index of records, never content; a
                         session named as a source is provenance, not process"
      d.checked_session_is_optional: "Offer the checked session transport alongside the legacy
                                      reader, enabled explicitly per project or machine; keep each
                                      judgment's source body alongside its computed card, exact raw
                                      reads and a reversible hook choice."
      d.parse_kept_by_file_identity: "a file of the record is parsed when it changes, not when it is
                                      read: its parsed document is kept under the user's own state
                                      directory against what the file is - its path, its length, its
                                      last write and the digest of the bytes that were parsed - and
                                      every write drops the entry for the file it wrote"
      d.relevance_stays_declared: "retrieval follows declared edges and names; no learned relevance
                                   at record scale"
      doc.agent_graph: "read 2026-09-01"
  d.shape_move_read_by_its_sign:
    rests_on: [s.2026_09_03_arrangements, d.arrangement_replaced_by_trigger, d.coverage_printed_never_acted, p.coverage_thresholds]
    verdict: "a tab's shape move is muted or fired by its arrangement's own sign, with the counts
