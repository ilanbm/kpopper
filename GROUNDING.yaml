  d.page_build_reads_the_loaded_record:
    rests_on: [m.read_command_loads_after, m.read_command_record_loads, s.2026_09_18_lane_b_load_once]
    request: s.2026_09_18_lane_b_load_once
    verdict: "a read command reads the record once, and the page it asks is built from that reading"
    wrong_if: "m.read_command_loads_after > 1"
    because: "open and check read the record and then asked the page what it knew, and the page read
              it again - two readings of the same files in one command, two live overlays, and two
              chances for the reader view and the page view to differ about one record in one
              instant. Each reading is separately guarded by _record_read_guard, so the old pair
              could draw a page from a newer record than the reader had just described; one guarded
              reading cannot. The reader now hands the document it read to the page build, which took
              a live open on this record from 10.66 to 5.49 seconds with byte-identical output -
              measured against e888570 before the per-document hoist merged in beside it, so that
              pair isolates this change; what the tree reads with both is lower again, and
              m.read_command_record_loads says so. The
              write path keeps its own readings and must: the page counts taken before a write and
              the read-back after it each have to see the record as it stands at that moment, because
              the write itself changes what the page counts - so _page_side takes no document and
              reads again on every call"
    reopened_by: "a write whose page snapshot holds a count taken before the write rather than after
                  it, or a document handed to the page build that the build's own reading would have
                  refused - a reader that only checks what it reads itself has two doors and guards
                  one"
    seen:
