      m.ci_spend_by_trigger: "108.83 dollars on pull requests against 29.99 on pushes to main; of
                              the 199 Darwin session jobs, 151 came from pull request commits and 48
                              from pushes"
  d.detached_worker_test_cleanup:
    name: "Wait for detached worker shutdown before deleting its test state"
    rests_on: [s.2026_09_13_worker_cleanup]
    verdict: "The detached-capture test waits for both a terminal receipt and removal of
              worker.lease before cleaning its directory."
    because: "A terminal event receipt does not mean the worker has finished using the queue
              directory. The worker releases its lease after its final scan. A bounded wait and
              explicit lease assertion preserve the result assertions without hiding cleanup errors
              or changing product behavior."
    reopened_by: "The worker lifecycle changes so that lease removal precedes more state writes, or
                  a failed worker leaves the test hanging beyond its bounded wait."
    seen: {s.2026_09_13_worker_cleanup: "read 2026-09-13"}
  d.distinct_is_a_bare_id:
    rests_on: [s.2026_09_04_sameness, d.sameness_is_judged, d.locate_by_shape]
    verdict: "distinct writes its edge as a bare id - or several, comma-separated - with the why as
              a comment beneath, never as a list or an id-keyed mapping; the pair is left out of
              every candidate list, and same refuses it until the edge is removed"
    because: "The reader infers a field's role from its shape: a list of ids votes for the
              dependency field and a mapping keyed by ids for the snapshot, so an edge written either
              way would outvote rests_on or seen in a small record and change what every judgment
              there means. A bare id has no role to claim. The why is for a person and lives beside
              the field as a comment, the way a set's reason does; nothing evaluates it, and the edge
              holds either way round."
    blocked_on: "implementation: falsified by a record whose role inference tips on a distinct_from
                 field - a bare id casts no vote, so the sign would be a reader that learned to read
                 one as a list - or by a merger who needs the why on a surface, where a comment
                 cannot be shown"
    seen:
      s.2026_09_04_sameness: "read 2026-09-04"
      d.sameness_is_judged: "the tool never decides that two entries are the same: it shows the
                             nearest existing entries when one is written and candidates when
                             hypotheses consolidate; the writer or the merger decides, and the
                             decision is recorded - same_as as a migration that leaves the build
                             green, distinct_from as an edge that retires the pair"
      d.locate_by_shape: "the docs locate a shipped script by matching its name and taking the
                          highest version, never by a path written against today's layout"
  d.drift_from_newest_born:
    rests_on: [s.2026_09_03_coverage, d.metrics_derived_builtin]
    verdict: "drift is the share of what sessions read on or after the newest born among the
              arrangement judgments that nothing picks; without a born it has no value"
    because: "The newest arrangement decision is the last day someone looked at the page as a whole,
              so what was left unpicked before it was chosen, not drifted. A session read on that
              same day counts, because two sessions in one day are the common case here and a day is
              the finest clock the record keeps; a record whose arrangements carry no born cannot
              date what was added, and the count says so rather than guessing a start."
    blocked_on: "observational: falsified if a real page shows drift at zero while its recent
                 sessions sit unserved - a new tab's born hiding what the older tabs never picked"
    seen:
      s.2026_09_03_coverage: "read 2026-09-03"
      d.metrics_derived_builtin: "graph.* and page.* are derived entries the reader computes itself
                                  - counts and shares, never stored, thresholds only inside
                                  falsifiers"
  d.dry_run_is_check_on_the_union:
    rests_on: [s.2026_09_04_consolidate, d.consolidation_is_a_test, d.hypotheses_read_beside_the_base, p.union_tests]
    verdict: "the dry run is the reader's own check, run on the base with the hypotheses laid over
              it by id, said as what the fold would change: what arrives, what it replaces and what
              rests on that, what the union moves or breaks, what is contested"
    because: "A second evaluator for hypotheses would drift from the first; what a hypothesis's
              judgment needs is exactly what check asks of any judgment, asked of the record as it
              would stand after the fold. So the union is checked as a base is, and only what check
              did not already say about the base alone is the union's doing - a record already red
              stays red on its own account. A premise that moved under a judgment blocks the fold and
              leaves the run green, since a move flags a judgment for a person and fails no build; a
              contested id, a falsifier that holds and a hole make it red. {{p.union_tests}} is the
              count of places the union is tested. The count in p.union_tests is retained only as the
              last Python reading; it no longer measures places in the native reader."
    reopened_by: "A consolidation dry run and a check of its explicit union disagree about a
                  structural failure or fired condition."
    replaced: ["the standing judgment holds, and a person takes this over it by name on 2026-09-24"]
    seen:
      s.2026_09_04_consolidate: "read 2026-09-04"
      d.consolidation_is_a_test: "consolidating hypotheses into the base tests whether the writers
                                  worked on the same world: premises re-checked, falsifiers
                                  evaluated, contradictions stopped - as a dry run at any moment, and
                                  as a step on every pull request"
      d.hypotheses_read_beside_the_base: "every command reads the hypotheses beside the record over
                                          the base - pull shows what each proposes, check and open
                                          say where two disagree, the opener counts what waits with
                                          each one's age and reach - and evaluates the base alone;
                                          the union is tested by consolidation, and the page draws
                                          the base"
      p.union_tests: 1
  d.entry_file_is_grounding:
    rests_on: [s.2026_09_12_layout, goal.portable, d.prefix_is_a_word, d.reasoning_in_record, p.entry_names]
    verdict: "the record's entry file is GROUNDING.yaml: the first add creates it at the workspace
              root, the locator finds it first and a record kept under the earlier name after it,
              wherever that record already is, and no command creates the earlier name again"
    because: "The name is the one thing a session with no author present reads before anything else,
              and {{goal.portable}} is the bar: a file named for what it does for the session - what
              its answers stand on - carries its own instruction, where provenance named the half of
              the content that is sources and readings and reads, in software now, as a supply-chain
              attestation. Grounding is the word the method already uses in its skill, its opener and
              its grounding line, and {{d.prefix_is_a_word}} is the same rule one level up: a name is
              the link a question takes into the record. Reasoning, the pitch word, names a process
              and one field, {{d.reasoning_in_record}}, not the state the file holds. The earlier
              name stays read so that no record has to move, and {{p.entry_names}} counts the names
              the locator knows - a third would be a second convention."
    reopened_by: "a session with no author present that found the file and did not read it before
                  answering from memory, or an adopter who asked what the file is, or a live record
                  the locator stopped finding under its earlier name; a third name the locator
                  answers to, or a command that creates the earlier name again; a third name the
                  locator answers to, or a command that creates the earlier name again; a third name
                  the locator answers to, or a command that creates the earlier name again"
    replaced: ["the standing judgment holds, and a person takes this over it by name on 2026-09-23"]
    seen:
      s.2026_09_12_layout: "read 2026-09-12"
      goal.portable: "usable by any session, in any project, with no author present"
      d.prefix_is_a_word: "a prefix born from now is a word - the subject a question would name, or
                           the kind spelled out where a record is about one thing - never a letter;
                           an entry joins the prefix its record already holds for its subject, so a
                           record kept under letters keeps them and declares what they stand for in
                           meta.prefixes, which the opener and the page print beside the namespace;
                           check does not fail a letter"
      d.reasoning_in_record: "reasoning is the because of the judgment it belongs to, in the record;
                              the page's connective text lives in the brief; both resolve references
                              at build and both carry seen"
      p.entry_names: 2
  d.every_worker_test_waits_for_the_lease:
    from: s.2026_09_15_batch_test_race
    name: "Every test that starts the detached worker waits for its lease"
    rests_on: [s.2026_09_13_worker_cleanup, s.2026_09_15_batch_worker_cleanup, d.detached_worker_test_cleanup]
    verdict: "a test that starts the detached capture worker waits for worker.lease to vanish, not
              only for a terminal receipt, before its directory is cleaned - the rule of the queue
              test holds for every test that starts the worker"
    because: "The receipt is published before the worker's final queue scan and lease release, so a
              terminal state is visible while the worker still writes into the state directory. The
              queue test learned this and was revised alone; the batch capture test starts the same
              worker through the command line, polled the receipt alone, and failed the same way on
              the next Python 3.13 run. The probe recorded with that failure found the worker still
              holding its lease at that moment in a minority of quiet local runs, a window a loaded
              runner widens. Waiting for the lease costs one file check per poll and hides nothing: a
              worker that never releases it fails the test loudly instead of racing the cleanup."
    reopened_by: "a third test starts the worker and polls only the receipt, or the worker's
                  lifecycle changes so that its lease is removed before its last write into the state
                  directory"
    seen:
      s.2026_09_13_worker_cleanup: "read 2026-09-13"
      s.2026_09_15_batch_worker_cleanup: "read 2026-09-15"
      d.detached_worker_test_cleanup: "The detached-capture test waits for both a terminal receipt
                                       and removal of worker.lease before cleaning its directory."
    distinct_from: d.detached_worker_test_cleanup
    # distinct 2026-09-15: the older judgment decides how one test waits for the worker; this one says the wait belongs to every test that starts the worker, and rests on the older one
  d.export_preserves_recorded_context:
    name: "Focused excerpts preserve historical and current context"
    rests_on: [doc.graph_export, goal.portable, d.moved_is_a_flag]
    verdict: "Provide bounded Markdown excerpts by default, with optional Mermaid and original-field
              details. Label historical and current readings separately, distinguish omitted bodies
              from missing records, and retain simultaneous condition results and reader flags
              without changing the record format or evaluation policy."
    because: "A focused excerpt can omit current bodies while full-record comparisons and condition
              results remain known. Selection limits which values are displayed, not whether their
              comparison is reported. A condition result does not establish that its dependency links
              are complete, and malformed dependency text must not become fabricated entry links.
              Readable text preserves these distinctions when diagrams are unavailable."
    reopened_by: "Readers of supported excerpts confuse historical and current values, treat omitted
                  bodies as missing records or changed premises as fired conditions, lose a
                  simultaneous finding, or require unnecessary stops and extensive rereading to
                  complete ordinary tasks."
    seen:
      doc.graph_export: "read 2026-09-14"
      goal.portable: "usable by any session, in any project, with no author present"
      d.moved_is_a_flag: "a dependency that moved since the snapshot flags the judgment for a
                          person; only a predicate that holds fails the build"
  d.first_add_is_the_birth:
    verdict: "where no record resolves, the first add creates GROUNDING.yaml at the workspace root
              with that entry, under one line that says what keeps it; no other command creates one,
              and an unavailable registered record is refused, never replaced"
    because: "The write occasion had no mechanical first step: add refused where no record existed,
              so every first record was a hand-written file. Installation alone still creates
              nothing; the first finding does, and on a surface that can publish the record is met as
              its page ({{d.first_meeting_artifact}}). The file it creates carries the name
              {{d.entry_file_is_grounding}} gives it, and one line saying what keeps it, so a record
              found without its author leads back to the tool."
    reopened_by: "a record born by a first add where a registered one was meant; or a session that
                  writes the file by hand rather than through add once this exists; or a first add
                  that created the earlier name"
    rests_on: [s.2026_09_10_skills_split, s.2026_09_12_layout, d.first_meeting_artifact, d.entry_file_is_grounding]
    seen:
      s.2026_09_10_skills_split: "read 2026-09-10"
      s.2026_09_12_layout: "read 2026-09-12"
      d.first_meeting_artifact: "a record born in this session, on a surface that can publish, is
                                 rendered and shown as a live artifact without asking"
      d.entry_file_is_grounding: "the record's entry file is GROUNDING.yaml: the first add creates
                                  it at the workspace root, the locator finds it first and a record
                                  kept under the earlier name after it, wherever that record already
                                  is, and no command creates the earlier name again"
  d.fold_passes_the_one_door:
    rests_on: [s.2026_09_04_minted_permission, s.2026_09_04_consolidate, s.2026_09_15_verdict_conflicts_decided, s.2026_09_15_branch_verdict_conflicts, d.contradiction_by_id_and_day, p.supersede_doors, m.door.unfired_flips_named_reversed, m.door.unfired_flips_folded_clean]
    verdict: "a folded reading passes the one door a written one does, asked with the base's own
              readings: a reading newer than the base's enters and a same-day or older one is
              contested; a verdict, or other grounds, laid over a standing judgment folds only when
              the base's own condition has broken it on what the base holds, or when a person names
              the id at the fold; a reversal nobody named is red, and the trail says which of the two
              admitted it"
    because: "The fold asked the door with the union's readings and by hand, so any verdict laid
              over a standing judgment folded as clean - {{m.door.unfired_flips_folded_clean}} of the
              flips tried, each with no evidence - and a hypothesis that brought the reading that
              breaks a judgment together with the verdict that repairs it had certified itself: the
              write add refuses in one tree passed across the branch line, where contributors
              actually meet. A person's hand was the design, but the report listed the flip among
              updates under clean, so the hand never read it. Asked with the base's readings, the
              base's condition fires only on what the base already accepted; a branch's reading is a
              proposal like its verdict, and the report says when that reading would fire it, so the
              person deciding knows. Naming the id is one flag per reversal per fold - the price a
              reversal should cost - and the sequence is the one tree's own, reading, red, repair,
              with the integrator as the one who repairs. {{m.door.unfired_flips_named_reversed}} of
              the same flips are now reversed and red until named; {{p.supersede_doors}} is still the
              count that would show a second door."
    wrong_if: "m.door.unfired_flips_named_reversed < 3"
    replaced: ["the standing judgment holds, and a person takes this over it by name on 2026-09-16"]
    seen:
      s.2026_09_04_minted_permission: "read 2026-09-04"
      s.2026_09_04_consolidate: "read 2026-09-04"
      s.2026_09_15_verdict_conflicts_decided: "read 2026-09-15"
      s.2026_09_15_branch_verdict_conflicts: "The session that replayed the two-branch verdict
                                              conflict of issues #98 and #99 on this tree and probed
                                              four cases the issues did not try. Its reading:
                                              readings pass the day rule, a judgment in one tree is
                                              replaced only when its own falsifier fires, but the
                                              fold - local hypothesis or another branch - lays any
                                              verdict over a standing judgment by hand and calls it
                                              clean, so the write that add refuses in one tree passes
                                              across the branch line; the in-place supersede keeps
                                              nothing of what it replaced; a judgment's grounds are
                                              invisible to both doors; a future-dated reading enters.
                                              The rule it shaped, not yet decided: the base's
                                              condition evaluated on the base, an unfired flip
                                              contested and folded only by name, every replacement
                                              traced beside the record, and a source's own clock in
                                              place of the day."
      d.contradiction_by_id_and_day: "a contradiction is told by the id, the day and the base's own
                                      readings: the same id with a value read no later than the
                                      base's own reading, or with a different verdict, or with the
                                      same verdict on other grounds, is refused into the base and
                                      named a hypothesis; a newer reading supersedes and one dated
                                      after today is refused; a standing judgment is superseded only
                                      when its wrong_if holds on what the base holds; across the
                                      branch line a reading from another source with another value
                                      waits for a person to name the source; the same premises under
                                      different ids are different subjects"
      p.supersede_doors: 1
      m.door.unfired_flips_named_reversed: 3
      m.door.unfired_flips_folded_clean: "3 of 3"
  d.followups_installation_is_not_execution:
    rests_on: [followups.installation_evidence, s.followups_install]
    verdict: "Report configured scheduling separately from evidence that a scheduled run actually
              fired."
    because: "A retained local request or matching host configuration cannot demonstrate a later
              wake, filesystem access at that time, or completion of the intended work."
    reopened_by: "The installation flow reports a successful scheduled execution using only
                  configuration readback or a simulated dispatch."
    seen:
      followups.installation_evidence: "Matching host configuration readback confirms installation.
                                        The installer explicitly leaves first-run verification false;
                                        a real scheduled wake needs separate runtime evidence."
      s.followups_install: "read 2026-09-10"
  d.followups_readiness_is_not_authority:
    rests_on: [followups.execution, followups.outcome_retention, d.moved_is_a_flag, s.followups_contract]
    verdict: "A due trigger and a claim select work to consider or perform within existing
              authorization; they do not authorize additional effects or silently review
              conclusions."
    because: "Readiness describes timing and evidence. Claims coordinate actors. The user still
              determines the scope of authorized work, and task completion is separate from checking
              the conclusions that used its evidence."
    reopened_by: "A runner treats a due trigger or claim token as permission for an unapproved
                  action, or clears a judgment warning merely because the task completed."
    seen:
      followups.execution: "The scheduled host agent performs authorized work in its own review run.
                            The coordinator does not automatically dispatch a separate session per
                            item."
      followups.outcome_retention: "Attempt outcomes and evidence remain in the private followup
                                    ledger. Finishing a task does not write new knowledge into the
                                    project record or refresh its review snapshots."
      d.moved_is_a_flag: "a dependency that moved since the snapshot flags the judgment for a
                          person; only a predicate that holds fails the build"
      s.followups_contract: "read 2026-09-10"
  d.gate_and_opener_against_the_mark:
    rests_on: [s.2026_09_03_coverage, d.gate_reminds, d.open_is_a_slot, p.gate_bounces, doc.hook_delivery]
    verdict: "The opener records a session-start baseline. Prompt diagnostics compare current
