         came from, rules for what was worked out"
    of: "2026-09-11"

open:
  q.crates_io_resources:
                         name: "What a crates.io install does about the verified resources"
                         question: "A crate installed from crates.io carries the two commands
                                    without the verified reasoning resources a release archive places
                                    beside them, so it can read and write an existing record but
                                    cannot start a new one until KPOPPER_NATIVE_RESOURCES names a
                                    matching bundle. Should it stay that way, fetch the matching
                                    release's resources on request, or send Cargo users to the
                                    archive?"
                         from: s.2026_09_23_crates_io
  q.entries_whose_file_is_gone:
                         name: "Which entries still name a file the tree no longer holds"
                         question: "Fourteen sources and about a dozen readings name a file of the
                                    removed implementation as where they were read, and one decision
                                    rests on a reason that named it - that the plugin and a second
                                    reader read the shared originals from scripts/ by path, which
                                    nothing does now. None of this fails a check, because the reader
                                    does not ask whether a file it names still exists. Which of these
                                    subjects survive in the native sources and should be read there,
                                    and which were about the implementation itself and should be
                                    closed the way the measured readings were?"
                         from: s.2026_09_23_python_exit
                         answered:
                           by: d.source_file_availability_is_a_note
                           said: "check reports a missing repository file locator as a note, with a
                                  re-read or revision pin hint. file and literal from paths accept
                                  revision:path; the revision must hold a blob. Absolute external
                                  paths, symbolic entry references, prose and glob patterns are
                                  outside this check."
                           of: "2026-09-24"
                           because: "Thirteen historical source locators are pinned to python-final
                                     with their original reading dates and revisions retained. Eight
                                     surviving readings now cite native sources; five readings about
                                     Python implementation places or packaging are closed, and the
                                     judgments that tested those counts use observable reopeners. The
                                     crate decision now names native/shared as the original. Counting
                                     equivalent places in native remains
                                     q.reader_places_counted_once."
  q.followups_dispatch: "Which followups should stay in the daily session and which should receive
                         a dedicated execution session? No per-item dispatch policy is currently
                         implemented."
  q.followups_outcomes_to_graph: "Which nontrivial followup outcomes should be recorded as new
                                  project evidence, by which authorized writer, so that knowledge
                                  does not remain only in execution history?"
  q.github_mobile_images:
                  name: "Verify the revised images in the GitHub iPhone app"
                  from: s.2026_09_19_readme_example_depth
                  question: "Does the GitHub iPhone app load the Markdown images and their
                             phone-layout links from the updated branch? Native-app rendering remains
                             unverified."
  q.opener_measured: "what measures the opener a session actually receives, so that d.open_is_a_slot
                      can fail? m.open_clean is one reading from 2026-09-01 and p.hook_slot reads the
                      Python constant, so the judgment stood while the native opener ran 17,358
                      characters against a 2,000-character slot."
  q.prefix_eval: "does a word prefix reach the right entry more often than a letter, and does a
                  legend close the gap? the three-arm eval on the page fixture - the same prompts and
                  trials as the grounding-line harness, under letters, under letters with
                  meta.prefixes, and under words - has not run"
  q.pull_defaults: "does a session that ran pull still open the record file for values - and if
                    so, what was missing from the line it got?"
  q.account_copy: "does the hosted copy of this plugin get refreshed from here, or retired?"
  q.first_artifact: "what is the first artifact that must never change silently?"
  q.language_direction: "prior.ts_direction puts the renderer, command line and checker in TypeScript at
                         0.7 and prior.rust_unwarranted keeps a compiled binary off the table at 0.9 - a
                         costly, reversible move, so it waits for a person rather than an event: yes, no,
                         or coupled to the next rewrite of the page?"
  q.locator_authority: "the locator takes the highest cached version, while the harness records
                        one enabled install path - they agree today, but should the locator read
                        that record instead of ranking what it finds?"
  q.arrangement_falsifiers: "will sessions write arrangement falsifiers a build can evaluate and
                             that say something - to be read as a foreign agent would, after
                             fifteen real arrangements?"
  q.reader_places_counted_once:
                                  name: "Which places the record counts once the native reader still
                                         holds once"
                                  question: "Several readings counted a place that must exist once -
                                             one parse of a record file, one shape test for a
                                             predicate, one door a replacing write passes, one line
                                             drawn on confidence. They were taken from the reader
                                             this tree no longer holds, and the native sources hold
                                             some of those places in two files. Which of the counts
                                             still stand, and what takes them from the native sources
                                             so a second one shows again?"
                                  from: s.2026_09_23_python_exit
  q.readme_canvas_metaphor:
                                  name: "Whether to place the canvas concept in the README"
                                  v: "Does an agent painting connections between evidence,
                                      assumptions, a decision and review conditions clarify the
                                      product, and where should that illustration appear? A separate
                                      local SVG/PNG concept was produced; it is not adopted into the
                                      README."
                                  from: s.2026_09_20_readme_path_banners
                                  at: "Later three-part feedback, item 3, and the canvas concept
                                       preview."
  q.readme_reader_comprehension: "Can readers new to the project explain what the redesigned
                                  entrance preserves, what its checks actually detect, and how it
                                  applies beyond code without coaching? Ask what the source
                                  illustration communicates as well. The approved design has not yet
                                  established reader comprehension or repeat use."
  q.runtime_rebuild_unchecked:
                         name: "What checks a reasoning runtime rebuilt from its sources"
                         question: "A fresh build of the reasoning runtime was validated by the
                                    removed suite, in a workflow whose exact bytes are embedded in
                                    the committed corresponding-source archive and so cannot be
                                    edited without regenerating it - and a regenerated archive would
                                    describe a recipe the committed runtimes were not built with.
                                    That validation is no longer wired to the checks, so a change to
                                    the Lean sources or the toolchain has none until it is ported.
                                    The committed runtimes are still checked for integrity on every
                                    native run. What takes the rebuild validation, and when is the
                                    archive regenerated so the two agree?"
                         from: s.2026_09_23_python_exit
  q.same_day_rereading: "where does a re-reading go when the session changed the file a premise was
                         read from, on the day it was read? set refuses it into the base as two
                         writers, and the hypothesis beside it is a contested reading the dry run
                         fails, so a hand edit in the pull request is the only door left - the day
                         may be the wrong grain for a writer that is also the world"
  q.sealed_falsifiers: "is one question - under this decision, can the sign still happen? -
                        enough against falsifiers a decision seals, or does the work on
                        predictions that change what they predict (performative prediction,
                        reflexive forecasts, Goodhart) give a sharper test; and how often do
                        sessions write sealed ones before and after the rule?"
  q.unprompted_recording: "what makes a session record what it decided in conversation,
                           unasked? seven decisions lived only in chat until a person asked;
                           the opener had shown the rule, and the gate cannot see a record
                           nobody touched"
  q.contradiction_rule: "which writes open a hypothesis - a different value on an id the base
                         holds is clear; is an opposite verdict on the same rests_on one too, and
                         how is opposite told from merely different?"
  q.hypothesis_lifetime: "when is an untested hypothesis stale enough for the opener to say so -
                          by age, by how much rests on it, or only when a person asks?"

  q.verdict_through_a_library: "does a test that follows a link the way a reader would tell a
                                malformed link from a sound one on every version it runs on - the
                                page-links test reads its verdict through urljoin, whose treatment of
                                a step past the root differs by version, and so passed on two of the
                                three tried while the link was wrong on all of them; would asserting
                                the shape of the link catch it everywhere, and what else in the suite
                                takes its verdict from a library that is free to differ?"

judgments:
  d.a_comparison_shows_where_it_parts:
    rests_on: [s.2026_09_04_difference, d.moved_is_a_flag]
    verdict: "where two readings are printed side by side, each is clipped to where they part rather
              than to where they agree; the head is kept only when they part inside it"
    because: "Clipping at the head shows the reader the part that did not change. Two long readings
              that differ at their end came back as one string printed twice - on the line check
              prints, the one open ranks, the one a write answers with, the one a fork refusal asks a
              person to choose by, and two more - so {{d.moved_is_a_flag}}'s flag arrived carrying
              nothing to judge. A window opening at the last whole word before the two diverge says
              what moved in the space a clip already costs."
    blocked_on: "observational: falsified if sessions read these lines worse rather than better - a
                 fragment led by an ellipsis drops the context the head carried, and the sign is a
                 session that has to open the record to learn what the moved value is about, where
                 the old line told it"
    seen:
      s.2026_09_04_difference: "read 2026-09-04"
      d.moved_is_a_flag: "a dependency that moved since the snapshot flags the judgment for a
                          person; only a predicate that holds fails the build"
    distinct_from: d.text_holds_the_prose_it_places
    # distinct 2026-09-04: one decides which reading a snapshot records; this decides how any two readings are shown against each other, whatever they are snapshots of
  d.a_half_move_is_said:
    verdict: "files of the record's other layout beside the entry file - the record renamed with its
              files left under the earlier names, or a .kpopper/ opened beside a record still under
              the earlier name - fail check and are named in the opener's head with where they
              belong; the reader still looks in one home, and an empty hypotheses directory left
              behind is passed over"
    because: "{{d.home_beside_the_entry}} made the reader look in one home, so a file left under the
              other is a claim nobody reads - and on the first record moved by hand a hypothesis and
              a brief vanished from every surface with every check green
              ({{s.2026_09_12_half_move}}). A checker that passes over what it cannot read is the
              failure this method exists to refuse, so it fails rather than notes: the pull request
              that moves a record by half stays red until the move is whole. Saying it costs one line
              where a session looks first, and the records outside this tree will each go through
              this by hand."
    reopened_by: "a record that keeps files under the other name on purpose, for another tool, and
                  cannot make check green; or a half-moved record that opened green"
    rests_on: [s.2026_09_12_half_move, d.home_beside_the_entry, d.in_the_tree_only_what_is_reviewed]
    seen:
      s.2026_09_12_half_move: "read 2026-09-12"
      d.home_beside_the_entry: "everything a record keeps beside itself lives in one directory,
                                .kpopper, beside the file the reader opens first - hypotheses/,
                                view.yaml, measure.yaml, session.json, records/<head>.yaml when the
                                record divides, build/ for what is rebuilt - and a record found under
                                the earlier name keeps the earlier names beside it; the reader looks
                                in one of the two, never both"
      d.in_the_tree_only_what_is_reviewed: "in the tree only what is reviewed; ignored only what is
                                            rebuilt, in the one directory .kpopper/build, with a
                                            .gitignore the build writes there; state never in the
                                            tree"
  d.a_line_is_clipped_by_its_parts:
    rests_on: [s.2026_09_04_difference, d.a_comparison_shows_where_it_parts]
    verdict: "a line that shows a comparison is built from parts already clipped, and never cut as a
              whole - a budget spent on the first value would eat the second and the arrow between
              them"
    because: "pull cut its line at its full width, so a long value took the whole budget and the
              reading it was being compared against never appeared at all: not a clipped comparison
              but a single value, with nothing to say a second existed. That is the failure
              {{d.a_comparison_shows_where_it_parts}} does not reach, because no per-side reading
              helps a side that was never printed. Clipping the parts first also makes the line's own
              budget a last resort rather than the thing doing the work."
    blocked_on: "observational: falsified by a surface where the parts are short and the line still
                 overruns - which would mean the budget belongs on the line after all"
    seen:
      s.2026_09_04_difference: "read 2026-09-04"
      d.a_comparison_shows_where_it_parts: "where two readings are printed side by side, each is
                                            clipped to where they part rather than to where they
                                            agree; the head is kept only when they part inside it"
  d.a_name_becomes_a_url_by_escaping:
    from: s.2026_09_16_page_address
    name: "A path reaches a browser as a URL it was turned into, never as text pasted after a
           scheme"
    rests_on: [s.2026_09_16_page_address, d.link_ends_share_one_spelling]
    verdict: "The path is converted by the call that escapes it, and any fragment this adds comes
              after that conversion."
    because: "A name is not an address. A number sign in a directory name ends the address where the
              name begins and the rest is read as a fragment; a space cuts it just as short; a
              literal percent sign is read as the start of an escape. None of these are unusual
              names, and the fixtures here already carry one. Pasting a path after a scheme also puts
              the one fragment the command offers where nothing distinguishes it from a fragment the
              name produced, so the flag and the accident become the same character. Converting first
              keeps the name inside the path and leaves the fragment to what asked for it."
    reopened_by: "A destination is wanted that this conversion cannot spell - an address that is not
                  a file, or a place a browser is given by some other means than a URL."
    seen:
      s.2026_09_16_page_address: "read 2026-09-16"
      d.link_ends_share_one_spelling: "Both ends are resolved before one is subtracted from the
                                       other, and the page is opened under the name it resolves to."
  d.a_write_joins_its_own_shard:
    rests_on: [s.2026_09_11_read_once, d.scale_by_federation, d.add_places_by_prefix]
    verdict: "a new entry goes into the file whose collection already holds its neighbours - the
              entries whose ids share its head - and a write to an entry goes into the file that
              holds it; a record in one file answers that file to all of it"
    because: "{{d.add_places_by_prefix}} is the same rule one level down, and it stopped at the
              file's edge: {{d.scale_by_federation}}, but the writer took the first file that held
              the collection whatever the subject, so the first entries written into a divided record
              would have undone the division one at a time, in whichever file came first. The head of
              an id is what such a record is divided by, because the prefix is the subject, so it is
              what the choice reads. A subject the record has not met yet still lands in the first
              file that holds its collection rather than opening a second home for it, and a record
              in one file cannot tell the difference."
    reopened_by: "a record divided some other way than by the head of its ids - a file per kind, or
                  per quarter - where a new entry lands away from the subject it belongs with"
    seen:
      s.2026_09_11_read_once: "read 2026-09-11"
      d.scale_by_federation: "a record scales by sharding into domain records under a pointer index,
                              never by growing one file"
      d.add_places_by_prefix: "add inserts a new entry beside the entries it shares the longest
                               dotted prefix with, in id order among them, and at a collection's tail
                               only when id order puts it there"
  d.add_places_by_prefix:
    rests_on: [m.multi.record_pairs_conflicting, d.base_shared_forks_on_contradiction]
    verdict: "add inserts a new entry beside the entries it shares the longest dotted prefix with,
              in id order among them, and at a collection's tail only when id order puts it there"
    because: "Every parallel pair conflicted on this file because every session appended at the same
              tail. An entry placed by its id lands where its subject already sits, so two sessions
              writing about different subjects touch different lines and git merges them, and two
              writing about the same subject meet - which is the honest signal. A collection nobody
              sorted still has a first sibling that sorts after the new id, so the rule reorders
              nothing that is there."
    blocked_on: "observational: falsified if a later survey of parallel branches, all writing
                 through add, still conflicts on the record in most pairs -
                 m.multi.record_pairs_conflicting measured again"
    seen:
      m.multi.record_pairs_conflicting: "4 of 4"
      d.base_shared_forks_on_contradiction: "a consistent addition goes straight to the shared
                                             record from any session or branch; a write that
                                             contradicts the record opens a named hypothesis, and
                                             whatever later rests on the contradiction goes there - a
                                             session is never the unit"
  d.also_is_read_by_absence:
    rests_on: [s.2026_09_04_also_reading, d.locate_by_shape, d.sameness_is_judged, p.fields_read_by_name]
    verdict: "also: names other identities of a subject and never what it rests on: the reader
              excludes it from role voting by name, reads it as a retirement only where the named id
              is absent everywhere, and where that id is held says so as a note naming both commands
              rather than choosing between a retirement that came back and a sibling the record
              declares"
    because: "A survivor carries the id retired into it. While that id is absent the field names
              nothing and votes for nothing; the day a merge brings back the branch it came from -
              one side having retired the id, the other still holding it, the two touching different
              lines - the field is a list of ids that are all entries, which is the shape the
              dependency role is voted on by, and in a record with one judgment it ties with the real
              one and nothing can be read at all. No write can reach that state, so nothing but shape
              inference could have seen it coming. Excluding the field by name is the smallest fix
              and must not be the only one: alone it turns a loud failure into a silent
              contradiction, and passing quietly over what cannot be read is the one thing this
              reader refuses. The note is a note and not a failure because the two readings have one
              shape - a live record already keeps sibling resource ids in this field - and deciding
              between them is what {{d.sameness_is_judged}} leaves to a person. A record that does
              keep its dependencies there still says so with schema. {{p.fields_read_by_name}} names
              are read this way, and the count is what would show the reader retreating from shape
              inference one field at a time."
    wrong_if: "p.fields_read_by_name > 4"
    seen:
      s.2026_09_04_also_reading: "read 2026-09-04"
      d.locate_by_shape: "the docs locate a shipped script by matching its name and taking the
                          highest version, never by a path written against today's layout"
      d.sameness_is_judged: "the tool never decides that two entries are the same: it shows the
                             nearest existing entries when one is written and candidates when
                             hypotheses consolidate; the writer or the merger decides, and the
                             decision is recorded - same_as as a migration that leaves the build
                             green, distinct_from as an edge that retires the pair"
      p.fields_read_by_name: 4
    distinct_from: d.distinct_is_a_bare_id
    # distinct 2026-09-04: one says how a field is read, the other how a field is written; they share their premises and not their subject
  d.another_branch_reads_as_hypotheses:
    rests_on: [s.2026_09_04_consolidate, d.no_feed_of_other_branches, d.record_is_code]
    verdict: "another branch's committed record is read as hypotheses and never written: its base as
              one named after the ref, holding only what differs from this base or is new to it, and
              each hypothesis file it carries as one more - so a branch's facts cross by a pull, and
              a dead branch is harvested without its code"
    because: "{{d.record_is_code}} puts a branch's knowledge in its commits, and
              {{d.no_feed_of_other_branches}} keeps it out of every session's opener - so the one
              honest way across is a command a person runs, reading what git already holds. Read
              whole, the other record would overwrite this one's reviews and rewordings on every id
              they share; pruned to what differs in its claim or is newer by its day, it proposes
              exactly what the same writes would have proposed from here. The reader's own pull then
              shows the proposals beside the values, and the same dry run tests them."
    blocked_on: "observational: falsified if a harvested branch's facts arrive wrong for being read
                 without their reviews, or if sessions push records across worktrees by hand instead"
    seen:
      s.2026_09_04_consolidate: "read 2026-09-04"
      d.no_feed_of_other_branches: "the opener adds one line - how many hypotheses wait, and for how
                                    long; nothing another branch claims is pushed into a session, it
                                    is pulled by seed or surfaces as a collision on the same id"
      d.record_is_code: "the record of what is known about the code lives in the tree - committed
                         with the work it describes, reviewed in the same pull request, checked by
                         the same CI - and a hypothesis travels with its branch; an out-of-tree
                         record holds only what the tree cannot hold, the world outside the code; a
                         user-level directory is at most an index of records, never content; a
                         session named as a source is provenance, not process"
  d.application_names_are_nouns:
    from: s.2026_09_18_application_names
    rests_on: [s.2026_09_18_application_names, doc.applications]
    verdict: "Name the applications kpopper Hub and Annotated Documents, with CLI names hub and
              annotated-doc. Retain page and document as compatibility aliases."
    because: "The hub presents the project record; annotated documents are standalone
              evidence-bearing artifacts. Noun-based application names support build, inspect and
              refresh without tying the application to one action."
    reopened_by: "Users confuse the project hub with a standalone document, canonical names differ
                  across CLI and skills, or a supported old invocation stops working."
    seen: {s.2026_09_18_application_names: "read 2026-09-18", doc.applications: "read 2026-09-18"}
  d.arrangement_link_is_earned:
    rests_on: [s.2026_09_03_arrangements, d.review_names_what_it_reads, d.serving_earned_by_picks]
    verdict: "an arrangement's tabs are the ones whose picks earn a session source it rests on, and
              any tab that claims no occasion; it is linked while every source is earned by some tab,
              and its review settles every shape it governs"
    because: "A link by the serves: line alone lets a tab keep its claim and lose its sections, then
              cite the unserved count the gutting produced; earned picks are what serving already
              means. An arrangement may decide the whole page at once, so it governs every tab that
              earns one of its sources, and a tab with no serves: line is the page's own and belongs
              to every decision as the one bare tab does. The older reading - the tab serving a
              session source it rests on - is narrowed, not reversed: every tab this finds, it
              found."
    blocked_on: "observational: falsified if a real brief keeps an arrangement linked through a
                 single token pick, or cuts one by a section moved between the tabs it governs"
    seen:
      s.2026_09_03_arrangements: "read 2026-09-03"
      d.review_names_what_it_reads: "review takes a judgment's id or a section's title; an
                                     arrangement's review also rewrites the shape of the one tab, or
                                     of the tab serving a session source it rests on; nothing
                                     refreshes a snapshot by itself"
      d.serving_earned_by_picks: "a tab serves an intent only when its sections pick something that
                                  session recorded; a declaration nothing picks fails the build, and
                                  an intent that recorded nothing stands outside coverage"
  d.arrangement_sign_is_one_comparison:
    rests_on: [s.2026_09_03_arrangements, d.falsifier_beyond_reach, d.metrics_derived_builtin]
    verdict: "an arrangement's sign is one comparison over a count that can hold - a name, an
              operator, one value; a compound or an impossible one is refused, and a re-opener stands
              beside it, never in its place"
    because: "A compound sign reads as evaluable and is never decided - worse, the comparison shape
              takes everything after the operator as the value, so page.spill > 0 or page.unserved >
              0 was decided as a text comparison and held nothing forever. A count below zero or a
              share above one never happens. An arrangement's sign is a count the build takes, or it
              is decoration, and decoration is freeze in disguise."
    blocked_on: "observational: falsified if sessions answer the rule by writing arrangements with
                 no sign at all - blocked_on where a comparison was available - or if the one value a
                 sign may carry proves too narrow for a real arrangement"
    seen:
      s.2026_09_03_arrangements: "read 2026-09-03"
      d.falsifier_beyond_reach: "a falsifier names a sign the decision itself cannot suppress; one
                                 that can only appear when people do what the decision stops offering
                                 is sealed, not falsifiable"
      d.metrics_derived_builtin: "graph.* and page.* are derived entries the reader computes itself
                                  - counts and shares, never stored, thresholds only inside
                                  falsifiers"
  d.assessment_separates_findings_and_attention:
    name: "Assessment findings remain independent of attention and display"
    rests_on: [doc.assessment_contract, d.moved_is_a_flag, goal.portable]
    verdict: "Expose versioned recorded findings through one assessment contract, preserve the
              source body and evaluation scope, and derive task-scoped attention separately. Keep
              existing reader flags as a compatibility policy and identify the optional typed session
              semantics separately."
    because: "Consumers need to combine changed premises, fired or unknown conditions, alternatives
              and structural issues without parsing prose or losing independent findings. A display
              selection or attention policy can change what is shown or acted on while leaving the
              assessed evidence intact."
    reopened_by: "A supported consumer must reinterpret prose to use a finding, policy selection
                  changes assessed evidence, display truncation erases a known result, or the named
                  profile hides a material difference between evaluators."
    seen:
      doc.assessment_contract: "read 2026-09-14"
      d.moved_is_a_flag: "a dependency that moved since the snapshot flags the judgment for a
                          person; only a predicate that holds fails the build"
      goal.portable: "usable by any session, in any project, with no author present"
  d.bare_values_place_last:
    name: "A bare scalar decides where a new value goes only when nothing else does"
    verdict: "A new value whose prefix no section holds yet goes to the section holding the most
              values written out (v, quoted or rule). Only when no section holds one does the section
              holding the most bare scalars take it - never open, questions or sources - and a record
              holding neither opens known:. Both runtimes place it the same way and break a tie by
              the first section name."
    because: "A bare scalar is a value to the reader but not always to the person: add <id> <value>
              files one as a question when its prefix has no home, and in live records bare text
              outside the questions is file paths and formulas. Counting bare scalars always would
              pull new values into such sections; never counting them left a record that writes its
              values bare with a second, known: section beside them. A misplaced value costs a hand
              edit, which locks a history-backed record, while an extra known: section is cosmetic,
              so bare scalars decide only when nothing else can."
    rests_on: [d.shape_is_read_not_declared, d.add_places_by_prefix]
    reopened_by: "A record that keeps bare text other than values, with no value written out beside
                  it, has a new value filed into that text; or a record that writes its values bare
                  in two sections of its own gets one in the section its person did not mean."
    from: s.2026_09_23_bare_value_placement
    seen:
      d.shape_is_read_not_declared: "what the record's physical form is - its files and shards, the
                                     field each role is read from, its sidecars, the stores derived
                                     from it and what reads it - is computed by a read command
                                     whenever asked and never kept as a declaration; the only
                                     declared parts are the choices no shape can infer, each a
                                     judgment with a sign, and the bindings of one machine, which
                                     stay in that machine's state"
      d.add_places_by_prefix: "add inserts a new entry beside the entries it shares the longest
                               dotted prefix with, in id order among them, and at a collection's tail
                               only when id order puts it there"
  d.brand_on_the_directory:
    verdict: "the brand goes on the directory, the verbs, the check's name and the head line of a
              born record; the concept goes on the entry file's name"
    because: "A file named for a tool becomes a standard when the tool already dominates its niche;
              a file named for the concept becomes one when many vendors are the aim from the first
              day, which {{goal.portable}} says this is - and this tool renamed itself twice while
              the file's name survived both. The brand is still an asset: {{lit.name_risk}} says
              qualified search works, both registries hold the name, and it shows to an adopter where
              the hosts show theirs - the directory in every repository that adopts, visible and
              searchable; the check on every pull request; the first line of a record someone finds,
              which said nothing before; the commands and the skill namespace, which already carry
              it. The file's name is {{d.entry_file_is_grounding}}."
    reopened_by: "a person who met a record in a tree and could not find the tool that keeps it from
                  the tree alone, or an adopter who took the directory's name for the format's"
    rests_on: [s.2026_09_12_layout, goal.portable, lit.name_risk, d.entry_file_is_grounding]
    seen:
      s.2026_09_12_layout: "read 2026-09-12"
      goal.portable: "usable by any session, in any project, with no author present"
      lit.name_risk: "bare-term search is owned by a fandom; the org and handle are taken; every
                      package registry is free; qualified search works"
      d.entry_file_is_grounding: "the record's entry file is GROUNDING.yaml: the first add creates
                                  it at the workspace root, the locator finds it first and a record
                                  kept under the earlier name after it, wherever that record already
                                  is, and no command creates the earlier name again"
    distinct_from: d.named_for_popper
    # distinct 2026-09-12: one is where the brand shows in an adopter's tree, the other is what the tool is called; both read the name's cost
  d.browser_code_in_browser_files:
    rests_on: [m.page_string_lines, prior.strings_lose_tooling]
    verdict: "the page's CSS and JS live in their own files under scripts/page/, read whole at
              import and inlined at render - a page is still one file"
    because: "The renderer carried its page as Python strings - run.constants_measured counted them
              before the move - with no highlighting, no linter, no types, and every edit to the
              page an edit to a .py file. Reading the files at render time keeps the output
              byte-identical and puts the code where its tools are; m.page_string_lines at zero is
              the move having happened. Cheap to reverse, so decided on the prior alone."
    wrong_if: "prior.strings_lose_tooling < 0.6"
    seen: {m.page_string_lines: 0, prior.strings_lose_tooling: 0.95}
  d.candidate_lists_are_a_floor:
    rests_on: [s.2026_09_04_also_reading, d.sameness_is_judged, d.names_rank_never_decide, alt.sameness_from_names]
    verdict: "a candidate list is a floor and never a census: two entries about one fact, each with
              its own source and resting on nothing, share no declared edge, and what is left of them
              - the value, the name - is a resemblance this record refuses to decide on, so such a
              pair is closed by a person or by the next write that lands near one of them"
    because: "The edges the generators read are provenance, derivation and premises: the same source
              and place, the same rule, the same premises. Two sessions that each read their own
              document about one number share none of them, which is the ordinary shape of a
              multi-session record rather than an edge case. What is left is the value and the name,
              and both are properties of the subject rather than of its identity - two entries hold
              24 for unrelated reasons - which is the road this record refused when it rejected a
              tool that infers sameness from names. So a session reading a clean list has learned
              that nothing declared connects two subjects, never that the record holds no duplicate."
    blocked_on: "observational: falsified by a signal over declared fields that names such a pair
                 without deciding on resemblance - an identity a source itself declares, say - or by
                 a real record in which two sessions reading one fact from two documents never
                 happens"
    seen:
      s.2026_09_04_also_reading: "read 2026-09-04"
      d.sameness_is_judged: "the tool never decides that two entries are the same: it shows the
                             nearest existing entries when one is written and candidates when
                             hypotheses consolidate; the writer or the merger decides, and the
                             decision is recorded - same_as as a migration that leaves the build
                             green, distinct_from as an edge that retires the pair"
      d.names_rank_never_decide: "a candidate pair is named for a declared reason - the same source
                                  and place, the same source, the same rule read through what was
                                  retired, the same premises - and the overlap of two names only
                                  orders a list; add says the nearest three and refuses nothing, the
                                  dry run says a handful per arriving id"
      alt.sameness_from_names: rejected
  d.checked_session_is_optional:
    rests_on: [goal.portable, d.open_is_a_slot, doc.checked_sessions]
    verdict: "Offer the checked session transport alongside the legacy reader, enabled explicitly
              per project or machine; keep each judgment's source body alongside its computed card,
              exact raw reads and a reversible hook choice."
    because: "A complete typed view can preserve declared distinctions while the existing opening
              remains the compatibility baseline. Formal field checks do not establish source truth
              or a general improvement in session performance. A computed card can omit source
              explanations, so the original fields remain in the same read."
    reopened_by: "New records expose an omitted distinction or an unreachable source reference, or
                  fresh comparative session evidence warrants changing the default."
    seen:
      goal.portable: "usable by any session, in any project, with no author present"
      d.open_is_a_slot: "the session opener fills a fixed character slot, highest value per
                         character first; values never preload"
      doc.checked_sessions: "read 2026-09-09"
  d.capture_is_not_clearance:
    rests_on: [s.background_ingestion]
    verdict: "A capture receipt means the source was retained; only an applied receipt and the
              current record justify relying on an update. Incomplete identity, unsupported layouts
              and conflicts remain explicit questions."
    because: "Separating durable intake from adjudication lets work continue without promoting
              unprocessed or ambiguous information into a fact. The record remains authoritative; the
              private queue contains source evidence and processing state."
    reopened_by: "An accepted source or its supplied meaning cannot be retrieved later in the same
                  project; a captured or conflicted report is presented as an applied and checked
                  fact; or intake creates a competing authoritative record."
    seen: {s.background_ingestion: "read 2026-09-09"}
  d.chrome_follows_language:
    rests_on: [s.2026_09_04_components, d.author_free_build_guarantees]
    verdict: "Chrome follows the declared record language, or the dominant script of its descriptive
              text; Hebrew and Arabic are distinct catalogs, and values do not choose the language"
    because: "Direction alone cannot choose a language. The page translates its own words and
              preserves the record wording; an unsupported declared language is reported rather than
              silently claimed as translated."
    blocked_on: "observational: re-open when another record language needs a catalog or changing
                 only a value changes the inferred language"
    seen:
      s.2026_09_04_components: "read 2026-09-04"
      d.author_free_build_guarantees: "the session composes freely and the build enforces the
                                       element rules on the output"
  d.ci_execution_reuses_verified_work:
    name: "Preserve selected coverage while shortening CI execution"
    verdict: "Gate expensive work with bundle integrity, run explicit Python suites in parallel,
              wait only for matching native targets, and reuse intact GMP builds with identical
              inputs."
    rests_on: [m.ci_python_serial_baseline, m.ci_native_wait_baseline, p.ci_native_build_inputs]
    because: "The measured delay is test execution and repeated dependency compilation; the platform
              and installed-payload contracts still require their existing checks."
    reopened_by: "A selected unittest case is omitted; any existing Python/platform combination
                  loses coverage; a changed source, recipe, toolchain or cached file is accepted
                  without rebuilding GMP; or a failed native target allows ci-required to pass."
    seen:
      m.ci_python_serial_baseline: 2280.21
      m.ci_native_wait_baseline: "PR 120 run 35288867621 delayed a one-second committed-bundle
                                  integrity failure until all five native builds finished, about 24
                                  minutes after builds began."
      p.ci_native_build_inputs: "Native sources, builder, bundled runtime, native loader and
                                 replacement probes, notices, and native-workflow changes select
                                 native builds; unknown paths select all checks. Selector-only
                                 changes use mandatory contracts. Packaging metadata alone tests
                                 consumers and installation without recompiling native source."
  d.ci_selects_families:
    name: "Select PR checks by declared input families and require selected work to succeed"
    from: s.2026_09_17_selective_ci
    rests_on: [p.ci_native_build_inputs]
    verdict: "Keep record and cheap contracts unconditional; select expensive families
              conservatively from the full PR diff, cancel superseded runs, and retain broad consumer
              checks on main."
    because: "Skills and prose do not require native compilation. Packaging needs evidence about the
              installed committed payload, while changed native inputs need compilation and
              replacement-library integration. Unknown paths select all checks; the aggregate gate
              refuses an unexpected skip so selecting less cannot silently convert missing work into
              success."
    reopened_by: "A changed input affects a skipped family; a selected job is skipped or fails while
                  ci-required passes; or main no longer exercises all consumer families."
    seen:
      p.ci_native_build_inputs: "Native sources, builder, bundled runtime, native loader and
                                 replacement probes, notices, and native-workflow changes select
                                 native builds; unknown paths select all checks. Selector-only
                                 changes use mandatory contracts. Packaging metadata alone tests
                                 consumers and installation without recompiling native source."
  d.claude_plugin_has_no_nested_zip:
    name: "Claude plugin package avoids nested ZIP entries"
    request: s.2026_09_19_claude_install_request
    verdict: "The Claude plugin source contains no tracked path ending in .zip; ZIP-formatted native
              runtimes use the .kpopper-runtime suffix."
    because: "Claude Desktop packages a relative-path plugin inside a ZIP and rejects any inner
              entry whose extension is .zip. The runtime reader uses zipfile content detection and
              does not require a .zip filename, so a domain-specific suffix preserves the verified
              offline payload while allowing the host to extract the plugin."
    rests_on: [s.2026_09_19_claude_install_request, s.2026_09_19_claude_nested_zip]
    reopened_by: "Claude documents and ships support for ZIP files nested in plugin downloads, or a
                  supported runtime consumer requires the .zip filename rather than ZIP-formatted
                  bytes."
    seen:
      s.2026_09_19_claude_install_request: "Request to fix, publish and directly merge the Claude
                                            plugin installation repair"
      s.2026_09_19_claude_nested_zip: "read 2026-09-19, Claude Desktop main.log lines 28472, 28518
                                       and 28567: RemotePluginManager retried and refused kpopper
                                       1.8.0 with ZipExtractionError because
                                       scripts/reasoning/native/darwin-arm64.zip was a ZIP entry
                                       inside the downloaded plugin ZIP; inspection of the installed
                                       client showed the plugin extraction policy rejects entries
                                       whose lowercase extension is .zip."
  d.community_entrypoints:
    because: "These entrypoints let a new contributor assess the existing checks, install the
              project, report a reproducible problem and submit a focused change. Badges link to
              their actual workflows, release or license; forms preserve a blank-issue route.
              Feature badges link to capability documentation: reasoning-runtime identifies Lean 4,
              and Versioned knowledge marks history as experimental. They describe technology and
              maturity without claiming the expanded reasoning/history epic is complete. Reporting
              policies need a real private contact before publication, and community files alone do
              not establish release readiness."
    name: "Make contributing discoverable and show actual project status"
    reopened_by: "A newcomer cannot complete setup or find the right reporting route from these
                  files, the forms prevent a useful report, a badge no longer represents the
                  workflow, release, license or capability it claims, or an experimental capability
                  becomes generally available."
    rests_on: [p.community_guidance]
    verdict: "Keep a small set of truthful badges and lightweight issue forms, with newcomer setup
              and reporting routes in the contribution guide."
    seen:
      p.community_guidance: "GitHub recommends discoverable community files and issue templates;
                             workflow status badges report actual workflow results."
  d.components_follow_shape:
    rests_on: [s.2026_09_04_components, d.groupings_declared, doc.hub_seam]
    verdict: "The existing shapes carry the hub components; an axis is reviewed text with signed
              references, links select entries carrying destinations, and grouping hues follow
              declaration order"
    because: "The hub provides the visual grammar without prescribing its sections. Dates are
              calendar days, so countdowns update from the picked date in the browser and retain a
              dated fallback without scripts. Overlapping groups keep every membership and use the
              first declared scheme for a stable identity across sections."
    blocked_on: "observational: re-open if a component requires a finance-specific field or a
                 grouping changes color when only a value changes"
    seen:
      s.2026_09_04_components: "read 2026-09-04"
      d.groupings_declared: "groupings are declared by the session, any number, under its own names;
                             the renderer owns none"
      doc.hub_seam: "read 2026-09-02"
  d.contested_is_a_rival_claim:
    rests_on: [s.2026_09_04_forks_chapter, d.hypotheses_read_beside_the_base, p.contested_meanings]
    verdict: "contested is said of one thing: a rival claim laid against what the record holds,
              which nothing but a person decides - two hypotheses on one id, a reading the door
              refuses at the fold, a hypothesis or an open question against an arrangement; a
              judgment the opener lists as needing a person is said to need one, never to be
              contested"
    because: "The opener's standing line called every flagged judgment contested - a premise that
              moved, a hole, a falsifier nothing evaluates - while check, pull, the dry run and the
              page keep the word for a rival claim a person must decide between. A session reading
              both takes a moved premise for a second writer and goes looking for a hypothesis that
              does not exist. One word for one thing; {{p.contested_meanings}} is the count that
              would show a second one creeping back in."
    wrong_if: "p.contested_meanings > 1"
    seen:
      s.2026_09_04_forks_chapter: "read 2026-09-04"
      d.hypotheses_read_beside_the_base: "every command reads the hypotheses beside the record over
                                          the base - pull shows what each proposes, check and open
                                          say where two disagree, the opener counts what waits with
                                          each one's age and reach - and evaluates the base alone;
                                          the union is tested by consolidation, and the page draws
                                          the base"
      p.contested_meanings: 1
  d.context_is_an_explicit_read:
    rests_on: [doc.checked_retrieval, d.checked_session_is_optional]
    verdict: "Search continues from a revision-bound ranked position; graph context is explicitly
              requested around known IDs for support or impact, keeps exact source reads and unread
              boundaries, and leaves global search available."
    because: "A needed source can occur later in a ranking or outside declared links. Declared paths
              can recover additional source records, but a path or search score does not establish a
              claim, and a bounded neighborhood cannot establish full coverage."
    reopened_by: "An unchanged search skips an unread match when it resumes; an
                  old returned cursor is silently applied to a changed ranking; a context read loses
                  source qualifications or hides unread boundaries; or task evidence justifies a
                  different retrieval contract."
    seen:
      doc.checked_retrieval: "read 2026-09-10"
      d.checked_session_is_optional: "Offer the checked session transport alongside the legacy
                                      reader, enabled explicitly per project or machine; keep each
                                      judgment's source body alongside its computed card, exact raw
                                      reads and a reversible hook choice."
  d.contradiction_by_id_and_day:
    rests_on: [s.2026_09_04_minted_permission, s.2026_09_03_hypotheses, s.2026_09_15_verdict_conflicts_decided, s.2026_09_15_branch_verdict_conflicts, d.base_shared_forks_on_contradiction, d.write_path_returns_reach, p.supersede_doors, m.door.opposed_verdicts_named_reversed, m.door.grounds_changes_named, m.door.future_dated_readings_refused]
    verdict: "a contradiction is told by the id, the day and the base's own readings: the same id
              with a value read no later than the base's own reading, or with a different verdict, or
              with the same verdict on other grounds, is refused into the base and named a
              hypothesis; a newer reading supersedes and one dated after today is refused; a standing
              judgment is superseded only when its wrong_if holds on what the base holds; across the
              branch line a reading from another source with another value waits for a person to name
              the source; the same premises under different ids are different subjects"
    because: "set is the update path - the world moving - so a differing value alone cannot be the
              contradiction; what the record can tell apart is time, and the day is its clock: a
              reading newer than the base's supersedes, one of the same day or older that disagrees
              is two writers. A day ahead of today would outrank every reading of today, so it is
              refused - {{m.door.future_dated_readings_refused}} places a reading is dated. A
              judgment has no clock and a session's word admits nothing, so a standing judgment is
              replaced only when its own condition holds - on what the base holds, since a reading
              that arrives together with the verdict has not been accepted yet - and every other
              rewrite waits beside the record for a person to take by name. The same verdict on other
              grounds is a decision written again and goes the same way, since the grounds are what
              the verdict answers to; {{m.door.grounds_changes_named}} such changes are named where
              both doors were blind. Across the branch line two sources for one id that disagree are
              two instruments, and no day orders instruments, so a person names which the id follows.
              The two-branch test of issues #98 and #99 named none of its opposed verdicts;
              {{m.door.opposed_verdicts_named_reversed}} are named now. The same premises under
              different ids stay different subjects until someone says otherwise. One function
              decides all of it; {{p.supersede_doors}} is the count that would show a second one
              creeping in. The count in p.supersede_doors is retained only as the last Python
              reading; it no longer measures places in the native reader."
    reopened_by: "Two native replacing writes decide differently whether the same id and reading day
                  may replace the same held claim."
    replaced: ["the standing judgment holds, and a person takes this over it by name on 2026-09-16", "the standing judgment holds, and a person takes this over it by name on 2026-09-24"]
    seen:
      s.2026_09_04_minted_permission: "read 2026-09-04"
      s.2026_09_03_hypotheses: "read 2026-09-03"
      s.2026_09_15_verdict_conflicts_decided: "read 2026-09-15"
      s.2026_09_15_branch_verdict_conflicts: "The session that replayed the two-branch verdict
                                              conflict of issues #98 and #99 on this tree and probed
                                              four cases the issues did not try. Its reading:
                                              readings pass the day rule, a judgment in one tree is
                                              replaced only when its own falsifier fires, but the
                                              fold - local hypothesis or another branch - lays any
                                              verdict over a standing judgment by hand and calls it
                                              clean, so the write that add refuses in one tree passes
                                              across the branch line; the in-place supersede keeps
                                              nothing of what it replaced; a judgment's grounds are
                                              invisible to both doors; a future-dated reading enters.
                                              The rule it shaped, not yet decided: the base's
                                              condition evaluated on the base, an unfired flip
                                              contested and folded only by name, every replacement
                                              traced beside the record, and a source's own clock in
                                              place of the day."
      d.base_shared_forks_on_contradiction: "a consistent addition goes straight to the shared
                                             record from any session or branch; a write that
                                             contradicts the record opens a named hypothesis, and
                                             whatever later rests on the contradiction goes there - a
                                             session is never the unit"
      d.write_path_returns_reach: "the record changes from the command line through set, add and
                                   review; each edits the file in place, writes seen itself, and
                                   answers with the reach - what rests on the write, what is MOVED
                                   now, which predicate fired; set can replace from and at together
                                   with a value using --source and --at, without reviewing dependent
                                   judgments"
      p.supersede_doors: 1
      m.door.opposed_verdicts_named_reversed: 2
      m.door.grounds_changes_named: 2
      m.door.future_dated_readings_refused: 3
  d.copyable_agent_requests:
    name: "Give copyable agent requests a consistent greeting and instruction"
    rests_on: [s.2026_09_23_dear_agent_copy]
    verdict: "User-facing natural-language requests intended for pasting into an agent chat begin
              with Dear agent, and use a fenced text block preceded by the bold instruction Copy and
              paste the following text to your agent:. Apply this convention in the README and
              guides; preserve executable command syntax, configuration templates, source quotations
              and actual output."
    because: "The maintainer chose the greeting as a brand signature. A consistent introduction
              makes the text to copy recognizable and separates an agent request from surrounding
              explanation. Adding prose to a slash command or shell command would change how it runs,
              while altering quoted or observed text would misrepresent its source."
    reopened_by: "Readers copy the label as part of the request, mistake a natural-language request
                  for an executable command, or the greeting interferes with a documented
                  interaction."
    seen: {s.2026_09_23_dear_agent_copy: "read 2026-09-23"}
  d.correct_is_for_unlanded_work:
    name: "Correct only what nobody could have read"
    rests_on: [s.2026_09_23_answer_and_correct, d.fold_passes_the_one_door]
    verdict: "correct rewrites an entry in place only while no commit holds it - outside git, while
              this session wrote it - and while everything resting on it is unlanded by the same
              test; what rests on it is flagged, never rewritten, and landed work goes to a
              hypothesis a person takes at the fold."
    because: "A writer's own slip was refused as a second writer or a re-decision, so sessions
              edited the file by hand, which a history-backed record refuses outright. A correction
              nobody could have read replaces nothing anyone relied on; anything already in a commit
              may have been read, and replacing it stays the person's act
              {{d.fold_passes_the_one_door}} describes."
    reopened_by: "A correction reaches work someone else had already read, or sessions still edit
                  the record by hand to fix what they just wrote."
    seen:
      s.2026_09_23_answer_and_correct: "read 2026-09-23"
      d.fold_passes_the_one_door: "a folded reading passes the one door a written one does, asked
                                   with the base's own readings: a reading newer than the base's
                                   enters and a same-day or older one is contested; a verdict, or
                                   other grounds, laid over a standing judgment folds only when the
                                   base's own condition has broken it on what the base holds, or when
                                   a person names the id at the fold; a reversal nobody named is red,
                                   and the trail says which of the two admitted it"
  d.coverage_printed_never_acted:
    rests_on: [s.2026_09_03_coverage, d.intent_is_a_source, d.metrics_derived_builtin, p.coverage_thresholds]
    verdict: "coverage is counted at every build and check and printed as facts - each intent no tab
              serves with one hint beside it, the prefixes nothing picks, spill, drift, the recent
              streak - and nothing in the mechanism acts on a number"
    because: "The hint says how much of what a session wrote already falls inside each tab's picks,
              and stops there: whether that makes the intent the same world as the tab is a session's
              judgment, recorded as an arrangement decision with its own falsifier. A line drawn in
              code would be a threshold nobody chose and everybody wants to move;
              {{p.coverage_thresholds}} of them exist, and the count is what would show one creeping
              in."
    reopened_by: "a coverage number the build acts on - a section dropped, a hint withheld or a page
                  refused because a count crossed a line drawn in code; a coverage number the build
                  acts on - a section dropped, a hint withheld or a page refused because a count
                  crossed a line drawn in code; a coverage number the build acts on - a section
                  dropped, a hint withheld or a page refused because a count crossed a line drawn in
                  code"
    replaced: ["the standing judgment holds, and a person takes this over it by name on 2026-09-23"]
    seen:
      s.2026_09_03_coverage: "read 2026-09-03"
      d.intent_is_a_source: "a session records what it was for as a source; a tab is a reading
                             occasion that serves intents, and serving is earned by picks"
      d.metrics_derived_builtin: "graph.* and page.* are derived entries the reader computes itself
                                  - counts and shares, never stored, thresholds only inside
                                  falsifiers"
      p.coverage_thresholds: 0
  d.crate_carries_shared_copies:
    name: "The published crate carries the shared originals it embeds"
    verdict: "native/ builds on its own: native/shared/ holds the original schemas, renderer files
              and embedded source texts, and native/LICENSE holds the crate licence. The Lean build
              trees under scripts/ stay synchronized with the embedded Lean copies. A crate built
              from crates.io declares the same adapter fingerprint as the same version built from
              this repository."
    because: "crates.io receives native/ alone, so every file the crate embeds or fingerprints must
              be inside it. There is no Python reader requiring originals under scripts/. Cargo
              publishes a rewritten manifest and keeps Cargo.toml.orig; the build hashes that
              original so receipts identify the same adapter across distribution channels."
    rests_on: [d.crates_io_every_release]
    reopened_by: "A crate built from crates.io refuses the verified resources of the release with
                  the same version, or declares a different adapter than that release's executable."
    from: s.2026_09_24_source_file_references
    replaced: ["the standing judgment holds, and a person takes this over it by name on 2026-09-24"]
    seen:
      d.crates_io_every_release: "Each release's crate is published to crates.io as kpopper, from
                                  the commit its GitHub release was made from and only once that
                                  release is out. An owner publishes the first version, which claims
                                  the name; the release workflow publishes every later one through
                                  trusted publishing. Only bytes equal to the package the release
                                  build verified are uploaded, and a version crates.io already serves
                                  must be those bytes."
  d.crates_io_every_release:
    name: "Every release reaches crates.io as kpopper"
    verdict: "Each release's crate is published to crates.io as kpopper, from the commit its GitHub
              release was made from and only once that release is out. An owner publishes the first
              version, which claims the name; the release workflow publishes every later one through
              trusted publishing. Only bytes equal to the package the release build verified are
              uploaded, and a version crates.io already serves must be those bytes."
    because: "kpopper is already the package name on PyPI and npm, and one crate installs both
              commands, so cargo install kpopper needs no second name. crates.io never takes a
              version back, so the upload waits for the release it belongs to, repeats nothing the
              registry already serves, and the repository holds no registry credential. Cargo
              packages the commit again when it publishes, so the job that holds the registry
              identity compares that package with the verified bytes before and after the upload, and
              runs no repository script."
    rests_on: [s.2026_09_23_crates_io, p.native_distribution_contract]
    reopened_by: "crates.io serves a crate named kpopper that this project did not publish, or
                  refuses a release's crate from the workflow's trusted publisher."
    from: s.2026_09_23_crates_io
    seen:
      s.2026_09_23_crates_io: "read 2026-09-23"
      p.native_distribution_contract: "The native CLI and plugin start at 0.9.0 with GitHub platform
                                       archives and explicit installers. Public names are kpopper and
                                       kpop. Existing GitHub tags/releases and legacy PyPI/npm
                                       versions remain available. Cargo is a source-build route;
                                       crates.io publication is separate."
  d.darwin_checked_where_it_lands:
    name: "Where in the life of a change the Darwin check belongs"
    verdict: "Darwin runs on the push to main and at release, not on every pull request commit"
    rests_on: [m.ci_spend_by_platform, m.ci_spend_by_trigger]
    reopened_by: "A Darwin-only failure turns up on the push to main, or in a release, that the pull
                  request which landed it would have caught - or the people writing here stop working
                  on Darwin machines, so nobody exercises that platform between merges."
    from: s.2026_09_18_ci_cost
