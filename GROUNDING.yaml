  d.skill_is_an_occasion:
    rests_on: [s.2026_09_10_skills_split, p.skills_shipped, m.skill_bytes_largest, m.skill_bytes_before, d.open_is_a_slot]
    verdict: "a skill is one occasion - the moment a session is in, said in its description - and
              its body is the how-to for that moment alone; the method's long-form waits in reference
              files read only when needed"
    because: "One skill covered four occasions under one description and loaded
              {{m.skill_bytes_before}} bytes on every invocation; after a compaction only the first
              five thousand tokens of a skill return, which in that file was the philosophy while the
              commands began at line 688. A precise description triggers - the activation A/B of
