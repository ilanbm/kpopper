        check_frozen: 0.26
        pull_frozen: 0.17
        overlays_per_open: 2
        semantic_roles_calls_per_open: 872
        findall_calls_per_open: 2529314
        open_live_with_per_document_memo: 0.7
        entries_319_open_live: 6.1
      s.2026_09_18_overlay_profile: read 2026-09-18
  d.page_build_reads_the_loaded_record:
    rests_on: [m.read_command_loads_after, m.read_command_record_loads, s.2026_09_18_lane_b_load_once]
    request: s.2026_09_18_lane_b_load_once
    verdict: "a read command reads the record once, and the page it asks is built from that reading"
    wrong_if: "m.read_command_loads_after > 1"
    because: "open and check read the record and then asked the page what it knew, and the page read
              it again - two readings of the same files in one command, two live overlays, and two
