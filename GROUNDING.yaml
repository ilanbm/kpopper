    seen:
      s.2026_09_10_skills_split: "read 2026-09-10"
      run.design_talk: "read 2026-09-02"
      d.gate_reminds: "Lifecycle hooks never request a continuation. Current findings are advisory
                       context on real user prompts; explicit check, gate and write-admission
                       failures remain authoritative."
      p.gate_bounces: 0
      doc.prompt_reminders: "read 2026-09-22"
      doc.hook_delivery: "read 2026-09-22"
  d.gate_by_consequence:
    rests_on: [prior.gate_by_consequence, m.claims.general_held, d.hypothesis_is_a_judgment]
    verdict: "who decides is confidence times the cost of being wrong: high and cheap is decided in
              one line, no person; high and costly is decided, recorded, and put in front of the
              person; low and cheap is tried, the reversal being the test; low and costly is the
              person's, or buys information with the cheapest experiment"
    because: "Confidence attaches to the claim and never to the decision; cost is what the lanes
              already weigh - reversibility, blast radius, who is affected. Asked for a language, a
              session answered at 0.7 and then proposed to wait for an event that would falsify the
              other choice, which nothing had asked of it. Confidence in a general claim is earned -
              {{m.claims.general_held}} of 3 scored held - so the cheap row is decided on it and the
              record says so in one line. The fork gate of d.hypothesis_is_a_judgment is the costly
              row of the same matrix: the falsifier drafted, the person confirming. The sign that
              would make a judgment wrong is written in every cell, since it is one line; it is
              pursued - a run, a measurement - only where being wrong costs."
    wrong_if: "prior.gate_by_consequence < 0.8"
    reopened_by: "sessions asking a person in the cheap row, or deciding alone in the costly one,
                  more often than not - read off the records of real work"
    seen:
      prior.gate_by_consequence: 0.85
      m.claims.general_held: 3
      d.hypothesis_is_a_judgment: "a task, a branch and a what-if are one thing: a judgment whose
                                   truth is pending - its premises in rests_on, its claim in verdict,
                                   what would refute its success in wrong_if - and the merge is its
                                   test"
  d.github_packages_is_not_a_channel:
    rests_on: [p.github_python_registries, lit.github_registries, d.npm_holds_the_name]
    verdict: "GitHub Packages is not a channel for this tree - the python package cannot live there
              at all, and an npm copy there would hold nothing the npm package exists to hold"
    because: "The registry a person installs from is PyPI, and GitHub Packages offers no Python
              registry to move it to - that half is not a preference. The npm half could go: a scoped
              copy on the GitHub registry. But the npm package exists to hold a name, and a name is
              held where people look for it; a copy under another host reserves nothing, and from a
              closed repository it asks for a token before it will install at all. That is a second
              place for the same files to live and drift, bought for no reach and no claim - the
              mistake this tree already refuses for its reader. What was actually wanted here is that
              an install stops lagging a merge, and that is the registries' own identity handshake,
              not a second registry."
    wrong_if: "p.github_python_registries > 0"
    seen:
      p.github_python_registries: 0
      lit.github_registries: "GitHub Packages hosts npm, RubyGems, Maven, Gradle, NuGet and
                              containers; it has no Python registry, so pip installs cannot come from
                              it"
      d.npm_holds_the_name: "the npm name is held against the day this becomes a Node tool, and it
                             is held by the browser checks rather than by a placeholder"
  d.history_authority_is_explicit:
    name: "Explicit history authority and preserved evidence"
    rests_on: [p.history_activation_cancellation, p.history_branch_adoption, p.history_replay_audit_evidence, p.history_writer_compatibility]
    verdict: "Activated records select authority through a validated generation marker and explicit
              acts. Retaining or importing an immutable claim does not accept it; cancellation
              preserves later evidence as inactive history."
    because: "Interrupted writes and merged branches can retain several valid versions at once.
              Choosing the newest file or treating presence as acceptance would change the record
              without an attributable decision. Binding each publication to a checked baseline and
              keeping cancelled generations lets recovery preserve both the current decision and the
              evidence needed to examine it."
    blocked_on: "observational: falsified by a reproducible interrupted-write or
                 branch-reconciliation case in which the same validated marker and retained evidence
                 admit different accepted states, or recovery requires deleting an original claim or
                 inventing a prior acceptance. Reproduce from retained copies independently of
                 generated-view checks."
    seen:
      p.history_activation_cancellation: "Guarded activation cancellation retains the complete
                                          candidate as inactive immutable audit, restores authored
                                          bytes, advances the legacy authority epoch, and binds
                                          cancellation receipts to the authority and later commits.
                                          Group recovery validates every member before clearing
                                          reader guards."
      p.history_branch_adoption: "Local branch history is captured at pinned Git commits and adopted
                                  through one prepared mutation with explicit overlap choices.
                                  Captured source envelopes are retained as immutable audit evidence;
                                  prior capsule coverage is explicit rather than recursively copied.
                                  Ordinary target evidence must match exact source bytes, and
                                  recovery never rereads moved source refs."
      p.history_replay_audit_evidence: "Adapter audit replay accepts only the current adapter
                                        identity or an exact full audit in validated causal parent
                                        receipts. A pending operation cannot witness its own audit.
                                        An unknown old adapter requires the original verified
                                        runtime; semantic and native audit changes still refuse."
      p.history_writer_compatibility: "History batch receipt v6 validates the final staged world
                                       while retaining per-action admission and original seen.
                                       Retained v2/v3 operations replay exact bytes. Unicode subjects
                                       retain exact logical identities through versioned hashed
                                       physical paths; older raw paths remain readable. Identity
                                       changes and brief references publish under one reader guard."
  d.home_beside_the_entry:
    verdict: "everything a record keeps beside itself lives in one directory, .kpopper, beside the
              file the reader opens first - hypotheses/, view.yaml, measure.yaml, session.json,
              records/<head>.yaml when the record divides, build/ for what is rebuilt - and a record
              found under the earlier name keeps the earlier names beside it; the reader looks in one
              of the two, never both"
    because: "The hosts this method adapts to keep one file meant to be read at the root and
              everything else in a directory named for the tool that owns it - .github, .claude,
              .codex - and that split answers two questions at once: the root holds the one file a
              person or a session must find by eye, and the directory carries the namespace, so a
              file inside needs only its role for a name. The directory follows the entry file, as
              {{d.record_is_code}} and {{d.register_out_of_tree}} already place hypotheses, so a
              pointer record and a registered one keep theirs beside the file the reader opens; a
              divided record's shards go there too, because at that size the reading goes through
              open, pull and the page ({{d.scale_by_federation}}) and the write already knows its
              shard ({{d.a_write_joins_its_own_shard}}). {{p.hypothesis_homes}} stays the count of
              places hypotheses are read from - a record under either name has one."
    wrong_if: "p.hypothesis_homes > 1"
    reopened_by: "a reviewer who missed a change under .kpopper in a pull request, a person on a
                  surface without git who could not find the page or the brief, or a second file
                  convention appearing beside the entry file"
    rests_on: [s.2026_09_12_layout, d.record_is_code, d.register_out_of_tree, d.scale_by_federation, d.a_write_joins_its_own_shard, p.hypothesis_homes]
    seen:
      s.2026_09_12_layout: "read 2026-09-12"
      d.record_is_code: "the record of what is known about the code lives in the tree - committed
                         with the work it describes, reviewed in the same pull request, checked by
                         the same CI - and a hypothesis travels with its branch; an out-of-tree
                         record holds only what the tree cannot hold, the world outside the code; a
                         user-level directory is at most an index of records, never content; a
                         session named as a source is provenance, not process"
      d.register_out_of_tree: "a record the tree cannot hold registers its path in the git common
                               dir, so every worktree finds it and nothing enters the tree"
      d.scale_by_federation: "a record scales by sharding into domain records under a pointer index,
                              never by growing one file"
      d.a_write_joins_its_own_shard: "a new entry goes into the file whose collection already holds
                                      its neighbours - the entries whose ids share its head - and a
                                      write to an entry goes into the file that holds it; a record in
                                      one file answers that file to all of it"
      p.hypothesis_homes: 1
  d.hook_state_keeps_its_directory:
    name: "Hook state leaves the temporary directory's mode alone"
    verdict: "The hooks keep a session's state in the host's temporary directory without changing
              that directory: the state file is private, and only a directory a hook creates is made
              private."
    because: "The temporary directory belongs to the system. macOS refuses to change the mode of the
              per-user $TMPDIR even for its owner, so a hook that tried failed before writing
              anything, and on macOS the grounding line, the recording reminder and the citation
              check never ran. The Python hooks never changed it, and a state file created private
              needs nothing from the directory."
    rests_on: [d.hooks_carry_pointers]
    reopened_by: "A session's hook state readable by another local user because the directory
                  holding it kept the mode the system gave it."
    from: s.2026_09_23_session_hook
    seen:
      d.hooks_carry_pointers: "the hooks are the one layer every session gets without choosing; they
                               name the entries a prompt touches and the skill for the next move, in
                               the host's own syntax, and never a value"
  d.hooks_carry_pointers:
    rests_on: [s.2026_09_10_skills_split, d.open_is_a_slot]
    verdict: "the hooks are the one layer every session gets without choosing; they name the entries
              a prompt touches and the skill for the next move, in the host's own syntax, and never a
              value"
    because: "The opener's slot already keeps values out ({{d.open_is_a_slot}}); a line that carried
              values would grow with the record and preload what the work may never ask. A pointer
              costs a line, the skill it names costs the occasion, and a session that never chose to
              look is looking anyway - the record reaches the question at the moment it is asked."
    reopened_by: "a session that answers from the grounding line's ids without pulling them, the
                  line read as evidence; or hit lines on prompts the record does not touch, measured
                  on a held-out prompt set"
    seen:
      s.2026_09_10_skills_split: "read 2026-09-10"
      d.open_is_a_slot: "the session opener fills a fixed character slot, highest value per
                         character first; values never preload"
  d.html_applications_are_optional:
    from: s.2026_09_18_experimental_applications
    rests_on: [doc.applications, d.assessment_separates_findings_and_attention]
    verdict: "Page and standalone HTML documents are optional experimental applications. Ordinary
              record checks and session hooks do not render or validate their presentation."
    because: "Record semantics remain useful without an HTML runtime. Explicit application commands
              own rendering, layout validation and document copies; experimental maturity is separate
              from architectural layer."
    reopened_by: "A core read or ordinary write requires the HTML runtime, a presentation change
                  alters canonical findings, or an application runs from an unrelated request without
                  a standing preference."
    seen:
      doc.applications: "read 2026-09-18"
      d.assessment_separates_findings_and_attention: "Expose versioned recorded findings through one
                                                      assessment contract, preserve the source body
                                                      and evaluation scope, and derive task-scoped
                                                      attention separately. Keep existing reader
                                                      flags as a compatibility policy and identify
                                                      the optional typed session semantics
                                                      separately."
  d.hypotheses_read_beside_the_base:
    rests_on: [s.2026_09_03_hypotheses, d.consolidation_is_a_test, d.no_feed_of_other_branches, p.hypothesis_thresholds]
    verdict: "every command reads the hypotheses beside the record over the base - pull shows what
              each proposes, check and open say where two disagree, the opener counts what waits with
              each one's age and reach - and evaluates the base alone; the union is tested by
              consolidation, and the page draws the base"
    because: "A hypothesis laid over the base at every check would move every judgment resting on
              what it proposes, in every session, for a claim nobody has tested - the dry run is
              where that question is asked, once, with the answer in three lists. Reading it beside
              the base costs almost nothing: a proposal is a line under the value it would replace, a
              contested id is the one thing that needs a person now, and the count line says how long
              each has waited and how much rests on it without drawing a line -
              {{p.hypothesis_thresholds}} thresholds live in the code, and the count is what would
              show one creeping in."
    reopened_by: "an age or a reach past which the hypothesis line stops reporting and starts
                  deciding - a hypothesis hidden, sorted away or folded because of a number; an age
                  or a reach past which the hypothesis line stops reporting and starts deciding - a
                  hypothesis hidden, sorted away or folded because of a number; an age or a reach
                  past which the hypothesis line stops reporting and starts deciding - a hypothesis
                  hidden, sorted away or folded because of a number"
    replaced: ["the standing judgment holds, and a person takes this over it by name on 2026-09-23"]
    seen:
      s.2026_09_03_hypotheses: "read 2026-09-03"
      d.consolidation_is_a_test: "consolidating hypotheses into the base tests whether the writers
                                  worked on the same world: premises re-checked, falsifiers
                                  evaluated, contradictions stopped - as a dry run at any moment, and
                                  as a step on every pull request"
      d.no_feed_of_other_branches: "the opener adds one line - how many hypotheses wait, and for how
                                    long; nothing another branch claims is pushed into a session, it
                                    is pulled by seed or surfaces as a collision on the same id"
      p.hypothesis_thresholds: 0
  d.hypothesis_files_meet_on_one_name:
    rests_on: [s.2026_09_04_hypothesis_claim_name, s.2026_09_04_merge_driver_reason, alt.record_merge_driver, p.hypothesis_name_inputs]
    request: s.2026_09_04_hypothesis_claim_name
    verdict: "hypothesis files meet only where two branches claim the same thing under one id: the
              suggested name carries the id contradicted and a mark of the claim written, so two
              readings that disagree open two files and merge, and two that agree open one path that
              git reports as an add and an add, since each head carries the day it was born; a merge
              driver stays set aside for that meeting - the two heads say one thing, and either is
              the whole of it - never for an absence of conflicts"
    because: "This narrows what stood here rather than retiring it. That decision read the fork
              honestly: the name came from the id alone, so two branches refused on one id wrote one
              path whatever they claimed, and the meeting was two writers on one subject, repaired by
              a rename and judged by the dry run. The rename is needed now only where the writers
              disagree - a mark of the whole claim rides in the name, so different claims are
              different files that git merges, and which reading stands is put to a person as a
              contest, the question a driver would have had to answer and cannot. What is left is the
              agreeing pair, kept on purpose: one claim gets one name wherever it is written, so two
              branches that read the same thing meet on one path, and that merge asks nothing harder
              than which day's head to keep. {{p.hypothesis_name_inputs}} is what enters a name now,
              and a third - the branch, the session - would end even the meeting this keeps."
    wrong_if: "p.hypothesis_name_inputs > 2"
    seen:
      s.2026_09_04_hypothesis_claim_name: "read 2026-09-04"
      s.2026_09_04_merge_driver_reason: "read 2026-09-04"
      alt.record_merge_driver: rejected
      p.hypothesis_name_inputs: 2
  d.in_the_tree_only_what_is_reviewed:
    verdict: "in the tree only what is reviewed; ignored only what is rebuilt, in the one directory
              .kpopper/build, with a .gitignore the build writes there; state never in the tree"
    because: "{{d.record_is_code}} already says why the record and its hypotheses are committed - an
              untracked file dies with its worktree, the honest fate of a claim nobody committed -
              and the same reasoning sorts everything else: the brief, the recipes and the session
              profile are reviewed, so they are tracked; the page is rebuilt from them, so it is not;
              the parse cache, the gate's mark and the pointer to a record outside the tree are
              state, and state already lives under the user's state directory and the git common
              directory ({{d.home_beside_the_entry}}). One ignored directory that ignores itself
              leaves the project's own .gitignore untouched and rules out ignore rules per file, the
              shape that rots."
    reopened_by: "an ignore rule for the record's files anywhere but .kpopper/build/.gitignore, a
                  state file written into the tree, or a reviewed file a session found ignored"
    rests_on: [s.2026_09_12_layout, d.record_is_code, d.home_beside_the_entry]
    seen:
      s.2026_09_12_layout: "read 2026-09-12"
      d.record_is_code: "the record of what is known about the code lives in the tree - committed
                         with the work it describes, reviewed in the same pull request, checked by
                         the same CI - and a hypothesis travels with its branch; an out-of-tree
                         record holds only what the tree cannot hold, the world outside the code; a
                         user-level directory is at most an index of records, never content; a
                         session named as a source is provenance, not process"
      d.home_beside_the_entry: "everything a record keeps beside itself lives in one directory,
                                .kpopper, beside the file the reader opens first - hypotheses/,
                                view.yaml, measure.yaml, session.json, records/<head>.yaml when the
                                record divides, build/ for what is rebuilt - and a record found under
                                the earlier name keeps the earlier names beside it; the reader looks
                                in one of the two, never both"
  d.ingestion_attention_is_selective:
    rests_on: [s.background_ingestion]
    verdict: "Background ingestion retains a receipt for every event and notifies only when a
              declared condition newly fires or a review question becomes actionable. A valid move
              stays quiet; receiving a notification does not create another capture."
    because: "The purpose of parallel checking is to surface implications while allowing unrelated
              work to continue. Requiring approval for every result or turning every reached
              dependency into an alert would make ordinary maintenance interrupt the work it serves.
              Host-specific wake behavior must be stated rather than inferred from hook completion."
    reopened_by: "A routine update with a still-valid condition interrupts or wakes the primary; an
                  important retained finding disappears on a later startup; a delivered notification
                  creates another input event; or a host is advertised as waking an idle task without
                  a verified supported route."
    seen: {s.background_ingestion: "read 2026-09-09"}
  d.knowledge_map_keeps_its_detail:
    rests_on: [s.2026_09_13_readme_direction, s.2026_09_13_reasoning_overview]
    verdict: "Keep the detailed, playful knowledge-source illustration: many existing tools and
              materials on the left, an ordered record of selected reasoning on the right. Use the
              approved black-ink and electric-blue treatment with the series typography."
    because: "The maintainer retained the dense-to-ordered composition and approved its new ink
              treatment. The five source categories and varied objects preserve breadth and
              playfulness, while the typography and palette join the current series. This is a chosen
              presentation whose communication still needs reader evidence, not a demonstrated
              conversion improvement."
    reopened_by: "An uncoached reader at phone width cannot identify the crowded-to-ordered
                  contrast, or reads the illustration as a promise to migrate or automatically
                  organize every source despite its caption and surrounding explanation."
    seen:
      s.2026_09_13_readme_direction: "read 2026-09-13"
      s.2026_09_13_reasoning_overview: "read 2026-09-13"
  d.link_ends_share_one_spelling:
    from: s.2026_09_15_link_spelling
    name: "A source link is measured between two paths spelled the same way"
    rests_on: [s.2026_09_15_link_spelling]
    verdict: "Both ends are resolved before one is subtracted from the other, and the page is opened
              under the name it resolves to."
    because: "One directory is reachable under more than one name, and the two ends arrive from
              different places: a record names its sources under whichever name a person typed, while
              the location of the page is found by walking up from where the command ran. Subtracting
              one spelling from the other counts levels that do not correspond, so the link climbs
              past the root and arrives nowhere - and it arrives nowhere quietly, because a link that
              escapes the root is discarded by some readers and kept by others. Resolved on both
              sides the link stays inside the directory the two files share, which holds under either
              name, so a path with no directory link in it is unaffected."
    reopened_by: "A record needs its links to keep the name a person typed rather than the one it
                  resolves to - a page whose readers must see the authored path, or a place where the
                  resolved name is not reachable."
    seen: {s.2026_09_15_link_spelling: "read 2026-09-15"}
  d.local_claims_want_a_run:
    rests_on: [s.2026_09_04_calibration, prior.local_needs_a_run, m.claims.general_held,
               m.claims.local_checked_held, m.claims.local_assumed_held, m.reach.general_held,
               m.reach.local_checked_held, m.reach.local_assumed_held,
               m.reach.assumed_at_high_confidence]
    verdict: "a claim with reach general may rest on the session's prior; a claim with reach local
              wants a run or a document beside it, usually a five-second one"
    because: "A general claim is about how things usually work anywhere, and the session has seen
              the pattern countless times. A local claim is about this project right now, which
              training cannot know: the session guesses from what is typical, and the specific case
              is specific. Scored on one day, {{m.claims.general_held}} of 3 general claims held,
              {{m.claims.local_checked_held}} of 6 local claims checked before they were asserted
              held, and {{m.claims.local_assumed_held}} of 4 local claims assumed held - each of the
              four had felt like 0.85. Sharper than the rule: local checks are fine and cost seconds;
              local assumptions carry no information. Three counts of different sizes, thirteen
              claims in all, are too thin for a comparison between them to be an honest predicate, so
              the sign that re-opens this is read by a person. A second scoring, on a different
              instrument, put the same rule against ground written before the answers: unchecked
              claims about a project held {{m.reach.local_assumed_held}} of 75, the same questions
              with that project's files readable held {{m.reach.local_checked_held}} of 83, and
              general claims held {{m.reach.general_held}} of 84 either way, since files do not
              answer them. The gap is the rule, now over a hundred and fifty-eight claims rather
              than thirteen. What the larger count shows and the thirteen did not: asked for a
              number, a session prices an unchecked local claim low -
              {{m.reach.assumed_at_high_confidence}} of those 75 reached 0.8. So the 0.85 the four
              assumed claims of that day felt like belongs to claims volunteered while working, not
              to local claims as such, and the sign below still wants a session scored the way that
              day was rather than asked a bank of questions."
    wrong_if: "prior.local_needs_a_run < 0.8"
    reopened_by: "a later session scored the same way, on more claims than thirteen, whose assumed
                  local claims held about as often as its checked ones"
    seen:
      s.2026_09_04_calibration: "read 2026-09-04"
      prior.local_needs_a_run: 0.9
      m.claims.general_held: 3
      m.claims.local_checked_held: 6
      m.claims.local_assumed_held: 0
      m.reach.general_held: 84
      m.reach.local_checked_held: 83
      m.reach.local_assumed_held: 25
      m.reach.assumed_at_high_confidence: 0
  d.measure_names_a_recipe:
    rests_on: [s.2026_09_04_remeasure, m.remeasure.stale_green, run.page_move_three_states, d.record_is_code, p.recipe_runners]
    verdict: "an entry whose value is a fact about the tree names its recipe with measure: - a bare
              name, never a command; the recipes live beside the record as argument lists in one file
              reviewed as code, and run only on the pull request, by one runner, without a shell - so
              the record never carries a command, and no command that reads the record runs one"
    because: "check compares seen against the record's own stored value and never against the tree,
              so a value wrong about the tree passes as long as it agrees with itself:
              {{run.page_move_three_states}} counted {{m.remeasure.stale_green}} such green, on a
              reading that was fresh by its date. A recipe is the entry's own at: made runnable - the
              count behind that run already said python3 ast over the renderer, in prose - and it
              lives where {{d.record_is_code}} puts everything the tree can hold: in the tree,
              reviewed in the same pull request, checked by the same job. What the record may carry
              is a name alone, refused when it is not one or stands on anything but a stored scalar
              reading, so a data file edited in a pull request makes nothing run; the allowlist is
              the one file whose content runs, trusted as the tests are, and {{p.recipe_runners}}
              counts the places that run it - a reading command that started to would show as a
              second."
    wrong_if: "p.recipe_runners > 1"
    reopened_by: "a disagreement between the tree and the record that the pull request did not
                  report, or a crossed falsifier or a same-day disagreement that ran green - a stale
                  green counted again on an entry with a recipe - or a recipe whose line is not a
                  reading of the tree it ran on"
    seen:
      s.2026_09_04_remeasure: "read 2026-09-04"
      m.remeasure.stale_green: 1
      run.page_move_three_states: "read 2026-09-03"
      d.record_is_code: "the record of what is known about the code lives in the tree - committed
                         with the work it describes, reviewed in the same pull request, checked by
                         the same CI - and a hypothesis travels with its branch; an out-of-tree
                         record holds only what the tree cannot hold, the world outside the code; a
                         user-level directory is at most an index of records, never content; a
                         session named as a source is provenance, not process"
      p.recipe_runners: 1
  d.mention_covers_never_silences:
    rests_on: [s.2026_09_04_signals, d.falsifier_beyond_reach, d.arrangement_replaced_by_trigger]
    verdict: "prose covers what it names and never accounts for it: a mention counts for coverage,
              and a flagged judgment no section picked still falls to spill"
    because: "An arrangement's sign is drawn against what fell through, so an author who could empty
              that count by writing well would hold their own falsifier at zero - which is exactly
              what {{d.falsifier_beyond_reach}} refuses, turned on the mechanism instead of on a
              judgment. Coverage asks whether the arrangement reached a thing, and a sentence naming
              it does; the spill section asks whether the arrangement answered for its state, and
              prose shows an argument while saying nothing about the judgment being broken, unchecked
              or waiting. So the two sets part: picks account, mentions cover."
    blocked_on: "observational: falsified if the spill section fills with judgments whose reasoning
                 already stands a paragraph above it, so that readers learn to skip the section that
                 exists to be unskippable"
    seen:
      s.2026_09_04_signals: "read 2026-09-04"
      d.falsifier_beyond_reach: "a falsifier names a sign the decision itself cannot suppress; one
                                 that can only appear when people do what the decision stops offering
                                 is sealed, not falsifiable"
      d.arrangement_replaced_by_trigger: "an arrangement is replaced only when its falsifier fires,
                                          a coverage gap exists, or a person asks"
    distinct_from: d.minimal_repair
    # distinct 2026-09-04: minimal repair is how much structural change a fired trigger buys; this is what may fire one at all
  d.merge_publishes_the_release:
    rests_on: [d.release_is_its_own_pull_request, s.2026_09_13_github_releases]
    verdict: "the push that lands a version publishes it - tagged at the commit that moved the
              version, carrying that version's changelog entry and the files built from that commit"
    because: "Three versions were released in one day and left nothing to point at: no tag, no
              release, only a changelog section. And the files that reach a registry were built by
              hand from a directory nobody clears, so what a person installs was never what any check
              ran against. The commit that moved the version is the one place those two can be tied
              together, and the merge is the moment it exists - a release built anywhere else is a
              claim about a tree rather than that tree. The pull request cannot do it, because until
              it merges its commit is not on the branch anyone installs from."
    blocked_on: "observational: falsified if uploads to the registries keep using locally built
                 files instead of these, or if a version lands with the publish step red and nobody
                 notices until the next one"
    seen:
      d.release_is_its_own_pull_request: "the version moves in a release pull request of its own,
                                          computed from what merged since the last release; a feature
                                          pull request never touches it"
      s.2026_09_13_github_releases: "read 2026-09-13"
  d.named_until_read:
    rests_on: [s.2026_09_10_skills_split, d.hooks_carry_pointers]
    verdict: "an entry is named until it is read: a read leg marks the ids that passed through a
              tool's output, a read entry is silent until its body changes or the session compacts,
              and an unread one repeats after ten prompts"
    because: "Once per session went silent when a later question needed the same id; naming every
              hit repeated one id thirty times in a focused session, and a line the model learns to
              skip is worse than none. The purpose of the line is the read, so its memory follows the
              read ({{d.hooks_carry_pointers}})."
    reopened_by: "a session that read an id and is named it again within the cooldown while its body
                  did not change; or one that never reads and is named the same id more than once in
                  ten prompts"
    seen:
      s.2026_09_10_skills_split: "read 2026-09-10"
      d.hooks_carry_pointers: "the hooks are the one layer every session gets without choosing; they
                               name the entries a prompt touches and the skill for the next move, in
                               the host's own syntax, and never a value"
  d.names_rank_never_decide:
    rests_on: [s.2026_09_04_sameness, d.sameness_is_judged, alt.sameness_from_names, p.candidate_reasons]
    verdict: "a candidate pair is named for a declared reason - the same source and place, the same
              source, the same rule read through what was retired, the same premises - and the
              overlap of two names only orders a list; add says the nearest three and refuses
              nothing, the dry run says a handful per arriving id"
    because: "Each of the {{p.candidate_reasons}} reasons is read from a field a writer declared; a
              name is text nobody declared as an identity, so it ranks what the reasons found and
              adds nothing to it - the count is what would show a fifth reason creeping in, and a
              name-shaped one first. Two judgments share premises when one's are among the other's, a
              session source counting for nothing since every judgment rests on the session that
              wrote it; five judgments here rest on one document with five verdicts and are named to
              each other as pairs to judge, never refused. What arrives with a hypothesis is held
              against the base and the other arrivals; the base's own pairs were named when they were
              written, so the dry run does not list them again."
