    verdict: "the prior kind remains a source of confidence while at most one in five
              high-confidence prior-resting judgments has been refuted; beyond that share, prior.* is
              demoted to a note"
    because: "The printed count and this share read the same high-confidence judgment ids from
              priors_line: each judgment is counted once even when it rests on several priors.
