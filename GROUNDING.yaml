              instant. Each reading is separately guarded by _record_read_guard, so the old pair
              could draw a page from a newer record than the reader had just described; one guarded
              reading cannot. The reader now hands the document it read to the page build, which took
              a live open on this record from 10.66 to 5.49 seconds with byte-identical output -
              measured against e888570 before the per-document hoist merged in beside it, so that
              pair isolates this change; what the tree reads with both is lower again, and
