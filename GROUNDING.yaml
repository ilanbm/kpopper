  d.reversal_is_a_redecision:
    rests_on: [s.2026_09_04_minted_permission, s.2026_09_03_arrangements, d.reversal_is_a_question, d.contradiction_by_id_and_day]
    verdict: "a reversal is the arrangement written again under its own id - admitted in place when
              its sign holds with its tabs intact, never twice in a day - and otherwise refused into
              a hypothesis that contests it until a person folds it"
    because: "The brief cannot reverse a decision by being edited - the record's own claims fail it
              - and a new id contradicts nothing, so the same id is where a reversal lives and the
              door every same-id write goes through decides it. The sign is read only from a brief
              that still carries what the decision made: a tab deleted or gutted makes the very sign
              it would cite. One re-decision a day makes one radical change per session mechanical
              rather than remembered, and replaced: keeps each decision's born, how long it stood and
              what ended it, so a flip reads from the record alone. A session's own word that a
              person asked bought a way past all three at once - the day, the cut link and the sign -
              and the session writes that word, so it buys nothing now. {{d.reversal_is_a_question}}
              is answered where it belongs instead: the question waits in the hypothesis until the
              person answers it by folding."
    blocked_on: "observational: falsified if an arrangement flips across days by sessions each
                 citing a sign the other's repair produced, or if a gradual edit - a pick narrowed
                 until something spills - is used to manufacture the sign"
    seen:
      s.2026_09_04_minted_permission: "read 2026-09-04"
      s.2026_09_03_arrangements: "read 2026-09-03"
      d.reversal_is_a_question: "undoing an arrangement whose falsifier did not fire is a question
                                 for the person, never a change"
      d.contradiction_by_id_and_day: "a contradiction is told by the id and the day: the same id
                                      with a value read no later than the base's own reading, or with
                                      a different verdict, is refused into the base and named a
                                      hypothesis; a newer reading supersedes, a standing judgment is
                                      superseded only when its wrong_if holds; the same premises
                                      under different ids are different subjects"
  d.review_names_what_it_reads:
    rests_on: [d.reasoning_in_record, d.metrics_derived_builtin]
    verdict: "review takes a judgment's id or a section's title; an arrangement's review also
              rewrites the shape of the one tab, or of the tab serving a session source it rests on;
              nothing refreshes a snapshot by itself"
    because: "Connective text has no id, so its title is its address, and a section reviewed by
              title gets its references snapshotted the way a judgment's dependencies are. An
              arrangement's shape is its seen kept in the brief, so the same review refreshes both -
              but a brief with several tabs has to say which, and until an arrangement names its tab,
              the tab serving what the arrangement rests on is the only link the record holds.
              Refreshing any of it automatically would erase the difference a snapshot exists to
              show."
    blocked_on: "implementation: falsified the day a real brief carries two tabs serving one session
                 source, so that the link picks arbitrarily - when an arrangement has to name its
                 tab"
    seen:
      d.reasoning_in_record: "reasoning is the because of the judgment it belongs to, in the record;
                              the page's connective text lives in the brief; both resolve references
                              at build and both carry seen"
      d.metrics_derived_builtin: "graph.* and page.* are derived entries the reader computes itself
                                  - counts and shares, never stored, thresholds only inside
                                  falsifiers"
  d.review_writes_inside_the_braces:
    name: "A review writes inside the braces of a judgment written on one line"
    verdict: "A review of a judgment written on one line writes its snapshot, and the reviewed date
              it renews or adds, inside the judgment's braces: a value there is replaced where it
              stands, a new pair follows the last field - the date follows replaced - and nothing
              else on the line moves. Both writers leave the same bytes. A judgment written on one
              line without braces, such as an alias, is refused, as is a field inside the braces
              written as an alias, with an anchor or a tag, or with no value."
    because: "The writers keep a record in the style it has, and set, same and distinct already
              write into a judgment written on one line. Refusing sent the person to rewrite the
              judgment by hand before every review - the hand edit the write path exists to replace -
              and rewriting it one field per line would drop the author's form and any comment after
              the braces."
    rests_on: [d.write_path_returns_reach]
    reopened_by: "Someone rewrites by hand, one field per line, a judgment that a review grew inside
                  its braces, or asks for the review to do it, because the line has grown too long to
                  read."
    from: s.2026_09_23_one_line_review
    seen:
      d.write_path_returns_reach: "the record changes from the command line through set, add and
                                   review; each edits the file in place, writes seen itself, and
                                   answers with the reach - what rests on the write, what is MOVED
                                   now, which predicate fired; set can replace from and at together
                                   with a value using --source and --at, without reviewing dependent
                                   judgments"
  d.same_asks_the_one_door:
    rests_on: [s.2026_09_04_sameness, d.contradiction_by_id_and_day, d.sameness_is_judged, p.supersede_doors]
    verdict: "same is a migration through the record's own write path: the retired id is rewritten
              everywhere it is named - dependencies, snapshots, predicates, rules, references in
              text, the brief - the survivor takes the newer reading with its place and date, and
              where the two readings disagree with nothing to order them the migration is refused
              through the one door every same-id write goes through; check runs after, and a problem
              it did not have undoes the whole of it"
    because: "Two ids for one subject are two readings of it, and the record already has one rule
              for two readings under one id: the newer supersedes, the same day or undated is two
              writers. Asking {{p.supersede_doors}} door rather than writing a second keeps the
              migration from becoming a way to overwrite a value that add and set would refuse. The
              rewrite is by whole token across every file the record is, structural where a judgment
              named both ids and would otherwise rest on the survivor twice; the survivor carries
              also: with the retired id, so a write under the old id is refused and pointed at it.
              Check after the write is what makes a migration safe to run without reading the diff: a
              reference the rewrite missed fails there, and the files come back as they were. The
              count in p.supersede_doors is retained only as the last Python reading; it no longer
              measures places in the native reader."
    reopened_by: "Identity migration admits a replacement that the ordinary write path refuses for
                  the same held claim and reading day."
    replaced: ["the standing judgment holds, and a person takes this over it by name on 2026-09-24"]
    seen:
      s.2026_09_04_sameness: "read 2026-09-04"
      d.contradiction_by_id_and_day: "a contradiction is told by the id, the day and the base's own
                                      readings: the same id with a value read no later than the
                                      base's own reading, or with a different verdict, or with the
                                      same verdict on other grounds, is refused into the base and
                                      named a hypothesis; a newer reading supersedes and one dated
                                      after today is refused; a standing judgment is superseded only
                                      when its wrong_if holds on what the base holds; across the
                                      branch line a reading from another source with another value
                                      waits for a person to name the source; the same premises under
                                      different ids are different subjects"
      d.sameness_is_judged: "the tool never decides that two entries are the same: it shows the
                             nearest existing entries when one is written and candidates when
                             hypotheses consolidate; the writer or the merger decides, and the
                             decision is recorded - same_as as a migration that leaves the build
                             green, distinct_from as an edge that retires the pair"
      p.supersede_doors: 1
  d.serving_earned_by_picks:
    rests_on: [s.2026_09_03_coverage, d.intent_is_a_source]
    verdict: "a tab serves an intent only when its sections pick something that session recorded; a
              declaration nothing picks fails the build, and an intent that recorded nothing stands
              outside coverage"
    because: "A tab could otherwise claim every intent and serve none, and coverage would read as
              complete on a page that shows nothing a session wrote. What a session recorded is what
              comes from its source or rests on it; one pick of that earns the claim, the share says
              how much of it the tab shows. An intent with nothing recorded can be neither served nor
              unserved, so it is said once and counted nowhere - a claim on it is the one claim that
              cannot be earned."
    blocked_on: "observational: falsified if tabs come to earn their claims with a single token pick
                 - one entry of the intent, chosen to silence the failure - often enough that the
                 failure stops meaning anything"
    seen:
      s.2026_09_03_coverage: "read 2026-09-03"
      d.intent_is_a_source: "a session records what it was for as a source; a tab is a reading
