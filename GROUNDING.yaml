         final closed section immediately above the Popper banner; shorten Lean while preserving its
         technical scope and limitations."
    read: "2026-09-23"
  s.2026_09_23_session_hook:
    name: "The native ground and citation hooks work on macOS again"
    asked: "Paraphrased maintainer request: check whether the kpopper session-start hook works as it
            should, say whether what fails is a regression from the Python version, then fix both
            failures found and open a pull request."
    of: "Read from this machine's Claude Code transcripts and reproduced with the 0.9.0 plugin
         binary. Since the native runtime became the default on 2026-09-22, every ground and citation
         hook failed with 'Operation not permitted' (56 failures on 2026-09-22 and 2026-09-23;
         grounding lines on prompts fell from 5-79 a day to none), while the Python hooks wrote their
         state into the same temporary directory. The opener faults found alongside - 17,358
         characters on this record against the 2,000-character slot, so KPOPPER_AGENT_CONTEXT never
         reached the agent; a record born by add that could not be opened under a host; a consolidate
         hint that counted pending contributions - are fixed by PR #184."
  s.2026_09_23_snapshot_named_reviewed:
    name: "A snapshot named reviewed survives review in both writers"
    asked: "Paraphrased maintainer request - a record may declare schema {snapshot: reviewed}, and
            review also treats a field called reviewed as the judgment's review day. Reproduce
            outside any git repository, decide between keeping the snapshot and writing no day or
            refusing such a schema at write time, ask the maintainer to choose, make the Python and
            native writers agree, and add a test in each runtime."
    of: "Reproduced on 92703f3 outside any repository. The Python review rewrote the snapshot, then
         wrote the day over it and exited 0, and check then failed with the judgment never checked.
         The native review refused with invalid_date_field, and where the judgment had no
         dependencies it wrote the day over an empty snapshot. The maintainer chose to keep the
         snapshot and write no day."
  s.2026_09_23_unsaved_baseline:
    name: "A session-start baseline that cannot be saved no longer costs the opening"
    asked: "Paraphrased maintainer request: the native session-start hook prints nothing on stdout
            when saving the session baseline fails, so the agent loses the could-not-open line,
            KPOPPER_AGENT_CONTEXT and the environment line. Keep them as the Python opener does,
            decide from the Python reference and this record whether a failed baseline leaves no
            baseline or an empty one, and add a regression test."
    of: "Reproduced on 3454c6b with a record whose judgment rests on a name that is not an entry:
         native session-start printed nothing on stdout and the reader's diagnostic twice; the Python
         opener printed the three lines and the diagnostic once, and neither left a baseline. With an
         empty baseline put in its place, both prompt-context hooks reported the assessment
         unavailable on every prompt, and once the record read again the native one reported the
         judgment's existing failure as the session's own."
  s.2026_09_23_young_record_sections:
    name: "A record's own section names hold before its first judgment"
    asked: "Paraphrased maintainer request: shape.md and the README say section names are a
            recommendation, yet a record with no judgment yet that keeps its values under facts: is
            refused - check reports that no dependency field was found, and add cannot write the
            record's first judgment - while the same record under known: reads. Reproduce it on main
            and put the choice to the maintainer: read such sections by the shape of their entries in
            both runtimes, or keep the refusal with a message naming the schema block and document
            the limit. Then keep the two runtimes in parity, add a regression test, record the
            outcome and open a pull request."
    of: "Reproduced on a1e8ac4: the Python reader and a native build both refused a record of
         sources and facts (exit 1) and read the same record under known: (0 judgments, 3 entries); a
         schema naming only deps did not help, and one naming all three roles did. Both test suites
         pinned the refusal on purpose. Tried on fourteen young records in both runtimes, reading a
         section by its entries - each a value (a bare scalar, or v, quoted or rule) or a source -
         read the records built that way and still refused every shape of misspelled dependency; the
         one shape it newly reads that could hide a judgment, an entry holding v with a single-string
         dependency under a field the reader does not know, is one known: already read. The
         maintainer chose reading by shape. Review then found that the Python fallback dropped the
         roles a partial schema declares, so a first judgment it wrote carried seen: where the schema
         named another snapshot field and checked as never compared; it now keeps them, as native
         does."
  s.2026_09_24_source_file_references:
    name: "Source files after the Python reader was removed"
