  d.readme_story_series:
    rests_on: [s.2026_09_13_story_approval, d.readme_opens_with_what_it_does, d.readme_visual_identity, s.2026_09_13_worker_and_research]
    verdict: "Open with the approved illustrated series: shared cache and private results, download
              promise versus retention, the Cowork workshop, then a dark-matter research synthesis.
              Provide desktop and phone layouts, visible record excerpts, source links and runnable
              examples."
    because: "Two code cases expose different dependencies: a visibility assumption and a promise
              across policy and email. The workshop shows the same continuity problem when a changed
              premise requires judgment rather than an executable failure. The two-input composition
              and larger consequence scene preserve the narrative energy the maintainer preferred.
              Published examples make the green branch tests, clean merges and failed recorded
              conditions inspectable, and show that ordinary integration tests can also detect the
              problems. The research case adds constructive synthesis across papers: distinct sourced
              findings feed one judgment with its adopted framework and open questions. It uses
              selected real abstracts with locators and a runnable replay of three concurrent CLI
              writers; it does not claim live independent agent research or infer scientific truth
              from agreement."
