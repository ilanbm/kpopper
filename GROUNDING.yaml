  d.readme_opens_with_what_it_does:
    rests_on: [s.2026_09_12_first_readings, s.2026_09_13_readme_direction, d.named_for_popper, s.2026_09_13_readme_depth, s.2026_09_13_reasoning_overview, s.2026_09_13_remove_duplicate_overview]
    verdict: "Keep the hero, practical benefit, direct installation link and opening reasoning
              illustration, followed by the concrete code and non-code examples with visible
              recorded premises and phone layouts. Omit the introductory caption and link to the
              illustration-production guide. Introduce the third-brain metaphor later."
    because: "The reported reader connected with the merge scenario while the opening metaphor
              required explanation. Concrete code cases give developers a familiar entrance, and the
              following Cowork case makes the wider scope visible. Visible record excerpts expose the
              declared premises; linked guides carry complete records and executable checks.
              Descriptive headings and navigation let readers choose their depth without needing
              the philosophical references first. The opening illustration shows the mechanism;
              each full example explains its practical value. Product links lead to the examples
              and usage rather than to instructions for constructing the illustration."
    reopened_by: "A new reader given the README without coaching cannot explain what it preserves or
                  what triggers review, takes a green check as proof of arbitrary code correctness,
                  or concludes from the opening that non-code projects are unsupported. Record the
                  misunderstanding and where it arose; stopping after finding an answer is not
