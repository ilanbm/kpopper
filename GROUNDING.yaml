  d.readme_working_modes:
    from: s.2026_09_14_working_modes
    name: "Explain shared contexts, branch contexts and explicit consolidation"
    rests_on: [s.working_modes_explanation, d.readme_layered_explanation, d.consolidation_is_a_test]
    verdict: "Explain Simple as one shared context and Advanced as branch contexts plus a continuing
              path for shared findings. Show consolidation explicitly in both modes, with folding,
              refutation and unresolved proposals distinguished. Show local reads of pending findings
              separately from publication and acceptance into main."
    because: "A branch-only picture hides findings that outlive the feature which discovered them. A
              generic review box hides comparison of subjects, conflicting claims and combined
