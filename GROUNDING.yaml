    seen: {s.2026_09_23_native_ci_speed: "read 2026-09-23"}
  d.native_tests_one_pool:
    name: "The native tests run in one pool"
    verdict: "CI runs the native suite with cargo-nextest at a pinned, checksum-verified version:
              every test of every test binary in one pool, with no retries, and a standing step fails
              when nextest's listing differs from cargo's. cargo test stays the local command."
    because: "cargo test runs the test binaries one after another. On 2026-09-23 their times added
              up to the whole run phase, 8.1 minutes on linux-x86_64 and 23.3 on darwin-arm64, and a
              binary holding one slow test, such as legacy_supersede.rs at 21 to 159 seconds, left
              the other cores idle."
    rests_on: [s.2026_09_23_native_ci_speed]
    reopened_by: "A test in cargo's listing is not run in CI; a retry turns a failure green; or the
