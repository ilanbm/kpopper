  d.opener_reports_a_missing_runtime:
    name: "The session opener says when the native runtime is missing"
    verdict: "When the plugin's native runtime is missing, the session opener prints the resolver's
              diagnostic, the exact install command and what follows on standard output: kpopper did
              not open the session, hooks never download or install the runtime, and the agent may
              offer to run the command and then ask for a new session. It still exits 0. Every other
              hook prints nothing and keeps the diagnostic on standard error."
    because: "A plugin installs without its native runtime, and standard error reaches neither
              model, so the first session opened with no word about kpopper and the agent could not
              say what was missing or how to fix it. The opener runs once per session and its
              standard output is already the session's context, the channel the Python compatibility
              launcher uses for its own repair command; any other hook would repeat the text on every
              prompt or tool call. Installing stays an explicit act, because the command downloads a
              release: the opener names it and the person decides."
    rests_on: [lit.session_start_output, p.native_distribution_contract, d.plugin_runtime_is_explicit]
    reopened_by: "An agent given the opener's message says nothing of the missing runtime or runs
                  the install command without asking; a host that runs these hooks stops adding plain
                  SessionStart output to the model's context or starts showing the model standard
                  error; or a plugin installation starts carrying its native runtime."
    from: s.2026_09_23_missing_runtime_at_start
    seen:
      lit.session_start_output: "On exit 0, Claude Code and Codex both add a SessionStart command
                                 hook's plain-text standard output to the model's context, and
                                 neither shows the model its standard error. Output that opens like
                                 JSON is parsed as JSON instead."
      p.native_distribution_contract: "The native CLI and plugin start at 0.9.0 with GitHub platform
                                       archives and explicit installers. Public names are kpopper and
                                       kpop. Existing GitHub tags/releases and legacy PyPI/npm
                                       versions remain available. Cargo is a source-build route;
                                       crates.io publication is separate."
      d.plugin_runtime_is_explicit: "Prepare hook dependencies through an explicit
                                     private-virtualenv setup; Claude Code and Codex hooks select it
                                     while executing code from their active plugin."
  d.overlay_infers_once_per_document:
    rests_on: [m.overlay_open_seconds, s.2026_09_18_overlay_profile]
    verdict: "the live overlay infers roles once per document it compares, never once per entry"
    because: "knowledge_views.overlay ran provenance.infer over the whole document once per entry -
              872 times per open on a 429-entry record, 8.9 of the 11 seconds a profiled open took
              inside re.findall - to compute a per-entry meaning whose per-document half is the same
              for every entry. Memoizing that half alone took a ten-second open to 0.70 seconds with
              identical output, so the fix is to build it once per document, on first use inside the
              loop so a document that refuses still leaves the holder the old order left - not an
              inverted mention index or a cache keyed on the record bytes, which would go stale on
              hypotheses, the pending ref, the mode and the target"
    reopened_by: "a live open that runs infer more than once for the same document within one
