  d.one_implementation_ships:
    rests_on: [s.2026_09_23_python_exit, d.python_frozen_at_v0_10_0, p.product_python_modules]
    verdict: "the tree ships one reader, the native command line; what the record says about how a
              record is read is read from it, and no second implementation of the same behaviour
              lives beside it"
    because: "Two implementations of one behaviour agree only by accident and cost twice: every rule
              about how a record is read had to be written, tested and kept true in both, and the
              readings this record took of the reader's own shape - one parse of a file, one door a
              replacing write passes, one budget the opener fills - were taken from only one of them,
              so a rule could hold in the reading and not in the reader people ran. With one
              implementation a reading of it is a reading of the product.
              {{p.product_python_modules}} is what is left of the other one, counted from the tree on
              every pull request rather than asserted here, so this decision cannot quiet its own
