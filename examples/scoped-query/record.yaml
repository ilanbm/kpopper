meta:
  name: Walking club practice record
  reasoning:
    version: 2
    profile: core/v1
    requires: [arithmetic/v1, query/v1]
sources:
  s.example:
    name: Invented inputs for this exercise
    file: evidence.md
    read: '2026-09-01'
parameters:
  p.guides: {v: 2, from: s.example, at: initial group, of: '2026-09-01'}
  p.group_size: {v: 8, from: s.example, at: initial group, of: '2026-09-01'}
routes:
  route.harbor: {minutes: 10, permitted: true, from: s.example, at: route list}
  route.park: {minutes: 20, permitted: true, from: s.example, at: route list}
  route.ridge: {minutes: 15, permitted: false, from: s.example, at: route list}
scopes:
  scope.routes:
    collection_scope:
      collection: routes
      fields: [minutes, permitted]
calculations:
  m.people: {rule: {expr: 'p.guides * p.group_size'}}
  m.minutes:
    rule:
      query:
        version: 1
        scope: scope.routes
        op: sum
        where: {column: permitted}
        value: {column: minutes}
  m.weather_margin:
    rule: {expr: 'p.weather + 1'}
    blocked_on: The forecast reading has not been recorded.
decisions:
  d.route_style:
    rests_on: [p.guides]
    verdict: Favor sheltered routes for an inexperienced group.
    because: More guides help, but comfort still needs a human judgment.
    reopened_by: The organizer receives accessibility needs that change the route.
    seen: {p.guides: 2}
