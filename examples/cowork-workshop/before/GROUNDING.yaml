judgments:
  workshop.agenda:
    name: "Use the shared-kitchen agenda"
    rests_on: [workshop.format, venue.shared_kitchen, workshop.duration_minutes, workshop.recipe]
    verdict: "Use the shared-kitchen agenda and provide ingredients at the venue."
    because: "The original brief supplies a shared space; the planning pass assigns the 90-minute
              recipe sequence to it."
    reopened_by: "The format or access to the shared kitchen changes; review activities, equipment
                  and preparation."
    seen:
      workshop.format: onsite
      venue.shared_kitchen: true
      workshop.duration_minutes: 90
      workshop.recipe: "Fresh pasta with tomato sauce."
  workshop.equipment_plan:
    name: "Use the venue equipment"
    rests_on: [workshop.format, venue.equipment_supplied, venue.workstations]
    verdict: "Plan equipment around the six venue workstations."
    because: "The onsite provision supports a common equipment list. Home setups have not been
              confirmed."
    reopened_by: "The format, supplied equipment or access to the workstations changes."
    seen: {workshop.format: onsite, venue.equipment_supplied: true, venue.workstations: 6}
  workshop.group_plan:
    name: "Use six groups of three"
    rests_on: [workshop.format, workshop.participants, planning.group_size, venue.workstations]
    verdict: "Use six groups of three for the onsite practice steps."
    because: "The selected arrangement fits 18 participants and six workstations; remote
              participation may require a different arrangement."
    reopened_by: "The format, attendance, group size or available workstations changes."
    seen:
      workshop.format: onsite
      workshop.participants: 18
      planning.group_size: 3
      venue.workstations: 6
  workshop.ingredient_plan:
    name: "Prepare portions at the venue"
    rests_on: [workshop.format, venue.ingredients_supplied, workshop.participants]
    verdict: "Prepare ingredient portions at the venue for the 18 participants."
    because: "The logistics pass assumes ingredients and participants meet in the same place."
    reopened_by: "The format, ingredient provision or participant count changes; review purchasing,
                  portions and distribution."
    seen: {workshop.format: onsite, venue.ingredients_supplied: true, workshop.participants: 18}
  workshop.safety_plan:
    name: "Brief and supervise in the shared space"
    rests_on: [workshop.format, planning.instructor_view, planning.safety_topics]
    verdict: "Use a common safety demonstration with the instructor supervising the shared
              workstations."
    because: "The onsite plan assumes direct visibility of participants and shared equipment."
    reopened_by: "The format, instructor visibility or cooking setup changes; reassess the safety
                  briefing and supervision."
    seen:
      workshop.format: onsite
      planning.instructor_view: "The instructor can see all six workstations."
      planning.safety_topics: "knives; hot water; hob use"
open:
  workshop.dietary_needs:
    name: "Collect dietary restrictions"
    question: "Which dietary restrictions require changing the recipe or ingredient portions?"
  workshop.home_equipment:
    name: "Confirm home equipment"
    question: "Which cooking tools and heat sources can each remote participant safely use?"

  workshop.home_ingredients:
    name: "Arrange ingredients for remote participants"
    question: "Who purchases or supplies ingredients, and when must the list reach participants?"

  workshop.remote_activities:
    name: "Review the remote teaching format"
    question: "Which demonstration, practice and supervision steps should change for participants
               joining from home?"

