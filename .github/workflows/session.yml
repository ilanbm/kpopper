name: checked-session

on:
  workflow_call:
    inputs:
      platforms:
        description: "Runner images to check, as a JSON array."
        type: string
        default: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      audit:
        description: "On Linux, fail when the checks read a file the session lane does not declare."
        type: boolean
        default: false
  workflow_dispatch:

concurrency:
  group: checked-session-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# These tests retain the Python reference contract.
env:
  KPOPPER_RUNTIME: python

jobs:
  session:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    env:
      ELAN_TOOLCHAIN: leanprover/lean4:v4.33.1
      KPOPPER_REQUIRE_CORE_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          lake-package-directory: scripts/session/lean
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
          use-github-cache: "false"
      - name: Bind the selected toolchain across runner shells
        shell: bash
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          KPOPPER_CI_LEAN_ROOT=$(lean --print-prefix)
          if [ "$RUNNER_OS" = "Windows" ]; then
            KPOPPER_CI_LEAN_ROOT=$(cygpath -m "$KPOPPER_CI_LEAN_ROOT")
          fi
          echo "KPOPPER_LEAN_ROOT=$KPOPPER_CI_LEAN_ROOT" >> "$GITHUB_ENV"
          echo "$KPOPPER_CI_LEAN_ROOT/bin" >> "$GITHUB_PATH"
      - name: Install the session transport
        run: python -m pip install ".[session]"
      - name: Record the files the session checks open
        if: inputs.audit && runner.os == 'Linux'
        run: python .github/scripts/ci_audit.py start
      - name: Build the package's reviewed kernel
        run: kpop session setup
      - name: Check installed runtime and integration contracts
        run: |
          kpop session status
          python -m unittest discover -s tests -p 'test_session*.py' -v
          python -m unittest discover -s tests -p test_predicate_literals.py -v
          python -m unittest discover -s tests -p 'test_structured*.py' -v
          python -m unittest discover -s tests -p test_expression_authoring.py -v
          python -m unittest discover -s tests -p test_readable_expressions.py -v
          python -m unittest discover -s tests -p test_process_boundaries.py -v
          python -m unittest discover -s tests -p 'test_export*.py' -v
          python -m unittest discover -s tests -p test_assessment.py -v
      - name: Check POSIX project modes with the required core
        if: runner.os != 'Windows'
        run: |
          python -m unittest discover -s tests -p test_mode_writer_integration.py -v
          python -m unittest discover -s tests -p test_mode_reader_integration.py -v
          python -m unittest discover -s tests -p test_mode_review_regressions.py -v
          python -m unittest discover -s tests -p test_mode_assessment_integration.py -v
      - name: Audit the named theorem dependencies
        shell: bash
        run: |
          KPOPPER_PROOF_DIR=$(mktemp -d)
          lean -o "$KPOPPER_PROOF_DIR/Main.olean" scripts/session/lean/Main.lean
          LEAN_PATH="$KPOPPER_PROOF_DIR" lean scripts/session/lean/ProofAudit.lean
      - name: The session checks read only what their lane declares
        if: inputs.audit && runner.os == 'Linux' && !cancelled()
        run: python .github/scripts/ci_audit.py finish --lane session
