name: native Rust platform acceptance

on:
  workflow_call:
    inputs:
      validation:
        type: string
        default: full
      target:
        type: string
        default: all
      audit:
        description: "On Linux x86_64, fail when the checks read a file the rust lane does not declare."
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      validation:
        description: Test scope (final-fixes supplements the full 1e75c2c platform run)
        required: false
        default: full
        type: choice
        options:
          - full
          - final-fixes
          - hooks
          - distribution
      target:
        description: Platform matrix target to run
        required: false
        default: all
        type: choice
        options:
          - all
          - without-darwin-x86_64
          - windows-x86_64

permissions:
  contents: read

concurrency:
  group: native-rust-${{ github.ref }}-${{ inputs.validation == 'distribution' && github.sha || 'checks' }}
  cancel-in-progress: true

jobs:
  platform:
    # Full Intel tests, release compilation and artifact cleanup can exceed an hour.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(inputs.target == 'windows-x86_64'
            && '[{"runner":"windows-2022","target":"windows-x86_64","binary":"kpop.exe"}]'
            || inputs.target == 'without-darwin-x86_64'
            && '[{"runner":"ubuntu-24.04","target":"linux-x86_64","binary":"kpop"},{"runner":"ubuntu-24.04-arm","target":"linux-aarch64","binary":"kpop"},{"runner":"macos-14","target":"darwin-arm64","binary":"kpop"},{"runner":"windows-2022","target":"windows-x86_64","binary":"kpop.exe"}]'
            || '[{"runner":"ubuntu-24.04","target":"linux-x86_64","binary":"kpop"},{"runner":"ubuntu-24.04-arm","target":"linux-aarch64","binary":"kpop"},{"runner":"macos-14","target":"darwin-arm64","binary":"kpop"},{"runner":"macos-15-intel","target":"darwin-x86_64","binary":"kpop"},{"runner":"windows-2022","target":"windows-x86_64","binary":"kpop.exe"}]') }}
    runs-on: ${{ matrix.runner }}
    env:
      KPOPPER_CI_VALIDATION: ${{ inputs.validation || 'full' }}
      ELAN_TOOLCHAIN: leanprover/lean4:v4.33.1
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      # Match the UTF-8 contract exported by the actual shell hook launcher.
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Record the files the native checks open
        if: inputs.audit && matrix.target == 'linux-x86_64'
        run: python .github/scripts/ci_audit.py start
      - name: Validate committed reasoning runtimes and corresponding source
        id: native-source
        run: python scripts/reasoning/build_runtime.py --check-bundles
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          lake-package-directory: scripts/session/lean
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
          use-github-cache: "false"
      - name: Install and bind the Python hook reference for parity tests
        if: inputs.validation != 'distribution'
        shell: python
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable, '-m', 'pip', 'install', 'PyYAML==6.0.3', 'tzdata==2025.2'], check=True)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('KPOP_HOST_ORACLE_PYTHON=' + sys.executable + '\n')
      - name: Bind the selected Lean toolchain and record Rust
        shell: bash
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          KPOPPER_CI_LEAN_ROOT=$(lean --print-prefix)
          if [ "$RUNNER_OS" = "Windows" ]; then
            KPOPPER_CI_LEAN_ROOT=$(cygpath -m "$KPOPPER_CI_LEAN_ROOT")
          fi
          echo "KPOPPER_LEAN_ROOT=$KPOPPER_CI_LEAN_ROOT" >> "$GITHUB_ENV"
          echo "$KPOPPER_CI_LEAN_ROOT/bin" >> "$GITHUB_PATH"
          echo "KPOPPER_CI_RUSTC=$(rustc --version --verbose | tr '\n' ' ')" >> "$GITHUB_ENV"
      - name: Build the existing ordinary Lean test resource
        shell: bash
        run: |
          KPOPPER_CI_ORDINARY=$(python -c 'import os; from scripts.session.core import setup; print(setup(os.environ["KPOPPER_LEAN_ROOT"])["cache"])')
          echo "KPOP_TEST_ORDINARY_PROGRAM=$KPOPPER_CI_ORDINARY" >> "$GITHUB_ENV"
      - name: Restore Rust dependency and build cache
        id: rust-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: native-rust-${{ matrix.target }}-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: |
            native-rust-${{ matrix.target }}-
      - name: Initialize the platform evidence archive
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/native-evidence/commit.txt"
          rustc --version --verbose > "$RUNNER_TEMP/native-evidence/rustc.txt"
          printf '%s\n' "$KPOPPER_CI_VALIDATION" > "$RUNNER_TEMP/native-evidence/validation-scope.txt"
      - name: Prepare resources for native integration tests
        shell: python
        env:
          KPOPPER_CI_TARGET: ${{ matrix.target }}
        run: |
          import os, pathlib, shutil
          root = pathlib.Path.cwd()
          resources = pathlib.Path(os.environ['RUNNER_TEMP'])/'native-test-resources'
          reasoning = resources/'reasoning'
          reasoning.mkdir(parents=True)
          target = os.environ['KPOPPER_CI_TARGET']
          shutil.copy2(root/'scripts'/'reasoning'/'native'/(target + '.kpopper-runtime'), reasoning/(target + '.kpopper-runtime'))
          shutil.copytree(pathlib.Path(os.environ['KPOP_TEST_ORDINARY_PROGRAM']), resources/'ordinary'/target)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('KPOP_CONSOLIDATION_RESOURCES=' + str(resources) + '\n')
      - name: Generate Windows history group vectors with the pinned Python reference
        if: matrix.target == 'windows-x86_64' && inputs.validation != 'final-fixes' && inputs.validation != 'distribution' && inputs.validation != 'hooks'
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          temporary = pathlib.Path(os.environ['RUNNER_TEMP'])
          oracle = temporary/'native-python-oracle'
          commit = 'f480ea68f6dfd36c397388bb01844459cc578d81'
          subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', commit], check=True)
          subprocess.run(['git', 'worktree', 'add', '--detach', str(oracle), commit], check=True)
          environment = temporary/'native-oracle-python'
          subprocess.run([sys.executable, '-m', 'venv', str(environment)], check=True)
          python = environment/'Scripts'/'python.exe'
          subprocess.run([str(python), '-m', 'pip', 'install', 'PyYAML==6.0.3'], check=True)
          fixture = temporary/'native-history-group.json'
          fixture_root = str(temporary/'native-history-group-source')
          prefix = chr(92)*2 + '?' + chr(92)
          if not fixture_root.startswith(prefix):
              fixture_root = prefix + fixture_root
          subprocess.run([str(python), 'native/ci/generate_history_group_fixture.py',
              '--oracle-root', str(oracle), '--output', str(fixture),
              '--source-transaction-fixture', 'native/tests/fixtures/history-transactions.json',
              '--fixture-root', fixture_root], check=True)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('KPOP_HISTORY_GROUP_FIXTURE=' + str(fixture) + '\n')
          (temporary/'native-evidence'/'python-group-oracle-commit.txt').write_text(commit + '\n', encoding='utf-8')
      - name: Test the native implementation (${{ inputs.validation || 'full' }})
        if: inputs.validation != 'distribution'
        working-directory: native
        shell: bash
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            export GIT_TRACE2_EVENT="$RUNNER_TEMP/native-evidence/git-trace.json"
          fi
          set -euo pipefail
          {
            case "$KPOPPER_CI_VALIDATION" in
              full)
                cargo test --locked --no-fail-fast --config 'profile.test.package.sha2.opt-level=3'
                ;;
              hooks)
                cargo test --locked --config 'profile.test.package.sha2.opt-level=3' --test host_hooks --test cli_alias
                ;;
              final-fixes)
                cargo test --locked --config 'profile.test.package.sha2.opt-level=3' --lib store::locking_tests
                cargo test --locked --config 'profile.test.package.sha2.opt-level=3' --lib ingestion_orchestration::tests
                cargo test --locked --config 'profile.test.package.sha2.opt-level=3' --test cli --test public_update --test public_ingestion --test ingestion_hooks
                ;;
              *)
                echo "Unsupported validation scope: $KPOPPER_CI_VALIDATION" >&2
                exit 1
                ;;
            esac
          } 2>&1 | tee "$RUNNER_TEMP/native-evidence/native-suite.log"
      - name: Compare ingestion and branch commands with the pinned Python reference
        if: ${{ !cancelled() && matrix.target == 'linux-x86_64' && inputs.validation != 'final-fixes' && inputs.validation != 'distribution' && inputs.validation != 'hooks' }}
        shell: bash
        run: |
          set -euo pipefail
          oracle_commit=f480ea68f6dfd36c397388bb01844459cc578d81
          git fetch --no-tags --depth=1 origin "$oracle_commit"
          git worktree add --detach "$RUNNER_TEMP/native-python-oracle" "$oracle_commit"
          python -m venv "$RUNNER_TEMP/native-oracle-python"
          "$RUNNER_TEMP/native-oracle-python/bin/python" -m pip install 'PyYAML==6.0.3'
          export KPOP_SESSION_ORACLE_PYTHON="$RUNNER_TEMP/native-oracle-python/bin/python"
          export KPOP_SESSION_ORACLE_ROOT="$RUNNER_TEMP/native-python-oracle"
          export KPOPPER_NATIVE_RESOURCES="$RUNNER_TEMP/native-oracle-resources"
          export KPOP_CONSOLIDATION_RESOURCES="$KPOPPER_NATIVE_RESOURCES"
          export KPOPPER_NATIVE_CACHE="$RUNNER_TEMP/native-oracle-cache"
          mkdir -p "$KPOPPER_NATIVE_RESOURCES/reasoning" "$KPOPPER_NATIVE_RESOURCES/ordinary"
          cp scripts/reasoning/native/linux-x86_64.kpopper-runtime "$KPOPPER_NATIVE_RESOURCES/reasoning/"
          cp -R "$KPOP_TEST_ORDINARY_PROGRAM" "$KPOPPER_NATIVE_RESOURCES/ordinary/linux-x86_64"
          printf '%s\n' "$oracle_commit" > "$RUNNER_TEMP/native-evidence/python-oracle-commit.txt"
          cargo test --manifest-path native/Cargo.toml --locked --no-fail-fast --config 'profile.test.package.sha2.opt-level=3' \
            --test ingestion_target_oracle --test ingestion_cli_oracle --test public_branch_consolidation \
            -- --ignored 2>&1 | tee "$RUNNER_TEMP/native-evidence/python-oracles.log"
      - name: Retain test diagnostics before release compilation
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-test-evidence-${{ matrix.target }}
          path: ${{ runner.temp }}/native-evidence
          if-no-files-found: error
          retention-days: 7
      - name: Check Windows installer refuses repurposed public files
        if: matrix.target == 'windows-x86_64'
        run: >-
          python -m unittest -v
          tests.test_native_distribution.NativeDistribution.test_windows_installer_refuses_modified_managed_public_files
          tests.test_native_distribution.NativeDistribution.test_cargo_metadata_utf8_does_not_depend_on_process_locale
      - name: Build the platform release
        id: native-release
        if: ${{ !cancelled() && steps.native-source.outcome == 'success' && inputs.validation != 'hooks' }}
        working-directory: native
        shell: bash
        run: |
          set -o pipefail
          cargo build --locked --release 2>&1 | tee "$RUNNER_TEMP/native-evidence/release-build.log"
      - name: Copy the executable and its verified native resources
        id: native-bundle
        if: ${{ !cancelled() && steps.native-release.outcome == 'success' && steps.native-source.outcome == 'success' }}
        shell: python
        env:
          KPOPPER_CI_TARGET: ${{ matrix.target }}
          KPOPPER_CI_BINARY: ${{ matrix.binary }}
        run: |
          import os, pathlib, shutil
          root = pathlib.Path.cwd()
          bundle = pathlib.Path(os.environ['RUNNER_TEMP'])/'native-bundle'
          reasoning = bundle/'resources'/'reasoning'
          ordinary = bundle/'resources'/'ordinary'/os.environ['KPOPPER_CI_TARGET']
          reasoning.mkdir(parents=True)
          shutil.copy2(root/'native'/'target'/'release'/os.environ['KPOPPER_CI_BINARY'], bundle/os.environ['KPOPPER_CI_BINARY'])
          alias = 'kpopper.exe' if os.environ['KPOPPER_CI_TARGET'].startswith('windows-') else 'kpopper'
          shutil.copy2(root/'native'/'target'/'release'/alias, bundle/alias)
          shutil.copy2(root/'scripts'/'reasoning'/'native'/(os.environ['KPOPPER_CI_TARGET'] + '.kpopper-runtime'), reasoning/(os.environ['KPOPPER_CI_TARGET'] + '.kpopper-runtime'))
          shutil.copytree(pathlib.Path(os.environ['KPOP_TEST_ORDINARY_PROGRAM']), ordinary)
          source = reasoning/'native'
          source.mkdir()
          shutil.copy2(root/'scripts/reasoning/native/gmp-source-and-build.tar.gz', source/'gmp-source-and-build.tar.gz')
          shutil.copytree(root/'scripts/reasoning/third_party', reasoning/'notices'/'lean')
      - name: Collect Rust dependency license texts
        id: native-notices
        if: ${{ !cancelled() && steps.native-source.outcome == 'success' && (steps.native-bundle.outcome == 'success' || inputs.validation == 'hooks') }}
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          root = pathlib.Path.cwd()
          output = pathlib.Path(os.environ['RUNNER_TEMP'])/'native-bundle/resources/reasoning/notices/rust'
          compiler = subprocess.check_output(['rustc', '-vV'], cwd=root/'native', text=True)
          host = next(line.removeprefix('host: ') for line in compiler.splitlines() if line.startswith('host: '))
          subprocess.run([sys.executable, str(root/'scripts/collect_rust_licenses.py'),
              '--manifest-path', str(root/'native/Cargo.toml'), '--output', str(output), '--filter-platform', host, '--overrides', str(root/'scripts/native-licenses')],
              cwd=root/'native', check=True)
          sysroot = pathlib.Path(subprocess.check_output(['rustc', '--print', 'sysroot'], cwd=root/'native', text=True).strip())
          documentation = sysroot/'share/doc/rust'
          toolchain_notices = output.parent/'rust-toolchain'
          toolchain_notices.mkdir()
          import shutil
          shutil.copy2(documentation/'COPYRIGHT-library.html', toolchain_notices/'COPYRIGHT-library.html')
          shutil.copytree(documentation/'licenses', toolchain_notices/'licenses')
      - name: Execute copied binary through public acceptance flows
        id: native-acceptance
        if: ${{ !cancelled() && steps.native-bundle.outcome == 'success' && steps.native-notices.outcome == 'success' }}
        env:
          KPOPPER_CI_BINARY: ${{ matrix.binary }}
        run: >-
          python native/ci/platform_acceptance.py
          --binary "${{ runner.temp }}/native-bundle/${{ matrix.binary }}"
          --output "${{ runner.temp }}/native-evidence"
      - name: Retain the exercised native bundle
        if: ${{ !cancelled() && steps.native-acceptance.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-bundle-${{ matrix.target }}
          path: ${{ runner.temp }}/native-bundle
          if-no-files-found: error
          retention-days: 7
      - name: Package native command distributions
        id: native-distribution
        if: ${{ !cancelled() && steps.native-acceptance.outcome == 'success' }}
        shell: python
        env:
          KPOPPER_CI_TARGET: ${{ matrix.target }}
          KPOPPER_CI_BINARY: ${{ matrix.binary }}
        run: |
          import json, os, pathlib, subprocess, sys
          temporary = pathlib.Path(os.environ['RUNNER_TEMP'])
          bundle = temporary/'native-bundle'
          target = os.environ['KPOPPER_CI_TARGET']
          alias = 'kpopper.exe' if target.startswith('windows-') else 'kpopper'
          version = pathlib.Path('VERSION').read_text().strip()
          output = temporary/'native-distribution'
          result = subprocess.run([sys.executable, 'scripts/package_native.py',
              '--binary', str(bundle/os.environ['KPOPPER_CI_BINARY']), '--alias', str(bundle/alias),
              '--resources', str(bundle/'resources'), '--target', target,
              '--version', version, '--commit', os.environ['GITHUB_SHA'], '--output', str(output)],
              check=True, capture_output=True, text=True)
          (temporary/'native-evidence'/'distribution.json').write_text(result.stdout)
          result = json.loads(result.stdout)
          subprocess.run([sys.executable, 'native/ci/default_install_acceptance.py',
              '--archive', result['archive'], '--sha256', result['sha256'], '--version', version,
              '--target', target, '--output', str(temporary/'native-evidence'/'installed-default')], check=True)
      - name: Retain verified native distributions
        if: ${{ !cancelled() && steps.native-distribution.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-distribution-${{ matrix.target }}
          path: ${{ runner.temp }}/native-distribution
          if-no-files-found: error
          retention-days: 7
      - name: The native checks read only what their lane declares
        if: inputs.audit && matrix.target == 'linux-x86_64' && !cancelled()
        run: python .github/scripts/ci_audit.py finish --lane rust
      - name: Archive platform evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-rust-${{ matrix.target }}
          path: ${{ runner.temp }}/native-evidence
          if-no-files-found: error
      - name: Save reusable Rust dependencies after diagnostic runs
        if: ${{ !cancelled() && steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
