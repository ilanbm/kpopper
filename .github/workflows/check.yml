name: kpopper check

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Pull requests supersede older runs; main keeps one run per commit so a later
  # documentation push cannot cancel the run that covers a runtime change.
  group: check-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || github.event_name == 'workflow_dispatch' && github.run_id || 'shared' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.select.outputs.rust }}
      runtime: ${{ steps.select.outputs.runtime }}
      platforms: ${{ steps.select.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Select the lanes the change reads
        id: select
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            python .github/scripts/ci_selection.py --base "$PR_BASE" --head "$PR_HEAD"
          elif [ "$EVENT" = push ]; then
            python .github/scripts/ci_selection.py --push --base "$PUSH_BASE" --head "$PUSH_HEAD"
          else
            python .github/scripts/ci_selection.py --full
          fi
      - name: Reject incomplete committed bundles before starting expensive checks
        if: steps.select.outputs.rust == 'true' || steps.select.outputs.runtime == 'true'
        run: python scripts/reasoning/build_runtime.py --check-bundles

  record:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The pull request declares its bump
        if: github.event_name == 'pull_request' && !startsWith(github.event.pull_request.title, 'Release ')
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s\n' "$BODY" | grep -qiE '^[[:space:]]*bump[[:space:]]*:[[:space:]]*(patch|minor|major)\b'; then
            echo "bump declared"
          else
            echo "::error::Say what this change asks of the version, in the pull request body: 'Bump: patch', 'Bump: minor' or 'Bump: major' - the template carries the line."
            exit 1
          fi

      - name: Install what the CI contracts read
        run: python -m pip install -r .github/requirements-test.txt
      - name: Check skill/release contracts, CI selection and the native plumbing
        run: >-
          python -m unittest tests.test_skills tests.test_release tests.test_ci_selection
          tests.test_ci_audit tests.test_native_distribution tests.test_native_release_assets
          tests.test_native_launcher tests.test_hook_delivery -v

      # The record is read by the native kpop of this tree. A reader main built from the same
      # native/ sources is reused, so only a change under native/ pays for the build. Only a
      # push to main saves one: pull requests read main's, and keep the cache budget free.
      - name: Reuse the native reader built from these sources
        id: reader
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/kpopper-record-reader
          key: record-reader-${{ runner.os }}-${{ hashFiles('native/**') }}
      - name: Build the native reader from this tree
        if: steps.reader.outputs.cache-hit != 'true'
        # Inside native/, so that its rust-toolchain.toml selects the compiler.
        working-directory: native
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          cargo build --locked --bin kpop
          mkdir -p ~/.cache/kpopper-record-reader
          cp target/debug/kpop ~/.cache/kpopper-record-reader/kpop
      - name: Keep main's native reader for the pull requests that follow
        if: github.event_name == 'push' && steps.reader.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/kpopper-record-reader
          key: ${{ steps.reader.outputs.cache-primary-key }}
      - name: Put the native reader on PATH
        run: echo "$HOME/.cache/kpopper-record-reader" >> "$GITHUB_PATH"

      - name: The record holds together
        run: kpop --frozen check

      - name: The hypotheses beside the record still test clean on this tree
        # The dry run: the record with its hypotheses laid over it, checked. Red on a
        # contested id, a falsifier that holds, or a hole; a premise that moved under a
        # judgment is green here and blocks only the fold. On a pull request this is the
        # merged tree; on a push to main it is the second net, for two consistent pull
        # requests that contradict together.
        run: kpop --frozen consolidate --dry-run

      - name: The tree still measures what the record says
        # Every entry that names a recipe is taken again from this tree, by the argument
        # list .kpopper/measure.yaml holds for it - the one place anything from beside
        # the record runs, and only with --run. What differs is one more hypothesis through
        # the same dry run: red on a falsifier that holds on the measured value, a hole, or
        # a reading the tree contests; an older reading that moved is green, with the
        # command that refreshes it in the log.
        run: kpop --frozen remeasure --run

      - name: The experimental hub renders, and says what it rendered
        run: kpop --frozen experimental hub --verify

      - name: The committed view still matches the record it comes from
        # Rendering rewrites .kpopper/view.yaml. If that leaves a diff, the record
        # moved and the view it renders to was never regenerated alongside it.
        run: git diff --exit-code

  native-cli:
    needs: [changes, record]
    if: needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/native-rust.yml
    with:
      target: ${{ needs.changes.outputs.platforms == 'all' && 'all' || 'without-darwin-x86_64' }}
      audit: true

  reasoning-runtime:
    needs: [changes, record]
    if: needs.changes.outputs.runtime == 'true'
    uses: ./.github/workflows/reasoning-runtime.yml
    with:
      target-scope: ${{ needs.changes.outputs.platforms }}

  ci-required:
    timeout-minutes: 10
    needs: [changes, record, native-cli, reasoning-runtime]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Require every selected check to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python .github/scripts/ci_selection.py --required
