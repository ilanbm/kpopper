name: kpopper check

on:
  workflow_dispatch:
    inputs:
      release_pr:
        description: Release pull request number (leave empty for a full diagnostic run)
        type: string
        required: false
      recovery_baseline_run:
        description: Full release check with only Windows test failures (requires Windows supplement)
        type: string
        required: false
      recovery_windows_run:
        description: Successful full Windows native check after a Windows-only fixture correction
        type: string
        required: false
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# Superseded PRs cancel; a later main push must not cancel a release being validated.
concurrency:
  group: check-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      rust: ${{ steps.select.outputs.rust }}
      platforms: ${{ steps.recovery.outputs.platforms || steps.select.outputs.platforms }}
      release: ${{ steps.select.outputs.release }}
      validation: ${{ steps.recovery.outputs.validation || steps.select.outputs.validation }}
      recovery: ${{ steps.recovery.outputs.evidence_sha256 }}
      promotion: ${{ steps.candidate.outputs.promotion }}
      source: ${{ steps.candidate.outputs.source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install the workflow reader for platform selection
        run: python -m pip install PyYAML==6.0.3
      - name: Identify the candidate and its last published baseline
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/release_candidate.py --select
      - name: Validate recovery inputs before selecting checks
        env:
          BASELINE_RUN: ${{ inputs.recovery_baseline_run }}
          WINDOWS_RUN: ${{ inputs.recovery_windows_run }}
          RELEASE: ${{ steps.candidate.outputs.release }}
          RELEASE_PR: ${{ inputs.release_pr }}
        run: |
          if [ -n "$BASELINE_RUN$WINDOWS_RUN" ]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$RELEASE" = true
            test -n "$RELEASE_PR" && test -n "$BASELINE_RUN" && test -n "$WINDOWS_RUN"
          fi
      - name: Select the lanes the change reads
        id: select
        env:
          EVENT: ${{ github.event_name }}
          RELEASE: ${{ steps.candidate.outputs.release }}
          BASELINE: ${{ steps.candidate.outputs.baseline }}
          SOURCE: ${{ steps.candidate.outputs.source }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$RELEASE" = true ]; then
            python .github/scripts/ci_selection.py --release --base "$BASELINE" --head "$SOURCE"
          elif [ "$EVENT" = pull_request ]; then
            validation=full
            # Labels are maintainer-controlled. Read current labels so a label added
            # while opening the PR is visible; API failures retain full coverage.
            focused=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels \
              --jq 'any(.labels[]; .name == "ci:reader-checks")' 2>/dev/null) || focused=false
            if [ "$focused" = true ]; then validation=readers; fi
            python .github/scripts/ci_selection.py --base "$PR_BASE" --head "$PR_HEAD" --validation "$validation"
          elif [ "$EVENT" = push ]; then
            python .github/scripts/ci_selection.py --push --base "$PUSH_BASE" --head "$PUSH_HEAD"
          else
            python .github/scripts/ci_selection.py --full
          fi
      - name: Verify prior complete tests against this release source
        id: recovery
        if: inputs.recovery_baseline_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN: ${{ inputs.recovery_baseline_run }}
          WINDOWS_RUN: ${{ inputs.recovery_windows_run }}
          SOURCE: ${{ steps.candidate.outputs.source }}
          RELEASE_PR: ${{ inputs.release_pr }}
        run: >-
          python .github/scripts/release_recovery.py
          --baseline-run "$BASELINE_RUN" --windows-run "$WINDOWS_RUN"
          --source "$SOURCE" --pr "$RELEASE_PR"
          --receipt "$RUNNER_TEMP/release-recovery.json"
      - name: Retain the verified test inheritance receipt
        if: steps.recovery.outputs.validation == 'distribution'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-recovery-evidence
          path: ${{ runner.temp }}/release-recovery.json
          if-no-files-found: error
      - name: Reject incomplete committed bundles before starting expensive checks
        if: steps.select.outputs.rust == 'true'
        run: python scripts/reasoning/build_runtime.py --check-bundles

  record:
    needs: changes
    if: needs.changes.outputs.promotion != 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.changes.outputs.source }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: The pull request declares its bump
        if: github.event_name == 'pull_request' && !startsWith(github.event.pull_request.title, 'Release ')
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s\n' "$BODY" | grep -qiE '^[[:space:]]*bump[[:space:]]*:[[:space:]]*(patch|minor|major)\b'; then
            echo "bump declared"
          else
            echo "::error::Say what this change asks of the version, in the pull request body: 'Bump: patch', 'Bump: minor' or 'Bump: major' - the template carries the line."
            exit 1
          fi

      - name: Install what the CI contracts read
        run: python -m pip install -r .github/requirements-test.txt
      - name: Check skill/release contracts, CI selection and the native plumbing
        run: >-
          python -m unittest tests.test_skills tests.test_release tests.test_ci_selection
          tests.test_ci_release_flow tests.test_ci_audit tests.test_native_distribution tests.test_native_release_assets
          tests.test_native_launcher tests.test_hook_delivery tests.test_release_candidate
          tests.test_release_recovery -v
      # The record is read by the native kpop of this tree. A reader main built from the same
      # native/ sources is reused, so only a change under native/ pays for the build. Only a
      # push to main saves one: pull requests read main's, and keep the cache budget free.
      - name: Reuse the native reader built from these sources
        id: reader
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/kpopper-record-reader
          key: record-reader-${{ runner.os }}-${{ hashFiles('native/**') }}
      - name: Build the native reader from this tree
        if: steps.reader.outputs.cache-hit != 'true'
        # Inside native/, so that its rust-toolchain.toml selects the compiler.
        working-directory: native
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          cargo build --locked --bin kpop
          mkdir -p ~/.cache/kpopper-record-reader
          cp target/debug/kpop ~/.cache/kpopper-record-reader/kpop
      - name: Keep main's native reader for the pull requests that follow
        if: github.event_name == 'push' && steps.reader.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/kpopper-record-reader
          key: ${{ steps.reader.outputs.cache-primary-key }}
      - name: Put the native reader on PATH
        run: echo "$HOME/.cache/kpopper-record-reader" >> "$GITHUB_PATH"

      - name: The record holds together
        run: kpop --frozen check

      - name: The hypotheses beside the record still test clean on this tree
        # The dry run: the record with its hypotheses laid over it, checked. Red on a
        # contested id, a falsifier that holds, or a hole; a premise that moved under a
        # judgment is green here and blocks only the fold. On a pull request this is the
        # merged tree; on a push to main it is the second net, for two consistent pull
        # requests that contradict together.
        run: kpop --frozen consolidate --dry-run

      - name: The tree still measures what the record says
        # Every entry that names a recipe is taken again from this tree, by the argument
        # list .kpopper/measure.yaml holds for it - the one place anything from beside
        # the record runs, and only with --run. What differs is one more hypothesis through
        # the same dry run: red on a falsifier that holds on the measured value, a hole, or
        # a reading the tree contests; an older reading that moved is green, with the
        # command that refreshes it in the log.
        run: kpop --frozen remeasure --run

      - name: The experimental hub renders, and says what it rendered
        run: kpop --frozen experimental hub --verify

      - name: The committed view still matches the record it comes from
        # Rendering rewrites .kpopper/view.yaml. If that leaves a diff, the record
        # moved and the view it renders to was never regenerated alongside it.
        run: git diff --exit-code

  native-cli:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/native-rust.yml
    with:
      target: ${{ needs.changes.outputs.platforms }}
      validation: ${{ needs.changes.outputs.validation }}
      publish: ${{ needs.changes.outputs.release == 'true' }}
      source_ref: ${{ needs.changes.outputs.source }}
      audit: true

  candidate-checked:
    timeout-minutes: 10
    needs: [changes, record, native-cli]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Require every selected check to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python .github/scripts/ci_selection.py --required

  # Release checks finish before publication. Only this small gate is rerun afterwards.
  ci-required:
    timeout-minutes: 10
    needs: [changes, candidate-checked]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Require successful candidate checks
        env:
          RESULT: ${{ needs.candidate-checked.result }}
        run: test "$RESULT" = success
      - name: The matching runtime must be public before the plugin can merge
        if: needs.changes.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.release_pr }}
        run: python .github/scripts/release_candidate.py --verify-pr --pr "$PR"
      - name: Main is exactly the candidate already checked and published
        if: needs.changes.outputs.promotion == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/release_candidate.py --verify-main
