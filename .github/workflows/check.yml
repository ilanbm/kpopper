name: kpopper check

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.select.outputs.python }}
      documents: ${{ steps.select.outputs.documents }}
      session: ${{ steps.select.outputs.session }}
      installed: ${{ steps.select.outputs.installed }}
      native: ${{ steps.select.outputs.native }}
      test_suites: ${{ steps.select.outputs.test_suites }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Select checks from the complete change
        id: select
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            python .github/scripts/ci_selection.py --base "$PR_BASE" --head "$PR_HEAD"
          elif [ "$EVENT" = push ]; then
            python .github/scripts/ci_selection.py --push --base "$PUSH_BASE" --head "$PUSH_HEAD"
          else
            python .github/scripts/ci_selection.py --full
          fi
      - name: Reject incomplete committed bundles before starting expensive checks
        if: steps.select.outputs.installed == 'true'
        run: python scripts/reasoning/build_runtime.py --check-bundles

  record:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The pull request declares its bump
        if: github.event_name == 'pull_request' && !startsWith(github.event.pull_request.title, 'Release ')
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s\n' "$BODY" | grep -qiE '^[[:space:]]*bump[[:space:]]*:[[:space:]]*(patch|minor|major)\b'; then
            echo "bump declared"
          else
            echo "::error::Say what this change asks of the version, in the pull request body: 'Bump: patch', 'Bump: minor' or 'Bump: major' - the template carries the line."
            exit 1
          fi

      - name: Install the package the way a user gets it
        run: pip install .
      - name: Check skill/release contracts and CI selection
        run: python -m unittest tests.test_skills tests.test_release tests.test_ci_selection tests.test_ci_execution -v

      - name: The record holds together
        run: kpop --frozen check

      - name: The hypotheses beside the record still test clean on this tree
        # The dry run: the record with its hypotheses laid over it, checked. Red on a
        # contested id, a falsifier that holds, or a hole; a premise that moved under a
        # judgment is green here and blocks only the fold. On a pull request this is the
        # merged tree; on a push to main it is the second net, for two consistent pull
        # requests that contradict together.
        run: kpop --frozen consolidate --dry-run

      - name: The tree still measures what the record says
        # Every entry that names a recipe is taken again from this tree, by the argument
        # list .kpopper/measure.yaml holds for it - the one place anything from beside
        # the record runs, and only with --run. What differs is one more hypothesis through
        # the same dry run: red on a falsifier that holds on the measured value, a hole, or
        # a reading the tree contests; an older reading that moved is green, with the
        # command that refreshes it in the log.
        run: kpop --frozen remeasure --run

      - name: The page renders, and says what it rendered
        run: kpop --frozen page --verify

      - name: The committed view still matches the record it comes from
        # Rendering rewrites .kpopper/view.yaml. If that leaves a diff, the record
        # moved and the view it renders to was never regenerated alongside it.
        run: git diff --exit-code

  check:
    # Keep the existing cap until completed parallel runs establish a new bound.
    timeout-minutes: 90
    needs: [changes, record]
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.documents == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # A pull request answers for both ends of the supported range. The push
        # that lands it re-reads the merged tree once, on the version the
        # package is built against.
        python: ${{ github.event_name == 'pull_request' && fromJSON('["3.9", "3.13"]') || fromJSON('["3.13"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package the way a user gets it
        run: pip install .
      - name: Install the test runner and schema validator
        run: python -m pip install -r .github/requirements-test.txt
      - name: The reader and the page keep their contract
        env:
          TEST_SUITES: ${{ needs.changes.outputs.test_suites }}
        run: python .github/scripts/ci_execution.py --suites "$TEST_SUITES"
      - name: Keep test outcomes and per-test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-tests-${{ matrix.python }}
          path: test-results/*.xml
          if-no-files-found: ignore

  document-ui:
    timeout-minutes: 15
    needs: [changes, record]
    if: needs.changes.outputs.documents == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/document-support/package-lock.json
      - name: Install the document runtime and pinned DOM test dependency
        run: |
          pip install .
          npm ci --prefix tests/document-support --ignore-scripts --no-audit --no-fund
      - name: Check offline evidence, copy choices and export recovery
        run: npm run test:documents
      - name: Test setup leaves the source tree unchanged
        run: git diff --exit-code

  session:
    needs: [changes, record]
    if: needs.changes.outputs.session == 'true'
    uses: ./.github/workflows/session.yml
    with:
      # A pull request checks the two platforms nobody here develops on. Darwin
      # bills at ten times the Linux rate per minute, and the branch it would
      # check is the one its author runs on a Darwin machine all day; the push
      # that lands the branch checks it before anything is released from main.
      platforms: >-
        ${{ github.event_name == 'pull_request'
            && '["ubuntu-latest", "windows-latest"]'
            || '["ubuntu-latest", "macos-latest", "windows-latest"]' }}

  reasoning-runtime:
    needs: [changes, record]
    if: needs.changes.outputs.installed == 'true'
    uses: ./.github/workflows/reasoning-runtime.yml
    with:
      rebuild: ${{ needs.changes.outputs.native == 'true' }}

  ci-required:
    timeout-minutes: 10
    needs: [changes, record, check, document-ui, session, reasoning-runtime]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Require every selected check to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python .github/scripts/ci_selection.py --required
