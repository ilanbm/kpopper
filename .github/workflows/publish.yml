name: publish

# A maintainer chooses a checked candidate. Publish native downloads before exposing its plugin.
on:
  workflow_dispatch:
    inputs:
      release_pr:
        description: Release pull request number
        type: string
        required: true
      check_run:
        description: Candidate kpopper check run ID (candidate-checked must have passed)
        type: string
        required: true

permissions:
  contents: read
  actions: read
  pull-requests: read

# Publication and the release-PR refresher must never move the same candidate concurrently.
concurrency:
  group: release-candidate
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      source: ${{ steps.plan.outputs.source }}
      run_id: ${{ steps.plan.outputs.run_id }}
      gate_job: ${{ steps.plan.outputs.gate_job }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - id: plan
        name: Require the current version-only candidate and its successful checks
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.release_pr }}
          CHECK_RUN: ${{ inputs.check_run }}
        run: python .github/scripts/release_candidate.py --plan --pr "$PR" --run-id "$CHECK_RUN"

  publish:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.plan.outputs.source }}
          path: candidate
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: ${{ needs.plan.outputs.run_id }}
          github-token: ${{ github.token }}
          pattern: native-distribution-*
          path: ${{ runner.temp }}/native-artifacts
      - name: Recheck the candidate immediately before publication
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.release_pr }}
          CHECK_RUN: ${{ inputs.check_run }}
        run: python .github/scripts/release_candidate.py --plan --pr "$PR" --run-id "$CHECK_RUN"
      - name: Verify and publish the exact native distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python .github/scripts/publish_release.py --source-directory candidate
          --artifacts "${{ runner.temp }}/native-artifacts"
      - name: The anonymous runtime downloads are available
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.release_pr }}
        run: python .github/scripts/release_candidate.py --verify-pr --pr "$PR"

  merge-gate:
    needs: [plan, publish]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Recheck only the merge gate, without repeating builds or tests
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_JOB: ${{ needs.plan.outputs.gate_job }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/jobs/$GATE_JOB/rerun"

  # crates.io receives the crate from the commit the GitHub release was just made from, once
  # that release is out: the bytes the build job verified, which it checked to build from their
  # own files and to be the program the release ships. This job holds no registry identity.
  crate:
    needs: [plan, publish]
    if: needs.plan.outputs.source != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      action: ${{ steps.crate.outputs.action }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.plan.outputs.source }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: ${{ needs.plan.outputs.run_id }}
          github-token: ${{ github.token }}
          name: verified-crate
          path: ${{ runner.temp }}/verified-crate
      # A version crates.io already serves must be these bytes; one it lacks is published next.
      - id: crate
        name: Decide what crates.io takes from this commit
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: >-
          python trusted/.github/scripts/publish_crate.py --plan --version "$VERSION"
          --source-directory "$GITHUB_WORKSPACE/candidate"
          --crate "$RUNNER_TEMP/verified-crate/kpopper-$VERSION.crate"

  # The one job that can publish, so it runs as little as publishing needs: no repository
  # script, no build, and nothing that lets the repository decide how Cargo runs - Cargo runs
  # outside the checkout, on the pinned toolchain, with a Cargo home of its own. It exchanges
  # this workflow's identity for a registry token that expires within the hour. Cargo packages
  # the commit itself, so the package is compared with the verified bytes before the upload and
  # again after it. A version crates.io already serves as those bytes is left alone, so a rerun
  # after an upload whose reply was lost ends green instead of publishing twice.
  crate-publish:
    needs: [plan, crate]
    if: github.event_name == 'workflow_dispatch' && needs.crate.outputs.action == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      CRATE: kpopper-${{ needs.plan.outputs.version }}.crate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.plan.outputs.source }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: ${{ needs.plan.outputs.run_id }}
          github-token: ${{ github.token }}
          name: verified-crate
          path: ${{ runner.temp }}/verified-crate
      - id: toolchain
        name: Take no Cargo configuration or toolchain choice from the repository
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.cargo/'; then
            echo "::error::repository-local Cargo configuration would run beside the registry token"
            exit 1
          fi
          channel=$(sed -n 's/^channel = "\([0-9]*\.[0-9]*\.[0-9]*\)"$/\1/p' native/rust-toolchain.toml)
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Package the commit, and require the verified bytes
        working-directory: ${{ runner.temp }}
        env:
          CHANNEL: ${{ steps.toolchain.outputs.channel }}
          CARGO_HOME: ${{ runner.temp }}/cargo-home
        run: |
          cargo "+$CHANNEL" package --manifest-path "$GITHUB_WORKSPACE/native/Cargo.toml" --locked --no-verify
          cmp "$RUNNER_TEMP/verified-crate/$CRATE" "$GITHUB_WORKSPACE/native/target/package/$CRATE"
      - id: registry
        name: Leave alone a version crates.io already serves as these bytes
        run: |
          set -euo pipefail
          expected=$(sha256sum "$RUNNER_TEMP/verified-crate/$CRATE" | cut -d' ' -f1)
          answer=$(curl -sS -o "$RUNNER_TEMP/registry.json" -w '%{http_code}' \
            -A 'kpopper release workflow (https://github.com/ilanbm/kpopper)' \
            "https://crates.io/api/v1/crates/kpopper/$VERSION")
          case "$answer" in
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            200)
              served=$(jq -r '.version.checksum' "$RUNNER_TEMP/registry.json")
              if [ "$served" != "$expected" ]; then
                echo "::error::crates.io serves kpopper $VERSION with checksum $served, not the verified $expected"
                exit 1
              fi
              echo "crates.io already serves kpopper $VERSION as these bytes; nothing to publish"
              echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::crates.io answered $answer for kpopper $VERSION"
              exit 1 ;;
          esac
      - id: auth
        if: steps.registry.outputs.publish == 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish to crates.io
        if: steps.registry.outputs.publish == 'true'
        working-directory: ${{ runner.temp }}
        env:
          CHANNEL: ${{ steps.toolchain.outputs.channel }}
          CARGO_HOME: ${{ runner.temp }}/cargo-home
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          cargo "+$CHANNEL" publish --manifest-path "$GITHUB_WORKSPACE/native/Cargo.toml" --locked --no-verify
          cmp "$RUNNER_TEMP/verified-crate/$CRATE" "$GITHUB_WORKSPACE/native/target/package/$CRATE"

  # The registry is read back from a job without its identity: crates.io must serve exactly the
  # verified bytes. It runs after a failed upload too, since the upload may have gone through,
  # and rerunning it alone repeats the check without publishing again.
  crate-served:
    needs: [plan, crate, crate-publish]
    if: ${{ !cancelled() && needs.crate.outputs.action == 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.plan.outputs.source }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: ${{ needs.plan.outputs.run_id }}
          github-token: ${{ github.token }}
          name: verified-crate
          path: ${{ runner.temp }}/verified-crate
      - name: crates.io serves the verified bytes
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: >-
          python trusted/.github/scripts/publish_crate.py --version "$VERSION"
          --source-directory "$GITHUB_WORKSPACE/candidate"
          --served "$RUNNER_TEMP/verified-crate/kpopper-$VERSION.crate"
