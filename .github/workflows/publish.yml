name: publish

# Native releases are built and installed before the publishing job receives write access.
# The legacy PyPI/npm lines are not republished or downgraded by this workflow.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - id: plan
        name: Identify an exact native version change
        shell: python
        run: |
          import json, os, subprocess, sys
          plan = json.loads(subprocess.check_output(
              [sys.executable, '.github/scripts/publish_release.py', '--plan'], text=True))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('publish=' + str(plan['publish']).lower() + '\n')
              output.write('version=' + plan['version'] + '\n')

  build:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    uses: ./.github/workflows/native-rust.yml
    with:
      validation: distribution
      target: all

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-distribution-*
          path: ${{ runner.temp }}/native-artifacts
      - name: Verify and publish the native release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python .github/scripts/publish_release.py
          --artifacts "${{ runner.temp }}/native-artifacts"
