name: publish

# Native releases are built and installed before the publishing job receives write access,
# and the same commit's crate then goes to crates.io. The legacy PyPI/npm lines are not
# republished or downgraded by this workflow.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - id: plan
        name: Identify an exact native version change
        shell: python
        run: |
          import json, os, subprocess, sys
          plan = json.loads(subprocess.check_output(
              [sys.executable, '.github/scripts/publish_release.py', '--plan'], text=True))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('publish=' + str(plan['publish']).lower() + '\n')
              output.write('version=' + plan['version'] + '\n')

  build:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    uses: ./.github/workflows/native-rust.yml
    with:
      validation: distribution
      target: all

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-distribution-*
          path: ${{ runner.temp }}/native-artifacts
      - name: Verify and publish the native release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python .github/scripts/publish_release.py
          --artifacts "${{ runner.temp }}/native-artifacts"

  # crates.io receives the crate from the commit the GitHub release was just made from, once
  # that release is out: the bytes the build job verified, which it checked to build from their
  # own files and to be the program the release ships. This job holds no registry identity.
  crate:
    needs: [plan, build, publish]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      action: ${{ steps.crate.outputs.action }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-crate
          path: ${{ runner.temp }}/verified-crate
      # A version crates.io already serves must be these bytes; one it lacks is published next.
      - id: crate
        name: Decide what crates.io takes from this commit
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: >-
          python .github/scripts/publish_crate.py --plan --version "$VERSION"
          --crate "$RUNNER_TEMP/verified-crate/kpopper-$VERSION.crate"

  # The one job that can publish, so it runs as little as publishing needs: no repository script
  # and no build. It exchanges this workflow's identity for a registry token that expires within
  # the hour. Cargo packages the commit itself, so the package is compared with the verified
  # bytes before the upload and again after it.
  crate-publish:
    needs: [plan, crate]
    if: needs.crate.outputs.action == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      CRATE: kpopper-${{ needs.plan.outputs.version }}.crate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-crate
          path: ${{ runner.temp }}/verified-crate
      - name: Package the commit, and require the verified bytes
        working-directory: native
        run: |
          cargo package --locked --no-verify
          cmp "$RUNNER_TEMP/verified-crate/$CRATE" "target/package/$CRATE"
      - id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish to crates.io
        working-directory: native
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          cargo publish --locked --no-verify
          cmp "$RUNNER_TEMP/verified-crate/$CRATE" "target/package/$CRATE"

  # The registry is read back from a job without its identity: crates.io must serve exactly the
  # verified bytes. Rerunning this job alone repeats the check without publishing again.
  crate-served:
    needs: [plan, crate-publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-crate
          path: ${{ runner.temp }}/verified-crate
      - name: crates.io serves the verified bytes
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: >-
          python .github/scripts/publish_crate.py --version "$VERSION"
          --served "$RUNNER_TEMP/verified-crate/kpopper-$VERSION.crate"
