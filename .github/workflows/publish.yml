name: publish

# Native releases are built and installed before the publishing job receives write access,
# and the same commit's crate then goes to crates.io. The legacy PyPI/npm lines are not
# republished or downgraded by this workflow.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - id: plan
        name: Identify an exact native version change
        shell: python
        run: |
          import json, os, subprocess, sys
          plan = json.loads(subprocess.check_output(
              [sys.executable, '.github/scripts/publish_release.py', '--plan'], text=True))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('publish=' + str(plan['publish']).lower() + '\n')
              output.write('version=' + plan['version'] + '\n')

  build:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    uses: ./.github/workflows/native-rust.yml
    with:
      validation: distribution
      target: all

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-distribution-*
          path: ${{ runner.temp }}/native-artifacts
      - name: Verify and publish the native release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python .github/scripts/publish_release.py
          --artifacts "${{ runner.temp }}/native-artifacts"

  # crates.io receives the crate from the commit the GitHub release was just made from, once
  # that release is out. This job builds the crate from its packaged files alone; it holds no
  # registry identity.
  crate:
    needs: [plan, publish]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      action: ${{ steps.crate.outputs.action }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - id: crate
        name: Decide what crates.io takes from this commit
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: python .github/scripts/publish_crate.py --plan --version "$VERSION"
      - name: Build the crate from its packaged files alone
        if: steps.crate.outputs.action == 'publish'
        working-directory: native
        run: cargo package --locked
      - name: Retain the verified crate
        if: steps.crate.outputs.action == 'publish'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-crate
          path: native/target/package/kpopper-${{ needs.plan.outputs.version }}.crate
          if-no-files-found: error
          retention-days: 7

  # The one job that can publish. It exchanges this workflow's identity for a registry token
  # that expires within the hour, and uploads only the bytes the crate job verified; it
  # compiles and runs nothing from the crate.
  crate-publish:
    needs: [plan, crate]
    if: needs.crate.outputs.action == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      CRATE_FILE: native/target/package/kpopper-${{ needs.plan.outputs.version }}.crate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-crate
          path: ${{ runner.temp }}/verified-crate
      - name: Package the same files, and require the verified bytes
        run: |
          (cd native && cargo package --locked --no-verify)
          cmp "$RUNNER_TEMP/verified-crate/$(basename "$CRATE_FILE")" "$CRATE_FILE"
      # Asked again here, so that rerunning this job after an upload that went through
      # checks the served bytes instead of publishing twice.
      - id: registry
        name: Ask crates.io again whether it serves this version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: python .github/scripts/publish_crate.py --plan --version "$VERSION"
      - id: auth
        if: steps.registry.outputs.action == 'publish'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish to crates.io
        if: steps.registry.outputs.action == 'publish'
        working-directory: native
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --no-verify
      - name: crates.io serves the verified bytes
        run: python .github/scripts/publish_crate.py --served "$CRATE_FILE"
