name: publish

on:
  workflow_dispatch:
    inputs:
      release_pr:
        description: Release pull request number
        type: string
        required: true
      check_run:
        description: Candidate check run holding the verified crate
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: crate-0.13.0-publication
  cancel-in-progress: false

jobs:
  crate-publish:
    if: >-
      github.repository == 'ilanbm/kpopper' &&
      github.ref == 'refs/heads/codex/manual-crate-0.13.0' &&
      inputs.release_pr == '256' && inputs.check_run == '36069339831'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      VERSION: 0.13.0
      SOURCE: 38f28fc7e2c5d7742d0b9366fa90ea6eaaa4728a
      EXPECTED: d9467495fff3f2b58bbf0855f5ba6cfef9cbec8bccc69435520af68061aff05c
      CRATE: kpopper-0.13.0.crate
    steps:
      - name: Require the exact checked source and successful crate build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/ilanbm/kpopper/actions/runs/36069339831 > "$RUNNER_TEMP/run.json"
          workflow=$(gh api repos/ilanbm/kpopper/actions/workflows/check.yml --jq .id)
          jq -e --arg source "$SOURCE" --argjson workflow "$workflow" '.head_sha == $source and .head_branch == "release/0.13.0" and .path == ".github/workflows/check.yml" and .event == "workflow_dispatch" and .repository.full_name == "ilanbm/kpopper" and .head_repository.full_name == "ilanbm/kpopper" and .workflow_id == $workflow' "$RUNNER_TEMP/run.json"
          gh api 'repos/ilanbm/kpopper/actions/runs/36069339831/jobs?filter=latest&per_page=100' > "$RUNNER_TEMP/jobs.json"
          jq -e '.jobs | any(.name == "native-cli / release (ubuntu-24.04, linux-x86_64, kpop)" and .conclusion == "success")' "$RUNNER_TEMP/jobs.json"
          jq -e '.jobs | any(.name == "native-cli / tests (ubuntu-24.04, linux-x86_64, kpop)" and .conclusion == "success")' "$RUNNER_TEMP/jobs.json"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 38f28fc7e2c5d7742d0b9366fa90ea6eaaa4728a
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 36069339831
          github-token: ${{ github.token }}
          name: verified-crate
          path: ${{ runner.temp }}/verified-crate
      - name: Require the authorized source and artifact
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test -z "$(git status --porcelain)"
          echo "$EXPECTED  $RUNNER_TEMP/verified-crate/$CRATE" | sha256sum --check
          if git ls-files | grep -E '(^|/)\.cargo/'; then
            echo 'Repository-local Cargo configuration is not allowed during publication.' >&2
            exit 1
          fi
          rustup toolchain install 1.98.1 --profile minimal
      - name: Package the exact source and compare every byte
        working-directory: ${{ runner.temp }}
        env:
          CARGO_HOME: ${{ runner.temp }}/cargo-home
        run: |
          set -euo pipefail
          cargo +1.98.1 package --manifest-path "$GITHUB_WORKSPACE/native/Cargo.toml" --locked --no-verify
          cmp "$RUNNER_TEMP/verified-crate/$CRATE" "$GITHUB_WORKSPACE/native/target/package/$CRATE"
      - id: registry
        name: Verify ownership and avoid publishing an existing version twice
        run: |
          set -euo pipefail
          agent='kpopper release workflow (https://github.com/ilanbm/kpopper)'
          curl --fail --silent --show-error -A "$agent" https://crates.io/api/v1/crates/kpopper/owners > "$RUNNER_TEMP/owners.json"
          jq -e '[.users[].login] == ["ilanbm"]' "$RUNNER_TEMP/owners.json"
          answer=$(curl -sS -o "$RUNNER_TEMP/registry.json" -w '%{http_code}' -A "$agent" "https://crates.io/api/v1/crates/kpopper/$VERSION")
          case "$answer" in
            404) echo 'publish=true' >> "$GITHUB_OUTPUT" ;;
            200)
              jq -e --arg expected "$EXPECTED" '.version.checksum == $expected and .version.yanked == false' "$RUNNER_TEMP/registry.json"
              echo 'publish=false' >> "$GITHUB_OUTPUT" ;;
            *) echo "crates.io answered $answer" >&2; exit 1 ;;
          esac
      - id: auth
        if: steps.registry.outputs.publish == 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
      - name: Publish the verified crate through Trusted Publishing
        if: steps.registry.outputs.publish == 'true'
        working-directory: ${{ runner.temp }}
        env:
          CARGO_HOME: ${{ runner.temp }}/cargo-home
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          cargo +1.98.1 publish --manifest-path "$GITHUB_WORKSPACE/native/Cargo.toml" --locked --no-verify
          cmp "$RUNNER_TEMP/verified-crate/$CRATE" "$GITHUB_WORKSPACE/native/target/package/$CRATE"
      - name: Verify the registry checksum and the publicly downloaded bytes
        if: ${{ !cancelled() }}
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          agent='kpopper release workflow (https://github.com/ilanbm/kpopper)'
          curl --fail --silent --show-error --retry 5 --retry-all-errors -A "$agent" "https://crates.io/api/v1/crates/kpopper/$VERSION" > registry-served.json
          jq -e --arg expected "$EXPECTED" '.version.checksum == $expected and .version.yanked == false' registry-served.json
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors -A "$agent" "https://crates.io/api/v1/crates/kpopper/$VERSION/download" -o served.crate
          echo "$EXPECTED  served.crate" | sha256sum --check
