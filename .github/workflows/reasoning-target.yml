name: reasoning target

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      target:
        type: string
        required: true
      validate-candidate:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 60
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare the Windows GMP build tools
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: mingw-w64-x86_64-gcc make m4 diffutils
      - name: Bind the Windows compiler tools
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: echo "KPOPPER_MSYS2_ROOT=$(cygpath -m /)" >> "$GITHUB_ENV"
      - name: Identify the exact dependency build inputs
        id: dependency-key
        run: python scripts/reasoning/build_runtime.py --target ${{ inputs.target }} --dependency-cache-key
      - name: Restore verified dependency prefixes and pinned downloads
        id: dependencies
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/reasoning-dependencies
          key: reasoning-dependencies-v1-${{ inputs.target }}-${{ steps.dependency-key.outputs.key }}
      - name: Compile and audit the candidate on POSIX
        if: runner.os != 'Windows'
        run: >-
          python scripts/reasoning/build_runtime.py
          --target ${{ inputs.target }}
          --work-dir '${{ runner.temp }}/reasoning-build'
          --dependency-cache '${{ runner.temp }}/reasoning-dependencies'
          --source-bundle scripts/reasoning/native/gmp-source-and-build.tar.gz
          --replacement-library '${{ runner.temp }}/replacement/${{ inputs.target }}.library'
      - name: Compile and audit the candidate on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: >-
          KPOPPER_MSYS2_ROOT="$(cygpath -m /)"
          python scripts/reasoning/build_runtime.py
          --target ${{ inputs.target }}
          --work-dir '${{ runner.temp }}/reasoning-build'
          --dependency-cache '${{ runner.temp }}/reasoning-dependencies'
          --source-bundle scripts/reasoning/native/gmp-source-and-build.tar.gz
          --replacement-library '${{ runner.temp }}/replacement/${{ inputs.target }}.library'
      - name: Save successfully built dependencies before running integration checks
        if: steps.dependencies.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/reasoning-dependencies
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Exercise the freshly built runtime and execute the replacement GMP
        working-directory: native
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
          KPOPPER_REQUIRE_GMP_REPLACEMENT_PROBE: "1"
          KPOPPER_GMP_REPLACEMENT_LIBRARY: ${{ runner.temp }}/replacement/${{ inputs.target }}.library
        run: cargo test --locked --test reasoning_runtime
      - name: Upload immutable target candidate
        uses: actions/upload-artifact@v4
        with:
          name: reasoning-${{ inputs.target }}
          path: |
            scripts/reasoning/native/${{ inputs.target }}.kpopper-runtime
            scripts/reasoning/native/${{ inputs.target }}.kpopper-runtime.sha256
          if-no-files-found: error
      - name: Upload the separately modified test library
        uses: actions/upload-artifact@v4
        with:
          name: gmp-replacement-${{ inputs.target }}
          path: ${{ runner.temp }}/replacement/${{ inputs.target }}.library
          if-no-files-found: error
      - name: Upload the shared corresponding-source archive
        if: inputs.target == 'linux-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: reasoning-corresponding-source
          path: scripts/reasoning/native/gmp-source-and-build.tar.gz
          if-no-files-found: error

  candidate-validation:
    timeout-minutes: 10
    needs: build
    # Validate the exact candidate and replacement library produced for this target.
    if: inputs.validate-candidate && needs.build.result == 'success'
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: reasoning-${{ inputs.target }}
          path: ${{ runner.temp }}/candidate
      - name: Verify the downloaded candidate archive and sidecar
        shell: python
        env:
          TARGET: ${{ inputs.target }}
        run: |
          import hashlib, os, pathlib
          archive = pathlib.Path(os.environ['RUNNER_TEMP'])/'candidate'/(os.environ['TARGET'] + '.kpopper-runtime')
          expected, name = pathlib.Path(str(archive) + '.sha256').read_text(encoding='ascii').strip().split(maxsplit=1)
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          if name != archive.name or actual != expected:
              raise SystemExit('downloaded reasoning candidate does not match its build sidecar')
