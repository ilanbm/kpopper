name: reasoning-runtime

on:
  workflow_call:
    inputs:
      rebuild:
        type: boolean
        required: true
  workflow_dispatch:

concurrency:
  group: reasoning-runtime-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: inputs.rebuild || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, target: linux-x86_64}
          - {runner: ubuntu-24.04-arm, target: linux-aarch64}
          - {runner: macos-15, target: darwin-arm64}
          - {runner: macos-15-intel, target: darwin-x86_64}
          - {runner: windows-2022, target: windows-x86_64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare the Windows GMP build tools
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: mingw-w64-x86_64-gcc make m4 diffutils
      - name: Compile and audit the candidate on POSIX
        if: runner.os != 'Windows'
        run: >-
          python scripts/reasoning/build_runtime.py
          --target ${{ matrix.target }}
          --work-dir '${{ runner.temp }}/reasoning-build'
          --source-bundle scripts/reasoning/native/gmp-source-and-build.tar.gz
          --replacement-library '${{ runner.temp }}/replacement/${{ matrix.target }}.library'
      - name: Compile and audit the candidate on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: >-
          KPOPPER_MSYS2_ROOT="$(cygpath -m /)"
          python scripts/reasoning/build_runtime.py
          --target ${{ matrix.target }}
          --work-dir '${{ runner.temp }}/reasoning-build'
          --source-bundle scripts/reasoning/native/gmp-source-and-build.tar.gz
          --replacement-library '${{ runner.temp }}/replacement/${{ matrix.target }}.library'
      - name: Check archive boundaries
        run: python -m unittest tests.test_reasoning_distribution -v
      - name: Execute the freshly built archive against the source scalar corpus
        run: python tests/test_reasoning_distribution.py --archive scripts/reasoning/native/${{ matrix.target }}.zip
      - name: Execute the freshly built archive against composition conformance
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          sys.path.insert(0, str(pathlib.Path.cwd()))
          from scripts.reasoning.runtime import Runtime
          archive = pathlib.Path('scripts/reasoning/native/${{ matrix.target }}.zip').resolve()
          native = Runtime(archive)
          env = dict(os.environ,
                     KPOPPER_REASONING_TEST_BINARY=str(native.binary),
                     KPOPPER_REQUIRE_REASONING_TESTS='1')
          subprocess.run([sys.executable, '-m', 'unittest',
                          'tests.test_reasoning_composition_kernel',
                          'tests.test_reasoning_composition_review'],
                         env=env, check=True)
      - name: Install the core source-reader dependency for query acceptance
        run: python -m pip install PyYAML
      - name: Execute the freshly built archive against query conformance
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          archive = pathlib.Path('scripts/reasoning/native/${{ matrix.target }}.zip').resolve()
          env = dict(os.environ, KPOPPER_QUERY_ARCHIVE=str(archive))
          subprocess.run([sys.executable, '-m', 'unittest',
                          'tests.test_reasoning_query_runtime', '-v'],
                         env=env, check=True)
      - name: Upload immutable target candidate
        uses: actions/upload-artifact@v4
        with:
          name: reasoning-${{ matrix.target }}
          path: |
            scripts/reasoning/native/${{ matrix.target }}.zip
            scripts/reasoning/native/${{ matrix.target }}.zip.sha256
          if-no-files-found: error
      - name: Upload the separately modified test library
        uses: actions/upload-artifact@v4
        with:
          name: gmp-replacement-${{ matrix.target }}
          path: ${{ runner.temp }}/replacement/${{ matrix.target }}.library
          if-no-files-found: error
      - name: Upload the shared corresponding-source archive
        if: matrix.target == 'linux-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: reasoning-corresponding-source
          path: scripts/reasoning/native/gmp-source-and-build.tar.gz
          if-no-files-found: error

  installed:
    needs: build
    # A packaging-only change tests the committed binaries without a compiler build.
    # A requested build must succeed before testing replacement libraries from it.
    if: >-
      !cancelled() &&
      (needs.build.result == 'success' ||
       (needs.build.result == 'skipped' && !inputs.rebuild && github.event_name != 'workflow_dispatch'))
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2022]
        # setup-python has no Darwin arm64 CPython3.9 artifact. The minimum
        # Python version is exercised on Intel macOS and both Linux CPUs.
        exclude:
          - {runner: macos-15, python: '3.9'}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Test the committed package data. Fresh candidate artifacts must first be
      # reviewed and copied into source; downloads cannot substitute their bytes.
      - name: Check completeness and integrity of committed runtime bundles
        run: python scripts/reasoning/build_runtime.py --check-bundles
      - uses: actions/download-artifact@v4
        if: needs.build.result == 'success'
        with:
          pattern: gmp-replacement-*
          merge-multiple: true
          path: ${{ runner.temp }}/replacement
      - name: Build the ordinary portable wheel and source distribution
        run: |
          python -m pip install build
          python -m build
      - name: Install each distribution and execute with cold caches and no compiler PATH
        shell: python
        env:
          KPOPPER_TEST_REPLACEMENT_ROOT: ${{ needs.build.result == 'success' && format('{0}/replacement', runner.temp) || '' }}
        run: |
          import os, pathlib, shutil, subprocess, sys, tempfile, zipfile
          root = pathlib.Path.cwd()
          work = pathlib.Path(tempfile.mkdtemp(prefix='reasoning-install-'))
          for kind, artifact in [('wheel', next((root/'dist').glob('*.whl'))), ('sdist', next((root/'dist').glob('*.tar.gz')))]:
              env = work/kind
              subprocess.run([sys.executable, '-m', 'venv', str(env)], check=True)
              python = env/('Scripts/python.exe' if sys.platform == 'win32' else 'bin/python')
              subprocess.run([str(python), '-m', 'pip', 'install', str(artifact)], check=True)
              subprocess.run([sys.executable, 'tests/test_reasoning_distribution.py', '--installed-python', str(python)], check=True)
              subprocess.run([sys.executable, 'tests/test_reasoning_composition_acceptance.py',
                              '--installed-python', str(python)], check=True)
          # Extract a real plugin tree into a separate directory, with the same
          # native assets. Use only its own source modules for the plugin probe.
          plugin_stage = work/'plugin-stage'
          shutil.copytree(root, plugin_stage, ignore=shutil.ignore_patterns('.git', '.lake', 'dist', '__pycache__'))
          archive = shutil.make_archive(str(work/'plugin'), 'zip', plugin_stage)
          plugin = work/'plugin-extracted'
          with zipfile.ZipFile(archive) as zf:
              zf.extractall(plugin)
          subprocess.run([sys.executable, 'tests/test_reasoning_distribution.py', '--installed-python', str(python), str(plugin)], check=True)
          subprocess.run([sys.executable, 'tests/test_reasoning_composition_acceptance.py',
                          '--installed-python', str(python), '--plugin-root', str(plugin)], check=True)
          # Make the native oracle/framing suites and schema validation mandatory.
          # The executable comes from the installed, committed package payload.
          subprocess.run([str(python), '-m', 'pip', 'install', 'jsonschema',
                          'tiktoken>=0.14,<1'], check=True)
          suite_env = dict(os.environ, XDG_CACHE_HOME=str(work/'native-suite-cache'),
                           KPOPPER_REQUIRE_REASONING_TESTS='1', KPOPPER_REQUIRE_CORE_TESTS='1')
          binary = subprocess.check_output([str(python), '-c', 'from kpopper.reasoning.runtime import Runtime; print(Runtime().binary)'],
                                           env=suite_env, text=True).strip()
          suite_env['KPOPPER_REASONING_TEST_BINARY'] = binary
          subprocess.run([str(python), '-m', 'unittest', 'discover', '-s', 'tests', '-p', 'test_reasoning*.py'],
                         cwd=root, env=suite_env, check=True)
