name: reasoning-runtime

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/reasoning/**
      - tests/test_reasoning*.py
      - pyproject.toml
      - .github/workflows/reasoning-runtime.yml

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, target: linux-x86_64}
          - {runner: ubuntu-24.04-arm, target: linux-aarch64}
          - {runner: macos-15, target: darwin-arm64}
          - {runner: macos-15-intel, target: darwin-x86_64}
          - {runner: windows-2022, target: windows-x86_64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare the Windows GMP build tools
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: mingw-w64-x86_64-gcc make m4 diffutils
      - name: Compile and audit the candidate on POSIX
        if: runner.os != 'Windows'
        run: >-
          python scripts/reasoning/build_runtime.py
          --target ${{ matrix.target }}
          --work-dir '${{ runner.temp }}/reasoning-build'
          --source-bundle scripts/reasoning/native/gmp-source-and-build.tar.gz
          --replacement-library '${{ runner.temp }}/replacement/${{ matrix.target }}.library'
      - name: Compile and audit the candidate on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: >-
          python scripts/reasoning/build_runtime.py
          --target ${{ matrix.target }}
          --work-dir '${{ runner.temp }}/reasoning-build'
          --source-bundle scripts/reasoning/native/gmp-source-and-build.tar.gz
          --replacement-library '${{ runner.temp }}/replacement/${{ matrix.target }}.library'
      - name: Check archive boundaries
        run: python -m unittest tests.test_reasoning_distribution -v
      - name: Upload immutable target candidate
        uses: actions/upload-artifact@v4
        with:
          name: reasoning-${{ matrix.target }}
          path: |
            scripts/reasoning/native/${{ matrix.target }}.zip
            scripts/reasoning/native/${{ matrix.target }}.zip.sha256
          if-no-files-found: error
      - name: Upload the separately modified test library
        uses: actions/upload-artifact@v4
        with:
          name: gmp-replacement-${{ matrix.target }}
          path: ${{ runner.temp }}/replacement/${{ matrix.target }}.library
          if-no-files-found: error
      - name: Upload the shared corresponding-source archive
        if: matrix.target == 'linux-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: reasoning-corresponding-source
          path: scripts/reasoning/native/gmp-source-and-build.tar.gz
          if-no-files-found: error

  installed:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          pattern: reasoning-*
          merge-multiple: true
          path: scripts/reasoning/native
      - uses: actions/download-artifact@v4
        with:
          pattern: gmp-replacement-*
          merge-multiple: true
          path: ${{ runner.temp }}/replacement
      - name: Build the ordinary portable wheel and source distribution
        run: |
          python -m pip install build
          python -m build
      - name: Install each distribution and execute with cold caches and no compiler PATH
        shell: python
        env:
          KPOPPER_TEST_REPLACEMENT_ROOT: ${{ runner.temp }}/replacement
        run: |
          import pathlib, shutil, subprocess, sys, tempfile, zipfile
          root = pathlib.Path.cwd()
          work = pathlib.Path(tempfile.mkdtemp(prefix='reasoning-install-'))
          for kind, artifact in [('wheel', next((root/'dist').glob('*.whl'))), ('sdist', next((root/'dist').glob('*.tar.gz')))]:
              env = work/kind
              subprocess.run([sys.executable, '-m', 'venv', str(env)], check=True)
              python = env/('Scripts/python.exe' if sys.platform == 'win32' else 'bin/python')
              subprocess.run([str(python), '-m', 'pip', 'install', str(artifact)], check=True)
              subprocess.run([sys.executable, 'tests/test_reasoning_distribution.py', '--installed-python', str(python)], check=True)
          # Extract a real plugin tree into a separate directory, with the same
          # native assets. Use only its own source modules for the plugin probe.
          plugin_stage = work/'plugin-stage'
          shutil.copytree(root, plugin_stage, ignore=shutil.ignore_patterns('.git', '.lake', 'dist', '__pycache__'))
          archive = shutil.make_archive(str(work/'plugin'), 'zip', plugin_stage)
          plugin = work/'plugin-extracted'
          with zipfile.ZipFile(archive) as zf:
              zf.extractall(plugin)
          subprocess.run([sys.executable, 'tests/test_reasoning_distribution.py', '--installed-python', str(python), str(plugin)], check=True)
