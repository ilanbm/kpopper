name: reasoning-runtime

on:
  workflow_call:
    inputs:
      rebuild:
        type: boolean
        required: true
      target-scope:
        type: string
        default: all
  workflow_dispatch:
    inputs:
      target-scope:
        description: "Platform scope for this validation run."
        type: choice
        options: [all, pull-request]
        default: all
      candidate-only:
        description: "Build replacement candidates before committing updated bundles; omit installed validation."
        type: boolean
        default: false

concurrency:
  group: reasoning-runtime-${{ github.ref }}-${{ github.event_name }}-${{ inputs.target-scope }}-${{ inputs.candidate-only }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate committed bundles before provisioning the platform matrix
        if: github.event_name != 'workflow_dispatch' || !inputs.candidate-only
        run: python scripts/reasoning/build_runtime.py --check-bundles

  target:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(inputs.target-scope == 'pull-request'
            && '[{"runner":"ubuntu-24.04","target":"linux-x86_64"},{"runner":"ubuntu-24.04-arm","target":"linux-aarch64"},{"runner":"macos-15","target":"darwin-arm64"},{"runner":"windows-2022","target":"windows-x86_64"}]'
            || '[{"runner":"ubuntu-24.04","target":"linux-x86_64"},{"runner":"ubuntu-24.04-arm","target":"linux-aarch64"},{"runner":"macos-15","target":"darwin-arm64"},{"runner":"macos-15-intel","target":"darwin-x86_64"},{"runner":"windows-2022","target":"windows-x86_64"}]') }}
    uses: ./.github/workflows/reasoning-target.yml
    with:
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      target-scope: ${{ inputs.target-scope }}
      rebuild: ${{ inputs.rebuild || github.event_name == 'workflow_dispatch' }}
      validate-candidate: ${{ github.event_name != 'workflow_dispatch' || !inputs.candidate-only }}
