name: reasoning-runtime

on:
  workflow_call:
    inputs:
      rebuild:
        type: boolean
        required: true
  workflow_dispatch:
    inputs:
      candidate-only:
        description: "Build replacement candidates before committing updated bundles; omit installed validation."
        type: boolean
        default: false

concurrency:
  group: reasoning-runtime-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate committed bundles before provisioning the platform matrix
        if: github.event_name != 'workflow_dispatch' || !inputs.candidate-only
        run: python scripts/reasoning/build_runtime.py --check-bundles

  target:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, target: linux-x86_64, pythons: '["3.9", "3.13"]'}
          - {runner: ubuntu-24.04-arm, target: linux-aarch64, pythons: '["3.9", "3.13"]'}
          - {runner: macos-15, target: darwin-arm64, pythons: '["3.13"]'}
          - {runner: macos-15-intel, target: darwin-x86_64, pythons: '["3.9", "3.13"]'}
          - {runner: windows-2022, target: windows-x86_64, pythons: '["3.9", "3.13"]'}
    uses: ./.github/workflows/reasoning-target.yml
    with:
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      python-versions: ${{ matrix.pythons }}
      rebuild: ${{ inputs.rebuild || github.event_name == 'workflow_dispatch' }}
      validate-installed: ${{ github.event_name != 'workflow_dispatch' || !inputs.candidate-only }}
