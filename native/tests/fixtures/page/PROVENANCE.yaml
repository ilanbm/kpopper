meta:
  updated: 2026-09-03
  name: Greenhouse
  scope: "Whether the old boiler can hold the greenhouse above 12°C through February -
          one session, one arrangement, every field the page reads."

sources:
  s.2026_09_02_heating:
    asked: "Can we keep the greenhouse above 12°C through February on the old boiler?"
    name: "the heating question, as this session read it: a shortfall in kilowatts, not a
           yes or no"
    of: "this session"
    read: "2026-09-02"
  s.2026_09_03_glazing:
    asked: "What would glazing the north wall cost, and how much of the shortfall would it close?"
    name: "the glazing question, as this session read it: a price and a kilowatt figure, not a yes
           or no"
    of: "this session"
    read: "2026-09-03"
  doc.boiler_sheet:
    name: "the boiler's service sheet"
    file: "boiler/service-2025.pdf"
    read: "2026-09-02"

known:
  glaze.north_wall_m2:
    v: 18
    unit: m2
    name: "north wall, the area a glazier would cover"
    from: s.2026_09_03_glazing
    at: "measured on site during the session"
    measure: north_wall
  glaze.quote_eur:
    v: 2400
    unit: EUR
    name: "the glazier's quote for the north wall"
    from: s.2026_09_03_glazing
    at: "the quote of 2026-09-03"
  glaze.saving_kw:
    v: 4
    unit: kW
    name: "loss the glazing would stop on the coldest night"
    from: s.2026_09_03_glazing
    at: "the glazier's U-value against the wall's"
  heat.boiler_kw:
    v: 24
    unit: kW
    name: "boiler output"
    from: doc.boiler_sheet
  heat.loss_kw:
    v: 31
    unit: kW
    name: "heat loss on a -5°C night"
    from: s.2026_09_02_heating
    at: "worked out from the glazing area during the session"
  heat.deficit_kw:
    rule: "heat.loss_kw - heat.boiler_kw"
    name: "shortfall on the coldest night"
  when.first_cold_night:
    v: "2027-02-01"
    name: "first night that matters"
    from: s.2026_09_02_heating

open:
  q.second_boiler: "is a second boiler cheaper than glazing the north wall?"

judgments:
  c.boiler_short:
    rests_on: [heat.boiler_kw, heat.loss_kw, heat.deficit_kw]
    verdict: "the old boiler cannot hold 12°C on the coldest February night"
    because: "It gives {{heat.boiler_kw}} kW against a loss of {{heat.loss_kw}} kW - a
              shortfall of {{heat.deficit_kw}} kW before any wind."
    wrong_if: "heat.loss_kw <= heat.boiler_kw"
    seen: {heat.boiler_kw: 24, heat.loss_kw: 31,
           heat.deficit_kw: "heat.loss_kw - heat.boiler_kw"}
  v.glazing_tab:
    rests_on: [s.2026_09_03_glazing, page.unserved]
    verdict: "a second tab, for the day the quote is read"
    because: "The glazing question is asked on a different day from the February night, so it gets
              its own occasion; the two merge the day a judgment on one tab rests on the other's
              numbers."
    wrong_if: "page.unserved > 0"
    born: "2026-09-03"
    seen: {s.2026_09_03_glazing: "read 2026-09-03", page.unserved: 0}
  v.heating_tab:
    rests_on: [s.2026_09_02_heating, graph.flagged, page.spill]
    verdict: "one tab, for the night the greenhouse is decided on"
    because: "Everything recorded so far serves one question; a second tab earns its place
              when an intent lands outside this one."
    wrong_if: "page.spill > 0"
    born: "2026-09-02"
    seen: {s.2026_09_02_heating: "read 2026-09-02", graph.flagged: 0, page.spill: 0}
