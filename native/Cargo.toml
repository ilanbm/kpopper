[package]
name = "kpopper"
version = "0.11.0"
edition = "2024"
rust-version = "1.98"
description = "An epistemic record for work that gets revisited: what is known, how each piece is grounded, and what would make each judgment wrong. Installs the kpop and kpopper commands."
license = "MIT"
repository = "https://github.com/ilanbm/kpopper"
readme = "README.md"
keywords = ["provenance", "epistemic", "falsifiability", "truth-maintenance", "traceability"]
categories = ["command-line-utilities", "development-tools"]
# The published crate: what the build reads, and the licence texts. The test suites,
# their fixtures and the CI helpers stay in the repository.
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/build.rs",
    "/README.md",
    "/LICENSE",
    "/src/**",
    "/shared/**",
    "/third_party/**",
]
autobins = false

[lib]
name = "kpop_native"

[[bin]]
name = "kpop"
path = "src/main.rs"

[[bin]]
name = "kpopper"
path = "src/alias.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "unbounded_depth", "raw_value"] }
base64 = "0.22"
tempfile = "3"
libyaml-safer = "0.3"
num-bigint = "0.4"
regex = "1"
ryu = "1"
sha2 = "0.10"
sha1 = "0.10"
zip = { version = "6", default-features = false, features = ["deflate"] }
rustpython-parser = { version = "0.4", default-features = false, features = ["num-bigint"] }
unicode-normalization = "0.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4"] }
tiktoken-rs = "0.12.0"
same-file = "1"
html5ever = "0.35"
markup5ever_rcdom = "0.35"
cssparser = "0.35"
unicode-casefold = "0.2.0"
rusqlite = { version = "0.37", features = ["bundled"] }
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }
tract-onnx = "=0.22.4"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }
nix = { version = "0.30", default-features = false, features = ["signal", "process"] }

[build-dependencies]
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Launcher attestation hashes complete runtime artifacts under bounded deadlines.
# Keep development/test hashing aligned with the platform acceptance builds.
[profile.dev.package.sha2]
opt-level = 3

[profile.test.package.sha2]
opt-level = 3

[dev-dependencies]
shlex = "1.3.0"
