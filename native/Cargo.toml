[package]
name = "kpop-native"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "unbounded_depth", "raw_value"] }
base64 = "0.22"
tempfile = "3"
libyaml-safer = "0.3"
num-bigint = "0.4"
regex = "1"
ryu = "1"
sha2 = "0.10"
zip = { version = "6", default-features = false, features = ["deflate"] }
rustpython-parser = { version = "0.4", default-features = false, features = ["num-bigint"] }
unicode-normalization = "0.1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", default-features = false, features = ["signal", "process"] }

[build-dependencies]
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
