meta:
  updated: 2026-09-11
  name: Two domains
  scope: "What the standup needs and what the room has: the same record as one file and as
          two shards under a pointer, so both can be held to the same answer."

sources:
  mtg.minutes:
    name: "the standup minutes"
    file: "meetings/standup-2026-09.md"
    read: "2026-09-10"
  room.plan:
    name: "the floor plan the building gave us"
    file: "rooms/floor-2.pdf"
    read: "2026-09-09"

known:
  mtg.attendees:
    v: 14
    name: "people at the standup"
    from: mtg.minutes
    at: "the attendance line of 2026-09-10"
  room.seats:
    v: 12
    name: "seats in the room"
    from: room.plan
    at: "floor 2, the corner room"
  room.spare:
    rule: "room.seats - mtg.attendees"
    name: "seats left over once everyone is in"

open:
  mtg.slot: "is the standup still at nine once the floor moves?"

judgments:
  mtg.outgrown_the_room:
    rests_on: [mtg.attendees, room.seats, room.spare]
    verdict: "the standup has outgrown the room"
    because: "{{mtg.attendees}} people against {{room.seats}} seats, which leaves
              {{room.spare}}."
    wrong_if: "mtg.attendees <= room.seats"
    seen: {mtg.attendees: 14, room.seats: 12, room.spare: "room.seats - mtg.attendees"}
  room.booking_holds:
    rests_on: [room.seats]
    verdict: "the booking stays where it is until the building hands over the other floor"
    because: "Nothing else on this floor seats more, so moving now would cost the slot and
              buy nothing."
    reopened_by: "the building offers a room on the other floor"
    seen: {room.seats: 12}
