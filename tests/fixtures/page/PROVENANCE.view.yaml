title: "Greenhouse, this winter"
tabs:
  - title: "The February night"
    occasion: "opened when deciding whether to fire the old boiler or fix the glazing"
    serves: [s.2026_09_02_heating]
    sections:
      - title: "What the numbers say"
        why: "the shortfall is the only number the decision turns on"
        text: "The boiler gives {{heat.boiler_kw}} kW and the coldest night takes
               {{heat.loss_kw}}. {{c.boiler_short}}"
        reviewed: "2026-09-02"
        seen:
          heat.boiler_kw: 24
          heat.loss_kw: 31
          c.boiler_short: "the old boiler cannot hold 12°C on the coldest February night"
        pick: [heat.boiler_kw, heat.loss_kw]
        as: headline
      - title: "By thread"
        why: "the heating numbers and the calendar, side by side"
        pick: [heat., when.first_cold_night]
        as: grouped
        by: threads
      - title: "By where it came from"
        why: "the same numbers, read by what they rest on"
        pick: [heat., when.first_cold_night]
        as: grouped
        by: where it came from
      - title: "What stands"
        why: "every verdict here says what would make it wrong"
        pick: judgments
        as: cards
      - title: "What comes first"
        why: "one date, in the sentence it belongs to - a section can be text alone"
        text: "The first night that matters is {{when.first_cold_night}}; every number above is
               for that night."
        reviewed: "2026-09-02"
        seen: {when.first_cold_night: "2027-02-01"}
    shape: {entries: 11, judgments: 3, flagged: 0, blocked: 0}
  - title: "The glazing quote"
    occasion: "opened when the glazier's quote comes in, to set it against the shortfall"
    serves: [s.2026_09_03_glazing]
    sections:
      - title: "What the quote buys"
        why: "the price, and the kilowatts it would keep in - both read against the shortfall on
              the first tab"
        pick: glaze.
        as: table
    shape: {entries: 11, judgments: 3, flagged: 0, blocked: 0}
groups:
  threads:
    Heating: [heat., c.boiler_short]
    Calendar: [when.first_cold_night]
  where it came from:
    The service sheet: [heat.boiler_kw]
    Worked out in the session: [heat.loss_kw, heat.deficit_kw, when.first_cold_night]
