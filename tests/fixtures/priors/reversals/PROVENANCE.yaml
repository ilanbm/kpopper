meta:
  updated: 2026-09-04
  name: Ledger export
  scope: "Whether the monthly export can be regenerated without breaking the macros written
          against it - one decision made on the session's own prior, and the sign that would
          re-open it."

sources:
  s.2026_09_03_export:
    asked: "Can we regenerate the monthly export without breaking the accountant's macros?"
    name: "the export question, as this session read it: whether the column order is what the
           macros depend on"
    of: "this session"
    read: "2026-09-03"
  run.header_diff:
    name: "the header rows of the last three exports, compared"
    of: "diff over exports/2026-06.csv, 2026-07.csv and 2026-08.csv, 2026-09-03"
    read: "2026-09-03"

known:
  export.header_changes:
    v: 0
    name: "header rows that differ across the last three exports"
    from: run.header_diff
    at: "three files, one header each"
  export.columns:
    v: 14
    name: "columns in the export"
    from: run.header_diff
  hyp.column_order:
    v: refuted
    name: "hypothesis column_order"
    from: s.2026_09_03_export
    at: "the export check contradicted the claim"
    of: "2026-09-04"
    refutes: [c.order_is_the_contract]
  hyp.stable_names:
    v: refuted
    name: "hypothesis stable_names"
    from: s.2026_09_03_export
    at: "the export check contradicted the claim"
    of: "2026-09-04"
    refutes: [c.names_are_stable]
  prior.macros_bind_by_position:
    v: 0.9
    unit: confidence
    name: "spreadsheet macros written against an export bind to column positions, not to names"
    from: s.2026_09_03_export
    reach: general
  prior.names_are_stable:
    v: 0.8
    unit: confidence
    reach: general
    name: "export column names are stable across regenerations"
    from: s.2026_09_03_export
  prior.regeneration_is_deterministic:
    v: 0.6
    unit: confidence
    name: "regenerating this export from the ledger twice over produces the same file both times"
    from: s.2026_09_03_export
    reach: local

judgments:
  c.append_is_safe:
    rests_on: [prior.names_are_stable, prior.macros_bind_by_position, export.header_changes]
    verdict: "new columns are appended after the existing columns"
    wrong_if: "export.header_changes > 0"
    seen:
      prior.names_are_stable: 0.8
      prior.macros_bind_by_position: 0.9
      export.header_changes: 0
  c.dates_are_values:
    rests_on: [prior.macros_bind_by_position, export.header_changes]
    verdict: "dates remain values in their existing columns"
    wrong_if: "export.header_changes > 0"
    seen: {prior.macros_bind_by_position: 0.9, export.header_changes: 0}
  c.escapes_preserve_values:
    rests_on: [prior.macros_bind_by_position, export.header_changes]
    verdict: "escaped values stay in their original columns"
    wrong_if: "export.header_changes > 0"
    seen: {prior.macros_bind_by_position: 0.9, export.header_changes: 0}
  c.fourteen_fit:
    rests_on: [export.columns]
    verdict: "fourteen columns fit one printed page in landscape"
    wrong_if: "export.columns > 16"
    seen: {export.columns: 14}
  c.monthly_export_regenerated:
    rests_on: [prior.regeneration_is_deterministic, export.header_changes]
    verdict: "the monthly export is regenerated from the ledger each month rather than edited
              in place"
    because: "Whether regenerating twice over gives the same file is a guess about this ledger
              at {{prior.regeneration_is_deterministic}}, not something the session has seen
              anywhere - so it is tried rather than decided, and the trying is the test: a header
              that differs across the last three exports is regeneration not reproducing what it
              replaced, and {{export.header_changes}} of them differ."
    wrong_if: "export.header_changes > 0"
    seen: {prior.regeneration_is_deterministic: 0.6, export.header_changes: 0}
  c.names_are_stable:
    rests_on: [prior.names_are_stable, export.header_changes]
    verdict: "the export keeps each column name"
    wrong_if: "export.header_changes > 0"
    seen: {prior.names_are_stable: 0.8, export.header_changes: 0}
  c.order_is_the_contract:
    rests_on: [prior.macros_bind_by_position, export.header_changes]
    verdict: "the column order of the export is a contract: a column is added at the end, never
              in between"
    because: "Macros bind by position - {{prior.macros_bind_by_position}} confident - and the last
              three exports changed their header {{export.header_changes}} times, so the order has
              held and is what the macros already depend on. Cheap to reverse, so decided on the
              prior alone."
    reopened_by: "a macro that breaks on an export whose column order did not change - the
                  binding would then be by name, and export.header_changes the wrong thing to
                  watch"
    seen: {prior.macros_bind_by_position: 0.9, export.header_changes: 0}
