# How the entries that name a measure are taken from this tree. Read by `kpopper remeasure`
# alone - the pull request runs it with --run; no command that reads the record does. A recipe
# is an argument list, never a line for a shell: it runs from the checkout's root, without a
# shell, with its streams capped and its time bounded, and the one line it prints is the value.
# The Python ones run isolated (-I), so a file in the checkout cannot stand in for a module
# they import. Each is the narrow count its entry's at: describes, and nothing more.

# m.page_string_lines - lines of render_page.py inside top-level string constants of three lines
# or more, from the syntax tree: the count run.constants_measured took by hand
page_string_lines:
  - python3
  - -I
  - -c
  - |
    import ast
    t = ast.parse(open('scripts/render_page.py', encoding='utf-8').read())
    print(sum(n.value.end_lineno - n.value.lineno + 1 for n in t.body
              if isinstance(n, ast.Assign) and isinstance(n.value, ast.Constant)
              and isinstance(n.value.value, str) and n.value.end_lineno - n.value.lineno >= 2))

# p.recipe_runners - files under scripts/ that name the allowlist file: whatever runs a recipe
# has to read it by name, so a second executor shows here
recipe_runners:
  - python3
  - -I
  - -c
  - |
    import glob
    print(sum('PROVENANCE.measure' in open(f, encoding='utf-8').read() for f in glob.glob('scripts/*.py')))

# p.hook_slot - the character budget the opener hands to `open --chars`
hook_slot: [sed, -n, 's/.*--chars \([0-9][0-9]*\).*/\1/p', scripts/session_open.sh]

# p.npm_files - entries of package.json's files list
npm_files:
  - python3
  - -I
  - -c
  - "import json; print(len(json.load(open('package.json', encoding='utf-8'))['files']))"

# p.checks_in_the_wheel - package-data entries of pyproject.toml that end in verify_page.js
checks_in_the_wheel:
  - python3
  - -I
  - -c
  - |
    import re
    t = open('pyproject.toml', encoding='utf-8').read()
    m = re.search(r'^kpopper = \[(.*?)\]', t, re.M)
    print(sum(1 for s in re.findall(r'"([^"]*)"', m.group(1)) if s.endswith('verify_page.js')))

# p.predicate_shapes - places that decide whether a predicate is one comparison this reader
# can decide: a refusal says so in those words, so a second shape test shows here
predicate_shapes:
  - python3
  - -I
  - -c
  - |
    import glob
    print(sum(open(f, encoding='utf-8').read().count('is not one comparison this reader decides')
              for f in glob.glob('scripts/*.py')))

# m.blocked_on_reopeners - judgments of this record that declare a hole: an entry carrying both
# rests_on and blocked_on, counted from the record's own text. Nothing is imported from the
# checkout: a count taken through the reader would agree with the reader by construction, and
# the parser the reader uses is not there under -I anyway.
blocked_on_reopeners:
  - python3
  - -I
  - -c
  - |
    import re
    n, deps, hole = 0, False, False
    for line in open('PROVENANCE.yaml', encoding='utf-8'):
        if re.match(r'^(\S|  \S)', line):
            n += deps and hole
            deps, hole = False, False
        deps = deps or bool(re.match(r'^    rests_on:', line))
        hole = hole or bool(re.match(r'^    blocked_on:', line))
    print(n + (deps and hole))

# m.blocked_on_implementation - the same judgments, counted where the declaration opens by
# calling itself an implementation hole rather than an observational one. The other half of the
# split is this taken from blocked_on_reopeners, so neither half can drift while the total holds.
blocked_on_implementation:
  - python3
  - -I
  - -c
  - |
    import re
    n, deps, kind = 0, False, ""
    for line in open('PROVENANCE.yaml', encoding='utf-8'):
        if re.match(r'^(\S|  \S)', line):
            n += deps and kind == "implementation"
            deps, kind = False, ""
        deps = deps or bool(re.match(r'^    rests_on:', line))
        m = re.match(r'^    blocked_on: [\'"]?([a-z]+)', line)
        if m:
            kind = m.group(1)
    print(n + (deps and kind == "implementation"))

# The lines a count draws, inside the functions the entry's at: names and nowhere else: a
# module-level number the function reads by name, and any number other than zero or one it
# compares against - a line worth arguing about is named or is not zero or one, and zero and one
# are how this code says empty and singular. A function the file no longer has is a hole, not a
# zero. Serves p.prior_count_thresholds, p.hypothesis_thresholds and p.coverage_thresholds; the
# module and the functions are the arguments.
prior_count_thresholds:
  - python3
  - -I
  - -c
  - &threshold_count |
    import ast, sys
    t = ast.parse(open(sys.argv[1], encoding='utf-8').read())
    named = set()
    for n in t.body:
        if not isinstance(n, (ast.Assign, ast.AnnAssign)) or not isinstance(n.value, ast.Constant) \
                or type(n.value.value) not in (int, float):
            continue
        for g in (n.targets if isinstance(n, ast.Assign) else [n.target]):
            if isinstance(g, ast.Name):
                named.add(g.id)
    have = {n.name for n in t.body if isinstance(n, ast.FunctionDef)}
    gone = [w for w in sys.argv[2:] if w not in have]
    if gone:
        sys.exit(sys.argv[1] + " has no " + ", ".join(gone))
    drawn = set()
    for n in t.body:
        if not isinstance(n, ast.FunctionDef) or n.name not in sys.argv[2:]:
            continue
        for x in ast.walk(n):
            if isinstance(x, ast.Name) and x.id in named:
                drawn.add(x.id)
            elif isinstance(x, ast.Compare):
                for y in [x.left] + list(x.comparators):
                    if isinstance(y, ast.Constant) and type(y.value) in (int, float) \
                            and y.value not in (0, 1):
                        drawn.add(y.value)
    print(len(drawn))
  - scripts/provenance.py
  - priors_line

# p.hypothesis_thresholds - the same count over the line the opener prints about hypotheses.
hypothesis_thresholds:
  - python3
  - -I
  - -c
  - *threshold_count
  - scripts/provenance.py
  - hypothesis_line

# p.coverage_thresholds - the same count over the coverage report, which computes and prints.
coverage_thresholds:
  - python3
  - -I
  - -c
  - *threshold_count
  - scripts/render_page.py
  - coverage
  - coverage_lines
