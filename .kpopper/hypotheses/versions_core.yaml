                          three different rules"
      m.core.scenarios_failed: 0
  d.entry_file_is_a_stamped_rendering:
    verdict: "GROUNDING.yaml is the rendering of the accepted state and the disputes, carrying in
              its head the heads it was rendered from; a hand edit is a pending write, reconciled
              three ways against those heads - the base the editor saw, the edited file, the current
              state - a file that carries no heads is an unknown base, a subject an edit dropped is
              refused with the file left as it is, and a merge that rebuilt the file is never read as
              an edit"
    because: "The record is hand-edited where the tool has no verb, so a model that makes hand edits
              illegal fails the way the record is used; a model that imports them as if they saw
              everything invents a causal context and can erase a dispute. Carrying the heads in the
              file itself is what makes the three-way honest without a snapshot of the state kept
              anywhere else, and the file stays the readable current view that the page and the hooks
              read today."
