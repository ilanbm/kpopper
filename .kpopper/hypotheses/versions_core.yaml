  d.merge_is_union_and_state_is_computed:
    verdict: "merge is the union of version files plus an index rebuild, and the state is computed
              from the frontier of versions no act replaced - each head with a status, each judgment
              from the check on accepted heads and the disposition of its dependencies, a reservation
              travelling down a chain, a fired premise and a version nothing holds being reservations
              of their own; the same contributions under the same rule version give the same computed
              state, whatever the order or the number of merges"
    because: "A union is order-free, idempotent and lossless by construction, which the fold had to
              engineer path by path and thirty review findings priced. What a union cannot do is
              choose what stands, so that is a separate computation over the same records and rules,
              testable on its own. A dependency that merely gained a newer version is a re-review, as
              MOVED is today; one whose judgment carries a reservation passes it on, or an assumption
              becomes a conclusion through a chain."
    wrong_if: "m.core.scenarios_failed > 0"
