hypothesis: {born: "2026-09-16"}

judgments:
  d.a_version_carries_its_times_apart:
    verdict: "a version carries the time it was recorded as a full timestamp with no authority to
              decide a dispute, the source's own clock value when the source has one - a document
              version, a commit, a day, a timestamp - and, when it matters, the time the datum is
              about, as three separate fields none of which is required of every record"
    because: "A datum about January, taken from version 7 of a report, recorded in March, is three
              facts; folding them into one date is what made a later reading of the same document
              version look like an update and a same-day correction look like a dispute. Two of the
              three are already in the record under other names; naming them keeps
              learning-we-were-wrong apart from the-world-changed."
    wrong_if: {expr: "m.core.scenarios_failed > 0"}
    rests_on: [s.2026_09_16_versions_core, lit.bitemporal, m.core.scenarios_failed]
    seen:
      s.2026_09_16_versions_core: "The session that closed the model behind the branch verdict
                                   conflicts: versions per subject stored one file each, what each
                                   writer saw kept apart from what a claim rests on and from what an
                                   act replaced, acts as versions of their own kind, state computed
                                   from the frontier and the acts and the checks, and the entry file
                                   as a stamped rendering that a hand edit is reconciled against
                                   three ways. Shaped in conversation with a second reviewer's four
                                   corrections - seeing is not replacing, a hand edit keeps the base
                                   it saw, a historical dependency is not a lost one, and one
                                   append-only file per subject conflicts under git where one file
                                   per version merges clean - and three precisions: acts can
                                   conflict, the two times need exact meaning, and the merged entry
                                   file is rebuilt, never read as an edit."
      lit.bitemporal: "the time a datum is about and the time it was recorded are two dimensions,
                       kept apart, so that learning today that yesterday was wrong is told apart from
                       the world changing today"
      m.core.scenarios_failed: 0
  d.acts_are_versions_and_can_conflict:
    verdict: "an acceptance, a refutation, a review and a correction are versions of their own kind,
              naming exactly which versions they adjudicated; a source rule is an automatic act
              recorded as one; two acts that adjudicate the same versions differently are a dispute
              between acts, never decided by arrival order; a review is recorded against the version
              and the evidence it read, and covers no version written later under the same id"
    because: "An adjudication that is not itself a record can be lost, repeated or applied to a
              version it never saw; one that names its objects survives the union and says what it
              did not cover, so a later piece of evidence it did not include is not erased by it.
              Recording a source rule's decision as an act keeps automatic and human decisions on one
              surface."
    wrong_if: {expr: "m.core.scenarios_failed > 0"}
    rests_on: [s.2026_09_16_versions_core, lit.tms, lit.belief_change, m.core.scenarios_failed]
