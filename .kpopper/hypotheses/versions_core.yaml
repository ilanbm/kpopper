  d.versions_per_subject_one_file_each:
    verdict: "every write is an immutable version of one subject, content-addressed and kept as one
              file of its own under .kpopper/versions/<subject>/, so that two branches writing one
              subject merge under git without a textual conflict and the disagreement is met by the
              reader, not by a merge marker"
    because: "Two appends to one file per subject conflict under git and one file per version merges
              clean - measured in a scratch repository on 2026-09-16 - and a textual conflict must be
              resolved before the record can be read at all, which is the wrong surface for two
              claims. Content addressing makes the union idempotent, and a version per write is what
              lets a later reader see the path and not only the end."
