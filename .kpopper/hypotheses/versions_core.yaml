  d.entry_file_is_a_stamped_rendering:
    verdict: "GROUNDING.yaml is the rendering of the accepted state and the disputes, stamped with
              the state it was rendered from; a hand edit is a pending write, reconciled three ways
              against that stamp - the base the editor saw, the edited file, the current state - and
              an unknown stamp is an unknown base; a merge that rebuilt the file is never read as an
              edit, and a real pending edit survives it"
    because: "The record is hand-edited where the tool has no verb, so a model that makes hand edits
              illegal fails the way the record is used; a model that imports them as if they saw
              everything invents a causal context and can erase a dispute. The stamp is what makes
              the three-way honest, and the file stays the readable current view that the page and
              the hooks read today."
