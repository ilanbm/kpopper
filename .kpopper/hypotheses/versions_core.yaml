  d.seeing_resting_replacing_are_three_relations:
    verdict: "a version keeps three relations apart: what its writer saw, what its claim rests on,
              and what an act replaced - so a second reading that saw the first and disagrees is a
              second head, not a supersession, and the day is evidence for a source rule, never the
              criterion of a contradiction"
    because: "Treating a descendant as a replacement made a reader who saw 100 and found 120 in the
              same source state into the sole head, which is a dispute painted as agreement.
              Concurrency - neither saw the other - is what makes a contradiction; a later reading of
              a moving source supersedes by a source rule that is an act, and a verdict is replaced
              by an act or by its own fired condition. Every rule the record holds today falls out of
              the three relations as a derived case."
    wrong_if: {expr: "m.core.scenarios_failed > 0"}
    rests_on: [s.2026_09_16_versions_core, lit.tms, lit.crdt_mv_register, m.core.scenarios_failed]
