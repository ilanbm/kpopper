                                   second reviewer's corrections - seeing is not replacing, a hand
                                   edit keeps the base it saw, a historical dependency is not a lost
                                   one, one append-only file per subject conflicts under git where
                                   one file per version merges clean, acts can conflict, the two
                                   times need exact meaning, the merged entry file is rebuilt and
                                   never read as an edit - and hardened by two review rounds of the
                                   module itself"
      lit.crdt_mv_register: "a single timestamp cannot tell concurrent writes apart - a write must
                             carry what it was based on; a multi-value register keeps every
                             concurrent write visible and a later write that saw them all resolves
                             them; merge as a set union is order-free, idempotent and lossless"
      m.core.scenarios_failed: 0
  d.fired_changes_status_acceptance_is_an_act:
    verdict: "a falsifier that holds changes the status of the decision it belongs to and nothing
              else; accepting a replacement is an act of its own, and a decision written but not yet
              accepted or reviewed by another is an assumption that every conclusion resting on it
              carries"
    because: "A fallen decision does not license whatever is written in its place - the wide
              replacement that enters because the narrow one fell was the case the second reviewer
              named - and a conclusion that rests on an unreviewed reversal as if it stood turns a
              proposal into a fact through a chain. Entry is not approval; the act is."
    wrong_if: "m.core.scenarios_failed > 0"
    rests_on: [s.2026_09_16_versions_core, lit.tms, m.core.scenarios_failed]
