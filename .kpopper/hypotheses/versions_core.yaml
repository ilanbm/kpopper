  d.versions_per_subject_one_file_each:
    verdict: "every write is an immutable version of one subject, identified by everything it says -
              its operation and its moment included - and kept as one file of its own under
              .kpopper/versions/<subject>/, so that two branches writing one subject merge under git
              without a textual conflict, a retry of one operation is one version, and the
              disagreement is met by the reader, not by a merge marker"
    because: "Two appends to one file per subject conflict under git and one file per version merges
              clean - measured in a scratch repository on 2026-09-16 - and a textual conflict must be
              resolved before the record can be read at all, which is the wrong surface for two
              claims. An identity that left the moment out let one name hold two contents and let the
              order of a union choose what stood; an operation minted once and sent again on a retry
              gives the retry the same file and a new observation a new one."
