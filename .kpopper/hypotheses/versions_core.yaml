  d.seeing_resting_replacing_are_three_relations:
    verdict: "a version keeps three relations apart: what its writer saw, what its claim rests on,
              and what an act replaced - so a second reading that saw the first and disagrees is a
              second head, not a supersession; a root claim written knowing nothing of its subject
              stands on its own and no moment decides between two roots that never met; a later clock
              supersedes only within one source; and heads that say the same are one claim held by
              several"
    because: "Treating a descendant as a replacement made a reader who saw 100 and found 120 in the
              same source state into the sole head, which is a dispute painted as agreement; the
              earliest recorded moment choosing between independent roots gave time the authority the
              contract denies it; a later revision of another source is not a later state of this
              one. Concurrency - neither saw the other - is what makes a contradiction; a reading is
              laid over another by a source rule that is an act, and a verdict by an act or by its
              own fired condition."
    wrong_if: "m.core.scenarios_failed > 0"
