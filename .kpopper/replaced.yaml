  verdict: the stop gate compares against the session-start mark and yields after one bounce; unchanged
    existing judgments falsified by updated readings can stay flagged while recording finishes, and check
    still reports their failed conditions
  because: A record that was already red must never block a session that did not touch it, and a gate
    that cannot be escaped teaches sessions to fight the gate instead of fixing the record. New failures
    are compared by identity so repairing one old error cannot hide a new one. A judgment whose body and
    interpretation are unchanged, whose condition became true after being false or unknown, and whose
    recorded input changed or arrived has encountered new evidence. Retaining that finding is successful
    recording. Structural errors, new or edited broken judgments and arrangement failures remain gate
    failures; legacy marks without those observations retain the conservative count comparison. A retained
    external capture can state its recording purpose in recorded_for on its source; its event, envelope
    and source bytes must match before it satisfies recording attribution without inventing an asked reading
    occasion. Real work requests remain subject to the page's existing coverage requirements.
