d.predicate_shape_is_one_reading:
- rests_on:
  - s.2026_09_04_falsifier_shape
  - p.predicate_shapes
  - d.arrangement_sign_is_one_comparison
  verdict: 'what shape a predicate must have to be decided is one reading, asked wherever a predicate
    is written, reported or evaluated: one comparison, which is a right-hand side carrying no second comparison
    - text inside quotes is a literal and is not read for one - and a predicate that is not one is declined
    by the reader and reported where an empty predicate is, never answered false'
  because: 'The comparison shape takes everything after the operator as its value, so a == false, or b
    == false was decided against the text after the first operator - false in every state of the record,
    a falsifier that reads as evaluable and can never fire. {{d.arrangement_sign_is_one_comparison}} refused
    that for an arrangement''s sign and named it there; every other judgment inherited it, and check passed
    over them because a predicate that names an entry was taken as one it could read. {{p.predicate_shapes}}
    counts the places that decide the shape: a second one drifts from the first, and it drifts both ways.
    The path that had a shape test read a quoted value by looking inside the quotes for operators, so
    a date - one value, written with hyphens - was refused there while the path with no test compared
    it happily; a rule any narrower than ''carries no second comparison'' refuses values the reader compares
    perfectly well, and silencing a falsifier that works is this same failure from the other side.'
  wrong_if: p.predicate_shapes > 1
  seen:
    s.2026_09_04_falsifier_shape: read 2026-09-04
    p.predicate_shapes: 1
    d.arrangement_sign_is_one_comparison: an arrangement's sign is one comparison over a count that can
      hold - a name, an operator, one value; a compound or an impossible one is refused, and a re-opener
      stands beside it, never in its place
  ended: the standing judgment holds, and a person takes this over it by name
  day: '2026-09-23'
