# Judgments this record's writes replaced, kept whole - read with `kpop pull <id> --history`.
d.contradiction_by_id_and_day:
- rests_on:
  - s.2026_09_04_minted_permission
  - s.2026_09_03_hypotheses
  - d.base_shared_forks_on_contradiction
  - d.write_path_returns_reach
  - p.supersede_doors
  verdict: 'a contradiction is told by the id and the day: the same id with a value read no later than
    the base''s own reading, or with a different verdict, is refused into the base and named a hypothesis;
    a newer reading supersedes, a standing judgment is superseded only when its wrong_if holds; the same
    premises under different ids are different subjects'
  because: 'set is the update path - the world moving, flagged as it always was - so a differing value
    alone cannot be the contradiction, or the reach would have nothing left to reach. What the record
    can tell apart is time: a reading newer than the one the base holds - its own date, else its source''s
    - supersedes it; one of the same day or older that disagrees is two writers, not the world moving.
    A value nothing dates is superseded by the first dated write, which starts the clock; a concurrent
    second writer is then same-day and refused - the case the mechanism exists for. A judgment has no
    such clock, and resting on a session source proves nothing, since every judgment rests on the session
    that wrote it; naming one proves no more, since the session writes it. So a judgment is replaced in
    the base only when it is already broken by its own condition, and every other rewrite waits beside
    the record for a person to fold. Five judgments here rest on one source with five verdicts, so the
    same premises under different ids stay different subjects until someone says otherwise - a candidate
    to judge, never a refusal. One function decides all of it; {{p.supersede_doors}} is the count that
    would show a second one creeping in.'
  wrong_if: p.supersede_doors > 1
  seen:
    s.2026_09_04_minted_permission: read 2026-09-04
    s.2026_09_03_hypotheses: read 2026-09-03
    d.base_shared_forks_on_contradiction: a consistent addition goes straight to the shared record from
      any session or branch; a write that contradicts the record opens a named hypothesis, and whatever
      later rests on the contradiction goes there - a session is never the unit
    d.write_path_returns_reach: the record changes from the command line through set, add and review;
      each edits the file in place, writes seen itself, and answers with the reach - what rests on the
      write, what is MOVED now, which predicate fired
    p.supersede_doors: 1
  ended: the standing judgment holds, and a person takes this over it by name
  day: '2026-09-16'
d.fold_passes_the_one_door:
- rests_on:
  - s.2026_09_04_minted_permission
  - s.2026_09_04_consolidate
  - d.contradiction_by_id_and_day
  - p.supersede_doors
  verdict: 'a folded reading passes the one door a written one does, with a person''s hand on it: an entry
    replaces what the base holds when its reading is newer, a judgment when the standing one is broken
    or when the fold itself is the person''s - and a reading the door refuses is contested, never overwritten'
  because: 'The fold is a write under ids the base holds, and one function still says whether such a write
    may replace what stands - {{d.contradiction_by_id_and_day}} put the rule there so that nothing else
    decides it, and the fold passes its hand through that function rather than deciding beside it. Readings
    keep the day rule whole: a hypothesis born of a same-day contradiction stays beside the record until
    someone reads again on a later day, which is the act the day rule tells two writers apart by, and
    no hand makes an older reading newer. A standing judgment has no clock to appeal to, so what could
    admit its rewrite was a claim written into the write itself - which is what a session mints for free.
    The fold is the one act here a session cannot write into the record, and it is where the rewrite is
    read beside what it replaces, with the dry run naming both. {{p.supersede_doors}} is the count that
    would show a second door.'
  wrong_if: p.supersede_doors > 1
  seen:
    s.2026_09_04_minted_permission: read 2026-09-04
    s.2026_09_04_consolidate: read 2026-09-04
    d.contradiction_by_id_and_day: 'a contradiction is told by the id and the day: the same id with a
      value read no later than the base''s own reading, or with a different verdict, is refused into the
      base and named a hypothesis; a newer reading supersedes, a standing judgment is superseded only
      when its wrong_if holds; the same premises under different ids are different subjects'
    p.supersede_doors: 1
  ended: the standing judgment holds, and a person takes this over it by name
  day: '2026-09-16'
d.readme_story_series:
- rests_on:
  - s.2026_09_13_story_approval
  - d.readme_opens_with_what_it_does
  - d.readme_visual_identity
  - s.2026_09_13_worker_and_research
  verdict: 'Open with the approved illustrated series: shared cache and private results, download promise
    versus retention, the Cowork workshop, then a dark-matter research synthesis. Provide desktop and
    phone layouts, visible record excerpts, source links and runnable examples.'
  because: 'Two code cases expose different dependencies: a visibility assumption and a promise across
    policy and email. The workshop shows the same continuity problem when a changed premise requires judgment
    rather than an executable failure. The two-input composition and larger consequence scene preserve
    the narrative energy the maintainer preferred. Published examples make the green branch tests, clean
    merges and failed recorded conditions inspectable, and show that ordinary integration tests can also
    detect the problems. The research case adds constructive synthesis across papers: distinct sourced
    findings feed one judgment with its adopted framework and open questions. It uses selected real abstracts
    with locators and a runnable replay of three concurrent CLI writers; it does not claim live independent
    agent research or infer scientific truth from agreement.'
  reopened_by: An uncoached reader cannot identify the reason invalidated in either code story, treats
    the Cowork review notice as proof the plan is wrong, believes the tool discovers unrecorded assumptions
    automatically, or cannot read the essential content on a phone. Revisit the length if readers who
    want to try the tool cannot find installation. Revisit the research story if readers take schematic
    figures for measured data, the synthesis for a proof, or the prepared replay for a live model evaluation.
  seen:
    s.2026_09_13_story_approval: read 2026-09-13
    d.readme_opens_with_what_it_does: Keep the hero, explain the practical benefit immediately below it,
      then show concrete code and non-code examples with visible recorded premises and a direct route
      to installation. Introduce the third-brain metaphor later.
    d.readme_visual_identity: Use the large ink portrait of Karl Popper on the left, with a restrained,
      faintly amused expression and a natural inward gaze toward the lowercase kpopper wordmark and one-line
      lemma quotation on the right. Keep the separate italic attribution without a final period, the secondary
      Korean bubble and the white geometric k icon on electric blue. Process overviews use ink illustrations
      and phone layouts with separate editable schematic references. In the conversation overview, show
      a person only in the main-session scene.
    s.2026_09_13_worker_and_research: read 2026-09-13
  ended: the standing judgment holds, and a person takes this over it by name
  day: '2026-09-19'
d.first_meeting_artifact:
- rests_on:
  - doc.agent_graph
  verdict: a record born in this session, on a surface that can publish, is rendered and shown as a live
    artifact without asking
  because: The first turn must feel like a normal session, and the first meeting with the record should
    be the page, alive - not a yaml file. Surfaces that strip script from previews get the browser instead.
  blocked_on: 'observational: falsified if users close or ignore the unrequested page more often than
    they touch it'
  seen:
    doc.agent_graph: read 2026-09-01
  ended: the standing judgment holds, and a person takes this over it by name
  day: '2026-09-18'
d.gate_asks_once_after_work:
- rests_on:
  - s.2026_09_10_skills_split
  - run.design_talk
  - d.gate_reminds
  - p.gate_bounces
  verdict: a session that changed files of the tree, or ran eight prompts, with the record untouched is
    asked once whether there was nothing to keep - as a line on the prompt, and as one stop on the turn
    after a line went unanswered; the gate still yields after one bounce
  because: Seven decisions lived only in chat and the gate could not see a record nobody touched ({{run.design_talk}}).
    One stop is a question, not a failure, and it comes only after the softer form was ignored for a turn;
    a stop that repeated would teach sessions to write filler, which the unattributed-entries reminder
    ({{d.gate_reminds}}) already catches, and {{p.gate_bounces}} stays where it was.
  wrong_if: p.gate_bounces > 1
  seen:
    s.2026_09_10_skills_split: read 2026-09-10
    run.design_talk: read 2026-09-02
    d.gate_reminds: the stop gate compares against the session-start mark and yields after one bounce;
      unchanged existing judgments falsified by updated readings can stay flagged while recording finishes,
      and check still reports their failed conditions
    p.gate_bounces: 1
  ended: the standing judgment holds, and a person takes this over it by name
  day: '2026-09-22'
