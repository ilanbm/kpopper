d.entry_file_is_grounding:
- verdict: 'the record''s entry file is GROUNDING.yaml: the first add creates it at the workspace root,
    the locator finds it first and a record kept under the earlier name after it, wherever that record
    already is, and no command creates the earlier name again'
  because: 'The name is the one thing a session with no author present reads before anything else, and
    {{goal.portable}} is the bar: a file named for what it does for the session - what its answers stand
    on - carries its own instruction, where provenance named the half of the content that is sources and
    readings and reads, in software now, as a supply-chain attestation. Grounding is the word the method
    already uses in its skill, its opener and its grounding line, and {{d.prefix_is_a_word}} is the same
    rule one level up: a name is the link a question takes into the record. Reasoning, the pitch word,
    names a process and one field, {{d.reasoning_in_record}}, not the state the file holds. The earlier
    name stays read so that no record has to move, and {{p.entry_names}} counts the names the locator
    knows - a third would be a second convention.'
  wrong_if: p.entry_names > 2
  reopened_by: a session with no author present that found the file and did not read it before answering
    from memory, or an adopter who asked what the file is, or a live record the locator stopped finding
    under its earlier name
  rests_on:
  - s.2026_09_12_layout
  - goal.portable
  - d.prefix_is_a_word
  - d.reasoning_in_record
  - p.entry_names
  seen:
    s.2026_09_12_layout: read 2026-09-12
    goal.portable: usable by any session, in any project, with no author present
    d.prefix_is_a_word: a prefix born from now is a word - the subject a question would name, or the kind
