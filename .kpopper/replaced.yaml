d.readme_get_started_is_one_instruction:
- name: Get started is one instruction the reader sends to their agent
  verdict: Open Get started with a short paragraph and one instruction, beginning Dear agent, that asks
    the reader's agent to install kpopper for itself from the section's own steps. The steps for each
    agent follow at once; the Claude Code and Codex steps install the plugin's native runtime directly.
    Standalone CLI installation lives in the command reference and Python compatibility setup in the plugin
    runtime guide.
  because: The maintainer asked for a short opening that reaches the agents at once and rests on one concise
    instruction to the agent. The Claude Code and Codex plugin commands and the plugin's install_native.sh
    run without interaction, and three Codex sessions given the instruction completed them unaided; Cowork
    and Work install in their own apps, which the instruction covers by asking the agent to say what is
    left. A plugin installs without its native runtime and the opener reports that only on standard error,
    so waiting for the opener to report it leaves a session that opens silently.
  rests_on:
  - s.2026_09_23_readme_get_started
  - run.plugin_arrives_without_runtime
  - run.agent_installs_itself
  reopened_by: An agent in Claude Code or Codex given the instruction ends without the plugin and its
    runtime installed, a reader who wants to install by hand cannot find the commands, or a plugin installation
    starts to carry its native runtime so the separate step is no longer needed.
