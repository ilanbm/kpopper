d.native_release_beside_tests:
- name: The native release is built and accepted beside its tests, and on Linux alone for a pull request
  verdict: Each target builds, accepts, packages and uploads its native release in a job of its own that
    runs beside its tests, and a verdict job fails when either job fails or is skipped where the validation
    needs it. A pull request that changes no platform input builds and accepts the release on linux-x86_64
    only; main, publication and a pull request that changes a platform input keep all five targets.
  because: The release waited behind the slowest test run of its own job, 8 to 19 minutes per target at
    the median. In 94 pull request runs from 2026-09-22 to 2026-09-23, no release or acceptance step failed
    on another platform for a change that touched no platform input. Once split, the release job is shorter
    than the tests on every target, so checking it on the other platforms in a pull request costs machines
    rather than minutes.
  rests_on:
  - s.2026_09_23_native_ci_speed
  reopened_by: A native job fails or is skipped while ci-required passes; publication uploads bytes that
    were not built and accepted in the same job; or on main a release or acceptance step fails on a platform
    other than Linux after a change that touched no platform input.
