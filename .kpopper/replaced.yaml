    into native/shared/, and the licence into native/LICENSE. scripts/ stays the place to edit them; a
    stale copy stops a native build in the repository and fails the release tests. A crate built from
    crates.io declares the adapter fingerprint of the same version built from the repository.'
  because: crates.io receives native/ alone, while the plugin and the Python reader read these files from
    scripts/ by path, so the originals cannot move. Cargo publishes a rewritten manifest and keeps the
