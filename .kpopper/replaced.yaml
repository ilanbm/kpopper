d.same_asks_the_one_door:
- rests_on:
  - s.2026_09_04_sameness
  - d.contradiction_by_id_and_day
  - d.sameness_is_judged
  - p.supersede_doors
  verdict: 'same is a migration through the record''s own write path: the retired id is rewritten everywhere
    it is named - dependencies, snapshots, predicates, rules, references in text, the brief - the survivor
    takes the newer reading with its place and date, and where the two readings disagree with nothing
    to order them the migration is refused through the one door every same-id write goes through; check
    runs after, and a problem it did not have undoes the whole of it'
  because: 'Two ids for one subject are two readings of it, and the record already has one rule for two
    readings under one id: the newer supersedes, the same day or undated is two writers. Asking {{p.supersede_doors}}
    door rather than writing a second keeps the migration from becoming a way to overwrite a value that
    add and set would refuse. The rewrite is by whole token across every file the record is, structural
    where a judgment named both ids and would otherwise rest on the survivor twice; the survivor carries
    also: with the retired id, so a write under the old id is refused and pointed at it. Check after the
    write is what makes a migration safe to run without reading the diff: a reference the rewrite missed
    fails there, and the files come back as they were.'
  wrong_if: p.supersede_doors > 1
  seen:
    s.2026_09_04_sameness: read 2026-09-04
    d.contradiction_by_id_and_day: 'a contradiction is told by the id and the day: the same id with a
      value read no later than the base''s own reading, or with a different verdict, is refused into the
      base and named a hypothesis; a newer reading supersedes, a standing judgment is superseded only
      when its wrong_if holds or the request that asked for the change is named; the same premises under
      different ids are different subjects'
    d.sameness_is_judged: 'the tool never decides that two entries are the same: it shows the nearest
      existing entries when one is written and candidates when hypotheses consolidate; the writer or the
      merger decides, and the decision is recorded - same_as as a migration that leaves the build green,
      distinct_from as an edge that retires the pair'
    p.supersede_doors: 1
  ended: the standing judgment holds, and a person takes this over it by name
  day: '2026-09-24'
