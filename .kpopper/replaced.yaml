    like any other, by {{d.contradiction_by_id_and_day}}: one older than the tree''s is superseded and
    the judgments over it move, which {{d.moved_is_a_flag}} keeps a flag and not a failure; one of the
    same day that disagrees is two writers, and here the second writer is the author of the pull request,
    who corrects the number in it. The runner writes nothing: a value with nobody''s reading behind it
    is not a reading, and a commit nobody reviewed is not the record.'
