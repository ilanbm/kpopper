  - s.2026_09_13_github_releases
  verdict: the push that lands a version publishes it - tagged at the commit that moved the version, carrying
    that version's changelog entry and the files built from that commit
  because: 'Three versions were released in one day and left nothing to point at: no tag, no release,
    only a changelog section. And the files that reach a registry were built by hand from a directory
    nobody clears, so what a person installs was never what any check ran against. The commit that moved
    the version is the one place those two can be tied together, and the merge is the moment it exists
    - a release built anywhere else is a claim about a tree rather than that tree. The pull request cannot
    do it, because until it merges its commit is not on the branch anyone installs from.'
  blocked_on: 'observational: falsified if uploads to the registries keep using locally built files instead
    of these, or if a version lands with the publish step red and nobody notices until the next one'
  seen:
    d.release_is_its_own_pull_request: the version moves in a release pull request of its own, computed
      from what merged since the last release; a feature pull request never touches it
    s.2026_09_13_github_releases: read 2026-09-13
  ended: the standing judgment holds, and a person takes this over it by name
  day: '2026-09-24'
d.release_is_one_tree:
- rests_on:
  - d.merge_publishes_the_release
  - s.2026_09_14_publish_review
  verdict: a release is made from a single commit - the tag, the text and the attached files all come
    from it, and only the commit that moves the version publishes
  because: 'The first shape of this tagged the commit that moved the version while building the files
    from whatever was checked out, which on any later push is a different tree: the tag would have said
    one thing and the wheel beside it another, and nobody downloading it could tell. Publishing only from
    the commit that moved the version makes the three agree by construction rather than by care, and costs
    the ability to tag an old version after the fact - which was never worth having, because the files
    for it would have come from the wrong tree anyway. What it also costs is retrying on the next push,
    and that is what rerunning a run is for: it replays the same commit.'
  blocked_on: 'observational: falsified if a release is ever wanted for a version already behind main,
    or if a failed publish is left unmade because rerunning its own run is not reachable by whoever notices'
  seen:
    d.merge_publishes_the_release: the push that lands a version publishes it - tagged at the commit that
      moved the version, carrying that version's changelog entry and the files built from that commit
    s.2026_09_14_publish_review: read 2026-09-14
