    outrank every reading of today, so it is refused - {{m.door.future_dated_readings_refused}} places
    a reading is dated. A judgment has no clock and a session''s word admits nothing, so a standing judgment
    is replaced only when its own condition holds - on what the base holds, since a reading that arrives
    together with the verdict has not been accepted yet - and every other rewrite waits beside the record
    for a person to take by name. The same verdict on other grounds is a decision written again and goes
    the same way, since the grounds are what the verdict answers to; {{m.door.grounds_changes_named}}
    such changes are named where both doors were blind. Across the branch line two sources for one id
    that disagree are two instruments, and no day orders instruments, so a person names which the id follows.
    The two-branch test of issues #98 and #99 named none of its opposed verdicts; {{m.door.opposed_verdicts_named_reversed}}
