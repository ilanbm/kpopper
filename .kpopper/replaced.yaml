d.ci_selects_families:
- name: Select PR checks by declared input families and require selected work to succeed
  from: s.2026_09_17_selective_ci
  rests_on:
  - p.ci_native_build_inputs
  verdict: Keep record and cheap contracts unconditional; select expensive families conservatively from
    the full PR diff, cancel superseded runs, and retain broad consumer checks on main.
  because: Skills and prose do not require native compilation. Packaging needs evidence about the installed
    committed payload, while changed native inputs need compilation and replacement-library integration.
    Unknown paths select all checks; the aggregate gate refuses an unexpected skip so selecting less cannot
    silently convert missing work into success.
  reopened_by: A changed input affects a skipped family; a selected job is skipped or fails while ci-required
    passes; or main no longer exercises all consumer families.
  seen:
    p.ci_native_build_inputs: Native sources, builder, bundled runtime, native loader and replacement
      probes, notices, and native-workflow changes select native builds; unknown paths select all checks.
      Selector-only changes use mandatory contracts. Packaging metadata alone tests consumers and installation
      without recompiling native source.
  ended: the standing judgment holds, and a person takes this over it by name
  day: '2026-09-24'
- name: Select PR checks by declared input families and require selected work to succeed
