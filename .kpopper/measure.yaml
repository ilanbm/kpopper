# How the entries that name a measure are taken from this tree. Read by `kpop remeasure`
# alone - the pull request runs it with --run; no command that reads the record does. A recipe
# is an argument list, never a line for a shell: it runs from the checkout's root, without a
# shell, with its streams capped and its time bounded, and the one line it prints is the value.
# The Python ones run isolated (-I), so a file in the checkout cannot stand in for a module
# they import. Each is the narrow count its entry's at: describes, and nothing more.

# p.skills_shipped - skill directories the plugin ships: each is one occasion, with its SKILL.md
skills_shipped:
  - python3
  - -I
  - -c
  - "import glob; print(len(glob.glob('skills/*/SKILL.md')))"

# m.skill_bytes_largest - bytes of the largest skill body a session can be handed: the ceiling
# the split holds, where one body used to be the whole method
skill_bytes_largest:
  - python3
  - -I
  - -c
  - "import glob, os; print(max(os.path.getsize(f) for f in glob.glob('skills/*/SKILL.md')))"

# p.npm_files - entries of package.json's files list
npm_files:
  - python3
  - -I
  - -c
  - "import json; print(len(json.load(open('package.json', encoding='utf-8'))['files']))"

# m.blocked_on_reopeners - judgments of this record that declare a hole: an entry carrying both
# rests_on and blocked_on, counted from the record's own text. Nothing is imported from the
# checkout: a count taken through the reader would agree with the reader by construction, and
# the parser the reader uses is not there under -I anyway.
blocked_on_reopeners:
  - python3
  - -I
  - -c
  - |
    import re
    n, deps, hole = 0, False, False
    for line in open('GROUNDING.yaml', encoding='utf-8'):
        if re.match(r'^(\S|  \S)', line):
            n += deps and hole
            deps, hole = False, False
        deps = deps or bool(re.match(r'^    rests_on:', line))
        hole = hole or bool(re.match(r'^    blocked_on:', line))
    print(n + (deps and hole))

# m.blocked_on_implementation - the same judgments, counted where the declaration opens by
# calling itself an implementation hole rather than an observational one. The other half of the
# split is this taken from blocked_on_reopeners, so neither half can drift while the total holds.
blocked_on_implementation:
  - python3
  - -I
  - -c
  - |
    import re
    n, deps, kind = 0, False, ""
    for line in open('GROUNDING.yaml', encoding='utf-8'):
        if re.match(r'^(\S|  \S)', line):
            n += deps and kind == "implementation"
            deps, kind = False, ""
        deps = deps or bool(re.match(r'^    rests_on:', line))
        m = re.match(r'^    blocked_on: [\'"]?([a-z]+)', line)
        if m:
            kind = m.group(1)
    print(n + (deps and kind == "implementation"))

# p.live_dry_run_gates - lines in the CI workflows, the pre-push guard and the plugin's hooks
# that run the consolidation dry run without --frozen: each would let a pending finding hold up
# someone's run, where the live dry run only reports what it would break
live_dry_run_gates:
  - python3
  - -I
  - -c
  - |
    import glob
    files = glob.glob('.github/workflows/*.yml') + glob.glob('.githooks/*') + glob.glob('hooks/*')
    print(sum('consolidate' in line and '--dry-run' in line and '--frozen' not in line
              for name in files for line in open(name, encoding='utf-8')))

# p.hook_slot - the character budget the opener fills, read from the reader that fills it
hook_slot:
  - python3
  - -I
  - -c
  - |
    import re
    t = open('native/src/ordinary_views.rs', encoding='utf-8').read()
    print(re.search(r'^pub\(crate\) const OPENING_CHARS: i64 = (\d+);', t, re.M).group(1))

# p.recipe_runners - files of the reader that run a measurement recipe: one runner is what
# keeps a command that reads the record from running one, and a second shows here by the call
recipe_runners:
  - python3
  - -I
  - -c
  - |
    import glob
    print(sum('run_recipe(' in open(f, encoding='utf-8').read() for f in glob.glob('native/src/*.rs')))

# p.product_python_modules - Python modules of the product under scripts/. The build,
# packaging and licence tools there are named out: they carry no product code and import
# none. Anything else under scripts/ written in Python is a second implementation starting
# again, and this count is what says so.
product_python_modules:
  - python3
  - -I
  - -c
  - |
    import glob
    tools = {'scripts/reasoning/build_runtime.py', 'scripts/package_native.py',
             'scripts/collect_rust_licenses.py'}
    print(sum(f not in tools for f in glob.glob('scripts/**/*.py', recursive=True)))
