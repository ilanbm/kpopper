    sections:
      - title: How to read what follows
        why: a wall of cards is not an argument until you know what separates them
        text: >
          Every card below carries a verdict and the sign that would make it wrong. That sign is
          the whole difference between a decision and an opinion, and it is why so many of these
          can be left standing without being re-argued: {{d.falsifier_beyond_reach}} rules out the
          comfortable kind, the sign that can only appear once the decision has already stopped
          anyone from producing it. Where a sign cannot be evaluated at all the judgment says so
          rather than inventing one. The reasoning itself is not written here twice, because
          {{d.reasoning_in_record}} - so what you are reading on this tab is the record, resolved,
          and not a summary of it.
        reviewed: "2026-09-04"
        seen:
          d.falsifier_beyond_reach:
            verdict: "a falsifier names a sign the decision itself cannot suppress; one that can
                      only appear when people do what the decision stops offering is sealed, not
                      falsifiable"
            because: "A decision shapes the world it is judged in. The grouping-schemes decision
                      first said it would be wrong if no brief ever declared a second scheme, while
                      the page drew only the first - nobody declares what nothing draws, so the sign
                      could never appear and the judgment was sealed by its own mechanism. The test
                      is one question asked of every wrong_if: under this decision, could that still
                      happen? A sign that lives outside the decision's reach - a person's request, a
                      record someone else writes, a measurement the change cannot touch - can."
          d.reasoning_in_record:
            verdict: "reasoning is the because of the judgment it belongs to, in the record; the
                      page's connective text lives in the brief; both resolve references at build and
                      both carry seen"
            because: "The test is whether an agent that never opens the page needs the text. A
                      judgment's reasoning: yes, so it lives where pull and open can serve it with
                      its own flag, which today they cannot, because the reasoning lives only in a
                      template. Connective text: no, so it stays in the cheapest file. The lab
                      already wraps a domain claim and never a page judgment; a second kind of
                      judgment beside the brief would split one conclusion across two files with two
                      reviews. Giving connective text a snapshot of what it references earns it the
                      same moved-since-reviewed tint without pretending it argues - it states, and a
                      sentence that would deserve a falsifier is a judgment that belongs in the
                      record."
      - title: What the README makes visible
